[package]
name = "AIGate"
version = "0.8.0"
edition = "2021"
description = "Local OpenAI-compatible reverse proxy: admin panel, multi-vendor routing, KV cache hit stats, loop-guard, circuit breaker, and desktop GUI"

[dependencies]
axum = "0.7"
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["stream", "json", "http2"] }
regex = "1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "auth"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.29"
wry = "0.38"
tray-icon = "0.13"
# WebView2 原生 cookie 读取（opencode 一键登录用）。
# 版本必须与 wry 0.38 内部一致（0.29），否则 windows crate 的 Interface trait
# 来自不同版本、`cast()` 会报 "no method named cast"。windows 同理取 0.54。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.29"
windows = "0.54"
[profile.release]
opt-level = 2
lto = "thin"

[[bin]]
name = "AIGate"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
