<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <!-- Central hub circle -->
  <circle cx="128" cy="128" r="32" fill="#ffffff" opacity="0.95"/>
  <circle cx="128" cy="128" r="20" fill="#6366f1"/>
  <!-- Connection nodes -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="72" cy="80" r="10"/>
    <circle cx="184" cy="80" r="10"/>
    <circle cx="72" cy="176" r="10"/>
    <circle cx="184" cy="176" r="10"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.4" fill="none" stroke-linecap="round">
    <line x1="82" y1="85" x2="112" y2="118"/>
    <line x1="174" y1="85" x2="144" y2="118"/>
    <line x1="82" y1="171" x2="112" y2="138"/>
    <line x1="174" y1="171" x2="144" y2="138"/>
    <!-- Outer connections -->
    <line x1="72" y1="60" x2="72" y2="70"/>
    <line x1="72" y1="186" x2="72" y2="196"/>
    <line x1="184" y1="60" x2="184" y2="70"/>
    <line x1="184" y1="186" x2="184" y2="196"/>
    <line x1="52" y1="80" x2="62" y2="80"/>
    <line x1="194" y1="80" x2="204" y2="80"/>
    <line x1="52" y1="176" x2="62" y2="176"/>
    <line x1="194" y1="176" x2="204" y2="176"/>
  </g>
</svg>
