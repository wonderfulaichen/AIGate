<div x-show="activeTab==='providers'" class="page-enter page-wide">
<!-- 供应商页的头部**不用大卡片**（2026-10-24 按用户反馈改）。
     .phd 卡片头在概览/分析等页是"每屏一个主问题"的锚点，但对供应商页
     它只是占掉 100px 垂直空间 —— 真正的信息在下面那 10 行里。
     这里改成**紧凑工具条**：标题+统计在左，操作按钮在右，一行解决。 -->
<div class="phd-bar">
  <div class="phd-bar-main">
    <h1 class="phd-bar-title" x-text="t('provider_config')"></h1>
    <span class="phd-bar-sub" x-text="t('plaza_summary',(providersFormData?providersFormData.length:0),totalModelCount())"></span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex:none">
    <template x-if="isDirty"><span class="dirty">● <span x-text="t('unsaved_changes')"></span></span></template>
    <button class="btn btn-g" @click.stop="refreshProviders()" x-text="t('refresh')"></button>
    <button class="btn btn-p" :disabled="!isDirty||_saving||provLoading" @click.stop="saveProvidersForm()"><template x-if="!_saving"><span x-text="t('save_config')"></span></template><template x-if="_saving"><span class="spin"></span></template></button>
    <button class="btn btn-p" :disabled="provLoading" @click.stop="showAddProvider=true" x-text="t('add')"></button>
  </div>
</div>
<!-- P1 骨架 (表单首载): 页头保留; 工具栏统计与空态都依赖真实数据 —— 无数据 ≠ 0 -->
<div x-show="provLoading" x-cloak aria-hidden="true" style="display:flex;flex-direction:column;gap:10px">
  <div class="skel-card"><div class="skel skel-line" style="width:34%"></div><div class="skel skel-line" style="width:100%;height:10px;margin-top:6px"></div><div class="skel skel-line" style="width:94%;height:10px;margin-top:6px"></div></div>
  <div class="skel-card"><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
</div>
<div class="pnl mb3" x-show="!provLoading" x-cloak><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px">
  <span class="search-wrap no-kbd"><input type="text" class="inp" style="width:240px" x-model="provSearchDraft" @input="onProvSearchInput($event)" @compositionstart="onSearchCompositionStart()" @compositionend="onSearchCompositionEnd('provSearch','provSearchDraft')" :placeholder="t('plaza_search_ph')" @keydown.escape="provSearch=''"><button type="button" class="search-clear" x-show="provSearch" @click.stop="provSearch=''" :aria-label="t('clear_search')" :title="t('clear_search')">✕</button></span>
  <span class="txs tm" x-text="(providersFormData||[]).length+' '+t('unit_providers')+' · '+(providersFormData||[]).reduce((s,p)=>s+(p.models||[]).length,0)+' '+t('unit_models')"></span>
  <span style="margin-left:auto" class="txs tm" x-text="t('plaza_showing')+' '+visibleProviders.length+' / '+(providersFormData?providersFormData.length:0)"></span>
</div></div>
<template x-if="visibleProviders.length===0 && providersFormData!==null && (providersFormData||[]).length===0"><div class="pnl"><div class="pnl-b empty-state"><div class="empty-ic" x-html="EMPTY_ICO"></div><h2 class="empty-t" x-text="t('empty_prov_title')"></h2><p class="empty-d" x-text="t('empty_prov_desc')"></p><button class="btn btn-p" @click.stop="showAddProvider=true" x-text="t('empty_prov_cta')"></button></div></div></template>
<template x-if="visibleProviders.length===0 && (providersFormData||[]).length>0"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('plaza_no_match')"></span> <button class="btn btn-g" style="font-size:var(--fs-11)" @click.stop="provSearch=''" x-text="t('plaza_clear_filters')"></button></div></div></template>
<!-- ── 供应商列表 = **紧凑行式**（2026-10-24 按 WaLiAPI 真实界面 1:1 重做）──
     实测目标尺寸：行高 73px / 圆角 16 / padding 16 / 1px 描边；
     内部：序号方块 24×24 → 状态点 8×8 → 名称+双标签 → URL 行 → 统计 → 图标按钮。
     改造前是 190px 高的竖版卡片（图标在上、徽章整行、带文字按钮），
     与参考项目形态完全不同 —— 所以这次整块重写，不再往旧卡片里加东西。
     只保留这一种列表：WaLiAPI 也只有一种（我们原有表格+卡片两套，各自都不像它）。 -->
<template x-if="visibleProviders.length>0">
  <div class="prov-list">
    <template x-for="(prov,pi) in visibleProviders" :key="prov.name">
      <div class="prov-row" :class="{'is-drag':provOverName===prov.name}"
           :draggable="!isProvExpanded(prov.name)"
           @dragstart="provDragStart($event,prov.name)" @dragover="provDragOver($event,prov.name)"
           @dragend="provDragEnd()" @drop="provDrop($event,prov.name)">
        <!-- 主行：点它展开（不进抽屉；抽屉由「编辑」图标进） -->
        <div class="prov-row-main" @click="toggleProvExpand(prov.name)" :aria-expanded="isProvExpanded(prov.name)?'true':'false'">
          <!-- 拖拽手柄 -->
          <div class="prov-grip" :title="t('drag_reorder')" aria-hidden="true">⋮⋮</div>
          <!-- 序号方块 -->
          <div class="prov-idx" x-text="pi+1"></div>
          <!-- 状态点 -->
          <span class="prov-dot" :class="healthOf(prov.name)==='ok'?'ok':(healthOf(prov.name)==='err'?'bad':'')"
                :title="healthOf(prov.name)==='ok'?t('health_ok'):(healthOf(prov.name)==='err'?t('health_err'):t('health_na'))" aria-hidden="true"></span>
          <!-- 名称 + 双标签 + URL -->
          <div class="prov-main">
            <div class="prov-title">
              <span class="prov-name" x-text="prov.name"></span>
              <span class="prov-tag tag-proto" x-text="'['+(availableApiFormats((prov.models||[])[0]||{},prov)[0]?t('fmt.'+availableApiFormats((prov.models||[])[0]||{},prov)[0]):'OpenAI')+']'"></span>
              <template x-if="prov.probed_protocols && prov.probed_protocols.length"><span class="prov-tag tag-iface" :title="t('prov_proto_probed_hint')" x-text="'['+t('prov_proto_probed_short')+']'"></span></template>
              <template x-if="prov.preset"><span class="prov-tag tag-iface" :title="t('preset_badge_hint')" x-text="'['+t('preset_badge')+']'"></span></template>
              <template x-if="prov.disabled"><span class="prov-tag tag-off" x-text="'['+t('prov_disabled_badge')+']'"></span></template>
              <!-- 套餐/免费徽章（2026-10-24）：套餐型供应商（opencode Go / WorkBuddy /
                   Buddy 月套餐）不按量计费，模型明细里它们的「已省」只能显示 "—"。
                   加这个徽章是为了让那个 "—" **有解释** —— 否则用户会以为算错了。
                   判据用统计层的 billing（组内任一中转 ID 不在免费名单即视为计费），
                   与「已省」列的判定同源，不另立一套口径。 -->
              <template x-if="provIsFlatRate(prov.name)">
                <span class="prov-tag tag-flat"
                      :title="t('flat_rate_hint')+' ('+provFlatRateCount(prov.name)+')'"
                      x-text="'['+t('flat_rate_badge')+']'"></span>
              </template>
            </div>
            <div class="prov-url mono" :title="prov.endpoint" x-text="prov.endpoint"></div>
          </div>
          <!-- 失败原因：成功率全红时"为什么"比"红多少"更要紧。
               有 last_error 才渲染；悬停看完整正文（可能很长，后端已截到 160 字符）。
               ⚠️ 位置很关键：放在**名称区内部**（.prov-main 里），不是行的末尾。
               放行尾时它会挤动右边距、把统计区往左推（实测 buddy/Joule 的
               统计左边缘从 1045 掉到 753/770，全页定宽对齐被它破坏）。
               放进名称区后，它占用的是可伸缩的空白，右侧统计与图标列岿然不动。 -->
          <!-- 统计（窄屏隐藏，与 WaLiAPI 的 hidden lg:flex 一致）。
               2026-10-24: 三项各自定宽（.prov-stat-u / -r / -t）——
               实测改造前右边缘已经对齐（都在 1297），但**每项的起点**随数字位数
               在 1088~1108 之间游走，竖着扫一列时看不出谁高谁低。定宽后三列的
               左边缘也固定，比较成功率/延迟变成真正的一列一列比。 -->
          <div class="prov-extra">
            <template x-if="provLastError(prov.name)">
              <span class="prov-errpill" :title="provErrTitle(prov.name)" tabindex="0"
                    :aria-label="t('prov_last_error')+': '+(provErrAdvice(prov.name)||provLastError(prov.name))">
                <span aria-hidden="true">!</span><span x-text="provErrShort(prov.name)"></span>
              </span>
            </template>
          </div>
          <template x-if="provQuickStats(prov.name)">
            <div class="prov-stats">
              <span class="prov-stat prov-stat-u" :title="t('unit_calls')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><b x-text="fmtT(provQuickStats(prov.name).calls)"></b></span>
              <span class="prov-stat prov-stat-r"><span class="prov-stat-l" x-text="t('success_rate')"></span><b :style="'color:'+provQuickStats(prov.name).okTone" x-text="provQuickStats(prov.name).okText"></b></span>
              <span class="prov-stat prov-stat-t"><span aria-hidden="true" style="display:inline-flex;color:var(--muted)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg></span><b x-text="fmtMs(provQuickStats(prov.name).latency)"></b></span>
            </div>
          </template>
          <!-- 顺序位次（替代 WaLiAPI 的 P/W：我们没有权重调度，用"第几位 = 优先级"表达） -->
          <span class="prov-order" :title="t('order_is_priority')" x-text="'#'+(pi+1)"></span>
          <!-- 图标按钮组（纯图标 + title，73px 行里放不下文字按钮） -->
          <div class="prov-acts" @click.stop>
            <button type="button" class="prov-ib" :title="t('test_connection')" :aria-label="t('test_connection')+' '+prov.name" :disabled="prov._testing" @click="testProvider(providersFormData.indexOf(prov))"><span x-show="!prov._testing" aria-hidden="true" style="display:inline-flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span><span x-show="prov._testing" class="spin"></span></button>
            <button type="button" class="prov-ib" :title="t('fetch_models')" :aria-label="t('fetch_models')+' '+prov.name" :disabled="prov._fetching" @click="fetchProviderModels(providersFormData.indexOf(prov))"><span x-show="!prov._fetching" aria-hidden="true" style="display:inline-flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span><span x-show="prov._fetching" class="spin"></span></button>
            <button type="button" class="prov-ib" :title="t('copy_curl')" :aria-label="t('copy_curl')+' '+prov.name" @click="copyProviderCurl(prov)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></button>
            <button type="button" class="prov-ib" :title="t('edit')" :aria-label="t('edit')+' '+prov.name" @click="openProviderDrawer(providersFormData.indexOf(prov))"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>
            <button type="button" class="prov-ib" :title="(prov.disabled?t('prov_enable'):t('prov_disable'))" :aria-label="(prov.disabled?t('prov_enable'):t('prov_disable'))+' '+prov.name" @click="toggleProvDisabled(prov)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></button>
            <button type="button" class="prov-ib prov-ib-del" :title="prov.preset?t('preset_locked'):t('delete')" :aria-label="t('delete')+' '+prov.name" :disabled="!!prov.preset" @click="deleteProvider(providersFormData.indexOf(prov))"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
            <button type="button" class="prov-ib" :title="isProvExpanded(prov.name)?t('collapse'):t('expand_details')" :aria-label="isProvExpanded(prov.name)?t('collapse'):t('expand_details')" :aria-expanded="isProvExpanded(prov.name)?'true':'false'" @click="toggleProvExpand(prov.name)"><span aria-hidden="true" :style="'display:inline-flex;transition:transform .2s;transform:rotate('+(isProvExpanded(prov.name)?180:0)+'deg)'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></span></button>
          </div>
        </div>
        <!-- 行内展开（保留我们已有、WaLiAPI 没有的能力：模型胶囊点一下复制） -->
        <template x-if="isProvExpanded(prov.name)">
          <div class="prov-expand" @click.stop>
            <!-- opencode 套餐额度（2026-10-24，**Console API 官方真实值**）。
                 数据来源是 `GET https://opencode.ai/console/api/go/status`，
                 需要供应商配置里的 Console Cookie + 组织 ID。
                 （早先的"本地累加 allowance"方案已删除：它看不到别的客户端的用量，
                   且要维护一张会过期的模型额度表。）
                 查询是**显式动作**（点按钮），不在打开页面时自动打外部接口。 -->
            <template x-if="provMayHaveQuota(prov)">
              <div class="pe-sec">
                <div class="pe-hd">
                  <span x-text="t('quota_title')"></span>
                  <span class="cg" style="gap:8px">
                    <span class="txs tm" x-text="t('quota_source_api')" :title="t('quota_source_api_hint')"></span>
                    <button type="button" class="btn btn-g" style="font-size:var(--fs-11);padding:3px 9px"
                            :disabled="ocQuotaLoading(prov.name)"
                            @click.stop="fetchOpencodeQuota(prov.name)">
                      <span x-show="!ocQuotaLoading(prov.name)" x-text="t('quota_query')"></span>
                      <span x-show="ocQuotaLoading(prov.name)" class="spin"></span>
                    </button>
                  </span>
                </div>

                <!-- 查询失败：如实报错（含"Cookie 可能过期"这种可操作提示），不画假进度条 -->
                <template x-if="ocQuotaErr(prov.name)">
                  <div class="quota-err"><span aria-hidden="true">!</span><span x-text="ocQuotaErr(prov.name)"></span></div>
                </template>

                <!-- 查到了：三个窗口各一条，带金额与重置时间 -->
                <template x-if="ocQuota(prov.name)">
                  <div class="quota-list">
                    <template x-for="w in ocQuota(prov.name).windows" :key="'qw'+w.key">
                      <div class="quota-row">
                        <span class="quota-model" x-text="ocWindowLabel(w.key)"></span>
                        <span class="quota-bar"><i :style="'width:'+Math.min(100,w.used_pct||0)+'%;background:'+ocTone(w.used_pct)"></i></span>
                        <b class="quota-w-v" :style="'color:'+ocTone(w.used_pct)"
                           :title="ocUsd(w.used_usd)+' / '+ocUsd(w.limit_usd)"
                           x-text="ocPctText(w.used_pct)"></b>
                        <span class="quota-amt mono" x-text="ocUsd(w.used_usd)+' / '+ocUsd(w.limit_usd)"></span>
                        <span class="quota-reset txs tm" x-show="w.resets_at"
                              x-text="t('quota_reset_at')+' '+ocResetText(w.resets_at)"></span>
                        <span class="quota-reset txs tm" x-show="!w.resets_at" x-text="t('quota_inactive')"></span>                      </div>
                    </template>
                    <div class="txs tm" style="margin-top:2px"
                         x-show="ocQuota(prov.name).ends_at"
                         x-text="t('quota_period_ends')+' '+ocQuota(prov.name).ends_at
                                 +(ocQuota(prov.name).cancel_at_period_end?' · '+t('quota_cancelled'):'')"></div>
                  </div>
                </template>

                <!-- 还没查过：给一句引导，别让用户以为坏了 -->
                <template x-if="!ocQuota(prov.name) && !ocQuotaErr(prov.name) && !ocQuotaLoading(prov.name)">
                  <div class="txs tm" style="margin-top:6px" x-text="t('quota_not_queried')"></div>
                </template>
              </div>
            </template>
            <div class="pe-sec">
              <div class="pe-hd"><span x-text="t('available_models_n',(prov.models||[]).length)"></span><span class="txs tm" x-text="t('click_to_copy')"></span></div>
              <div class="pe-chips">
                <template x-for="m in (prov.models||[])" :key="'pm'+m.model_id">
                  <button type="button" class="pe-chip" :class="{'copied':copiedField==='model:'+m.model_id}" :title="(m.upstream_model||m.model_id)+' · '+t('click_to_copy')" @click.stop="copyModelId(m.model_id)"><span x-text="m.model_id"></span><span aria-hidden="true" x-show="copiedField==='model:'+m.model_id"> ✓</span></button>
                </template>
                <span class="txs tm" x-show="!(prov.models||[]).length" x-text="t('no_models_yet')"></span>
              </div>
            </div>
            <template x-if="prov._testResult">
              <div class="pe-test" :class="prov._testResult.success?'ok':'bad'">
                <span aria-hidden="true" x-text="prov._testResult.success?'✓':'✗'"></span>
                <span x-text="prov._testResult.success?t('test_ok'):(testErrFirst(prov._testResult.status)||t('test_failed'))"></span>
                <span class="mono" x-show="prov._testResult.latency_ms" x-text="fmtMs(prov._testResult.latency_ms||0)"></span>
              </div>
            </template>
            <template x-if="provQuickStats(prov.name)">
              <div class="pe-stats">
                <div><div class="pe-k" x-text="t('quick_calls')"></div><div class="pe-v" x-text="fmtT(provQuickStats(prov.name).calls)"></div></div>
                <div><div class="pe-k" x-text="t('success_rate')"></div><div class="pe-v" :style="'color:'+provQuickStats(prov.name).okTone" x-text="provQuickStats(prov.name).okText"></div></div>
                <div><div class="pe-k" x-text="t('avg_latency')"></div><div class="pe-v" x-text="fmtMs(provQuickStats(prov.name).latency)"></div></div>
                <div><div class="pe-k" x-text="t('detail.endpoint_short')"></div><div class="pe-v txs mono" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="prov.endpoint" x-text="prov.endpoint"></div></div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
</div>
