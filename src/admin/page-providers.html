<div x-show="activeTab==='providers'" class="page-enter page-wide">
<div class="phd">
  <div><h1 class="pt" x-text="t('provider_config')"></h1><p class="ps" x-text="t('plaza_summary',(providersFormData?providersFormData.length:0),totalModelCount())"></p></div>
  <div style="display:flex;gap:8px;align-items:center">
    <template x-if="isDirty"><span class="dirty">● <span x-text="t('unsaved_changes')"></span></span></template>
    <button class="btn btn-g" @click="refreshProviders()" x-text="t('refresh')"></button>
    <button class="btn btn-p" :disabled="!isDirty||_saving||provLoading" @click="saveProvidersForm()"><template x-if="!_saving"><span x-text="t('save_config')"></span></template><template x-if="_saving"><span class="spin"></span></template></button>
    <button class="btn btn-p" :disabled="provLoading" @click="showAddProvider=true" x-text="t('add')"></button>
  </div>
</div>
<!-- P1 骨架 (表单首载): 页头保留; 工具栏统计与空态都依赖真实数据 —— 无数据 ≠ 0 -->
<div x-show="provLoading" x-cloak aria-hidden="true" style="display:flex;flex-direction:column;gap:10px">
  <div class="skel-card"><div class="skel skel-line" style="width:34%"></div><div class="skel skel-line" style="width:100%;height:10px;margin-top:6px"></div><div class="skel skel-line" style="width:94%;height:10px;margin-top:6px"></div></div>
  <div class="skel-card"><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
</div>
<div class="pnl mb3" x-show="!provLoading" x-cloak><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px">
  <span class="search-wrap no-kbd"><input type="text" class="inp" style="width:240px" x-model="provSearch" :placeholder="t('plaza_search_ph')" @keydown.escape="provSearch=''"><button type="button" class="search-clear" x-show="provSearch" @click="provSearch=''" :aria-label="t('clear_search')" :title="t('clear_search')">✕</button></span>
  <span class="txs tm" x-text="(providersFormData||[]).length+' '+t('unit_providers')+' · '+(providersFormData||[]).reduce((s,p)=>s+(p.models||[]).length,0)+' '+t('unit_models')"></span>
  <span style="margin-left:auto" class="txs tm" x-text="t('plaza_showing')+' '+visibleProviders.length+' / '+(providersFormData?providersFormData.length:0)"></span>
  <div class="seg"><span class="seg-i" :class="{'a':provViewMode==='table'}" @click="provViewMode='table'" x-text="t('plaza_view_table')"></span><span class="seg-i" :class="{'a':provViewMode==='card'}" @click="provViewMode='card'" x-text="t('plaza_view_card')"></span></div>
</div></div>
<template x-if="visibleProviders.length===0 && providersFormData!==null && (providersFormData||[]).length===0"><div class="pnl"><div class="pnl-b empty-state"><div class="empty-ic" x-html="EMPTY_ICO"></div><h2 class="empty-t" x-text="t('empty_prov_title')"></h2><p class="empty-d" x-text="t('empty_prov_desc')"></p><button class="btn btn-p" @click="showAddProvider=true" x-text="t('empty_prov_cta')"></button></div></div></template>
<template x-if="visibleProviders.length===0 && (providersFormData||[]).length>0"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('plaza_no_match')"></span> <button class="btn btn-g" style="font-size:var(--fs-11)" @click="provSearch=''" x-text="t('plaza_clear_filters')"></button></div></div></template>
<template x-if="provViewMode==='table' && visibleProviders.length>0"><div class="pnl"><div style="overflow-x:auto">
<table class="prov-table"><thead><tr>
<th style="width:5%"></th>
<th x-text="t('provider_name')"></th>
<th x-text="t('provider_status')"></th>
<th x-text="t('latency')"></th>
<th x-text="t('circuit')"></th>
<th x-text="t('key_label')"></th>
<th x-text="t('unit_models')"></th>
<th style="text-align:right" x-text="t('actions')"></th>
</tr></thead>
<tbody><template x-for="prov in visibleProviders" :key="prov.name"><tr>
  <td><div style="width:28px;height:28px;border-radius:var(--rm);overflow:hidden" x-html="providerLogo(prov.name)"></div></td>
  <td><!-- P2: 供应商名点击即复制 (短值就地面板内复制) --><span class="txsm fw6 bdg-click" :class="copiedField==='prov:'+prov.name?'bdg bdg-copied':''" :title="t('copy')" @click.stop="copyBadge(prov.name,'prov:'+prov.name)" x-text="prov.name"></span><!-- 「内置」此前是这一行里**唯一没有 title 的徽章**, 而它的词义有歧义:
     非开发者容易读成"软件自带的、应该自动就能用", 实际含义是"此条目由内置模板生成
     (因此受保护、不可删除)"。加 title 说清来源 (2026-10-12 审计)。 -->
<template x-if="prov.preset"><span class="bdg bdg-p" style="font-size:var(--fs-9)" :title="t('preset_badge_hint')" x-text="t('preset_badge')"></span></template><template x-if="prov.preset && presetDirty(prov)"><span class="bdg bdg-w" style="font-size:var(--fs-9)" :title="t('preset_modified_hint')" x-text="t('preset_modified')"></span></template><template x-if="prov.disabled"><span class="bdg bdg-w" style="font-size:var(--fs-9)" x-text="t('prov_disabled_badge')"></span></template><div class="txs mono tm" style="max-width:220px;overflow:hidden;text-overflow:ellipsis" :title="prov.endpoint" x-text="prov.endpoint"></div></td>
  <td>
    <!-- P2: 状态色统一走 bcls(tone) 语义表 (原为各处手写三元链, 同一状态在不同页取不同色) -->
    <template x-if="healthOf(prov.name)==='ok'||healthOf(prov.name)==='err'"><span class="bdg" :class="bcls(healthOf(prov.name)==='ok'?'ok':'err')" x-text="healthOf(prov.name)==='ok'?t('health_ok'):t('health_err')"></span></template>
    <template x-if="!health.find(h => h.provider === prov.name) && prov._testResult"><span class="bdg" :class="bcls(prov._testResult.success?'ok':'err')" x-text="prov._testResult.success?t('health_ok'):t('health_err')"></span></template>
    <template x-if="!health.find(h => h.provider === prov.name) && !prov._testResult"><span class="txs tm" x-text="t('health_na')"></span></template>
    <template x-if="prov._testResult && !prov._testResult.success">
      <div style="margin-top:4px;max-width:210px">
        <div class="txs" style="color:var(--err);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="t('err_view_full')" @click="prov._errOpen=!prov._errOpen"><span x-show="testStage(prov._testResult)" style="font-weight:600" x-text="testStage(prov._testResult)"></span><span x-text="testErrFirst(prov._testResult.status)"></span></div>
        <template x-if="prov._errOpen">
          <div style="margin-top:4px;padding:6px 8px;border-radius:var(--rm);background:var(--err-bg-soft);border:1px solid var(--err-bd-soft);max-width:280px;white-space:pre-wrap;word-break:break-all;font-size:var(--fs-10);color:var(--err-fg)">
            <div x-text="prov._testResult.status"></div>
            <button class="btn btn-g" style="font-size:var(--fs-10);padding:2px 6px;margin-top:5px" @click.stop="copyTestErr(prov)" x-text="copiedField==='terr'?t('copied'):t('copy')"></button>
          </div>
        </template>
      </div>
    </template>
  </td>
  <td class="txs tm mono"><template x-if="health.find(h => h.provider === prov.name)"><span x-text="fmtMs(health.find(h => h.provider === prov.name).latency_ms)"></span></template><template x-if="!health.find(h => h.provider === prov.name) && prov._testResult"><span x-text="fmtMs(prov._testResult.latency_ms||0)"></span></template><template x-if="!health.find(h => h.provider === prov.name) && !prov._testResult"><span x-text="t('health_na')"></span></template></td>
  <td><template x-if="health.find(h => h.provider === prov.name)"><span class="bdg" :class="bcls(health.find(h=>h.provider===prov.name).circuit==='closed'?'ok':health.find(h=>h.provider===prov.name).circuit==='half-open'?'warn':'err')" x-text="health.find(h=>h.provider===prov.name).circuit==='closed'?t('circuit_closed'):health.find(h=>h.provider===prov.name).circuit==='half-open'?t('circuit_half_open'):t('circuit_open')"></span></template><template x-if="!health.find(h => h.provider === prov.name)"><span class="txs tm" x-text="t('health_na')"></span></template></td>
  <td><span class="bdg" :class="bcls(hasCred(prov.name)?'ok':'warn')" x-text="keyStatusText(prov.name)"></span></td>
  <td>
    <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
      <span class="mono txsm" x-text="(prov.models||[]).length"></span>
      <template x-if="prov._newModels>0"><span class="bdg bdg-s" style="font-size:var(--fs-9)" x-text="t('new_models_badge', prov._newModels)"></span></template>
      <template x-for="fmt in badgeList(provProtocols(prov),2).shown" :key="fmt"><span class="bdg bdg-g" :title="t('prov_proto_inuse_hint')" x-text="fmt"></span></template>
      <template x-if="badgeList(provProtocols(prov),2).more>0"><span class="bdg-more" :title="badgeList(provProtocols(prov),2).title" x-text="'+'+badgeList(provProtocols(prov),2).more"></span></template>
      <template x-if="(prov.probed_protocols||[]).length"><span class="bdg bdg-p" :title="t('prov_proto_probed_hint')" x-text="t('prov_proto_probed_short')"></span></template>
      <template x-for="fmt in (prov.probed_protocols||[])" :key="'ppt'+fmt"><span class="bdg bdg-p" :title="t('prov_proto_probed_hint')" x-text="fmt"></span></template>
    </div>
  </td>
  <td style="text-align:right;white-space:nowrap"><div style="display:inline-flex;gap:4px">
    <!-- ⚡/↓ 原本是**无文字图标**, 含义只能靠 hover 才知道 —— 而「拉取模型」是每次新增
         供应商后都要做的高频操作（HANDOFF 原文: 部署后点拉取 + 保存即得新模型）。
         2026-10-12 审计后给这两个加文字（图标保留在前面, 仍一眼可扫）。 -->
    <button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" :title="t('test_connection')" :disabled="prov._testing" @click="testProvider(providersFormData.indexOf(prov))"><template x-if="!prov._testing"><span>⚡ <span x-text="t('test_short')"></span></span></template><template x-if="prov._testing"><span class="spin"></span></template></button>
    <button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px;color:var(--warn)" x-show="health.find(h=>h.provider===prov.name)&&health.find(h=>h.provider===prov.name).circuit!=='closed'" @click="resetCircuit(prov.name)" x-text="t('reset_circuit')"></button>
    <button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" :title="t('fetch_models')" :disabled="prov._fetching" @click="fetchProviderModels(providersFormData.indexOf(prov))"><template x-if="!prov._fetching"><span>↓ <span x-text="t('fetch_models')"></span></span></template><template x-if="prov._fetching"><span class="spin"></span></template></button>
    <button class="btn btn-o" style="font-size:var(--fs-11);padding:4px 10px" @click="openProviderDrawer(providersFormData.indexOf(prov))" x-text="t('edit')"></button>
    <template x-if="isAccountProv(prov)"><button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" @click="openLogin(prov.name)" x-text="accountsStatus&&accountsStatus[prov.name]?t('relogin'):t('login')"></button></template>
    <template x-if="prov.preset"><button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" @click="toggleProvDisabled(prov)" x-text="prov.disabled?t('prov_enable'):t('prov_disable')"></button></template>
    <template x-if="prov.preset && presetDirty(prov)"><button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px;color:var(--warn)" :title="t('preset_reset')" @click="presetReset(prov)">⟲</button></template>
    <button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px;color:var(--err)" :disabled="!!prov.preset" @click="deleteProvider(providersFormData.indexOf(prov))" :title="prov.preset?t('preset_locked'):t('delete')" :aria-label="t('delete')">✕</button>
  </div></td>
</tr></template></tbody></table>
</div></div></template>
<template x-if="provViewMode==='card' && visibleProviders.length>0"><div class="plaza-grid">
  <template x-for="prov in visibleProviders" :key="prov.name"><div class="plaza-card card-hoverable">
    <!-- 标题行: 图标方块 + 名称(可点复制) + 徽章组. 对齐 cc-switch ProviderCard 的
         「drag/图标 + 名称 + 状态徽章 + (URL 行独立成第二行)」结构 -->
    <div class="plaza-ch">
      <div class="plaza-ic ibox" x-html="providerLogo(prov.name)"></div>
      <div style="min-width:0;flex:1">
        <div class="plaza-nm bdg-click" :class="copiedField==='prov:'+prov.name?'bdg bdg-copied':''" :title="t('copy')" @click.stop="copyBadge(prov.name,'prov:'+prov.name)" x-text="prov.name"></div>
        <div class="plaza-ep" :title="prov.endpoint" x-text="prov.endpoint"></div>
      </div>
      <!-- 健康/密钥状态放在标题右侧, 与名称同排 —— 一眼看到"这家能不能用" -->
      <template x-if="healthOf(prov.name)==='ok'||healthOf(prov.name)==='err'"><span class="bdg" :class="healthOf(prov.name)==='ok'?'bdg-s':'bdg-e'" x-text="healthOf(prov.name)==='ok'?t('health_ok'):t('health_err')"></span></template>
      <span class="bdg" :class="hasCred(prov.name)?'bdg-s':'bdg-w'" x-text="keyStatusText(prov.name)"></span>
      <template x-if="prov.preset"><span class="bdg bdg-p" :title="t('preset_badge_hint')" x-text="t('preset_badge')"></span></template>
      <template x-if="prov.preset && presetDirty(prov)"><span class="bdg bdg-w" :title="t('preset_modified_hint')" x-text="t('preset_modified')"></span></template>
      <template x-if="prov.disabled"><span class="bdg bdg-w" x-text="t('prov_disabled_badge')"></span></template>
    </div>
    <div class="plaza-ft">
      <span class="txs tm mono" x-text="health.find(h=>h.provider===prov.name)?fmtMs(health.find(h=>h.provider===prov.name).latency_ms):(prov._testResult?fmtMs(prov._testResult.latency_ms||0):t('health_na'))"></span>
      <span class="txs tm" x-text="(prov.models||[]).length+' '+t('unit_models')"></span>
      <template x-if="prov._newModels>0"><span class="bdg bdg-s" style="font-size:var(--fs-9)" x-text="t('new_models_badge', prov._newModels)"></span></template>
      <template x-for="fmt in badgeList(provProtocols(prov),2).shown" :key="fmt"><span class="bdg bdg-g" :title="t('prov_proto_inuse_hint')" x-text="fmt"></span></template>
      <template x-if="badgeList(provProtocols(prov),2).more>0"><span class="bdg-more" :title="badgeList(provProtocols(prov),2).title" x-text="'+'+badgeList(provProtocols(prov),2).more"></span></template>
      <template x-if="(prov.probed_protocols||[]).length"><span class="bdg bdg-p" :title="t('prov_proto_probed_hint')" x-text="t('prov_proto_probed_short')"></span></template>
      <template x-for="fmt in (prov.probed_protocols||[])" :key="'ppc'+fmt"><span class="bdg bdg-p" :title="t('prov_proto_probed_hint')" x-text="fmt"></span></template>
    </div>
    <!-- 操作条: 次级按钮靠左, 主操作(编辑)与删除靠右 —— 原为 5 个平铺按钮挤一行 -->
    <div class="plaza-acts">
      <!-- 卡片视图宽度够, 这两个高频操作直接给文字（表格视图同款改动, 见上方注释） -->
      <button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" :title="t('test_connection')" :disabled="prov._testing" @click="testProvider(providersFormData.indexOf(prov))"><template x-if="!prov._testing"><span>⚡ <span x-text="t('test_short')"></span></span></template><template x-if="prov._testing"><span class="spin"></span></template></button>
      <button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" :title="t('fetch_models')" :disabled="prov._fetching" @click="fetchProviderModels(providersFormData.indexOf(prov))"><template x-if="!prov._fetching"><span>↓ <span x-text="t('fetch_models')"></span></span></template><template x-if="prov._fetching"><span class="spin"></span></template></button>
      <button class="btn btn-g icon-btn" style="color:var(--warn)" x-show="health.find(h=>h.provider===prov.name)&&health.find(h=>h.provider===prov.name).circuit!=='closed'" :title="t('reset_circuit')" :aria-label="t('reset_circuit')" @click="resetCircuit(prov.name)">⟲</button>
      <template x-if="isAccountProv(prov)"><button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" @click="openLogin(prov.name)" x-text="accountsStatus&&accountsStatus[prov.name]?t('relogin'):t('login')"></button></template>
      <template x-if="prov.preset"><button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" @click="toggleProvDisabled(prov)" x-text="prov.disabled?t('prov_enable'):t('prov_disable')"></button></template>
      <template x-if="prov.preset && presetDirty(prov)"><button class="btn btn-g icon-btn" :title="t('preset_reset')" :aria-label="t('preset_reset')" @click="presetReset(prov)">⟲</button></template>
      <button class="btn btn-o" style="font-size:var(--fs-11);padding:4px 10px;margin-left:auto" @click="openProviderDrawer(providersFormData.indexOf(prov))" x-text="t('edit')"></button>
      <button class="btn btn-g icon-btn" style="color:var(--err)" :disabled="!!prov.preset" @click="deleteProvider(providersFormData.indexOf(prov))" :title="prov.preset?t('preset_locked'):t('delete')" :aria-label="t('delete')">✕</button>
    </div>
    <template x-if="prov._testResult && !prov._testResult.success">
      <div style="margin-top:6px">
        <div class="txs" style="color:var(--err);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="t('err_view_full')" @click="prov._errOpen=!prov._errOpen"><span x-show="testStage(prov._testResult)" style="font-weight:600" x-text="testStage(prov._testResult)"></span><span x-text="testErrFirst(prov._testResult.status)"></span></div>
        <!-- 这次测的是哪个密钥: 失败时尤其要知道 (草稿/已保存), 否则无法判断该改哪一份 -->
        <div class="txs tm" x-show="testKeySourceText(prov._testResult)" x-text="testKeySourceText(prov._testResult)"></div>
        <template x-if="prov._errOpen">
          <div style="margin-top:4px;padding:6px 8px;border-radius:var(--rm);background:var(--err-bg-soft);border:1px solid var(--err-bd-soft);white-space:pre-wrap;word-break:break-all;font-size:var(--fs-10);color:var(--err-fg)">
            <div x-text="prov._testResult.status"></div>
            <button class="btn btn-g" style="font-size:var(--fs-10);padding:2px 6px;margin-top:5px" @click.stop="copyTestErr(prov)" x-text="copiedField==='terr'?t('copied'):t('copy')"></button>
          </div>
        </template>
      </div>
    </template>
  </div></template>
  </div></template>
</div>
