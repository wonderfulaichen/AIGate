</head>
<body>
<div class="layout" x-data="dashboard()" x-init="init()">
<!-- skip 链接: 键盘首个 Tab 落点, 越过侧栏直达主内容 (平时移出视口, 聚焦才滑入).
     必须在 x-data 作用域内 —— 否则 x-text="t(...)" 无 Alpine 上下文, 文本为空. -->
<a href="#main-content" class="skip-link" x-text="t('skip_main')"></a>
<header class="hdr">
  <button @click="sbCollapsed=!sbCollapsed" class="btn-g" style="padding:4px 6px;border-radius:6px" :title="t('toggle_sidebar')" :aria-label="t('toggle_sidebar')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span class="hdr-title">AIGate</span>
  <div class="hdr-right">
    <span class="txs mono tm">v<span x-text="version.version"></span></span>
    <select class="sel" style="font-size:var(--fs-11);padding:3px 24px 3px 8px" @change="setLang($event.target.value)" x-effect="$el.value=(Alpine.store('i18n')||{}).lang||'zh-CN'">
      <option value="zh-CN" x-text="t('lang_zh')"></option><option value="en-US" x-text="t('lang_en')"></option>
    </select>
  </div>
</header>
<div class="body">
<nav class="sb" :class="{'colapsed':sbCollapsed}">
  <div class="sb-nav">
    <div class="sb-glabel" x-text="t('nav_group.monitor')"></div>
    <a href="#" @click.prevent="switchTab('dashboard')" class="sb-item" :class="{'active':activeTab==='dashboard'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span x-text="t('nav.dashboard')"></span></a>
    <a href="#" @click.prevent="switchTab('analytics')" class="sb-item" :class="{'active':activeTab==='analytics'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg><span x-text="t('nav.analytics')"></span></a>
    <a href="#" @click.prevent="switchTab('records')" class="sb-item" :class="{'active':activeTab==='records'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span x-text="t('nav.records')"></span></a>
    <div class="sb-glabel" x-text="t('nav_group.config')"></div>

    <a href="#" @click.prevent="switchTab('providers')" class="sb-item" :class="{'active':activeTab==='providers'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="6" rx="2"/><rect x="3" y="15" width="18" height="6" rx="2"/><circle cx="7" cy="6" r="0.5" fill="currentColor"/><circle cx="7" cy="18" r="0.5" fill="currentColor"/></svg><span x-text="t('nav.providers')"></span></a>
    <a href="#" @click.prevent="switchTab('settings')" class="sb-item" :class="{'active':activeTab==='settings'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span x-text="t('nav.settings')"></span></a>
    <div class="sb-glabel" x-text="t('nav_group.system')"></div>
    <a href="#" @click.prevent="switchTab('about')" class="sb-item" :class="{'active':activeTab==='about'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/></svg><span x-text="t('nav.about')"></span></a>
  </div>
</nav>
<main class="main" id="main-content" tabindex="-1">
<!-- 全局播报区 (aria-live=polite): 分页/筛选等状态变化用既有文案播报给屏幕阅读器; 平时视觉隐藏 -->
<span class="sr-only" role="status" aria-live="polite" x-text="liveMsg"></span>
<!-- P1: 原全局 loadBar 细条已由各页骨架替代 (面板标题不闪的三态外壳, 见 components.css .skel) -->
<template x-if="statsError && !stats"><div class="pnl" style="margin-bottom:16px"><div class="pnl-b" style="text-align:center;padding:40px 16px"><div class="tm" style="margin-bottom:14px" x-text="t('fetch_failed')"></div><button class="btn btn-g" @click="retryFetchStats()" x-text="t('refresh')"></button></div></div></template>
