<div x-show="activeTab==='dashboard'" class="page-enter ov-page">
  <div class="phd">
    <div><h1 class="pt" x-text="t('dashboard_title')"></h1><p class="ps" x-text="t('dashboard_subtitle')"></p></div>
    <div class="ov-actions"><span class="bdg bdg-s"><span class="hb" aria-hidden="true"></span><span x-text="t('service_running')"></span></span><!-- P3: 已完成徽章可点击重新展开清单 (原实现 3/3 后清单整块消失, 再想核对就没入口了) --><span class="bdg bdg-s" x-show="!loading && onboardAllDone" style="background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok);cursor:pointer" role="button" tabindex="0" :title="t('onboard_title')" :aria-expanded="onboardShowDone" @click="onboardShowDone=!onboardShowDone" @keydown.enter.prevent="onboardShowDone=!onboardShowDone" @keydown.space.prevent="onboardShowDone=!onboardShowDone">✓ <span x-text="t('onboard_done_badge')"></span></span><button class="btn btn-g" @click="fetchStats(null,true);fetchBalance();fetchHealth()" :disabled="_refreshing"><span x-show="!_refreshing" x-text="t('refresh')"></span><span x-show="_refreshing" class="spin"></span></button></div>
  </div>
  <!-- P1 骨架 (loading 态): 与页根同级, 面板标题不闪; 宽限期 250ms 内首载完成则不出现.
       手动刷新 (_refreshing) 时覆盖内容显示同一骨架 —— 后台轮询不置位, 无 3s 频闪. -->
  <div class="ov-page" x-show="((loading&&skelReady)||_refreshing)&&!statsError" x-cloak aria-hidden="true" style="display:flex;flex-direction:column;gap:16px">
    <div class="skel-card" style="align-items:flex-start;gap:8px"><div class="skel skel-line" style="width:220px"></div><div class="skel skel-line" style="width:340px;height:10px"></div><div class="skel skel-line" style="width:160px;height:28px;margin-top:4px"></div></div>
    <div class="ov-grid" style="display:grid">
      <div class="ov-main">
        <div class="skel-card"><div class="skel skel-line" style="width:30%"></div><div class="skel skel-value"></div><div class="skel skel-line" style="width:70%;height:10px"></div></div>
        <div class="skel-card"><div class="skel skel-line" style="width:26%"></div><div class="skel skel-value"></div><div class="skel skel-line" style="width:60%;height:10px"></div></div>
        <div class="skel-card"><div class="skel skel-line" style="width:34%"></div><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
      </div>
      <div class="ov-side">
        <div class="skel-card"><div class="skel skel-line" style="width:40%"></div><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
        <div class="skel-card"><div class="skel skel-line" style="width:30%"></div><div class="skel skel-line" style="width:80%;height:10px"></div></div>
      </div>
    </div>
  </div>
  <div class="pnl mb3" x-show="!loading && !_refreshing && !statsError && providersFormData!==null && (!onboardAllDone || onboardShowDone)" x-cloak>
    <div class="pnl-h"><div><span class="pnl-ht" x-text="t('onboard_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('onboard_desc')"></div></div><span class="bdg bdg-g" x-text="t('onboard_progress',onboardDone)"></span></div>
    <div class="pnl-b"><div class="onb-list">
      <template x-for="(s,i) in onboardSteps" :key="s.k">
        <div class="onb-step" :class="{'done':s.done,'cur':!s.done && i===onboardFirstPending}">
          <div class="onb-num"><span x-show="s.done">✓</span><span x-show="!s.done" x-text="i+1"></span></div>
          <div class="onb-body"><div class="onb-t"><span x-text="t('onboard_step_'+s.k+'_title')"></span><span class="onb-tag" x-show="s.done" x-text="t('onboard_step_done')"></span></div><div class="onb-d" x-text="t('onboard_step_'+s.k+'_desc')"></div></div>
          <button class="btn btn-o" style="font-size:var(--fs-11);flex:none" x-show="!s.done" @click="onboardAction(s.k)" x-text="t('onboard_step_'+s.k+'_action')"></button>
        </div>
      </template>
    </div></div>
  </div>
  <template x-if="!loading && !_refreshing && !statsError && (!stats || stats.total_requests===0)">
    <div>
    <div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px 16px">
      <span class="bdg bdg-s mb2" x-text="t('service_running')"></span>
      <h2 style="font-size:1.1rem;font-weight:600;color:var(--fg);margin:8px 0" x-text="t('waiting_first_request')"></h2>
      <p class="txsm tm mb3" x-text="t('setup_hint')"></p>
      <div class="fb" style="max-width:460px;margin:0 auto;padding:10px 14px;background:var(--input);border-radius:var(--r);border:1px solid var(--border)"><span class="mono txsm" style="color:var(--fg);overflow:hidden;text-overflow:ellipsis" x-text="baseUrl"></span><button class="btn btn-g" style="font-size:var(--fs-11)" @click="copyText(baseUrl,'base')" x-text="copiedField==='base'?t('copied'):t('copy')"></button></div>
    </div></div>
    <div class="pnl" style="margin-top:12px">
      <div class="pnl-h"><div><span class="pnl-ht" x-text="t('first_req_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('first_req_desc')"></div></div><div class="seg"><span class="seg-i" :class="{'a':firstReqTab==='curl'}" @click="firstReqTab='curl'">curl</span><span class="seg-i" :class="{'a':firstReqTab==='python'}" @click="firstReqTab='python'">Python</span><span class="seg-i" :class="{'a':firstReqTab==='node'}" @click="firstReqTab='node'">Node.js</span></div></div>
      <div class="pnl-b">
        <div class="fr-code"><pre x-text="firstRequestCode()"></pre></div>
        <div class="fb" style="margin-top:10px">
          <div class="fr-hints"><span class="txs tm" x-text="t('first_req_nokey')"></span><span class="txs tm" x-text="t('first_req_local')"></span></div>
          <button class="btn btn-p" style="font-size:var(--fs-11);flex:none" @click="copyFirstRequest()" x-text="copiedField==='firstreq'?t('copied'):t('copy')"></button>
        </div>
      </div>
    </div>
    </div>
  </template>
  <template x-if="!loading && !_refreshing && stats && stats.total_requests>0">
    <div class="ov-grid fade-in">
      <div class="ov-main">
        <!-- Hero 指标带: 一个玻璃大卡承载"一眼要看的全部关键数字" ——
             原先散在三张卡 + 三个小格, 视线要来回跳; 合成一条带之后主次一眼分明.
             对照 cc-switch UsageHero: 主数字(+≈副档) | 竖分隔指标簇 | 全宽趋势 | 底部统计格. -->
        <div class="hero">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
            <div class="hero-top">
              <div class="hero-lead">
                <span class="ibox hero-ico" style="background:var(--secondary-soft);color:var(--secondary)" aria-hidden="true">◇</span>
                <div style="min-width:0">
                  <div class="hero-label" x-text="t('hero_tokens')"></div>
                  <div class="hero-val"><span class="hero-num" x-text="numText('heroTokens',heroTokens,'int')"></span><span class="hero-approx" x-show="heroTokensApprox" x-text="heroTokensApprox"></span></div>
                </div>
              </div>
              <div class="hero-cluster">
                <div class="hero-cell"><span class="hero-cell-l" x-text="t('hero_requests')"></span><span class="hero-cell-v" x-text="numText('heroRequests',heroRequests)"></span></div>
                <div class="hero-div" aria-hidden="true"></div>
                <div class="hero-cell"><span class="hero-cell-l" x-text="t('hero_cost')"></span><span class="hero-cell-v" :style="'color:'+costTone" :title="heroCostHint" x-text="heroCostText"></span></div>
                <div class="hero-div" aria-hidden="true"></div>
                <div class="hero-cell"><span class="hero-cell-l" x-text="t('success_rate')"></span><span class="hero-cell-v" :style="'color:'+rateColor(sRate,sRateText)" x-text="sRateText"></span></div>
                <div class="hero-div" aria-hidden="true"></div>
                <div class="hero-cell"><span class="hero-cell-l" x-text="t('avg_latency')"></span><span class="hero-cell-v" x-text="avgLatencyText"></span></div>
              </div>
            </div>
            <span class="txs tm" :title="heroScopeHint" x-text="heroScopeLabel"></span>
          </div>
          <div class="hero-spark" x-html="sparklineSvg((stats.trends||[]).map(x=>(x.total_prompt_tokens||0)+(x.total_completion_tokens||0)))"></div>
          <div class="hero-stats">
            <div class="mini-stat"><span class="ibox" style="background:var(--ok-bg);color:var(--ok)" aria-hidden="true">↓</span><div style="min-width:0"><div class="mini-stat-l" x-text="t('input_tokens_short')"></div><div class="mini-stat-v" x-text="numText('heroPrompt',heroPrompt)"></div></div></div>
            <div class="mini-stat"><span class="ibox" style="background:var(--secondary-soft);color:var(--secondary)" aria-hidden="true">↑</span><div style="min-width:0"><div class="mini-stat-l" x-text="t('output_tokens_short')"></div><div class="mini-stat-v" x-text="numText('heroCompletion',heroCompletion)"></div></div></div>
            <div class="mini-stat"><span class="ibox" style="background:var(--info-bg);color:var(--info-fg)" aria-hidden="true">◎</span><div style="min-width:0"><div class="mini-stat-l" x-text="t('kv_cache_hit')"></div><div class="mini-stat-v" x-text="heroCacheText"></div></div></div>
            <div class="mini-stat"><span class="ibox" style="background:var(--warn-bg);color:var(--warn)" aria-hidden="true">⚡</span><div style="min-width:0"><div class="mini-stat-l" x-text="t('generation_speed')"></div><div class="mini-stat-v" x-text="genSpeedText"></div></div></div>
          </div>
        </div>
        <div class="pnl"><div class="pnl-b"><div class="fb mb2"><span class="pnl-ht" x-text="t('opt_saved_title')"></span><span class="txs tm" style="margin-left:8px" x-text="t('opt_saved_cumulative',fmtT(stats.total_opt_saved_tokens||0),stats.opt_saved_since||new Date().toLocaleDateString())+(stats.total_opt_saved_fee>0?(' · ≈ '+fmtMoneyTiny(stats.total_opt_saved_fee)):'')"></span></div><div class="ov-summary-grid"><div class="ov-summary-card"><div class="ov-kpi-top"><span class="ov-kpi-label" x-text="t('opt_saved_today_tokens')"></span><span class="ov-icon" style="background:rgba(52,211,153,.12);color:var(--ok)">⚡</span></div><div class="ov-kpi-value" style="color:var(--ok)" x-text="numText('todaySaved',todaySavedTokens)"></div><div class="ov-kpi-hint" x-text="(stats.today_opt_saved_fee>0?('≈ '+fmtMoneyTiny(stats.today_opt_saved_fee)+' · '):'')+t('session_saved_tokens_hint')"></div></div><div class="ov-summary-card"><div class="ov-kpi-top"><span class="ov-kpi-label" x-text="t('opt_saved_month_tokens')"></span><span class="ov-icon" style="background:var(--primary-soft);color:var(--accent)">📊</span></div><div class="ov-kpi-value" style="color:var(--accent)" x-text="numText('monthSaved',stats.month_opt_saved_tokens||0)"></div><div class="ov-kpi-hint" x-text="(stats.month_opt_saved_fee>0?('≈ '+fmtMoneyTiny(stats.month_opt_saved_fee)+' · '):'')+monthSavedHint"></div></div></div></div></div>
        <!-- ── 事件台账 (2026-10-11): 用户要的「工作报告 + 异常通知」──
             用户原话:「熔断、报错等等连工作报告、异常通知都没做。出问题得用户自己去一点点找。」
             此前熔断开合**一行日志都没有** (circuit_breaker.rs 零 tracing), 面板只有当前快照 ——
             刷新一下, 断过的痕迹就没了。这块按时间列出"发生了什么 + 为什么"。
             放在健康度右边紧邻: "是不是出事了"与"出了什么事"是同一个问题。 -->
        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('events_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('events_desc')"></div></div><div class="fb"><span class="bdg" :class="eventsHasProblem?'bdg-e':'bdg-n'" x-show="events.length" x-text="t('events_count',events.length)"></span><button class="btn btn-g" style="font-size:var(--fs-11)" x-show="events.length" @click="clearEvents()" x-text="t('events_clear')"></button></div></div><div class="pnl-b">
          <template x-if="!events.length"><div class="txs tm" style="padding:6px 0" x-text="t('events_empty')"></div></template>
          <div class="evt-list">
            <template x-for="(e,i) in events.slice(0,8)" :key="String(e.ts)+e.kind+e.subject+i">
              <div class="evt-row">
                <span class="evt-dot" :style="'background:'+({ok:'var(--ok)',warn:'var(--warn)',err:'var(--err)'}[e.severity]||'var(--muted)')" aria-hidden="true"></span>
                <span class="evt-time mono txs" x-text="eventTime(e.ts)"></span>
                <span class="evt-kind" :style="'color:'+({ok:'var(--ok)',warn:'var(--warn)',err:'var(--err)'}[e.severity]||'var(--muted)')" x-text="eventLabel(e.kind)"></span>
                <span class="evt-sub mono txs" x-show="e.subject" x-text="e.subject"></span>
                <!-- 合并次数: 同一次持续故障累计发生几次, 避免刷屏又不丢掉"它还在继续" -->
                <span class="bdg bdg-w" x-show="e.count>1" x-text="'×'+e.count"></span>
                <span class="evt-detail txs tm" x-text="e.detail"></span>
              </div>
            </template>
          </div>
          <div class="panel-takeaway" x-show="eventsTakeaway" x-text="eventsTakeaway"></div>
        </div></div>
        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht"><span x-text="t('performance_health')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('performance_health_desc')"></div></div><button class="btn btn-g" style="font-size:var(--fs-11)" @click="switchTab('analytics')" x-text="t('view_analytics')+' →'"></button></div><div class="pnl-b"><div class="ov-health-grid">
          <div class="ov-health-item"><div class="ov-health-label" x-text="t('success_rate')"></div><div class="ov-health-value" :style="'color:'+rateColor(sRate,sRateText)" x-text="sRateText"></div></div>
          <div class="ov-health-item"><div class="ov-health-label" x-text="t('avg_latency')"></div><div class="ov-health-value" x-text="avgLatencyText"></div></div>
          <div class="ov-health-item"><div class="ov-health-label" x-text="t('generation_speed')"></div><div class="ov-health-value" x-text="genSpeedText"></div><div class="txs tm" x-show="stats.gen_samples" x-text="t('sample_count',stats.gen_samples)"></div></div>
          <!-- 转发中断: 把"只存在于日志里"的断流/掐断/上游错误搬到面板 ——
               用户两次报障"任务突然停下", 证据一直都只在日志里, 只能来问.
               0 时不标色 (正常), 有值时标黄并给出"该去哪看"的指引. -->
          <div class="ov-health-item" :title="t('health_breakdown', (stats.health&&stats.health.upstream_cut)||0, (stats.health&&stats.health.loop_truncated)||0, (stats.health&&stats.health.client_aborted)||0)">
            <div class="ov-health-label" x-text="t('health_interrupt')"></div>
            <div class="ov-health-value" :style="healthInterrupts?'color:var(--warn)':'color:var(--muted)'" x-text="String(healthInterrupts)"></div>
            <div class="txs tm" x-show="healthInterrupts" x-text="t('health_see_records')"></div>
          </div>
        </div><div style="margin-top:14px"><div class="txs tm" style="margin-bottom:4px"><span x-text="t('top_models_traffic')"></span></div><template x-for="(m,i) in (stats.top_models||[]).slice(0,6)" :key="m.model"><div class="ov-model-row"><span class="ov-dot" :style="'background:'+(m.errors===0?'var(--ok)':m.errors<m.requests/5?'var(--warn)':'var(--err)')"></span><span class="mono txs" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)" x-text="m.model"></span><span class="txs tm" x-text="m.requests+' '+t('unit_times')"></span><span class="txs mono" style="color:var(--muted)" x-text="m.requests?fmtPct((m.requests-m.errors)/m.requests*100):'—'"></span></div></template><template x-if="!(stats.top_models||[]).length"><div class="txs tm" style="padding:10px 0" x-text="t('no_data')"></div></template></div><div class="panel-takeaway" x-show="healthTakeaway" x-text="healthTakeaway"></div></div></div>
      </div>
      <div class="ov-side stagger">
        <div class="pnl"><div class="pnl-h"><span class="pnl-ht" x-text="t('balance_cost')"></span><button class="btn btn-g" style="font-size:var(--fs-11)" @click="fetchBalance()" x-text="t('balance_refresh')"></button></div><div class="pnl-b" style="padding:8px 16px"><template x-for="row in providerRows" :key="row.provider"><div style="padding:10px 0;border-bottom:1px solid var(--fill-4)"><div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px;border-radius:var(--rm);overflow:hidden" x-html="providerLogo(row.provider)"></div><span class="txsm fw6" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="row.provider"></span><!-- P3: 余额去掉"无数据/0"混淆 —— 无余额配置时不给 '—' 数字, 而是空位; 有值时按余量着色 --><span class="txsm mono fw6" :style="row.hasBalance?'color:'+balanceTone(row.balance):'color:var(--muted)'" x-text="fmtBalanceRow(row)"></span></div><div style="display:flex;justify-content:space-between;padding-left:32px;margin-top:4px"><span class="txs tm" x-text="t('stat.today_cost')+' '+fmtMoney(row.today_cost)"></span><span class="txs tm" x-text="row.source||''"></span></div><template x-if="fmtCreditsExpiry(row)"><div class="txs" style="color:var(--warn);padding-left:32px;margin-top:4px" x-text="fmtCreditsExpiry(row)"></div></template><!-- 本窗口额度进度: 只有积分制且上游给了窗口字段才渲染 (fmtQuotaProgress 返回 '' 即不显示) --><template x-if="fmtQuotaProgress(row)"><div style="padding-left:32px;margin-top:5px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span class="txs tm" x-text="fmtQuotaProgress(row).text"></span><span class="txs mono fw6" :style="'color:'+fmtQuotaProgress(row).color" x-text="fmtQuotaProgress(row).label+' '+fmtPct(fmtQuotaProgress(row).pct)"></span></div><!-- 复用 prop-bar 既有写法(只画非零段, 不画底槽): 底槽色会是本页新出现的颜色, 主题门禁会拦 --><div class="prop-bar" style="height:4px"><span :style="'flex-grow:'+Math.max(fmtQuotaProgress(row).pct,1)+';background:'+fmtQuotaProgress(row).color" :title="fmtQuotaProgress(row).label+' '+fmtPct(fmtQuotaProgress(row).pct)"></span><span style="flex-grow:1"></span></div></div></template><template x-if="row.error"><div class="txs" style="color:var(--err);padding-left:32px;margin-top:3px" x-text="row.error"></div></template></div></template><template x-if="!providerRows.length"><div class="txs tm" style="text-align:center;padding:18px 0" x-text="t('balance_none')"></div></template></div><div class="panel-takeaway" x-show="balanceTakeaway" x-text="balanceTakeaway"></div></div>
        <div class="pnl"><div class="pnl-h"><span class="pnl-ht" x-text="t('quick_start')"></span></div><div class="pnl-b"><div class="txs tm" style="line-height:1.6;margin-bottom:10px" x-text="t('quick_start_desc')"></div><div class="fb" style="padding:8px 10px;background:var(--input);border:1px solid var(--border);border-radius:var(--r)"><span class="mono txs" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="baseUrl"></span><button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 6px" @click="copyText(baseUrl,'base')" x-text="copiedField==='base'?t('copied'):t('copy')"></button></div><div class="ov-actions" style="margin-top:10px"><button class="btn btn-o" style="font-size:var(--fs-11)" @click="switchTab('providers')" x-text="t('manage_providers')"></button><button class="btn btn-g" style="font-size:var(--fs-11)" @click="switchTab('records')" x-text="t('view_records')"></button></div></div></div>
        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht"><span x-text="t('api_information')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('api_information_desc')"></div></div><button class="btn btn-g" style="font-size:var(--fs-11)" @click="switchTab('providers')" x-text="t('view_providers')+' →'"></button></div><div class="pnl-b"><template x-for="item in [{method:'BASE',path:baseUrl,descKey:'api_base_url_desc'},{method:'GET',path:'/v1/models',descKey:'available_models'},{method:'POST',path:'/v1/chat/completions',descKey:'chat_completions'},{method:'POST',path:'/v1/messages',descKey:'anthropic_messages'},{method:'POST',path:'/v1/responses',descKey:'responses_api'}]" :key="item.path"><div class="ov-api-row"><span class="ov-api-method" x-text="item.method"></span><span class="ov-api-path" style="flex:1" x-text="item.path"></span><span class="txs tm" x-text="t(item.descKey)"></span><button class="btn btn-g" style="font-size:var(--fs-11);padding:4px 8px" @click="copyText(item.path,'api')" x-text="copiedField==='api'?t('copied'):t('copy')"></button></div></template></div></div>
      </div>
    </div>
  </template>
  <!-- 常见问题 (数组驱动, 手风琴一次展开一项) -->
  <div class="pnl" style="margin-top:16px">
    <div class="pnl-h"><div><span class="pnl-ht" x-text="t('faq_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('faq_desc')"></div></div></div>
    <div class="pnl-b"><div class="faq-list">
      <template x-for="(q,i) in [{k:'cost'},{k:'protocol'},{k:'breaker'},{k:'slow'},{k:'cred'}]" :key="q.k">
        <div class="faq-item" :class="{'open':faqOpen===i}">
          <button type="button" class="faq-q" @click="faqOpen=(faqOpen===i?-1:i)"><span x-text="t('faq_'+q.k+'_q')"></span><span class="faq-caret" x-text="faqOpen===i?'⌃':'⌄'"></span></button>
          <div class="faq-a" x-show="faqOpen===i" x-cloak><div class="faq-a-in" x-text="t('faq_'+q.k+'_a')"></div></div>
        </div>
      </template>
    </div></div>
  </div>
</div>
