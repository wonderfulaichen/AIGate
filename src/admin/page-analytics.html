<div x-show="activeTab==='analytics'" class="page-enter ov-page an-page" x-init="normalizeAnalyticsTab()">
  <!-- 页头（2026-10-27 重构）：用户「不要搞这些标题卡片，显示效益太低」。
       原实现是**整张卡片**（padding 22/26 + 30px 标题 + 14px 副标题 + 胶囊）占 ~100px，
       而它承载的信息只有"页面名 + 一句解释 + 两个数字"。
       现在压成一条：标题与说明同行、无卡片容器，高度 ~40px。
       胶囊也去掉 —— 顶部导航已经高亮了「分析」，页内再标一次是重复。 -->
  <div class="phd"><div class="phd-line"><h1 class="pt" x-text="t('analytics_title')"></h1><p class="ps" x-text="t('analytics_subtitle')"></p></div><div class="ov-actions"><span class="bdg bdg-g" x-text="t('stats_range',stats?(stats.source_window||t('current_log_window')):t('current_log_window'))"></span><span class="txs tm" x-text="t('stats_context',trendGranularityLabel,tzLabel)"></span><button class="btn btn-g" @click="fetchStats(null,true)" :disabled="_refreshing"><span x-show="!_refreshing" x-text="t('refresh')"></span><span x-show="_refreshing" class="spin"></span></button></div></div>
  <!-- P1 骨架 (loading 态): 与页根同级; 页头不闪. 手动刷新 (_refreshing) 覆盖内容显示同一骨架. -->
  <div x-show="!statsError && ((loading&&skelReady)||(_refreshing))" x-cloak aria-hidden="true" style="display:flex;flex-direction:column;gap:16px">
    <div class="skel-card" style="align-items:flex-start;gap:8px"><div class="skel skel-line" style="width:200px"></div><div class="skel skel-line" style="width:300px;height:10px"></div></div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
      <template x-for="i in 5" :key="i"><div class="skel-card skel-stat"><div class="skel skel-line" style="width:60%;height:10px"></div><div class="skel skel-value"></div></div></template>
    </div>
    <div class="skel-card"><div class="skel skel-line" style="width:24%"></div><div class="skel" style="height:240px"></div></div>
    <div class="skel-card"><div class="skel skel-line" style="width:30%"></div><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
  </div>
  <!-- 错误态: 明确失败 + 重试 (骨架只表示在途, 不与错误态混用) -->
  <template x-if="statsError && !stats"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('fetch_failed')"></span><button class="btn btn-g" style="margin-left:10px" @click="retryFetchStats()" x-text="t('refresh')"></button></div></div></template>
  <!-- 空态: 已加载且确实无数据 (原实现把「加载中」与「无数据」混在同一模板, 加载中会误显 no_data) -->
  <template x-if="!stats && !statsError && !loading"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('no_data')"></span></div></div></template>
  <template x-if="!loading && !_refreshing && stats"><div style="display:flex;flex-direction:column;gap:16px">
    <!-- 空态（无任何请求）：**整页只显示这一张**。
         ⚠️ 2026-10-27 修：原来空态只是自己出现，下面的 KPI 条 / 控件条 /
         趋势图 / 热力图**照常渲染**（它们只看 `stats` 是否存在，不看有没有数据）。
         于是当 stats.total_requests=0 而 model_trends 有内容时（注入数据、
         或统计与趋势来源不一致），页面会同时显示"暂无分析数据"和一张有数据的图 ——
         自相矛盾。现在空态时整块内容让位，只留空态卡。 -->
    <template x-if="!stats.total_requests"><div class="pnl"><div class="pnl-b empty-state"><div class="empty-ic" x-html="EMPTY_ICO"></div><h2 class="empty-t" x-text="t('empty_analytics_title')"></h2><p class="empty-d" x-text="t('empty_analytics_desc')"></p><button class="btn btn-p" @click="switchTab('dashboard')" x-text="t('empty_analytics_cta')"></button></div></div></template>
    <template x-if="stats.total_requests">
    <div style="display:flex;flex-direction:column;gap:16px">
    <div class="an-stat-strip">
      <div class="an-stat"><span class="ibox" style="background:var(--primary-soft);color:var(--accent)" aria-hidden="true">↗</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('total_requests')"></div><div class="an-stat-value" x-text="numTextFmt('anRequests',stats.total_requests,'num')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--warn-bg);color:var(--warn)" aria-hidden="true">¥</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('total_cost')"></div><div class="an-stat-value" x-text="numTextFmt('anCost',stats.total_cost,'money')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--secondary-soft);color:var(--secondary)" aria-hidden="true">◇</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('total_tokens')"></div><div class="an-stat-value" x-text="numTextFmt('anTokens',(stats.total_prompt_tokens||0)+(stats.total_completion_tokens||0),'t')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--ok-bg);color:var(--ok)" aria-hidden="true">◷</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('average_rpm')"></div><div class="an-stat-value" x-text="numTextFmt('anRpm',analysisRpm,'dec2')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--info-bg);color:var(--info-fg)" aria-hidden="true">⇅</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('average_tpm')"></div><div class="an-stat-value" x-text="numTextFmt('anTpm',Math.round(analysisTpm),'t')"></div><div class="txs tm an-stat-hint" x-text="t('tokens_per_min')"></div></div></div>
    </div>
    <!-- ── 分析页页签 (2026-10-16 重构) ──
         起因: 用户「分析页太混乱了，需要重新整体全面设计，太多各种卡片」。
         实测重构前内容高 4342px (视口 1036px) → 要滚 4.2 屏, 15 张卡平铺, 且省量/延迟/分布
         三类信息各散在 4-5 张卡里重复出现。
         按"回答什么问题"分三组, 每组 1-2 屏:
           overview 用量概览  → 趋势 / 热力图 / 分布与排名
           cost     省量与成本 → 省量审计(折叠) / 模型明细 / 供应商性能
           perf     性能与延迟 → 首字延迟 / 时间去哪了(折叠) / 网关开销(折叠) / 拓扑(折叠)
         复用既有 `.seg` 页内分段控件样式 (与时间范围、折线/柱状同一套), 不新增 CSS。 -->
    <!-- 控件条（2026-10-27 合并成一行）：用户「布局按键太随便，提高空间利用率」。
         原来「页签」「时间范围」各占一整张卡片一整行，实测两者合计只用了
         1494px 宽度里的 382px（26%），剩下 74% 是纯空白，还多占 2 屏高。
         现在合成一条：页签 | 时间范围 | 自定义 | 粒度，右端放当前口径提示。 -->
    <div class="pnl"><div class="an-filter" style="flex-wrap:wrap;gap:10px">
      <div class="seg" role="tablist" aria-label="分析视图">
        <button type="button" class="seg-i" role="tab" :aria-selected="analyticsTab==='overview'" :class="{'a':analyticsTab==='overview'}" @click="setAnalyticsTab('overview')" x-text="t('an_tab_overview')"></button>
        <button type="button" class="seg-i" role="tab" :aria-selected="analyticsTab==='cost'" :class="{'a':analyticsTab==='cost'}" @click="setAnalyticsTab('cost')" x-text="t('an_tab_cost')"></button>
      </div>
      <span style="width:1px;height:18px;background:var(--border);flex:none" aria-hidden="true"></span>
      <span class="txs tm" x-text="t('time_range')"></span>
      <div class="seg">
        <button type="button" class="seg-i" :class="{'a':analyticsSpan==='hour'}" @click="setSpan('hour')" x-text="t('span_hour')"></button>
        <button type="button" class="seg-i" :class="{'a':analyticsSpan==='day'}" @click="setSpan('day')" x-text="t('span_day')"></button>
        <button type="button" class="seg-i" :class="{'a':analyticsSpan==='month'}" @click="setSpan('month')" x-text="t('span_month')"></button>
      </div>
      <!-- P3: 自定义区间 —— 粒度按跨度自动推导; 非快捷档时快捷按钮都不高亮 (反向识别) -->
      <span class="cg" style="gap:6px"><span class="txs tm" x-text="t('span_custom')"></span><input type="number" min="1" max="3650" class="inp" style="width:64px" :value="customDays" @change="setRangeDays($event.target.value)" :placeholder="t('span_custom_ph')"></span>
      <span class="txs tm" style="color:var(--muted)" x-text="granularityLabel"></span>
      <span class="txs tm" style="margin-left:auto" x-text="anTabHint"></span>
    </div></div>
    <!-- 趋势图面板（2026-10-27 重做布局与指标开关）。
         ① 控件挪到**图表底部工具栏**（参考 WaLiAPI DashboardPage.tsx:1073-1100）：
            原来「线/柱」与「指标」两个 seg 都塞在标题行里，而 .pnl-h 是
            justify-content:space-between —— 三个子元素被**均分**空间，
            于是「线/柱」居中、「指标」靠右，两组按钮隔着一整个屏幕（用户截图吐槽）。
            现在标题行只放标题与合计，控件统一在图下方一行：
            [图型] [输入][输出][缓存] ............ [各指标区间合计]
         ② 三个**独立开关**取代我上一版臆造的「总量/分项/缓存」三选一：
            参考项目是 showInput/showOutput/showCached 三个独立布尔（可任意组合），
            且与模型图例正交 —— 开关决定"堆什么指标"，图例决定"堆哪些模型"。
         ③ 开关带颜色圆点（与图内分段同色）：输入=蓝、输出=紫、缓存=绿。
         ④ 缓存默认关：cached_tokens 与输入有语义重叠（命中部分是输入的子集），
            全开会让"总量"读起来虚高。要研究缓存时再打开。 -->
    <div class="pnl mb4" x-show="analyticsTab==='overview'">
      <div class="pnl-h pnl-h-plot">
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;min-width:0">
          <h2 class="pnl-ht" x-text="t('token_trend_title')"></h2>
          <span class="txs tm" style="margin-left:8px" x-show="trendHeadTotal" x-text="trendHeadTotal"></span>
          <span class="txs tm" style="margin-left:8px" x-text="t('token_trend_desc')"></span>
        </div>
        <div class="chart-context" x-show="trendContextLabel" x-text="trendContextLabel"></div>
      </div>
      <div class="pnl-b token-trend-body">
        <div class="trend-hover" x-show="modelTrendSvgHtml" @mousemove="onTrendHover($event)" @mouseleave="onTrendHoverEnd()"><div class="trend-fade" :class="{fading:trendFading}" x-html="modelTrendSvgHtml"></div><div class="trend-crosshair" x-show="trendHover" :style="'left:'+(trendHover?trendHover.leftPct:0)+'%'"></div><div class="trend-tip" x-show="trendHover" :class="'tip-'+(trendHover?trendHover.align:'center')" :style="'left:'+(trendHover?trendHover.leftPct:0)+'%'" x-html="trendTooltipHtml"></div></div>
        <div x-show="!modelTrendSvgHtml" class="trend-empty"><div class="empty-ic" x-html="EMPTY_ICO"></div><div class="empty-t" x-text="t('no_trend')"></div><div class="empty-d" x-text="t('token_trend_note')"></div></div>
        <!-- 模型图例（点模型 = 显隐该模型） -->
        <div class="model-trend-legend"><template x-for="it in trendLegendItems" :key="it.k"><span class="model-trend-chip" :class="{dim:it.hidden}" @click="toggleModel(it.k)"><i :style="'background:'+it.color"></i><span x-text="it.label"></span><b x-text="fmtT(it.tokens)"></b><span class="tm" x-text="fmtPct(it.pct)"></span></span></template></div>
        <!-- 底部工具栏：图型 + 三个指标开关（左） | 各指标区间合计（右）
             ⚠️ 「线/柱」原来用 .seg（带灰底块的独立分段控件），与后面的
             指标开关视觉上就是**两拨东西**，即使挨着也看着远（实测间距 51px，
             用户嫌"离得这么远"）。
             现在把图型也做成与指标开关**同款胶囊**（.trend-metric-toggle），
             一排下来是同一组控件 —— 参考项目的工具条里就是这种"一排小胶囊"。 -->
        <div class="trend-toolbar">
          <div class="trend-metric-toggles">
            <button type="button" class="trend-metric-toggle" :class="{on:chartMode==='line'}"
                    :aria-pressed="chartMode==='line'" @click="setChartMode('line')"
                    x-text="t('line_chart')"></button>
            <button type="button" class="trend-metric-toggle" :class="{on:chartMode==='bar'}"
                    :aria-pressed="chartMode==='bar'" @click="setChartMode('bar')"
                    x-text="t('bar_chart')"></button>
            <!-- 改坏验证：把指标开关挪回标题行 -->
            <span class="trend-tb-div" aria-hidden="true"></span>
            <template x-for="mt in trendMetricToggles" :key="'mt'+mt.k">
              <button type="button" class="trend-metric-toggle" :class="{on:mt.on}"
                      :aria-pressed="mt.on" @click="toggleTrendMetric(mt.k)">
                <i :style="'background:'+(mt.on?mt.color:'var(--border)')"></i>
                <span x-text="mt.label"></span>
              </button>
            </template>
          </div>
          <!-- 各指标的区间合计（只显示已打开的） -->
          <div class="trend-metric-summary">
            <template x-for="ms in trendMetricSummary" :key="'ms'+ms.k">
              <span><i :style="'background:'+ms.color"></i><span x-text="ms.label"></span><b x-text="ms.v"></b></span>
            </template>
          </div>
        </div>
        <!-- 缓存口径说明：cached_tokens 是新增字段，历史日志里没有它 → 兜底为 0。
             "缓存为 0"可能是真没命中，也可能是当时没记录 —— 必须说出来。 -->
        <div class="chart-summary" x-show="trendMetrics.cache" x-text="t('trend_cache_note')"></div>
      </div>
    </div>
<!-- ── 用量热力图 (2026-10-11, 对标 dsh-our-free-model) ──
         补的缺口: 原先只有折线趋势, 看不出"哪几天烧得多 / 有没有断档"。
         日历式视图必须**按周分列 + 逐日连续**（缺的那天画空格, 不能省略）——
         省略会让相邻两天看起来连在一起, 读成日期错位。
         数据来自日级 rollup（跨日志滚动窗口的持久化账本）, 故能覆盖 17 周而
         不受 logs.jsonl 5000 行上限影响。 -->
    <div class="pnl mb4" x-show="analyticsTab==='overview'"><div class="pnl-h"><div style="display:flex;align-items:baseline;flex-wrap:wrap;min-width:0"><h2 class="pnl-ht" x-text="t('heatmap_title')"></h2><span class="txs tm" style="margin-left:8px" x-text="t('heatmap_desc')"></span></div><span class="txs tm" x-show="heatmapDays.length" x-text="t('heatmap_total',fmtT(heatmapTotal))"></span></div><div class="pnl-b">
      <div class="hm-wrap">
        <div class="hm-months" x-html="heatmapMonthLabels()"></div>
        <div class="hm-body">
          <div class="hm-days"><span x-text="t('hm_mon')"></span><span></span><span x-text="t('hm_wed')"></span><span></span><span x-text="t('hm_fri')"></span><span></span><span x-text="t('hm_sun')"></span></div>
          <div class="hm-grid" x-html="heatmapGridSvg()"></div>
        </div>
      </div>
      <div class="hm-legend"><span class="txs tm" x-text="t('heatmap_less')"></span><span class="hm-sw" style="background:var(--border)"></span><span class="hm-sw" style="background:var(--accent);opacity:.22"></span><span class="hm-sw" style="background:var(--accent);opacity:.45"></span><span class="hm-sw" style="background:var(--accent);opacity:.70"></span><span class="hm-sw" style="background:var(--accent)"></span><span class="txs tm" x-text="t('heatmap_more')"></span></div>
      <div class="panel-takeaway" x-show="heatmapTakeaway" x-text="heatmapTakeaway"></div>
    </div></div>

    <!-- 省量审计面板: 2026-10-12 修复 —— 0f6c06f 轮加热力图时误删了本面板的开启结构
         (标题行与 pnl / pnl-b 包裹), 只留下内容与末尾既有的闭合标签, 导致:
         ① 审计内容失去面板与标题, 成了散落在热力图与 TTFT 之间的裸卡片;
         ② 那 2 个失去配对的闭合标签正是 balance.py 报的 page-analytics div:-2。
         现按 75290c5 原样还原开启行, 末尾既有的闭合标签正好配对 pnl-b 与 pnl。
         ⚠️ 本注释刻意不写任何字面量 div 标签 —— balance.py 用正则计数, 会被注释里的标签骗到。 -->
    <!-- 上下文构成 (2026-10-26 提为一级面板)。
         为什么提出来：它回答的是"**输入大在哪里**"——这是用户调 prompt、
         查 token 花在哪儿的**第一个**问题。此前它埋在「省量审计」折叠卡里的
         第三段（要展开 → 再往下滚），而「省量审计」默认是折叠的：
         打开分析页根本看不到它。
         参考项目把它做成独立、默认可见的一级卡（DashboardPage 的上下文构成区），
         这里照做 —— 诊断卡默认折叠没问题，但"输入构成"不是诊断，是用量概览。
         ⚠️ 不从「省量审计」里删掉它：那里是它的**详细版**（含估算口径说明），
         这里给的是速览。 -->
    <!-- x-show 加 auditContextSegs.length 判断：没有审计数据时不显示这条空进度条
         （2026-10-27 实测：mock/无审计数据时面板只剩一个空灰条，占 100px 纯浪费）。 -->
    <div class="pnl mb4" x-show="analyticsTab==='cost' && auditContextSegs.length">
      <div class="pnl-h">
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;min-width:0">
          <h2 class="pnl-ht" x-text="t('audit_ctx_title')"></h2>
          <span class="txs tm" style="margin-left:8px" x-text="t('audit_ctx_hint')"></span>
        </div>
        <span class="txs tm" x-text="auditContextNote()"></span>
      </div>
      <div class="pnl-b">
        <!-- 比例条: 六类按占比铺开 (相对形状可信, 绝对量是估算) -->
        <div class="prop-bar"><template x-for="sg in auditContextSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' ≈'+fmtT(sg.v)"></span></template></div>
        <div class="prop-legend"><template x-for="sg in auditContextSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span><span class="mono" x-text="'≈'+fmtT(sg.v)"></span><span class="tm" x-text="auditCtxPct(sg.v)"></span></span></template></div>
        <div class="txs tm" style="margin-top:4px;color:var(--warn)" x-show="auditCtxImages()>0" x-text="t('audit_ctx_images', auditCtxImages())"></div>
      </div>
    </div>
    <div class="pnl mb4" x-show="analyticsTab==='cost'"><div class="pnl-h" style="cursor:pointer;user-select:none" @click="auditExpanded=!auditExpanded" role="button" :aria-expanded="auditExpanded"><div><h2 class="pnl-ht" style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" :style="'display:inline-block;transition:transform .15s;transform:rotate('+(auditExpanded?90:0)+'deg);color:var(--muted);font-size:var(--fs-11)'">▸</span><span x-text="t('audit_title')"></span></h2><div class="txs tm" style="margin-top:3px" x-text="t('audit_desc')"></div></div><span class="txs tm" x-text="auditWindowLabel()"></span></div><div class="pnl-b" x-show="auditExpanded" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:220px"><span class="txs tm" x-text="t('audit_applied')"></span><span class="txsm mono fw6" style="color:var(--ok)" x-text="fmtT((stats.audit||{}).applied_saved_tokens||0)"></span><span class="txs tm" x-text="auditAppliedPct()"></span>
          <div x-show="auditAppliedSegs.length" class="prop-bar"><template x-for="sg in auditAppliedSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
          <div x-show="auditAppliedSegs.length" class="prop-legend"><template x-for="sg in auditAppliedSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span></span></template></div>
          <div style="display:flex;flex-direction:column;gap:2px;margin-top:4px">
            <span class="txs tm" x-text="auditLine('audit_applied_strip',(stats.audit||{}).applied_strip_tokens,(stats.audit||{}).applied_strip_fee)"></span>
            <span class="txs tm" :style="((stats.audit||{}).applied_strip_toolcall_tokens||0)>0?'color:var(--ok)':'color:var(--muted)'" x-text="auditLine('audit_applied_strip_tc',(stats.audit||{}).applied_strip_toolcall_tokens,(stats.audit||{}).applied_strip_toolcall_fee)"></span>
            <span class="txs tm" x-text="auditLine('audit_applied_trim',(stats.audit||{}).applied_trim_tokens,(stats.audit||{}).applied_trim_fee)"></span>
            <span class="txs tm" x-text="auditLine('audit_applied_resp',(stats.audit||{}).applied_resp_cache_tokens,(stats.audit||{}).applied_resp_cache_fee)"></span>
          </div>
        </div>
        <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:180px"><span class="txs tm" x-text="t('audit_kv_hit')"></span><span class="txsm mono fw6" style="color:var(--accent)" x-text="kvHitRate()"></span><span class="txs tm" x-text="t('audit_kv_miss')+' '+fmtT((stats.audit||{}).cache_miss_tokens||0)+' · '+t('audit_kv_read')+' '+fmtT((stats.audit||{}).cache_read_tokens||0)"></span>
          <div x-show="kvSegs.length" class="prop-bar"><template x-for="sg in kvSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
          <span class="txs tm" style="color:var(--ok)" x-show="((stats.audit||{}).cache_saved_fee||0)!==0" x-text="t('audit_kv_saved_fee')+' '+fmtMoney((stats.audit||{}).cache_saved_fee||0)"></span></div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div class="txs fw7" style="color:var(--fg);margin-bottom:6px" x-text="t('audit_potential')"></div>
        <div x-show="auditPotentialSegs.length" class="prop-bar"><template x-for="sg in auditPotentialSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
        <div x-show="auditPotentialSegs.length" class="prop-legend"><template x-for="sg in auditPotentialSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span><span class="mono" x-text="fmtT(sg.v)"></span></span></template></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div x-show="((stats.audit||{}).strip_toolcall_requests||0)>0" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 8px;border-radius:var(--rm);background:rgba(52,211,153,.08)"><span class="txs" style="color:var(--ok)" x-text="t('audit_toggle_active',(stats.audit||{}).strip_toolcall_requests||0)"></span></div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_exempt_reasoning')"></span><span class="txsm mono fw6" style="color:var(--warn)" x-text="fmtT((stats.audit||{}).exempt_reasoning_tokens||0)"></span><span class="txs tm" x-text="auditPctSampled((stats.audit||{}).exempt_reasoning_tokens)"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_exempt_reasoning_hint')"></span></div>
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_dup_blocks')"></span><span class="txsm mono fw6" style="color:var(--warn)" x-text="fmtT((stats.audit||{}).dup_block_tokens||0)"></span><span class="txs tm" x-text="auditPctSampled((stats.audit||{}).dup_block_tokens)+((stats.audit||{}).dup_block_count?(' · '+t('audit_dup_count',(stats.audit||{}).dup_block_count)):'')"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_dup_hint')"></span></div>
        </div>
      </div>
      <!-- ── 上下文构成 (2026-10-24, 借鉴 WaLiAPI/magpie 的分类可观测性) ──
           回答"输入大在哪里": 是工具 schema? 工具结果? 还是历史助手消息?
           ⚠️ 口径: 全部是**估算**, 且**不与上游 prompt_tokens 做等比校准** ——
           总和对得上不代表各部分对 (校准只是把误差均摊, 让估算伪装成实测)。 -->
      <div style="border-top:1px solid var(--border);padding-top:10px" x-show="auditContextSegs.length">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px">
          <span class="txs fw7" style="color:var(--fg)" x-text="t('audit_ctx_title')"></span>
          <span class="txs tm" x-text="auditContextNote()"></span>
        </div>
        <!-- 比例条: 六类按占比铺开 (相对形状可信, 绝对量是估算) -->
        <div class="prop-bar"><template x-for="sg in auditContextSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' ≈'+fmtT(sg.v)"></span></template></div>
        <div class="prop-legend"><template x-for="sg in auditContextSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span><span class="mono" x-text="'≈'+fmtT(sg.v)"></span><span class="tm" x-text="auditCtxPct(sg.v)"></span></span></template></div>
        <div class="txs tm" style="margin-top:4px;color:var(--muted)" x-text="t('audit_ctx_hint')"></div>
        <div class="txs tm" style="margin-top:2px;color:var(--warn)" x-show="auditCtxImages()>0" x-text="t('audit_ctx_images', auditCtxImages())"></div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div class="txs fw7" style="color:var(--fg);margin-bottom:6px" x-text="t('audit_output_title')"></div>
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:150px"><span class="txs tm" x-text="t('audit_out_total')"></span><span class="txsm mono fw6" x-text="fmtT((stats.audit.output||{}).output_tokens||0)"></span><span class="txs tm" x-text="t('audit_out_per_req',((stats.audit.output||{}).requests?Math.round(((stats.audit.output||{}).output_tokens||0)/(stats.audit.output||{}).requests):0))"></span></div>
          <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:150px"><span class="txs tm" x-text="t('audit_out_ratio')"></span><span class="txsm mono fw6" x-text="outInRatio()"></span><span class="txs tm" x-text="t('audit_out_max',fmtT((stats.audit.output||{}).max_tokens||0))"></span></div>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_out_long')"></span><span class="txsm mono fw6" x-text="(stats.audit.output||{}).long_requests||0"></span><span class="txs tm" x-text="t('audit_out_long_share',outLongShare())"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_out_long_hint')"></span></div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px" x-show="((stats.audit.output||{}).loop_truncated||0)>0"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_out_loop')"></span><span class="txsm mono fw6" style="color:var(--err)" x-text="(stats.audit.output||{}).loop_truncated||0"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_out_loop_hint')"></span></div>
      </div>
      <div class="txs prose-note" x-text="t('audit_footer')"></div>
      <div x-show="degradationTotal>0" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span class="txsm" style="min-width:96px;color:var(--warn)" x-text="t('degrade_title')"></span>
          <span class="txsm mono fw6" style="color:var(--warn)" x-text="degradationTotal"></span>
          <template x-for="(v,k) in (degradations||{})" :key="k"><span x-show="v>0" class="txs tm" x-text="'· '+t('degrade_'+k)+' '+v"></span></template>
        </div>
        <div class="txs tm" style="margin-top:4px;color:var(--muted)" x-text="t('degrade_note')"></div>
      </div>
    </div></div>
    <!-- 首字延迟 (TTFT): 先看"等多久才出字", 再看分布 —— 均值会被长尾拉平, 只看均值会误判 -->
    <!-- ── 请求时间轴 (2026-10-16 由三张卡合并为一张) ──
         用户: "明显那些都可以合并到拓扑图啊" —— 洞察是对的, 而且比"合并卡片"更本质:
         首字延迟 / 各阶段耗时 / 网关开销 / 拓扑描述的是**同一条时间轴的同一个东西**,
         一次请求从进门到出字。四张平铺时用户得自己知道谁包含谁; 现在层级显式表达:
           ① 总时长与首字延迟 (头条)
           ② 客户端四段 (等首字/思考/正文/工具) —— 首尾相接, 合计 ≈ 总时长
           ③ 「等首字」下钻: 网关去程五段 —— 它是 ② 第一段的**内部**, 不是并列项
           ④ 首字延迟分布 + 拓扑三跳 (收尾两块)
         ⚠️ 前提是 ② 的第一段必须是**真正的首字延迟**; 此前它记的是"首字之后"的时长
            (proxy.rs::stage_timings 的 t0.elapsed() bug, 本轮已修), 否则拼不成连续轴。 -->
    <div class="pnl mb4" x-show="analyticsTab==='cost'"><div class="pnl-h"><div style="display:flex;align-items:baseline;flex-wrap:wrap;min-width:0"><h2 class="pnl-ht" x-text="t('fuse_title2')"></h2><span class="txs tm" style="margin-left:8px" x-text="t('fuse_desc2')"></span></div><span class="txs tm" x-show="ttftHasData" x-text="t('ttft_samples',ttftSummary.samples)"></span></div><div class="pnl-b" style="display:flex;flex-direction:column;gap:14px">
      <template x-if="!topoFlowRows.length"><div class="empty-state" style="padding:8px 0"><div class="empty-t" x-text="t('ttft_no_data')"></div><div class="empty-d" x-text="t('ttft_no_data_hint')"></div></div></template>


      <!-- 链路: 客户端 → 网关 两跳头 + 供应商分组 (每组内是模型行, 行自带条) -->
      <div x-show="topoFlowRows.length" style="display:flex;flex-direction:column;gap:0">
        <!-- 链路的三段 (客户端 → 网关 → 供应商) 走**一行头条**, 轻量无边框;
             下面是逐节点的条, 每个节点自带时间轴。 -->
        <!-- 拓扑图: 节点有卡片形态, 节点之间是**连接线**(带箭头与流量标注) —— 不是一行文字 -->
        <div class="topo-graph">
          <div class="topo-node">
            <span class="ibox" style="background:var(--primary-soft);color:var(--accent)" aria-hidden="true">◈</span>
            <div class="topo-node-body">
              <div class="topo-node-name" x-text="t('gw_topo_client')"></div>
              <div class="topo-node-kv"><span x-text="t('gw_topo_requests')"></span><b class="mono" x-text="stats.total_requests||0"></b></div>
              <div class="topo-node-kv"><span x-text="t('gw_topo_errors')"></span><b class="mono" :style="(stats.error_count||0)?'color:var(--err)':''" x-text="stats.error_count||0"></b></div>
              <div class="topo-node-kv"><span x-text="t('success_rate')"></span><b class="mono" x-text="(stats.total_requests||0)?fmtPct(((stats.total_requests-(stats.error_count||0))/(stats.total_requests))*100):'—'"></b></div>
            </div>
          </div>
          <div class="topo-edge">
            <span class="topo-edge-label mono" x-text="fmtT(stats.total_requests||0)"></span>
            <span class="topo-edge-line" aria-hidden="true"></span>
          </div>
          <div class="topo-node">
            <span class="ibox" style="background:var(--info-bg);color:var(--info-fg)" aria-hidden="true">◎</span>
            <div class="topo-node-body">
              <div class="topo-node-name" x-text="t('gw_topo_gateway')"></div>
              <div class="topo-node-kv"><span x-text="t('gw_topo_own')"></span><b class="mono" x-text="gwOverheadP95==null?'—':('p95 '+msText(gwOverheadP95))"></b></div>
              <div class="topo-node-kv"><span x-text="t('gw_topo_upstream')"></span><b class="mono" x-text="gwTtfbP95==null?'—':('p95 '+msText(gwTtfbP95))"></b></div>
              <!-- 网关去程五段的**逐段数值**（2026-10-26 恢复）。
                   为什么必须在这里而不能只留两个 p95：
                   用户报"慢"时第一件要分清的是"慢在网关还是慢在上游"——两个 p95
                   只给出结论, 不给出**是哪一段**。而"路由/护栏/转换/上游首字节/
                   其他开销"这五段才是可动手的定位信息（护栏命中多就要查规则、
                   转换重就要看协议）。
                   ⚠️ 口径与单条记录详情的「时间去哪了」同源（ds-computed.js
                   的 gwStageWinRows，样本数/均值/p50/p95 都取后端算好的值，
                   前端不重算分位）。无样本 → avg 为 null → 显示 "—"
                   （未采集 ≠ 0）。 -->
              <template x-if="gwStageHasData">
                <div class="topo-gw-stages">
                  <div class="topo-gw-stages-hd" x-text="t('gw_win_title')"></div>
                  <template x-for="r in gwStageWinRows" :key="'gws'+r.k">
                    <div class="topo-gw-stage">
                      <span class="topo-gw-stage-l" x-text="r.label"></span>
                      <span class="topo-bar"><i :style="'width:'+Math.min(100, gwStageBarPct(r))+'%;background:'+r.color"></i></span>
                      <b class="topo-gw-stage-v mono" x-text="r.avg==null?'—':msText(r.avg)"></b>
                      <span class="topo-gw-stage-n txs tm" x-text="r.n?('n='+r.n):''"></span>
                    </div>
                  </template>
                  <div class="txs tm" style="margin-top:3px" x-text="t('gw_win_desc')"></div>
                </div>
              </template>
            </div>
          </div>
          <div class="topo-edge">
            <span class="topo-edge-label mono" x-text="fmtT((stats.total_prompt_tokens||0)+(stats.total_completion_tokens||0))+' '+t('unit_tok')"></span>
            <span class="topo-edge-line" aria-hidden="true"></span>
          </div>
          <div class="topo-node topo-node-prov" :class="{'topo-node-slowest':topoFlowMax>0}">
            <span class="ibox" style="background:var(--secondary-soft);color:var(--secondary)" aria-hidden="true">⇅</span>
            <div class="topo-node-body">
              <div class="topo-node-name" x-text="t('gw_topo_providers')"></div>
              <div class="topo-node-kv"><span x-text="t('gw_topo_prov_n',(stats.per_provider||[]).length)"></span></div>
              <div class="topo-node-kv" x-show="topoFlowMax>0"><span x-text="t('topo_slowest_node')"></span><b class="mono" style="color:var(--warn)" x-text="topoSlowestLabel"></b></div>
            </div>
          </div>
        </div>

      </div>

      <!-- 首字延迟分布: 与上面同源 (ttft), 放收尾而不是单独一张卡 -->
      <div x-show="ttftHasData" style="border-top:1px solid var(--border);padding-top:12px">
        <div class="fb" style="margin-bottom:7px"><span class="txs fw7" style="color:var(--fg)" x-text="t('ttft_dist_title')"></span><span class="txs tm" style="margin-left:auto" x-text="t('ttft_avg')+' '+ttftAvgText+' · p50 '+ttftP50Text+' · p90 '+ttftP90Text"></span></div>
        <!-- 分位数口径披露 (2026-10-26): p50/p90 是**按直方图桶上界反推**的近似值,
             不是精确分位。之前界面只给数字不给口径, 用户会当成实测值,
             拿去和上游对账时对不上。本项目纪律: 口径必须写在界面上。 -->
        <div class="txs tm" style="color:var(--muted);margin-bottom:6px" x-text="t('ttft_approx_hint')"></div>
        <div class="prop-bar"><template x-for="r in ttftSummary.rows" :key="r.k"><span :style="'flex-grow:'+Math.max(r.v,1)+';background:'+r.color" :title="r.label+' · '+r.v+' · '+fmtPct(r.pct)"></span></template></div>
        <div class="prop-legend"><template x-for="r in ttftSummary.rows" :key="r.k"><span><i :style="'background:'+r.color"></i><span x-text="r.label"></span><span class="mono" x-text="r.v"></span></span></template></div>
        <div class="panel-takeaway" x-show="ttftTakeaway" x-text="ttftTakeaway"></div>
        <div x-show="ttftSlowCount>0" class="txs" style="color:var(--warn)" x-text="t('ttft_slow_hint',ttftSlowCount)"></div>
      </div>
      <div class="txs tm" style="color:var(--muted)" x-text="t('fuse_note')"></div>
    </div></div>
    <!-- ── 供应商汇总表 (2026-10-24 新增) ──
         回答"哪个供应商在拖后腿 / 它下面的模型各是什么表现"。
         `per_provider` 的全套字段此前只在拓扑图里露了个"数量"，是前端没呈现而非数据缺失。
         两级下钻: 供应商行 → 展开该供应商下的模型（数据取自 per_model 的同 provider 行）。 -->
    <!-- 只放在「省量与性能」页签（2026-10-24）。此前两个页签都显示，
         导致 overview 页签无端多出 704px —— 而这张表回答的是"哪个供应商在拖后腿"，
         属于诊断信息，不属于「用了多少」的用量概览。 -->
    <!-- ── 供应商 + 模型 明细（2026-10-27 合并为一张）──
         用户：「供应商明细和模型明细明明是一起的，你还分开显示，你看参考看哪去了？」
         两级关系本来就该在一张表里：供应商行是分组头，展开即其模型；
         搜索与筛选共用一套（原来两张表各有搜索框，要搜同一件事得在两个框里各输一遍）。
         模型表原有的「列显隐开关」保留 —— 这里的展开区用的是精简列，
         完整列（诊断展开、原性别名、省额）仍可通过「更多列」看模型表。 -->
    <div class="pnl mb4" x-show="analyticsTab==='cost'">
      <div class="pnl-h">
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;min-width:0">
          <h2 class="pnl-ht" x-text="t('prov_summary_title')"></h2>
          <span class="txs tm" style="margin-left:8px" x-text="t('prov_summary_desc')"></span>
        </div>
        <span class="cg" style="gap:8px">
          <span class="txs tm" x-text="t('prov_summary_n',(stats.per_provider||[]).length)"></span>
          <span class="txs tm" x-text="filteredModelStats.length+' / '+(stats.per_model||[]).length"></span>
          <button class="btn btn-g" style="font-size:var(--fs-10);padding:2px 8px;line-height:1.4" @click="modelColsMore=!modelColsMore" :aria-pressed="modelColsMore" x-text="modelColsMore?t('cols_less'):t('cols_more')"></button>
        </span>
      </div>
      <div class="an-filter" style="flex-wrap:wrap;gap:8px">
        <input class="inp" style="width:220px" :placeholder="t('prov_search')" x-model="provTableFilterDraft" @input="onProvTableSearchInput($event,'provTableFilterDraft')" @compositionstart="onSearchCompositionStart()" @compositionend="onSearchCompositionEnd('provTableFilter','provTableFilterDraft')">
        <input class="inp" style="width:220px" :placeholder="t('analytics_search_models')" x-model="modelDetailFilterDraft" @input="onModelDetailSearchInput($event)" @compositionstart="onSearchCompositionStart()" @compositionend="onSearchCompositionEnd('modelDetailFilter','modelDetailFilterDraft')">
        <select class="sel" x-model="modelProviderFilter"><option value="" x-text="t('provider_all')"></option><template x-for="p in modelDetailProviders" :key="p"><option :value="p" x-text="p"></option></template></select>
        <span class="txs tm" x-text="t('instant_filter',filteredProviderStats.length)"></span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th style="width:28px" aria-hidden="true"></th>
            <th x-text="t('detail.provider')"></th>
            <th class="num" x-text="t('tbl.requests')"></th>
            <th class="num" x-text="t('success_rate')"></th>
            <!-- 429 限流 (2026-10-26): 之前分析页**完全不显示限流** ——
                 而"这家在限流"与"这家在报 500"要采取的动作完全不同
                 (前者是上游配额/并发问题，后者是服务异常)。
                 rate_limited 后端早就有 (admin.rs 的 ProviderStats)，只是没画。 -->
            <th class="num" x-text="t('tbl.rate_limited')"></th>
            <!-- 首字延迟 (TTFT): 与平均延迟并列，因为两者含义不同 ——
                 平均延迟含整段生成，首字延迟是"用户等多久看到第一个字"。
                 没采到 (null) → "—"，不拿平均延迟冒充。 -->
            <th class="num" x-text="t('tbl.ttft')"></th>
            <th class="num" x-text="t('tbl.avg_latency')"></th>
            <th class="num" x-text="t('unit_tokens')"></th>
            <th class="num" x-text="t('total_cost')"></th>
          </tr></thead>
          <tbody>
            <!-- 主行: 每家一行（单根行元素，Alpine 3 的 x-for 要求单根） -->
            <template x-for="p in filteredProviderStats" :key="'pp'+p.provider">
              <tr @click="toggleProvTable(p.provider)" style="cursor:pointer">
                <td><span aria-hidden="true" :style="'display:inline-block;transition:transform .15s;color:var(--muted);font-size:var(--fs-10);transform:rotate('+(provTableOpen(p.provider)?90:0)+'deg)'">▸</span></td>
                <td>
                  <div style="display:flex;flex-direction:column;gap:1px;min-width:0">
                    <div style="display:flex;align-items:baseline;gap:6px;min-width:0">
                      <span class="fw6" x-text="p.provider"></span>
                      <span class="txs tm" x-text="t('prov_model_n',provModelsOf(p.provider).length)"></span>
                    </div>
                    <!-- 最近一次失败原因（2026-10-26）：直接挂在供应商名下面，
                         **不需要点开**。
                         为什么这样放：用户看到成功率 60% 时，下一个问题必然是
                         "为什么" —— 若要展开才看得到答案，等于把答案藏起来。
                         为什么只显示"最近一次"：失败原因可能各不相同，全列出来
                         表格会被撑爆；最近一次是最可能相关的那条。
                         全成功时这一行不出现（不制造噪音）。 -->
                    <span class="txs" style="color:var(--err);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px"
                          x-show="provLastError(p.provider)"
                          :title="provErrTitle(p.provider)"
                          x-text="provLastError(p.provider)"></span>
                  </div>
                </td>
                <td class="num mono" x-text="p.requests"></td>
                <td class="num mono" :style="'color:'+provSuccessTone(p)" x-text="provSuccessText(p)"></td>
                <!-- 429: 为 0 时不印 0（不制造噪音），有值才红字显示 -->
                <td class="num mono" :style="p.rate_limited?'color:var(--warn)':''"
                    x-text="p.rate_limited||''"></td>
                <!-- 首字延迟: 未采集 → "—"（不拿平均延迟冒充） -->
                <td class="num mono" x-text="p.ttft_avg_ms==null?'—':fmtMs(p.ttft_avg_ms)"></td>
                <td class="num mono" x-text="fmtMs(p.avg_latency_ms)"></td>
                <td class="num mono" x-text="fmtT((p.total_prompt_tokens||0)+(p.total_completion_tokens||0))"></td>
                <td class="num mono" x-text="p.billing?fmtMoney(p.total_cost||0):'—'"></td>
              </tr>
            </template>
            <!-- 展开区 = 该供应商下的**模型明细**（2026-10-27 合并）。
                 用户：「供应商明细和模型明细明明是一起的，你还分开显示」。
                 它们本来就是两级关系（供应商 → 其下模型），此前做成两张独立面板：
                 各自一个标题、各自一个搜索框、各占一整行，而且模型表还要单独
                 滚一遍才能找到刚才那家 —— 两处都要读同一件事。
                 现在并在同一张表里：供应商行是分组头，展开即它的模型，
                 列对齐、搜索共用一套。 -->
            <template x-for="p in filteredProviderStats" :key="'px'+p.provider">
              <tr x-show="provTableOpen(p.provider)"><td colspan="9" style="padding:0;background:var(--fill-1)">
                <div style="padding:6px 12px 10px 34px">
                  <!-- 列头：只在有模型时出现（空供应商不必显示一排空标题） -->
                  <div class="prov-model-row prov-model-hd" x-show="provModelsOf(p.provider).length">
                    <span class="txs tm" style="flex:1;min-width:0" x-text="t('tbl.upstream_model')"></span>
                    <span class="txs tm mono" style="flex:none;width:64px;text-align:right" x-text="t('tbl.requests')"></span>
                    <span class="txs tm mono" style="flex:none;width:118px;text-align:right" :title="t('tbl.tokens_in_out_hint')" x-text="t('tbl.tokens_in_out')"></span>
                    <!-- 诊断值（缓存命中/生成速度）并在一个格里，与模型表同一口径 -->
                    <span class="txs tm mono" style="flex:none;width:96px;text-align:right" :title="t('model_diag_hint')" x-text="t('model_diag')"></span>
                    <span class="txs tm mono" style="flex:none;width:82px;text-align:right" x-text="t('total_cost')"></span>
                    <span class="txs tm mono" style="flex:none;width:76px;text-align:right" :title="t('optimization_saved_model_hint')" x-text="t('optimization_saved_tokens')"></span>
                  </div>
                  <template x-for="m in provModelsShown(p.provider)" :key="'pm'+m.model">
                    <div class="prov-model-row">
                      <span class="mono txs" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="m.upstream_model||m.model">
                        <span x-text="m.upstream_model||m.model"></span>
                        <template x-if="m.free"><span class="bdg bdg-s" style="margin-left:4px;font-size:var(--fs-9)" x-text="t('badge.free')"></span></template>
                      </span>
                      <span class="txs tm mono" style="flex:none;width:64px;text-align:right" x-text="m.requests"></span>
                      <span class="txs tm mono" style="flex:none;width:118px;text-align:right" x-text="fmtT(m.total_prompt_tokens||0)+' → '+fmtT(m.total_completion_tokens||0)"></span>
                      <span class="txs tm mono" style="flex:none;width:96px;text-align:right" :title="modelDiagTitle(m)" x-text="modelDiagMain(m)"></span>
                      <span class="txs tm mono" style="flex:none;width:82px;text-align:right" x-text="(m.total_cost>0?fmtMoney(m.total_cost):'—')"></span>
                      <span class="txs tm mono" style="flex:none;width:76px;text-align:right" :style="(m.optimization_saved_tokens||0)>0?'color:var(--ok)':''" x-text="fmtT(m.optimization_saved_tokens||0)"></span>
                    </div>
                  </template>
                  <!-- 首屏 10 行 + 展开更多：一家可能有 40+ 模型，全渲染会撑 3 屏 -->
                  <div class="txs tm" style="margin-top:4px" x-show="provModelsHiddenCount(p.provider)>0">
                    <button type="button" class="btn btn-g" style="font-size:var(--fs-11);padding:2px 8px"
                            @click.stop="toggleProvModels(p.provider)"
                            x-text="t('rows_show_more',provModelsHiddenCount(p.provider))"></button>
                  </div>
                  <div class="txs tm" style="margin-top:4px" x-show="(perProvModelAll||{})[p.provider] && provModelsOf(p.provider).length>10">
                    <button type="button" class="btn btn-g" style="font-size:var(--fs-11);padding:2px 8px"
                            @click.stop="toggleProvModels(p.provider)"
                            x-text="t('rows_show_less')"></button>
                  </div>
                  <div class="txs tm" x-show="!provModelsOf(p.provider).length" x-text="t('prov_no_model_detail')"></div>
                </div>
              </td></tr>
            </template>
            <template x-if="!filteredProviderStats.length">
              <tr><td colspan="9" style="text-align:center;padding:28px" class="tm" x-text="t('no_data')"></td></tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
    </div>
    </template>
  </div></template>
</div>
