<div x-show="activeTab==='analytics'" class="page-enter ov-page">
  <div class="phd"><div><h1 class="pt" x-text="t('analytics_title')"></h1><p class="ps" x-text="t('analytics_subtitle')"></p></div><div class="ov-actions"><span class="bdg bdg-g" x-text="t('stats_range',stats?(stats.source_window||t('current_log_window')):t('current_log_window'))"></span><span class="txs tm" x-text="t('stats_context',trendGranularityLabel,tzLabel)"></span><button class="btn btn-g" @click="fetchStats(null,true)" :disabled="_refreshing"><span x-show="!_refreshing" x-text="t('refresh')"></span><span x-show="_refreshing" class="spin"></span></button></div></div>
  <!-- P1 骨架 (loading 态): 与页根同级; 页头不闪. 手动刷新 (_refreshing) 覆盖内容显示同一骨架. -->
  <div x-show="!statsError && ((loading&&skelReady)||(_refreshing))" x-cloak aria-hidden="true" style="display:flex;flex-direction:column;gap:16px">
    <div class="skel-card" style="align-items:flex-start;gap:8px"><div class="skel skel-line" style="width:200px"></div><div class="skel skel-line" style="width:300px;height:10px"></div></div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
      <template x-for="i in 5" :key="i"><div class="skel-card skel-stat"><div class="skel skel-line" style="width:60%;height:10px"></div><div class="skel skel-value"></div></div></template>
    </div>
    <div class="skel-card"><div class="skel skel-line" style="width:24%"></div><div class="skel" style="height:240px"></div></div>
    <div class="skel-card"><div class="skel skel-line" style="width:30%"></div><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
  </div>
  <!-- 错误态: 明确失败 + 重试 (骨架只表示在途, 不与错误态混用) -->
  <template x-if="statsError && !stats"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('fetch_failed')"></span><button class="btn btn-g" style="margin-left:10px" @click="retryFetchStats()" x-text="t('refresh')"></button></div></div></template>
  <!-- 空态: 已加载且确实无数据 (原实现把「加载中」与「无数据」混在同一模板, 加载中会误显 no_data) -->
  <template x-if="!stats && !statsError && !loading"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('no_data')"></span></div></div></template>
  <template x-if="!loading && !_refreshing && stats"><div style="display:flex;flex-direction:column;gap:16px">
    <template x-if="!stats.total_requests"><div class="pnl"><div class="pnl-b empty-state"><div class="empty-ic" x-html="EMPTY_ICO"></div><h2 class="empty-t" x-text="t('empty_analytics_title')"></h2><p class="empty-d" x-text="t('empty_analytics_desc')"></p><button class="btn btn-p" @click="switchTab('dashboard')" x-text="t('empty_analytics_cta')"></button></div></div></template>
    <div class="an-stat-strip">
      <div class="an-stat"><div class="an-stat-label" x-text="t('total_requests')"></div><div class="an-stat-value" x-text="stats.total_requests||0"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('total_cost')"></div><div class="an-stat-value" x-text="fmtMoney(stats.total_cost||0)"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('total_tokens')"></div><div class="an-stat-value" x-text="fmtT((stats.total_prompt_tokens||0)+(stats.total_completion_tokens||0))"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('average_rpm')"></div><div class="an-stat-value" x-text="analysisRpm.toFixed(2)"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('average_tpm')"></div><div class="an-stat-value" x-text="fmtT(Math.round(analysisTpm))"></div><div class="txs tm an-stat-hint" x-text="t('tokens_per_min')"></div></div>
    </div>
    <div class="pnl"><div class="an-filter"><span class="txs tm" x-text="t('time_range')"></span><div class="seg"><span class="seg-i" :class="{'a':analyticsSpan==='hour'}" @click="setSpan('hour')" x-text="t('span_hour')"></span><span class="seg-i" :class="{'a':analyticsSpan==='day'}" @click="setSpan('day')" x-text="t('span_day')"></span><span class="seg-i" :class="{'a':analyticsSpan==='month'}" @click="setSpan('month')" x-text="t('span_month')"></span></div><span class="txs tm" style="margin-left:auto" x-text="t('stats_range', stats?stats.source_window:t('current_log_window'))"></span></div></div>
    <div class="pnl mb4"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('token_trend_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('token_trend_desc')"></div><div class="chart-context" x-show="trendContextLabel" x-text="trendContextLabel"></div></div><div class="seg an-chart-tabs"><span class="seg-i" :class="{'a':chartMode==='line'}" @click="chartMode='line';computeModelTrend()" x-text="t('line_chart')"></span><span class="seg-i" :class="{'a':chartMode==='bar'}" @click="chartMode='bar';computeModelTrend()" x-text="t('bar_chart')"></span></div></div><div class="pnl-b token-trend-body"><div class="trend-hover" x-show="modelTrendSvgHtml" @mousemove="onTrendHover($event)" @mouseleave="onTrendHoverEnd()"><div x-html="modelTrendSvgHtml"></div><div class="trend-crosshair" x-show="trendHover" :style="'left:'+(trendHover?trendHover.leftPct:0)+'%'"></div><div class="trend-tip" x-show="trendHover" :class="'tip-'+(trendHover?trendHover.align:'center')" :style="'left:'+(trendHover?trendHover.leftPct:0)+'%'" x-html="trendTooltipHtml"></div></div><div x-show="!modelTrendSvgHtml" class="tm" x-text="t('no_trend')"></div></div><div class="model-trend-legend"><template x-for="it in trendLegendItems" :key="it.k"><span class="model-trend-chip" :class="{dim:it.hidden}" @click="toggleModel(it.k)"><i :style="'background:'+it.color"></i><span x-text="it.label"></span><b x-text="fmtT(it.tokens)"></b><span class="tm" x-text="fmtPct(it.pct)"></span></span></template></div><div class="chart-summary" x-text="t('token_trend_note')"></div></div>
    <div class="pnl mb4"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('audit_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('audit_desc')"></div></div><span class="txs tm" x-text="auditWindowLabel()"></span></div><div class="pnl-b" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:220px"><span class="txs tm" x-text="t('audit_applied')"></span><span class="txsm mono fw6" style="color:var(--ok)" x-text="fmtT((stats.audit||{}).applied_saved_tokens||0)"></span><span class="txs tm" x-text="auditAppliedPct()"></span>
          <div x-show="auditAppliedSegs.length" class="prop-bar"><template x-for="sg in auditAppliedSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
          <div x-show="auditAppliedSegs.length" class="prop-legend"><template x-for="sg in auditAppliedSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span></span></template></div>
          <div style="display:flex;flex-direction:column;gap:2px;margin-top:4px">
            <span class="txs tm" x-text="auditLine('audit_applied_strip',(stats.audit||{}).applied_strip_tokens,(stats.audit||{}).applied_strip_fee)"></span>
            <span class="txs tm" :style="((stats.audit||{}).applied_strip_toolcall_tokens||0)>0?'color:var(--ok)':'color:var(--muted)'" x-text="auditLine('audit_applied_strip_tc',(stats.audit||{}).applied_strip_toolcall_tokens,(stats.audit||{}).applied_strip_toolcall_fee)"></span>
            <span class="txs tm" x-text="auditLine('audit_applied_trim',(stats.audit||{}).applied_trim_tokens,(stats.audit||{}).applied_trim_fee)"></span>
            <span class="txs tm" x-text="auditLine('audit_applied_resp',(stats.audit||{}).applied_resp_cache_tokens,(stats.audit||{}).applied_resp_cache_fee)"></span>
          </div>
        </div>
        <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:180px"><span class="txs tm" x-text="t('audit_kv_hit')"></span><span class="txsm mono fw6" style="color:var(--indigo)" x-text="kvHitRate()"></span><span class="txs tm" x-text="t('audit_kv_miss')+' '+fmtT((stats.audit||{}).cache_miss_tokens||0)+' · '+t('audit_kv_read')+' '+fmtT((stats.audit||{}).cache_read_tokens||0)"></span>
          <div x-show="kvSegs.length" class="prop-bar"><template x-for="sg in kvSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
          <span class="txs tm" style="color:var(--ok)" x-show="((stats.audit||{}).cache_saved_fee||0)!==0" x-text="t('audit_kv_saved_fee')+' '+fmtMoney((stats.audit||{}).cache_saved_fee||0)"></span></div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div class="txs fw7" style="color:var(--fg);margin-bottom:6px" x-text="t('audit_potential')"></div>
        <div x-show="auditPotentialSegs.length" class="prop-bar"><template x-for="sg in auditPotentialSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
        <div x-show="auditPotentialSegs.length" class="prop-legend"><template x-for="sg in auditPotentialSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span><span class="mono" x-text="fmtT(sg.v)"></span></span></template></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div x-show="((stats.audit||{}).strip_toolcall_requests||0)>0" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 8px;border-radius:6px;background:rgba(52,211,153,.08)"><span class="txs" style="color:var(--ok)" x-text="t('audit_toggle_active',(stats.audit||{}).strip_toolcall_requests||0)"></span></div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_exempt_reasoning')"></span><span class="txsm mono fw6" style="color:var(--warn)" x-text="fmtT((stats.audit||{}).exempt_reasoning_tokens||0)"></span><span class="txs tm" x-text="auditPctSampled((stats.audit||{}).exempt_reasoning_tokens)"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_exempt_reasoning_hint')"></span></div>
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_dup_blocks')"></span><span class="txsm mono fw6" style="color:var(--warn)" x-text="fmtT((stats.audit||{}).dup_block_tokens||0)"></span><span class="txs tm" x-text="auditPctSampled((stats.audit||{}).dup_block_tokens)+((stats.audit||{}).dup_block_count?(' · '+t('audit_dup_count',(stats.audit||{}).dup_block_count)):'')"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_dup_hint')"></span></div>
        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div class="txs fw7" style="color:var(--fg);margin-bottom:6px" x-text="t('audit_output_title')"></div>
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:150px"><span class="txs tm" x-text="t('audit_out_total')"></span><span class="txsm mono fw6" x-text="fmtT((stats.audit.output||{}).output_tokens||0)"></span><span class="txs tm" x-text="t('audit_out_per_req',((stats.audit.output||{}).requests?Math.round(((stats.audit.output||{}).output_tokens||0)/(stats.audit.output||{}).requests):0))"></span></div>
          <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:150px"><span class="txs tm" x-text="t('audit_out_ratio')"></span><span class="txsm mono fw6" x-text="outInRatio()"></span><span class="txs tm" x-text="t('audit_out_max',fmtT((stats.audit.output||{}).max_tokens||0))"></span></div>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_out_long')"></span><span class="txsm mono fw6" x-text="(stats.audit.output||{}).long_requests||0"></span><span class="txs tm" x-text="t('audit_out_long_share',outLongShare())"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_out_long_hint')"></span></div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px" x-show="((stats.audit.output||{}).loop_truncated||0)>0"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_out_loop')"></span><span class="txsm mono fw6" style="color:var(--err)" x-text="(stats.audit.output||{}).loop_truncated||0"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_out_loop_hint')"></span></div>
      </div>
      <div class="txs tm" style="color:var(--muted)" x-text="t('audit_footer')"></div>
      <div x-show="degradationTotal>0" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span class="txsm" style="min-width:96px;color:var(--warn)" x-text="t('degrade_title')"></span>
          <span class="txsm mono fw6" style="color:var(--warn)" x-text="degradationTotal"></span>
          <template x-for="(v,k) in (degradations||{})" :key="k"><span x-show="v>0" class="txs tm" x-text="'· '+t('degrade_'+k)+' '+v"></span></template>
        </div>
        <div class="txs tm" style="margin-top:4px;color:var(--muted)" x-text="t('degrade_note')"></div>
      </div>
    </div></div>
    <div class="g2"><div class="pnl"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('call_distribution')"></span><div class="txs tm" style="margin-top:3px" x-text="t('aggregate_provider_model')"></div></div></div><div class="pnl-b"><div style="display:flex;gap:18px;align-items:center"><div style="width:150px;flex-shrink:0;text-align:center" x-html="'<svg viewBox=&quot;0 0 140 140&quot; width=&quot;140&quot;>'+donutSvg+'</svg>'"></div><div style="flex:1;min-width:0"><template x-for="(m,i) in (stats.per_model||[]).slice(0,8)" :key="m.model"><div class="dist-legend"><span class="dist-dot" :style="'background:'+donutColors[i%donutColors.length]"></span><span class="mono txs" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="m.model" x-text="m.model"></span><span class="txs tm" x-text="m.requests"></span><span class="dist-pct" x-text="fmtPct((m.requests/(stats.total_requests||1))*100)"></span></div></template><template x-if="(stats.per_model||[]).length>8"><div class="dist-legend"><span class="dist-dot" style="background:var(--chart-rest)"></span><span class="txs" style="flex:1" x-text="t('other_n',(stats.per_model||[]).length-8)"></span><span class="dist-pct" x-text="(((stats.total_requests-(stats.per_model||[]).slice(0,8).reduce((s,m)=>s+m.requests,0))/(stats.total_requests||1))*100)"></span></div></template></div></div><div class="panel-takeaway" x-show="distTopTakeaway" x-text="distTopTakeaway"></div></div></div><div class="pnl"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('call_ranking')"></span><div class="txs tm" style="margin-top:3px" x-text="t('top_model_routes')"></div></div></div><div class="pnl-b"><template x-for="(m,i) in (stats.top_models||[]).slice(0,8)" :key="m.model"><div class="an-rank"><span class="mono txs fw7" :style="'width:22px;color:'+(i<3?['var(--rank-1)','var(--rank-2)','var(--rank-3)'][i]:'var(--muted)')" x-text="'#'+(i+1)"></span><div style="flex:1;min-width:0"><div class="fb"><span class="mono txs" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="m.model" x-text="m.model"></span><span class="txs tm" x-text="fmtPct((m.requests/(stats.total_requests||1))*100)"></span></div><div style="height:7px;margin-top:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden"><div class="an-rank-bar" :style="'width:'+((m.requests/(stats.top_models[0].requests||1))*100)+'%'"></div></div></div><span class="txs tm" x-text="m.requests"></span></div></template><div class="panel-takeaway" x-show="rankTopTakeaway" x-text="rankTopTakeaway"></div></div></div>
    <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('model_details')"></span><div class="txs tm" style="margin-top:3px" x-text="t('model_details_desc')"></div></div><span class="txs tm" x-text="filteredModelStats.length+' / '+(stats.per_model||[]).length"></span></div><div class="an-filter"><input class="inp" style="width:260px" :placeholder="t('analytics_search_models')" x-model="modelDetailFilter"><select class="sel" x-model="modelProviderFilter"><option value="" x-text="t('provider_all')"></option><template x-for="p in modelDetailProviders" :key="p"><option :value="p" x-text="p"></option></template></select><span class="txs tm" x-text="t('instant_filter',filteredModelStats.length)"></span></div><div style="overflow-x:auto"><table><thead><tr><th x-text="t('tbl.upstream_model')"></th><th x-text="t('balance_provider')"></th><th x-text="t('tbl.alias')"></th><th x-text="t('tbl.requests')"></th><th x-text="t('tbl.success')"></th><th x-text="t('tbl.errors')"></th><th x-text="t('tbl.avg_latency')"></th><th x-text="t('tbl.input_tokens')"></th><th x-text="t('tbl.output_tokens')"></th><th x-text="t('tbl.cache_hit')"></th><th x-text="t('tbl.gen_speed')"></th><th x-text="t('tbl.cost')"></th></tr></thead><tbody><template x-for="m in filteredModelStats" :key="m.provider+'/'+m.upstream_model"><tr><td class="mono fw6"><span x-text="m.upstream_model||m.model"></span><template x-if="m.free"><span class="bdg bdg-s" style="margin-left:6px;font-size:var(--fs-9)" x-text="t('badge.free')"></span></template></td><td class="txs" x-text="m.provider||'—'"></td><td class="txs tm" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="(m.aliases||[]).join(', ')"></td><td class="mono" x-text="m.requests"></td><td class="mono" x-text="Math.max(0,(m.requests||0)-modelErrorCount(m))"></td><td class="mono" :style="modelErrorCount(m)?'color:var(--err)':''" x-text="modelErrorCount(m)"></td><td class="mono txs" x-text="fmtMs(m.avg_latency_ms)"></td><td class="mono txs" x-text="fmtT(m.total_prompt_tokens)"></td><td class="mono txs" x-text="fmtT(m.total_completion_tokens)"></td><td class="txs" x-text="m.total_cache_hit_tokens?fmtPct(m.total_cache_hit_tokens/(m.total_prompt_tokens||1)*100):'—'"></td><td class="mono txs" x-text="m.gen_speed?(m.gen_speed.toFixed(1)+' '+t('unit_tokps')):'—'"></td><td class="mono txs" x-text="fmtMoney(m.total_cost||0)"></td></tr></template><template x-if="!filteredModelStats.length"><tr><td colspan="12" style="text-align:center;padding:32px" class="tm" x-text="(stats.per_model||[]).length?t('no_match'):t('no_data')"></td></tr></template></tbody></table></div></div>
    <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('provider_performance')"></span><div class="txs tm" style="margin-top:3px" x-text="t('current_window_aggregate')"></div></div></div><div class="pnl-b" style="overflow-x:auto"><table><thead><tr><th x-text="t('balance_provider')"></th><th x-text="t('tbl.requests')"></th><th x-text="t('tbl.success')"></th><th x-text="t('tbl.errors')"></th><th x-text="t('tbl.avg_latency')"></th><th x-text="t('tbl.input_tokens')"></th><th x-text="t('tbl.output_tokens')"></th><th x-text="t('tbl.cache_hit')"></th><th x-text="t('tbl.gen_speed')"></th><th x-text="t('tbl.cost')"></th><th x-text="t('kv_cache_saved')"></th><th x-text="t('optimization_saved_tokens')"></th></tr></thead><tbody><template x-for="p in (stats.per_provider||[])" :key="p.provider"><tr><td class="fw6" x-text="p.provider"></td><td x-text="p.requests"></td><td x-text="Math.max(0,(p.requests||0)-(p.errors||0))"></td><td x-text="p.errors||0"></td><td x-text="fmtMs(p.avg_latency_ms)"></td><td x-text="fmtT(p.total_prompt_tokens)"></td><td x-text="fmtT(p.total_completion_tokens)"></td><td x-text="p.total_cache_hit_tokens?fmtPct(p.total_cache_hit_tokens/(p.total_prompt_tokens||1)*100):'—'"></td><td x-text="p.gen_speed?(p.gen_speed.toFixed(1)+' '+t('unit_tokps')):'—'"></td><td x-text="fmtMoney(p.total_cost)"></td><td x-text="p.billing?fmtMoney(p.cache_saved||0):'—'"></td><td x-text="fmtT(p.today_opt_saved_tokens||0)"></td></tr></template><template x-if="!(stats.per_provider||[]).length"><tr><td colspan="12" style="text-align:center;padding:32px" class="tm" x-text="t('no_data')"></td></tr></template></tbody></table></div></div>
  </div></template>
</div>
