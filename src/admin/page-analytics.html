<div x-show="activeTab==='analytics'" class="page-enter ov-page">
  <div class="phd"><div><h1 class="pt" x-text="t('analytics_title')"></h1><p class="ps" x-text="t('analytics_subtitle')"></p></div><div class="ov-actions"><span class="bdg bdg-g" x-text="t('stats_range',stats?(stats.source_window||t('current_log_window')):t('current_log_window'))"></span><span class="txs tm" x-text="t('stats_context',trendGranularityLabel,tzLabel)"></span><button class="btn btn-g" @click="fetchStats(null,true)" :disabled="_refreshing"><span x-show="!_refreshing" x-text="t('refresh')"></span><span x-show="_refreshing" class="spin"></span></button></div></div>
  <!-- P1 骨架 (loading 态): 与页根同级; 页头不闪. 手动刷新 (_refreshing) 覆盖内容显示同一骨架. -->
  <div x-show="!statsError && ((loading&&skelReady)||(_refreshing))" x-cloak aria-hidden="true" style="display:flex;flex-direction:column;gap:16px">
    <div class="skel-card" style="align-items:flex-start;gap:8px"><div class="skel skel-line" style="width:200px"></div><div class="skel skel-line" style="width:300px;height:10px"></div></div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
      <template x-for="i in 5" :key="i"><div class="skel-card skel-stat"><div class="skel skel-line" style="width:60%;height:10px"></div><div class="skel skel-value"></div></div></template>
    </div>
    <div class="skel-card"><div class="skel skel-line" style="width:24%"></div><div class="skel" style="height:240px"></div></div>
    <div class="skel-card"><div class="skel skel-line" style="width:30%"></div><div class="skel skel-row"></div><div class="skel skel-row"></div><div class="skel skel-row"></div></div>
  </div>
  <!-- 错误态: 明确失败 + 重试 (骨架只表示在途, 不与错误态混用) -->
  <template x-if="statsError && !stats"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('fetch_failed')"></span><button class="btn btn-g" style="margin-left:10px" @click="retryFetchStats()" x-text="t('refresh')"></button></div></div></template>
  <!-- 空态: 已加载且确实无数据 (原实现把「加载中」与「无数据」混在同一模板, 加载中会误显 no_data) -->
  <template x-if="!stats && !statsError && !loading"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('no_data')"></span></div></div></template>
  <template x-if="!loading && !_refreshing && stats"><div style="display:flex;flex-direction:column;gap:16px">
    <template x-if="!stats.total_requests"><div class="pnl"><div class="pnl-b empty-state"><div class="empty-ic" x-html="EMPTY_ICO"></div><h2 class="empty-t" x-text="t('empty_analytics_title')"></h2><p class="empty-d" x-text="t('empty_analytics_desc')"></p><button class="btn btn-p" @click="switchTab('dashboard')" x-text="t('empty_analytics_cta')"></button></div></div></template>
    <div class="an-stat-strip">
      <div class="an-stat"><span class="ibox" style="background:var(--primary-soft);color:var(--accent)" aria-hidden="true">↗</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('total_requests')"></div><div class="an-stat-value" x-text="numTextFmt('anRequests',stats.total_requests,'num')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--warn-bg);color:var(--warn)" aria-hidden="true">¥</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('total_cost')"></div><div class="an-stat-value" x-text="numTextFmt('anCost',stats.total_cost,'money')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--secondary-soft);color:var(--secondary)" aria-hidden="true">◇</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('total_tokens')"></div><div class="an-stat-value" x-text="numTextFmt('anTokens',(stats.total_prompt_tokens||0)+(stats.total_completion_tokens||0),'t')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--ok-bg);color:var(--ok)" aria-hidden="true">◷</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('average_rpm')"></div><div class="an-stat-value" x-text="numTextFmt('anRpm',analysisRpm,'dec2')"></div><div class="an-stat-hint"></div></div></div>
      <div class="an-stat"><span class="ibox" style="background:var(--info-bg);color:var(--info-fg)" aria-hidden="true">⇅</span><div class="an-stat-body"><div class="an-stat-label" x-text="t('average_tpm')"></div><div class="an-stat-value" x-text="numTextFmt('anTpm',Math.round(analysisTpm),'t')"></div><div class="txs tm an-stat-hint" x-text="t('tokens_per_min')"></div></div></div>
    </div>
    <!-- ── 分析页页签 (2026-10-16 重构) ──
         起因: 用户「分析页太混乱了，需要重新整体全面设计，太多各种卡片」。
         实测重构前内容高 4342px (视口 1036px) → 要滚 4.2 屏, 15 张卡平铺, 且省量/延迟/分布
         三类信息各散在 4-5 张卡里重复出现。
         按"回答什么问题"分三组, 每组 1-2 屏:
           overview 用量概览  → 趋势 / 热力图 / 分布与排名
           cost     省量与成本 → 省量审计(折叠) / 模型明细 / 供应商性能
           perf     性能与延迟 → 首字延迟 / 时间去哪了(折叠) / 网关开销(折叠) / 拓扑(折叠)
         复用既有 `.seg` 页内分段控件样式 (与时间范围、折线/柱状同一套), 不新增 CSS。 -->
    <div class="pnl"><div class="an-filter"><div class="seg" role="tablist" aria-label="分析视图">
      <span class="seg-i" role="tab" :aria-selected="analyticsTab==='overview'" :class="{'a':analyticsTab==='overview'}" @click="analyticsTab='overview'" x-text="t('an_tab_overview')"></span>
      <span class="seg-i" role="tab" :aria-selected="analyticsTab==='cost'" :class="{'a':analyticsTab==='cost'}" @click="analyticsTab='cost'" x-text="t('an_tab_cost')"></span>
      <span class="seg-i" role="tab" :aria-selected="analyticsTab==='perf'" :class="{'a':analyticsTab==='perf'}" @click="analyticsTab='perf'" x-text="t('an_tab_perf')"></span>
    </div><span class="txs tm" style="margin-left:auto" x-text="t('an_tab_hint_'+(analyticsTab||'overview'))"></span></div></div>
    <div class="pnl"><div class="an-filter"><span class="txs tm" x-text="t('time_range')"></span><div class="seg"><span class="seg-i" :class="{'a':analyticsSpan==='hour'}" @click="setSpan('hour')" x-text="t('span_hour')"></span><span class="seg-i" :class="{'a':analyticsSpan==='day'}" @click="setSpan('day')" x-text="t('span_day')"></span><span class="seg-i" :class="{'a':analyticsSpan==='month'}" @click="setSpan('month')" x-text="t('span_month')"></span></div><!-- P3: 自定义区间 —— 粒度按跨度自动推导; 非快捷档时快捷按钮都不高亮 (反向识别) --><span class="cg" style="gap:6px"><span class="txs tm" x-text="t('span_custom')"></span><input type="number" min="1" max="3650" class="inp" style="width:64px" :value="customDays" @change="setRangeDays($event.target.value)" :placeholder="t('span_custom_ph')"></span><span class="txs tm" style="color:var(--muted)" x-text="granularityLabel"></span><span class="txs tm" style="margin-left:auto" x-text="t('stats_range', stats?stats.source_window:t('current_log_window'))"></span></div></div>
    <div class="pnl mb4" x-show="analyticsTab==='overview'"><div class="pnl-h pnl-h-plot"><div><span class="pnl-ht" x-text="t('token_trend_title')"></span><!-- P3: 图头合计 (与图例逐项可对) --><span class="txs tm" style="margin-left:8px" x-show="trendHeadTotal" x-text="trendHeadTotal"></span><div class="txs tm" style="margin-top:3px" x-text="t('token_trend_desc')"></div><div class="chart-context" x-show="trendContextLabel" x-text="trendContextLabel"></div></div><div class="seg an-chart-tabs"><span class="seg-i" :class="{'a':chartMode==='line'}" @click="setChartMode('line')" x-text="t('line_chart')"></span><span class="seg-i" :class="{'a':chartMode==='bar'}" @click="setChartMode('bar')" x-text="t('bar_chart')"></span></div></div><div class="pnl-b token-trend-body"><div class="trend-hover" x-show="modelTrendSvgHtml" @mousemove="onTrendHover($event)" @mouseleave="onTrendHoverEnd()"><div class="trend-fade" :class="{fading:trendFading}" x-html="modelTrendSvgHtml"></div><div class="trend-crosshair" x-show="trendHover" :style="'left:'+(trendHover?trendHover.leftPct:0)+'%'"></div><div class="trend-tip" x-show="trendHover" :class="'tip-'+(trendHover?trendHover.align:'center')" :style="'left:'+(trendHover?trendHover.leftPct:0)+'%'" x-html="trendTooltipHtml"></div></div><div x-show="!modelTrendSvgHtml" class="trend-empty"><div class="empty-ic" x-html="EMPTY_ICO"></div><div class="empty-t" x-text="t('no_trend')"></div><div class="empty-d" x-text="t('token_trend_note')"></div></div></div><div class="model-trend-legend"><template x-for="it in trendLegendItems" :key="it.k"><span class="model-trend-chip" :class="{dim:it.hidden}" @click="toggleModel(it.k)"><i :style="'background:'+it.color"></i><span x-text="it.label"></span><b x-text="fmtT(it.tokens)"></b><span class="tm" x-text="fmtPct(it.pct)"></span></span></template></div><div class="chart-summary" x-text="t('token_trend_note')"></div></div>
    <!-- ── 用量热力图 (2026-10-11, 对标 dsh-our-free-model) ──
         补的缺口: 原先只有折线趋势, 看不出"哪几天烧得多 / 有没有断档"。
         日历式视图必须**按周分列 + 逐日连续**（缺的那天画空格, 不能省略）——
         省略会让相邻两天看起来连在一起, 读成日期错位。
         数据来自日级 rollup（跨日志滚动窗口的持久化账本）, 故能覆盖 17 周而
         不受 logs.jsonl 5000 行上限影响。 -->
    <div class="pnl mb4" x-show="analyticsTab==='overview'"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('heatmap_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('heatmap_desc')"></div></div><span class="txs tm" x-show="heatmapDays.length" x-text="t('heatmap_total',fmtT(heatmapTotal))"></span></div><div class="pnl-b">
      <div class="hm-wrap">
        <div class="hm-months" x-html="heatmapMonthLabels()"></div>
        <div class="hm-body">
          <div class="hm-days"><span x-text="t('hm_mon')"></span><span></span><span x-text="t('hm_wed')"></span><span></span><span x-text="t('hm_fri')"></span><span></span><span x-text="t('hm_sun')"></span></div>
          <div class="hm-grid" x-html="heatmapGridSvg()"></div>
        </div>
      </div>
      <div class="hm-legend"><span class="txs tm" x-text="t('heatmap_less')"></span><span class="hm-sw" style="background:var(--border)"></span><span class="hm-sw" style="background:var(--accent);opacity:.22"></span><span class="hm-sw" style="background:var(--accent);opacity:.45"></span><span class="hm-sw" style="background:var(--accent);opacity:.70"></span><span class="hm-sw" style="background:var(--accent)"></span><span class="txs tm" x-text="t('heatmap_more')"></span></div>
      <div class="panel-takeaway" x-show="heatmapTakeaway" x-text="heatmapTakeaway"></div>
    </div></div>

    <!-- 省量审计面板: 2026-10-12 修复 —— 0f6c06f 轮加热力图时误删了本面板的开启结构
         (标题行与 pnl / pnl-b 包裹), 只留下内容与末尾既有的闭合标签, 导致:
         ① 审计内容失去面板与标题, 成了散落在热力图与 TTFT 之间的裸卡片;
         ② 那 2 个失去配对的闭合标签正是 balance.py 报的 page-analytics div:-2。
         现按 75290c5 原样还原开启行, 末尾既有的闭合标签正好配对 pnl-b 与 pnl。
         ⚠️ 本注释刻意不写任何字面量 div 标签 —— balance.py 用正则计数, 会被注释里的标签骗到。 -->
    <div class="pnl mb4" x-show="analyticsTab==='cost'"><div class="pnl-h" style="cursor:pointer;user-select:none" @click="auditExpanded=!auditExpanded" role="button" :aria-expanded="auditExpanded"><div><span class="pnl-ht" style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" :style="'display:inline-block;transition:transform .15s;transform:rotate('+(auditExpanded?90:0)+'deg);color:var(--muted);font-size:var(--fs-11)'">▸</span><span x-text="t('audit_title')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('audit_desc')"></div></div><span class="txs tm" x-text="auditWindowLabel()"></span></div><div class="pnl-b" x-show="auditExpanded" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:220px"><span class="txs tm" x-text="t('audit_applied')"></span><span class="txsm mono fw6" style="color:var(--ok)" x-text="fmtT((stats.audit||{}).applied_saved_tokens||0)"></span><span class="txs tm" x-text="auditAppliedPct()"></span>
          <div x-show="auditAppliedSegs.length" class="prop-bar"><template x-for="sg in auditAppliedSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
          <div x-show="auditAppliedSegs.length" class="prop-legend"><template x-for="sg in auditAppliedSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span></span></template></div>
          <div style="display:flex;flex-direction:column;gap:2px;margin-top:4px">
            <span class="txs tm" x-text="auditLine('audit_applied_strip',(stats.audit||{}).applied_strip_tokens,(stats.audit||{}).applied_strip_fee)"></span>
            <span class="txs tm" :style="((stats.audit||{}).applied_strip_toolcall_tokens||0)>0?'color:var(--ok)':'color:var(--muted)'" x-text="auditLine('audit_applied_strip_tc',(stats.audit||{}).applied_strip_toolcall_tokens,(stats.audit||{}).applied_strip_toolcall_fee)"></span>
            <span class="txs tm" x-text="auditLine('audit_applied_trim',(stats.audit||{}).applied_trim_tokens,(stats.audit||{}).applied_trim_fee)"></span>
            <span class="txs tm" x-text="auditLine('audit_applied_resp',(stats.audit||{}).applied_resp_cache_tokens,(stats.audit||{}).applied_resp_cache_fee)"></span>
          </div>
        </div>
        <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:180px"><span class="txs tm" x-text="t('audit_kv_hit')"></span><span class="txsm mono fw6" style="color:var(--accent)" x-text="kvHitRate()"></span><span class="txs tm" x-text="t('audit_kv_miss')+' '+fmtT((stats.audit||{}).cache_miss_tokens||0)+' · '+t('audit_kv_read')+' '+fmtT((stats.audit||{}).cache_read_tokens||0)"></span>
          <div x-show="kvSegs.length" class="prop-bar"><template x-for="sg in kvSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
          <span class="txs tm" style="color:var(--ok)" x-show="((stats.audit||{}).cache_saved_fee||0)!==0" x-text="t('audit_kv_saved_fee')+' '+fmtMoney((stats.audit||{}).cache_saved_fee||0)"></span></div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div class="txs fw7" style="color:var(--fg);margin-bottom:6px" x-text="t('audit_potential')"></div>
        <div x-show="auditPotentialSegs.length" class="prop-bar"><template x-for="sg in auditPotentialSegs" :key="sg.k"><span :style="'flex-grow:'+Math.max(sg.v,1)+';background:'+sg.color" :title="sg.label+' '+fmtT(sg.v)"></span></template></div>
        <div x-show="auditPotentialSegs.length" class="prop-legend"><template x-for="sg in auditPotentialSegs" :key="sg.k"><span><i :style="'background:'+sg.color"></i><span x-text="sg.label"></span><span class="mono" x-text="fmtT(sg.v)"></span></span></template></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div x-show="((stats.audit||{}).strip_toolcall_requests||0)>0" style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:6px 8px;border-radius:var(--rm);background:rgba(52,211,153,.08)"><span class="txs" style="color:var(--ok)" x-text="t('audit_toggle_active',(stats.audit||{}).strip_toolcall_requests||0)"></span></div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_exempt_reasoning')"></span><span class="txsm mono fw6" style="color:var(--warn)" x-text="fmtT((stats.audit||{}).exempt_reasoning_tokens||0)"></span><span class="txs tm" x-text="auditPctSampled((stats.audit||{}).exempt_reasoning_tokens)"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_exempt_reasoning_hint')"></span></div>
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_dup_blocks')"></span><span class="txsm mono fw6" style="color:var(--warn)" x-text="fmtT((stats.audit||{}).dup_block_tokens||0)"></span><span class="txs tm" x-text="auditPctSampled((stats.audit||{}).dup_block_tokens)+((stats.audit||{}).dup_block_count?(' · '+t('audit_dup_count',(stats.audit||{}).dup_block_count)):'')"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_dup_hint')"></span></div>
        </div>
      </div>
      <div style="border-top:1px solid var(--border);padding-top:10px">
        <div class="txs fw7" style="color:var(--fg);margin-bottom:6px" x-text="t('audit_output_title')"></div>
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:150px"><span class="txs tm" x-text="t('audit_out_total')"></span><span class="txsm mono fw6" x-text="fmtT((stats.audit.output||{}).output_tokens||0)"></span><span class="txs tm" x-text="t('audit_out_per_req',((stats.audit.output||{}).requests?Math.round(((stats.audit.output||{}).output_tokens||0)/(stats.audit.output||{}).requests):0))"></span></div>
          <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:150px"><span class="txs tm" x-text="t('audit_out_ratio')"></span><span class="txsm mono fw6" x-text="outInRatio()"></span><span class="txs tm" x-text="t('audit_out_max',fmtT((stats.audit.output||{}).max_tokens||0))"></span></div>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_out_long')"></span><span class="txsm mono fw6" x-text="(stats.audit.output||{}).long_requests||0"></span><span class="txs tm" x-text="t('audit_out_long_share',outLongShare())"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_out_long_hint')"></span></div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px" x-show="((stats.audit.output||{}).loop_truncated||0)>0"><span class="txsm" style="min-width:96px;color:var(--fg)" x-text="t('audit_out_loop')"></span><span class="txsm mono fw6" style="color:var(--err)" x-text="(stats.audit.output||{}).loop_truncated||0"></span><span class="txs tm" style="color:var(--muted)" x-text="t('audit_out_loop_hint')"></span></div>
      </div>
      <div class="txs prose-note" x-text="t('audit_footer')"></div>
      <div x-show="degradationTotal>0" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <span class="txsm" style="min-width:96px;color:var(--warn)" x-text="t('degrade_title')"></span>
          <span class="txsm mono fw6" style="color:var(--warn)" x-text="degradationTotal"></span>
          <template x-for="(v,k) in (degradations||{})" :key="k"><span x-show="v>0" class="txs tm" x-text="'· '+t('degrade_'+k)+' '+v"></span></template>
        </div>
        <div class="txs tm" style="margin-top:4px;color:var(--muted)" x-text="t('degrade_note')"></div>
      </div>
    </div></div>
    <!-- 首字延迟 (TTFT): 先看"等多久才出字", 再看分布 —— 均值会被长尾拉平, 只看均值会误判 -->
    <div class="pnl mb4" x-show="analyticsTab==='perf'"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('ttft_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('ttft_subtitle')"></div></div><span class="txs tm" x-show="ttftHasData" x-text="t('ttft_samples',ttftSummary.samples)"></span></div><div class="pnl-b" style="display:flex;flex-direction:column;gap:12px">
      <template x-if="!ttftHasData"><div class="empty-state" style="padding:8px 0"><div class="empty-t" x-text="t('ttft_no_data')"></div><div class="empty-d" x-text="t('ttft_no_data_hint')"></div></div></template>
      <template x-if="ttftHasData">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;gap:20px;flex-wrap:wrap">
            <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;min-width:140px"><span class="txs tm" x-text="t('ttft_avg')"></span><span class="txsm mono fw6" style="color:var(--accent)" x-text="ttftAvgText"></span></div>
            <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;min-width:120px"><span class="txs tm" x-text="t('ttft_p50')"></span><span class="txsm mono fw6" x-text="ttftP50Text"></span></div>
            <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;min-width:120px"><span class="txs tm" x-text="t('ttft_p90')"></span><span class="txsm mono fw6" :style="ttftSummary.p90Ms>=10000?'color:var(--warn)':''" x-text="ttftP90Text"></span></div>
          </div>
          <div class="txs tm" x-text="t('ttft_approx_hint')"></div>
          <div style="border-top:1px solid var(--border);padding-top:10px">
            <div class="txs fw7" style="color:var(--fg);margin-bottom:6px" x-text="t('ttft_dist_title')"></div>
            <div class="prop-bar"><template x-for="r in ttftSummary.rows" :key="r.k"><span :style="'flex-grow:'+Math.max(r.v,1)+';background:'+r.color" :title="r.label+' · '+r.v+' · '+fmtPct(r.pct)"></span></template></div>
            <div class="prop-legend"><template x-for="r in ttftSummary.rows" :key="r.k"><span><i :style="'background:'+r.color"></i><span x-text="r.label"></span><span class="mono" x-text="r.v"></span></span></template></div>
            <div class="txs tm" style="margin-top:4px" x-text="t('ttft_dist_desc')"></div>
          </div>
          <div class="panel-takeaway" x-show="ttftTakeaway" x-text="ttftTakeaway"></div>
          <div x-show="ttftSlowCount>0" class="txs" style="color:var(--warn)" x-text="t('ttft_slow_hint',ttftSlowCount)"></div>
        </div>
      </template>
    </div></div>
    <!-- ── 时间去哪了 (窗口级, 方案 F 2026-10-13) ──
         把窗口内每次流式请求的四段耗时聚合, 回答"这段时间时间花在哪"。
         两个口径要点: ① 各段用 Σ毫秒/样本数 求平均 (不平均各请求的速率 —— 长尾会被抹平);
         ② 未采集的样本不计入 (非流式/缓存回放/原生直通拿不到阶段时刻) → 显示 "—" 而非 0。 -->
    <!-- ── 耗时拆分: 客户端视角 + 网关视角 (2026-10-16 由两张卡合并) ──
         原本「时间去哪了」与「网关自身开销」是两张结构完全相同的卡 (各一条分段比例条 +
         每段一个数值块), 只是模型侧/网关侧之分。合并后一次看到两侧, 对比关系更清楚,
         也省掉一套标题/留白/说明。两侧口径不同, 故各自保留一行小字说明。 -->
    <div class="pnl mb4" x-show="analyticsTab==='perf'"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('perf_split_title')"></span><div class="txs tm" style="margin-top:3px" x-text="t('perf_split_desc')"></div></div></div><div class="pnl-b" style="display:flex;flex-direction:column;gap:16px">
      <div x-show="stageHasData">
        <div class="fb" style="margin-bottom:8px"><span class="txs tm" x-text="t('perf_row_model')"></span><span class="txs tm" style="margin-left:auto" x-text="t('stages_samples',stageSummary.waiting_samples||0)"></span></div>
        <div class="prop-bar"><template x-for="s in stageWinRows" :key="s.k"><span x-show="s.avg!=null" :style="'flex-grow:'+Math.max(s.avg||0,0.5)+';background:'+s.color" :title="s.label+' '+msText(s.avg)"></span></template></div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:10px">
          <template x-for="s in stageWinRows" :key="s.k">
            <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;min-width:110px">
              <span class="txs tm" x-text="s.label"></span>
              <span class="txsm mono fw6" :style="s.avg==null?'opacity:.5;color:var(--muted)':('color:'+s.color)" x-text="msText(s.avg)"></span>
              <span class="txs tm" x-show="s.avg!=null" x-text="t('stages_n_samples',s.n)"></span>
            </div>
          </template>
        </div>
        <div class="txs tm" style="color:var(--muted);margin-top:8px" x-text="t('stages_note')"></div>
      </div>
      <div x-show="gwStageHasData" style="border-top:1px solid var(--border);padding-top:14px">
        <div class="fb" style="margin-bottom:8px"><span class="txs tm" x-text="t('perf_row_gateway')"></span><span class="txs tm" style="margin-left:auto" x-text="t('stages_samples',(gwStageSummary.overhead||{}).samples||0)"></span></div>
        <div class="prop-bar"><template x-for="s in gwStageWinRows" :key="s.k"><span x-show="s.avg!=null" :style="'flex-grow:'+Math.max(s.avg||0,0.5)+';background:'+s.color" :title="s.label+' '+msText(s.avg)"></span></template></div>
        <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:10px">
          <template x-for="s in gwStageWinRows" :key="s.k">
            <div class="cg" style="flex-direction:column;align-items:flex-start;gap:2px;min-width:110px">
              <span class="txs tm" x-text="s.label"></span>
              <span class="txsm mono fw6" :style="s.avg==null?'opacity:.5;color:var(--muted)':('color:'+s.color)" x-text="msText(s.avg)"></span>
              <span class="txs tm" x-show="s.p95!=null" x-text="'p95 '+msText(s.p95)"></span>
              <span class="txs tm" x-show="s.avg!=null" x-text="t('stages_n_samples',s.n)"></span>
            </div>
          </template>
        </div>
        <div class="txs tm" style="color:var(--muted);margin-top:8px" x-text="t('gw_note')"></div>
        <div class="txs tm" style="color:var(--muted)" x-text="t('gw_direct_note')"></div>
      </div>
    </div></div>
    <!-- ── 链路拓扑 (简化版, 2026-10-15; 2026-10-16 精简) ──
         客户端 → 网关 → 提供商。**只留链式耗时对比** (哪一跳慢): 客户端量/错误/成功率 →
         网关(自身开销 p95 / 上游首字节 p95) → 提供商。
         逐提供商的 请求/错误/429 原样列在这里过 —— 那三项在「供应商性能」表里逐列已有
         (同一份 per_provider), 重复一遍只是把表读第二遍, 故改为计数 + 指向该表。 -->
    <div class="pnl mb4" x-show="analyticsTab==='perf' && (stats.total_requests||0)>0"><div class="pnl-h" style="cursor:pointer;user-select:none" @click="gwTopoExpanded=!gwTopoExpanded" role="button" :aria-expanded="gwTopoExpanded"><div><span class="pnl-ht" style="display:inline-flex;align-items:center;gap:6px"><span aria-hidden="true" :style="'display:inline-block;transition:transform .15s;transform:rotate('+(gwTopoExpanded?90:0)+'deg);color:var(--muted);font-size:var(--fs-11)'">▸</span><span x-text="t('gw_topo_title')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('gw_topo_desc')"></div></div></div><div class="pnl-b" x-show="gwTopoExpanded" style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
        <div class="ov-secondary-item" style="min-width:180px">
          <div class="txs tm" x-text="t('gw_topo_client')"></div>
          <div class="mono fw6" style="margin-top:6px" x-text="t('gw_topo_requests')+' '+(stats.total_requests||0)"></div>
          <div class="txs tm" style="margin-top:2px" x-text="t('gw_topo_errors')+' '+(stats.error_count||0)"></div>
          <div class="txs tm" style="margin-top:2px" x-text="t('success_rate')+' '+((stats.total_requests||0)?fmtPct(((stats.total_requests-(stats.error_count||0))/(stats.total_requests))*100):'—')"></div>
        </div>
        <span aria-hidden="true" style="color:var(--muted);align-self:center">→</span>
        <div class="ov-secondary-item" style="min-width:180px">
          <div class="txs tm" x-text="t('gw_topo_gateway')"></div>
          <div class="mono fw6" style="margin-top:6px" x-text="t('gw_topo_own')+' '+(gwOverheadP95==null?'—':('p95 '+msText(gwOverheadP95)))"></div>
          <div class="txs tm" style="margin-top:2px" x-text="t('gw_topo_upstream')+' '+(gwTtfbP95==null?'—':('p95 '+msText(gwTtfbP95)))"></div>
        </div>
        <span aria-hidden="true" style="color:var(--muted);align-self:center">→</span><div class="ov-secondary-item" style="min-width:200px;flex:1"><div class="txs tm" x-text="t('gw_topo_providers')"></div><div class="mono fw6" style="margin-top:6px" x-text="t('gw_topo_prov_n',(stats.per_provider||[]).length)"></div><div class="txs tm" style="margin-top:2px" x-text="t('gw_topo_prov_hint')"></div></div>
      </div>
      <div class="txs tm" style="color:var(--muted)" x-text="t('gw_topo_note')"></div>
    </div></div>
    <div class="pnl mb4" x-show="analyticsTab==='overview'"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('call_distribution')"></span><div class="txs tm" style="margin-top:3px" x-text="t('aggregate_provider_model')"></div></div></div><div class="pnl-b"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div style="width:150px;flex-shrink:0;text-align:center" x-html="'<svg viewBox=&quot;0 0 140 140&quot; width=&quot;140&quot;>'+donutSvg+'</svg>'"></div><div style="flex:1;min-width:280px"><!-- 环图与排名原本是两张卡、同一份 per_model 数据 (2026-10-16 合并)：
                   占比数字与条形各占一列纯属重复 —— 现在条形本身就是占比的可视化，
                   数值直接压在条形上，一列搞定。 --><template x-for="(m,i) in (stats.per_model||[]).slice(0,8)" :key="m.model"><div class="an-rank"><span class="mono txs fw7" :style="'width:22px;color:'+(i<3?['var(--rank-1)','var(--rank-2)','var(--rank-3)'][i]:'var(--muted)')" x-text="'#'+(i+1)"></span><div style="flex:1;min-width:0"><div class="fb"><span class="mono txs" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="m.model" x-text="m.model"></span><span class="txs tm" x-text="fmtT(m.requests)+' · '+fmtPct((m.requests/(stats.total_requests||1))*100)"></span></div><div style="height:7px;margin-top:5px;background:var(--fill-5);border-radius:var(--pill);overflow:hidden"><div class="an-rank-bar" :style="'width:'+((m.requests/(stats.per_model[0].requests||1))*100)+'%'"></div></div></div></div></template><template x-if="(stats.per_model||[]).length>8"><div class="dist-legend"><span class="dist-dot" style="background:var(--chart-rest)"></span><span class="txs" style="flex:1" x-text="t('other_n',(stats.per_model||[]).length-8)"></span><span class="dist-pct" x-text="fmtPct(((stats.total_requests-(stats.per_model||[]).slice(0,8).reduce((s,m)=>s+m.requests,0))/(stats.total_requests||1))*100)"></span></div></template><div class="panel-takeaway" x-show="distTopTakeaway" x-text="distTopTakeaway"></div></div></div></div></div>
    <div class="pnl" x-show="analyticsTab==='cost'"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('model_details')"></span><div class="txs tm" style="margin-top:3px" x-text="t('model_details_desc')"></div></div><span class="cg" style="gap:8px"><span class="txs tm" x-text="filteredModelStats.length+' / '+(stats.per_model||[]).length"></span><button class="btn btn-g" style="font-size:var(--fs-11);padding:3px 9px" @click="modelColsMore=!modelColsMore" :aria-pressed="modelColsMore" x-text="modelColsMore?t('cols_less'):t('cols_more')"></button></span></div><div class="an-filter"><input class="inp" style="width:260px" :placeholder="t('analytics_search_models')" x-model="modelDetailFilter"><select class="sel" x-model="modelProviderFilter"><option value="" x-text="t('provider_all')"></option><template x-for="p in modelDetailProviders" :key="p"><option :value="p" x-text="p"></option></template></select><span class="txs tm" x-text="t('instant_filter',filteredModelStats.length)"></span></div><div style="overflow-x:auto"><table><thead><tr><th x-text="t('tbl.upstream_model')"></th><th x-text="t('balance_provider')"></th><th x-text="t('tbl.alias')" x-show="modelColsMore"></th><th x-text="t('tbl.requests')"></th><th x-text="t('tbl.success')" x-show="modelColsMore"></th><th x-text="t('tbl.errors')"></th><th x-text="t('tbl.avg_latency')" x-show="modelColsMore"></th><th :title="t('tbl.tokens_in_out_hint')" x-text="t('tbl.tokens_in_out')"></th><th x-text="t('tbl.output_tokens')"></th><th x-text="t('tbl.cache_hit')" x-show="modelColsMore"></th><th x-text="t('tbl.gen_speed')" x-show="modelColsMore"></th><th x-text="t('ttft_col_avg')" x-show="modelColsMore"></th><th x-text="t('tbl.cost')"></th><th :title="t('optimization_saved_model_hint')" x-text="t('optimization_saved_tokens')"></th><th :title="t('optimization_saved_model_hint')" x-text="t('optimization_saved_fee')" x-show="modelColsMore"></th></tr></thead><tbody><template x-for="m in filteredModelStats" :key="m.provider+'/'+m.upstream_model"><tr><td class="mono fw6"><span x-text="m.upstream_model||m.model"></span><template x-if="m.free"><span class="bdg bdg-s" style="margin-left:6px;font-size:var(--fs-9)" x-text="t('badge.free')"></span></template></td><td class="txs" x-text="m.provider||'—'"></td><td class="txs tm" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="(m.aliases||[]).join(', ')" x-show="modelColsMore"></td><td class="mono" x-text="m.requests"></td><td class="mono" x-text="Math.max(0,(m.requests||0)-modelErrorCount(m))" x-show="modelColsMore"></td><td class="mono" :style="modelErrorCount(m)?'color:var(--err)':''" x-text="modelErrorCount(m)"></td><td class="mono txs" x-text="fmtMs(m.avg_latency_ms)" x-show="modelColsMore"></td><td class="mono txs"><span x-text="modelTokensBeforeText(m)"></span><span class="tm"> → </span><span x-text="modelTokensAfterText(m)" style="color:var(--fg)"></span><span class="txs tm" x-show="modelSavedPct(m)" style="margin-left:6px;color:var(--ok)" x-text="t('tokens_saved_pct',modelSavedPct(m))"></span></td><td class="mono txs" x-text="fmtT(m.total_completion_tokens)"></td><td class="txs" x-text="m.total_cache_hit_tokens?fmtPct(m.total_cache_hit_tokens/(m.total_prompt_tokens||1)*100):'—'" x-show="modelColsMore"></td><td class="mono txs" x-text="m.gen_speed?(m.gen_speed.toFixed(1)+' '+t('unit_tokps')):'—'" x-show="modelColsMore"></td><td class="mono txs" x-text="ttftCellText(m)" x-show="modelColsMore"></td><td class="mono txs" x-text="fmtMoney(m.total_cost||0)"></td><td class="mono txs" :style="(m.optimization_saved_tokens||0)>0?'color:var(--ok)':'color:var(--muted)'" x-text="fmtT(m.optimization_saved_tokens||0)"></td><td class="mono txs" style="color:var(--ok)" x-text="modelSavedFeeText(m)" x-show="modelColsMore"></td></tr></template><template x-if="!filteredModelStats.length"><tr><td colspan="14" style="text-align:center;padding:32px" class="tm" x-text="(stats.per_model||[]).length?t('no_match'):t('no_data')"></td></tr></template></tbody></table></div></div>
    <div class="pnl" x-show="analyticsTab==='cost'"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('provider_performance')"></span><div class="txs tm" style="margin-top:3px" x-text="t('current_window_aggregate')"></div></div><button class="btn btn-g" style="font-size:var(--fs-11);padding:3px 9px" @click="provColsMore=!provColsMore" :aria-pressed="provColsMore" x-text="provColsMore?t('cols_less'):t('cols_more')"></button></div><div class="pnl-b" style="overflow-x:auto"><table><thead><tr><th x-text="t('balance_provider')"></th><th x-text="t('tbl.requests')"></th><th x-text="t('tbl.success')" x-show="provColsMore"></th><th x-text="t('tbl.errors')"></th><th x-text="t('tbl.rate_limited')"></th><th x-text="t('tbl.avg_latency')" x-show="provColsMore"></th><th x-text="t('tbl.input_tokens')"></th><th x-text="t('tbl.output_tokens')"></th><th x-text="t('tbl.cache_hit')" x-show="provColsMore"></th><th x-text="t('tbl.gen_speed')" x-show="provColsMore"></th><th x-text="t('ttft_col_avg')" x-show="provColsMore"></th><th x-text="t('tbl.cost')"></th><th x-text="t('kv_cache_saved')" x-show="provColsMore"></th><th x-text="t('optimization_saved_tokens')"></th></tr></thead><tbody><template x-for="p in (stats.per_provider||[])" :key="p.provider"><tr><td class="fw6" x-text="p.provider"></td><td x-text="p.requests"></td><td x-text="Math.max(0,(p.requests||0)-(p.errors||0))" x-show="provColsMore"></td><td x-text="p.errors||0"></td><td class="mono" :style="p.rate_limited?'color:var(--warn-fg)':'color:var(--muted)'" x-text="p.rate_limited||0"></td><td x-text="fmtMs(p.avg_latency_ms)" x-show="provColsMore"></td><td x-text="fmtT(p.total_prompt_tokens)"></td><td x-text="fmtT(p.total_completion_tokens)"></td><td x-text="p.total_cache_hit_tokens?fmtPct(p.total_cache_hit_tokens/(p.total_prompt_tokens||1)*100):'—'" x-show="provColsMore"></td><td x-text="p.gen_speed?(p.gen_speed.toFixed(1)+' '+t('unit_tokps')):'—'" x-show="provColsMore"></td><td class="mono txs" x-text="ttftCellText(p)" x-show="provColsMore"></td><td x-text="fmtMoney(p.total_cost)"></td><td x-text="p.billing?fmtMoney(p.cache_saved||0):'—'" x-show="provColsMore"></td><td x-text="fmtT(p.today_opt_saved_tokens||0)"></td></tr></template><template x-if="!(stats.per_provider||[]).length"><tr><td colspan="14" style="text-align:center;padding:32px" class="tm" x-text="t('no_data')"></td></tr></template></tbody></table></div></div>
  </div></template>
</div>
