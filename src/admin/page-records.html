<div x-show="activeTab==='records'" class="page-enter page-wide">
  <div class="phd"><div><h1 class="pt" x-text="t('records_title')"></h1><p class="ps" x-text="t('records_subtitle')"></p></div><div class="ov-actions"><button class="btn btn-g" :disabled="loading||!logsFetched" @click="fetchLogs()" x-text="t('refresh')"></button><button class="btn btn-g" :disabled="loading||!logsFetched" @click="exportLogs()" x-text="t('export_json')"></button><button class="btn btn-g" style="color:var(--err)" :disabled="clearingLogs||loading||!logsFetched" @click="clearAllLogs()" x-text="clearingLogs?t('saving'):t('clear_all_records')"></button></div></div>
  <!-- P1 骨架 (首次加载): 页头保留, 统计卡与表格以骨架占位 —— 原实现首载时统计卡直接显示 0 (无数据 ≠ 0).
       门控同时看 stats 的 loading 与 logs 的 logsFetched: 两个独立请求谁后到都保持骨架. -->
  <div x-show="((loading||!logsFetched)&&skelReady)" x-cloak aria-hidden="true" style="display:flex;flex-direction:column;gap:16px">
    <div class="rec-stats rec-stats-skel"><template x-for="i in 4" :key="i"><div class="rec-stat"><div class="skel skel-line" style="width:56%;height:10px"></div><div class="skel" style="height:22px;width:60%;margin-top:8px"></div></div></template></div>
    <div class="skel-card"><div class="skel skel-line" style="width:30%"></div><div class="skel skel-line" style="width:100%;height:10px;margin-top:8px"></div><div class="skel skel-line" style="width:92%;height:10px;margin-top:6px"></div><div class="skel skel-line" style="width:96%;height:10px;margin-top:6px"></div><div class="skel skel-line" style="width:88%;height:10px;margin-top:6px"></div></div>
  </div>
  <div class="rec-stats" x-show="!loading&&logsFetched">
    <div class="rec-stat"><div class="rec-stat-label" x-text="t('current_window_requests')"></div><div class="rec-stat-value" x-text="logs.length"></div></div>
    <div class="rec-stat" :style="'cursor:pointer;'+(logStatusFilter==='error'?'outline:1px solid var(--err-bd)':'')" :title="t('opt.error')" @click="logStatusFilter=(logStatusFilter==='error'?'':'error');resetLogView()"><div class="rec-stat-label" x-text="t('error_requests')"></div><div class="rec-stat-value" style="color:var(--err)" x-text="recordErrorCount"></div></div>
    <div class="rec-stat"><div class="rec-stat-label" x-text="t('success_rate')"></div><div class="rec-stat-value" :style="'color:'+rateColor(recordSuccessRate,recordSuccessRateText)" x-text="recordSuccessRateText"></div></div>
    <div class="rec-stat"><div class="rec-stat-label" x-text="t('unit_tokens')"></div><div class="rec-stat-value" x-text="fmtT(recordTokenCount)"></div></div>
  </div>
  <div class="txs tm" style="margin:-6px 0 12px" x-show="!loading&&logsFetched" x-text="t('records_scope_hint',logs.length)"></div>
  <div class="rec-layout" x-show="!loading&&logsFetched">
    <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht" x-text="t('call_records')"></span><span class="txs tm" style="margin-left:8px" x-text="filteredLogs.length+' / '+logs.length"></span></div></div>
      <div class="an-filter"><span class="search-wrap"><input type="text" class="inp" style="width:220px" x-ref="logSearch" aria-keyshortcuts="/" :placeholder="t('search_placeholder')" x-model="logSearchDraft" @input="onLogSearchInput($event)" @compositionstart="onLogSearchCompositionStart()" @compositionupdate="onLogSearchCompositionUpdate()" @compositionend="onLogSearchCompositionEnd()" @keydown.escape="$el.blur()"><kbd aria-hidden="true">/</kbd></span><select class="sel" x-model="logProviderFilter" @change="resetLogView()"><option value="" x-text="t('opt.all_providers')"></option><template x-for="p in logProviders" :key="p"><option :value="p" x-text="p"></option></template></select><div class="seg"><span class="seg-i" :class="{'a':logStatusFilter===''}" @click="logStatusFilter='';resetLogView()" x-text="t('opt_all')"></span><span class="seg-i" :class="{'a':logStatusFilter==='success'}" @click="logStatusFilter='success';resetLogView()" x-text="t('opt.success')"></span><span class="seg-i" :class="{'a':logStatusFilter==='error'}" @click="logStatusFilter='error';resetLogView()" x-text="t('opt.error')"></span></div><select class="sel" x-model="logTimeFilter" @change="resetLogView()"><option value="" x-text="t('time_all')"></option><option value="1h" x-text="t('time_1h')"></option><option value="24h" x-text="t('time_24h')"></option><option value="7d" x-text="t('time_7d')"></option></select><button class="btn btn-g" style="font-size:var(--fs-11)" @click="clearLogSearch();logProviderFilter='';logStatusFilter='';logTimeFilter='';logSortKey='';resetLogView()" x-text="t('filter_reset')"></button><!-- P3: 列显隐 (偏好存 localStorage; 至少保留一列) --><span style="position:relative"><button class="btn btn-g" style="font-size:var(--fs-11)" @click="logColsOpen=!logColsOpen" :aria-expanded="logColsOpen" x-text="t('columns')+' ⌄'"></button>
        <div class="cols-pop" x-show="logColsOpen" x-cloak @click.outside="logColsOpen=false">
          <template x-for="c in [{k:'status',t:'status'},{k:'error',t:'detail.error'},{k:'model',t:'detail.model'},{k:'reasoning',t:'detail.reasoning'},{k:'provider',t:'detail.provider'},{k:'tokens',t:'unit_tokens'},{k:'cache',t:'detail.cache_hit_rate'},{k:'latency',t:'latency'}]" :key="c.k">
            <label class="cols-row"><input type="checkbox" :checked="logColsShown[c.k]" @change="toggleLogCol(c.k)"><span x-text="t(c.t)"></span></label>
          </template>
        </div></span></div>
      <div style="overflow-x:auto"><table><thead><tr><th class="th-sort" @click="toggleLogSort('time')"><span x-text="t('detail.time')"></span><span class="th-sort-ico" x-text="logSortIcon('time')"></span></th><th class="th-sort" @click="toggleLogSort('status')"><span x-text="t('status')"></span><span class="th-sort-ico" x-text="logSortIcon('status')"></span></th><th x-show="logColsShown.error" class="th-sort" @click="toggleLogSort('error')"><span x-text="t('detail.error')"></span><span class="th-sort-ico" x-text="logSortIcon('error')"></span></th><th x-show="logColsShown.model" class="th-sort" @click="toggleLogSort('model')"><span x-text="t('detail.model')"></span><span class="th-sort-ico" x-text="logSortIcon('model')"></span></th><th x-show="logColsShown.reasoning" x-text="t('detail.reasoning')"></th><th x-show="logColsShown.provider" x-text="t('detail.provider')"></th><th x-show="logColsShown.tokens" class="th-sort" @click="toggleLogSort('tokens')"><span x-text="t('unit_tokens')"></span><span class="th-sort-ico" x-text="logSortIcon('tokens')"></span></th><th x-show="logColsShown.cache" class="th-sort" @click="toggleLogSort('cache')"><span x-text="t('detail.cache_hit_rate')"></span><span class="th-sort-ico" x-text="logSortIcon('cache')"></span></th><th x-show="logColsShown.latency" class="th-sort" @click="toggleLogSort('latency')"><span x-text="t('latency')"></span><span class="th-sort-ico" x-text="logSortIcon('latency')"></span></th></tr></thead><tbody><template x-for="(log,i) in paginatedLogs" :key="i"><tr @click="openLogDetail(log)" style="cursor:pointer"><td class="mono txs tm th-sticky" x-text="fmtTs(log.timestamp)" :data-l="t('detail.time')"></td><td :data-l="t('status')"><span class="bdg" :class="bcls(log.status<400?'ok':'err')" x-text="log.status"></span></td><td style="max-width:200px" x-show="logColsShown.error" :data-l="t('detail.error')"><template x-if="log.error"><div style="min-width:0"><div class="txs" style="color:var(--err);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="t('err_view_full')" @click.stop="logErrOpen[String(log.timestamp)]=!logErrOpen[String(log.timestamp)]" x-text="testErrFirst(log.error)"></div><template x-if="logErrOpen[String(log.timestamp)]"><div style="margin-top:4px;padding:6px 8px;border-radius:6px;background:var(--err-bg-soft);border:1px solid var(--err-bd-soft);white-space:pre-wrap;word-break:break-all;font-size:var(--fs-10);color:var(--err-fg);max-width:280px"><div x-text="log.error"></div><button class="btn btn-g" style="font-size:var(--fs-10);padding:2px 6px;margin-top:5px" @click.stop="copyText(log.error,'logerr')" x-text="copiedField==='logerr'?t('copied'):t('copy')"></button></div></template></div></template><template x-if="!log.error"><span class="tm">—</span></template></td><td x-show="logColsShown.model" :data-l="t('detail.model')"><div class="mono txs fw6 cell-clip bdg-click" :title="t('copy')" @click.stop="copyBadge(log.model,'lm:'+log.model)" x-text="log.model"></div><div class="txs tm cell-clip" :title="log.upstream_model||''" x-text="log.upstream_model&&log.upstream_model!==log.model?log.upstream_model:''"></div></td><td x-show="logColsShown.reasoning" :data-l="t('detail.reasoning')"><template x-if="log.reasoning_effort"><span class="bdg bdg-p" x-text="log.reasoning_effort"></span></template><span class="txs tm" x-show="!log.reasoning_effort">—</span></td><td class="txs cell-clip" style="cursor:pointer;color:var(--indigo)" :title="t('view_providers')" @click.stop="openLogProvider(log)" x-text="log.provider" x-show="logColsShown.provider" :data-l="t('detail.provider')"></td><td class="mono txs" x-show="logColsShown.tokens" :data-l="t('unit_tokens')"><span x-show="log.usage_estimated" :title="t('usage_estimated_hint')" style="color:var(--warn);margin-right:3px">≈</span><span x-text="fmtT(log.prompt_tokens||0)+' → '+fmtT(log.completion_tokens||0)"></span></td><td x-show="logColsShown.cache" :data-l="t('detail.cache_hit_rate')"><span class="bdg bdg-g" x-show="log.cached" x-text="t('badge.cached')"></span><span class="mono txs" x-show="!log.cached" x-text="logCacheRate(log)"></span></td><td class="mono txs" x-text="fmtMs(log.latency_ms)+' / '+(log.first_token_ms?fmtMs(log.first_token_ms):'—')" x-show="logColsShown.latency" :data-l="t('latency')"></td></tr></template><template x-if="!filteredLogs.length && logs.length"><tr><td colspan="9" style="text-align:center;padding:40px" class="tm" x-text="t('no_match')"></td></tr></template><template x-if="!filteredLogs.length && !logs.length"><tr><td colspan="9" style="padding:0"><div class="empty-state" style="padding:40px 16px"><div class="empty-ic" x-html="EMPTY_ICO"></div><h2 class="empty-t" x-text="t('empty_records_title')"></h2><p class="empty-d" x-text="t('empty_records_desc')"></p><button class="btn btn-p" @click="switchTab('dashboard')" x-text="t('empty_records_cta')"></button></div></td></tr></template></tbody></table></div>
      <div class="fb" style="padding:10px 16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px"><span class="txs tm" x-text="t('total_count',filteredLogs.length)"></span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><!-- P3: 每页条数 (全局记忆) --><span class="cg" style="gap:6px"><span class="txs tm" x-text="t('rows_per_page')"></span><select class="sel" style="font-size:var(--fs-11);padding:3px 22px 3px 8px" :value="pageSize" @change="setPageSize($event.target.value)"><template x-for="n in pageSizeOptions" :key="n"><option :value="n" x-text="n"></option></template></select></span><button class="btn btn-g" :disabled="logPage===0" @click="gotoLogPage(0)" :title="t('first_page')" :aria-label="t('first_page')">«</button><button class="btn btn-g" :disabled="logPage===0" @click="gotoLogPage(logPage-1)" x-text="t('prev_page')"></button><!-- P3: 页码直达 (省略算法: 首尾 + 当前邻域).
     单元素表达省略号 —— 不再用「span + button 双分支」: 那会让 x-show 隐藏的那个仍留在
     DOM 里 (残影文本), 且 Alpine 的 <template x-for> 本就有严格单根约束. -->
<template x-for="(p,pi) in pageNumbers(logPage,totalLogPages)" :key="'pg'+pi"><button class="btn pg-item" :class="p===logPage?'btn-p':'pg-gap'" :disabled="p==='…'" @click="p!=='…'&&gotoLogPage(p)" :aria-current="p===logPage?'page':null" :aria-label="p==='…'?null:t('page_n',p+1)" x-text="p==='…'?'…':p+1"></button></template><button class="btn btn-g" :disabled="logPage>=totalLogPages-1" @click="gotoLogPage(logPage+1)" x-text="t('next_page')"></button><button class="btn btn-g" :disabled="logPage>=totalLogPages-1" @click="gotoLogPage(totalLogPages-1)" :title="t('last_page')" :aria-label="t('last_page')">»</button></div></div>
    </div>
  </div>
  <template x-if="selectedLog"><div class="log-modal" role="dialog" aria-modal="true" @click.self="closeLogDetail()" @keydown.escape.window="closeLogDetail()"><div class="log-modal-card"><div class="log-modal-head"><div><span class="pnl-ht" x-text="t('request_details')"></span><span class="bdg" style="margin-left:8px" :class="selectedLog.status<400?'bdg-s':'bdg-e'" x-text="selectedLog.status"></span></div><button class="btn btn-g" @click="closeLogDetail()" :title="t('cancel')" :aria-label="t('cancel')">✕</button></div><div class="log-modal-body"><div class="log-detail-grid"><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.time')"></div><div class="log-detail-val mono" x-text="fmtDateTime(selectedLog.timestamp)"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.model')"></div><div class="log-detail-val mono" x-text="selectedLog.model"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('tbl.upstream_model')"></div><div class="log-detail-val mono" x-text="selectedLog.upstream_model||'—'"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.provider')"></div><div class="log-detail-val" x-text="selectedLog.provider"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.endpoint')"></div><div class="log-detail-val mono" x-text="selectedLog.endpoint"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_body_size')"></div><div class="log-detail-val mono" x-text="fmtB(selectedLog.body_len)"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_prompt_completion')"></div><div class="log-detail-val mono" x-text="t('detail_in_out')+' '+fmtT(selectedLog.prompt_tokens||0)+' / '+t('detail_out')+' '+fmtT(selectedLog.completion_tokens||0)"></div><div class="txs" style="color:var(--warn);margin-top:2px" x-show="selectedLog.usage_estimated" x-text="t('usage_estimated_hint')"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_latency_ttft')"></div><div class="log-detail-val mono" x-text="fmtMs(selectedLog.latency_ms)+' / '+(selectedLog.first_token_ms?fmtMs(selectedLog.first_token_ms):'—')"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.kv_cache')"></div><div class="log-detail-val mono" x-text="t('detail_hit_n',fmtT(selectedLog.prompt_cache_hit_tokens||0))+' / '+t('detail_miss_n',fmtT(selectedLog.prompt_cache_miss_tokens||0))"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.cache_hit_rate')"></div><div class="log-detail-val mono" x-text="logCacheRate(selectedLog)"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.reasoning')"></div><div class="log-detail-val" x-text="selectedLog.reasoning_effort||'—'"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.gen_speed')"></div><div class="log-detail-val mono" x-text="logGenSpeed(selectedLog)"></div></div>
        <div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_cost')"></div><div class="log-detail-val mono" :style="selectedLog.cached?'color:var(--muted)':''" x-text="selectedLog.cached?t('detail_cost_cached'):fmtMoney(selectedLog.cost||0)"></div></div>
        <div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_cache_saved')"></div><div class="log-detail-val mono" style="color:var(--ok)" x-text="(selectedLog.cache_saved?fmtMoneyTiny(selectedLog.cache_saved):'—')"></div></div><div class="log-detail-item" style="grid-column:1/-1"><div class="log-detail-key" x-text="t('detail.opt_saved')"></div><div class="log-detail-val" style="color:var(--ok)">
          <div class="mono" x-text="fmtT(logSavedTotal(selectedLog))+(selectedLog.opt_saved_fee?('  ≈ '+fmtMoneyTiny(selectedLog.opt_saved_fee)):'')"></div>
          <div class="txs tm" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:10px">
            <span x-text="t('saved_strip')+' '+fmtT((selectedLog.saved_breakdown||{}).strip||0)"></span>
            <span x-show="((selectedLog.saved_breakdown||{}).strip_toolcall||0)>0" x-text="t('saved_strip_tc')+' '+fmtT((selectedLog.saved_breakdown||{}).strip_toolcall||0)"></span>
            <span x-text="t('saved_trim')+' '+fmtT((selectedLog.saved_breakdown||{}).trim||0)"></span>
            <span x-text="t('saved_resp')+' '+fmtT((selectedLog.saved_breakdown||{}).resp_cache||0)"></span>
          </div>
        </div></div><template x-if="selectedLog.error"><div class="log-detail-item" style="grid-column:1/-1"><div class="log-detail-key" x-text="t('detail.error')"></div><div class="log-detail-val" style="color:var(--err)" x-text="selectedLog.error"></div></div></template></div></div></div></div></template>
</div>
