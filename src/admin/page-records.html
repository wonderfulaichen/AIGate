rt('cache')" @keydown.space.prevent="toggleLogSort('cache')" @click="toggleLogSort('cache')"><span x-text="t('detail.cache_hit_rate')"></span><span class="th-sort-ico" :class="{on:logSortActive('cache')}" x-text="logSortIcon('cache')"></span></th><th x-show="logColsShown.latency" class="th-sort" tabindex="0" role="button" @keydown.enter.prevent="toggleLogSort('latency')" @keydown.space.prevent="toggleLogSort('latency')" @click="toggleLogSort('latency')"><span x-text="t('latency')"></span><span class="th-sort-ico" :class="{on:logSortActive('latency')}" x-text="logSortIcon('latency')"></span></th></tr></thead><tbody><template x-for="(log,i) in paginatedLogs" :key="log.seq?log.seq:('t'+log.timestamp+'i'+i)"><tr @click="openLogDetail(log)" :class="{'row-flash':_flashLogTs>0&&Number(log.timestamp)===_flashLogTs}" style="cursor:pointer"><td class="mono txs tm th-sticky" x-text="fmtTs(log.timestamp)" :data-l="t('detail.time')"></td><td :data-l="t('status')"><span class="log-pill" :class="bcls(log.status===499?'warn':(log.status<400?'ok':'err'))" x-text="log.status"></span></td><td style="max-width:200px" x-show="logColsShown.error" :data-l="t('detail.error')"><template x-if="log.error"><div style="min-width:0"><div class="txs" :style="'color:'+(log.status===499?'var(--warn-fg)':'var(--err)')+';cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'" :title="t('err_view_full')" @click.stop="logErrOpen[String(log.timestamp)]=!logErrOpen[String(log.timestamp)]" x-text="testErrFirst(log.error)"></div><template x-if="logErrOpen[String(log.timestamp)]"><div style="margin-top:4px;padding:6px 8px;border-radius:var(--rm);background:var(--err-bg-soft);border:1px solid var(--err-bd-soft);white-space:pre-wrap;word-break:break-all;font-size:var(--fs-10);color:var(--err-fg);max-width:280px"><div x-text="log.error"></div><button class="btn btn-g" style="font-size:var(--fs-10);padding:2px 6px;margin-top:5px" @click.stop="copyText(log.error,'logerr')" x-text="copiedField==='logerr'?t('copied'):t('copy')"></button></div></template></div></template><template x-if="!log.error"><span class="tm">—</span></template></td><td x-show="logColsShown.model" :data-l="t('detail.model')"><div class="mono txs fw6 cell-clip bdg-click" :title="t('copy')" @click.stop="copyBadge(log.model,'lm:'+log.model)" x-text="log.model"></div><div class="txs tm cell-clip" :title="log.upstream_model||''" x-text="log.upstream_model&&log.upstream_model!==log.model?log.upstream_model:''"></div></td><td x-show="logColsShown.reasoning" :data-l="t('detail.reasoning')"><template x-if="log.reasoning_effort"><span class="log-pill-effort" x-text="log.reasoning_effort"></span></template><span class="txs tm" x-show="!log.reasoning_effort">—</span></td><td class="txs cell-clip" style="cursor:pointer;color:var(--accent)" :title="t('view_providers')" @click.stop="openLogProvider(log)" x-text="log.provider" x-show="logColsShown.provider" :data-l="t('detail.provider')"></td><td class="mono txs" x-show="logColsShown.tokens" :data-l="t('unit_tokens')"><div class="cell-stack"><span x-show="log.usage_estimated" :title="t('usage_estimated_hint')" style="color:var(--warn);margin-right:3px">≈</span><span><span x-text="fmtT((log.prompt_tokens||0)+(log.completion_tokens||0))"></span></span><span class="cell-sub" x-text="'↓ '+fmtT(log.prompt_tokens||0)+' · ↑ '+fmtT(log.completion_tokens||0)"></span></div></td><td x-show="logColsShown.cache" :data-l="t('detail.cache_hit_rate')"><span class="log-pill bdg-ok" x-show="log.cached" x-text="t('badge.cached')"></span><span class="mono txs" x-show="!log.cached" x-text="logCacheRate(log)"></span></td><td class="mono txs" x-show="logColsShown.latency" :data-l="t('latency')"><div class="cell-stack"><span x-text="fmtMs(log.latency_ms)"></span><span class="cell-sub" x-show="log.first_token_ms" x-text="'TTFT '+fmtMs(log.first_token_ms)"></span></div></td></tr></template><template x-if="!filteredLogs.length && logs.length"><tr><td colspan="9" style="text-align:center;padding:40px" class="tm" x-text="t('no_match')"></td></tr></template><template x-if="!filteredLogs.length && !logs.length"><tr><td colspan="9" style="padding:0"><div class="empty-state" style="padding:40px 16px"><div class="empty-ic" x-html="EMPTY_ICO"></div><h2 class="empty-t" x-text="t('empty_records_title')"></h2><p class="empty-d" x-text="t('empty_records_desc')"></p><button class="btn btn-p" @click="switchTab('dashboard')" x-text="t('empty_records_cta')"></button></div></td></tr></template></tbody></table></div>
      <div class="fb" style="padding:10px 16px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px"><span class="txs tm" x-text="t('total_count',filteredLogs.length)"></span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><!-- P3: 每页条数 (全局记忆) --><span class="cg" style="gap:6px"><span class="txs tm" x-text="t('rows_per_page')"></span><select class="sel" style="font-size:var(--fs-11);padding:3px 22px 3px 8px" :value="pageSize" @change="setPageSize($event.target.value)"><template x-for="n in pageSizeOptions" :key="n"><option :value="n" x-text="n"></option></template></select></span><button class="btn btn-g" :disabled="logPage===0" @click="gotoLogPage(0)" :title="t('first_page')" :aria-label="t('first_page')">«</button><button class="btn btn-g" :disabled="logPage===0" @click="gotoLogPage(logPage-1)" x-text="t('prev_page')"></button><!-- P3: 页码直达 (省略算法: 首尾 + 当前邻域).

<template x-for="(p,pi) in pageNumbers(logPage,totalLogPages)" :key="'pg'+pi"><button class="btn pg-item" :class="p===logPage?'btn-p':'pg-gap'" :disabled="p==='…'" @click="p!=='…'&&gotoLogPage(p)" :aria-current="p===logPage?'page':null" :aria-label="p==='…'?null:t('page_n',p+1)" x-text="p==='…'?'…':p+1"></button></template><button class="btn btn-g" :disabled="logPage>=totalLogPages-1" @click="gotoLogPage(logPage+1)" x-text="t('next_page')"></button><button class="btn btn-g" :disabled="logPage>=totalLogPages-1" @click="gotoLogPage(totalLogPages-1)" :title="t('last_page')" :aria-label="t('last_page')">»</button></div></div>
    </div>
  </div>
  <template x-if="selectedLog"><div class="log-modal" role="dialog" aria-modal="true" @click.self="closeLogDetail()" @keydown.escape.window="closeLogDetail()"><div class="log-modal-card"><div class="log-modal-head"><div><h2 class="pnl-ht" x-text="t('request_details')"></h2><span class="bdg" style="margin-left:8px" :class="selectedLog.status===499?'bdg-w':(selectedLog.status<400?'bdg-s':'bdg-e')" x-text="selectedLog.status"></span></div><button class="btn btn-g" @click="closeLogDetail()" :title="t('cancel')" :aria-label="t('cancel')">✕</button></div><div class="log-modal-body"><div class="log-param-strip"><!-- 参数徽章带（2026-10-24）：把这次请求的"关键参数"做成一排彩色胶囊，放在详情最上方 —— 扫读时先看到"用什么打的"，再往下看数值。形状对照 WaLiAPI 的 LogsPage.tsx:1487-1517；但只放**我们 RequestLog 真实有**的字段（实测没有 stream/temp/max，不为像而假装有）。 --><span class="lp-tag lp-blue" x-text="'model: '+(selectedLog.model||'—')"></span><template x-if="selectedLog.upstream_model && selectedLog.upstream_model!==selectedLog.model"><span class="lp-tag lp-blue" x-text="'→ ' + selectedLog.upstream_model"></span></template><template x-if="selectedLog.reasoning_effort"><span class="lp-tag lp-violet" x-text="'effort: '+selectedLog.reasoning_effort"></span></template><template x-if="selectedLog.cached"><span class="lp-tag lp-green" x-text="t('badge.cached')"></span></template><template x-if="selectedLog.usage_estimated"><span class="lp-tag lp-amber" :title="t('usage_estimated_hint')" x-text="t('tag_usage_estimated')"></span></template><template x-if="selectedLog.provider"><span class="lp-tag lp-gray" x-text="selectedLog.provider"></span></template><template x-if="logEndReason(selectedLog)"><span class="lp-tag lp-gray" x-text="logEndReason(selectedLog)"></span></template></div><div class="log-detail-grid"><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.time')"></div><div class="log-detail-val mono" x-text="fmtDateTime(selectedLog.timestamp)"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.model')"></div><div class="log-detail-val mono" x-text="selectedLog.model"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('tbl.upstream_model')"></div><div class="log-detail-val mono" x-text="selectedLog.upstream_model||'—'"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.provider')"></div><div class="log-detail-val" x-text="selectedLog.provider"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.client_name')"></div><div class="log-detail-val" x-text="selectedLog.client_name||'—'"></div></div><div class="log-detail-item"><div class="log-detail-key" :title="t('detail.trace_id_hint')" x-text="t('detail.trace_id')"></div><div class="log-detail-val mono" style="font-size:var(--fs-11);word-break:break-all" x-text="selectedLog.trace_id||'—'"></div></div><div class="log-detail-item" x-show="selectedLog.upstream_request_id"><div class="log-detail-key" :title="t('detail.upstream_rid_hint')" x-text="t('detail.upstream_rid')"></div><div class="log-detail-val mono" style="font-size:var(--fs-11);word-break:break-all" x-text="selectedLog.upstream_request_id"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.endpoint')"></div><div class="log-detail-val mono" x-text="selectedLog.endpoint"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="(selectedLog.status>=400 && !selectedLog.prompt_tokens && !selectedLog.completion_tokens)?t('detail_req_size'):t('detail_body_size')"></div><div class="log-detail-val mono" x-text="fmtB(selectedLog.body_len)"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_prompt_completion')"></div><div class="log-detail-val mono" x-text="t('detail_in_out')+' '+fmtT(selectedLog.prompt_tokens||0)+' / '+t('detail_out')+' '+fmtT(selectedLog.completion_tokens||0)"></div><div class="txs" style="color:var(--warn);margin-top:2px" x-show="selectedLog.usage_estimated" x-text="t('usage_estimated_hint')"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_latency_ttft')"></div><div class="log-detail-val mono" x-text="fmtMs(selectedLog.latency_ms)+' / '+(selectedLog.first_token_ms?fmtMs(selectedLog.first_token_ms):'—')"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.kv_cache')"></div><div class="log-detail-val mono" x-text="t('detail_hit_n',fmtT(selectedLog.prompt_cache_hit_tokens||0))+' / '+t('detail_miss_n',fmtT(selectedLog.prompt_cache_miss_tokens||0))"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.cache_hit_rate')"></div><div class="log-detail-val mono" x-text="logCacheRate(selectedLog)"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.reasoning')"></div><div class="log-detail-val" x-text="selectedLog.reasoning_effort||'—'"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.gen_speed')"></div><div class="log-detail-val mono" x-text="logGenSpeed(selectedLog)"></div></div>
        <div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_cost')"></div><div class="log-detail-val mono" :style="selectedLog.cached?'color:var(--muted)':''" x-text="selectedLog.cached?t('detail_cost_cached'):fmtMoney(selectedLog.cost||0)"></div></div>
        <div class="log-detail-item"><div class="log-detail-key" x-text="t('detail_cache_saved')"></div><div class="log-detail-val mono" style="color:var(--ok)" x-text="(selectedLog.cache_saved?fmtMoneyTiny(selectedLog.cache_saved):'—')"></div></div><div class="log-detail-item"><div class="log-detail-key" x-text="t('detail.end_reason')"></div><div class="log-detail-val" x-text="logEndReason(selectedLog)"></div></div><!-- 状态说明 (2026-10-24): 流式请求在 HTTP 头发出后才发现流内错误时,
     日志的语义状态(502)与客户端实收(200)会不一致。不写明的话用户永远对不上账。 -->
<div class="log-detail-item" style="grid-column:1/-1" x-show="statusMismatchText(selectedLog)"><div class="log-detail-key" :title="t('detail.status_mismatch_hint')" x-text="t('detail.status_mismatch_label')"></div><div class="log-detail-val txs" x-text="statusMismatchText(selectedLog)"></div></div><div class="log-detail-item" style="grid-column:1/-1"><div class="log-detail-key" x-text="t('detail.opt_saved')"></div><div class="log-detail-val" style="color:var(--ok)">
          <div class="mono" x-text="fmtT(logSavedTotal(selectedLog))+(selectedLog.opt_saved_fee?('  ≈ '+fmtMoneyTiny(selectedLog.opt_saved_fee)):'')"></div>
          <div class="txs tm" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:10px">
            <span x-text="t('saved_strip')+' '+fmtT((selectedLog.saved_breakdown||{}).strip||0)"></span>
            <span x-show="((selectedLog.saved_breakdown||{}).strip_toolcall||0)>0" x-text="t('saved_strip_tc')+' '+fmtT((selectedLog.saved_breakdown||{}).strip_toolcall||0)"></span>
            <span x-text="t('saved_trim')+' '+fmtT((selectedLog.saved_breakdown||{}).trim||0)"></span>
            <span x-text="t('saved_resp')+' '+fmtT((selectedLog.saved_breakdown||{}).resp_cache||0)"></span>
          </div>
          <!-- 省量是**本地估算** (剥离在发往上游之前) → 明确写出"别拿上游用量核对", 并给出
               真正可核对的量: 请求体字节的原始→实发差 (2026-10-16, 用户报障时拿上游对账对不上)。 -->
          <div class="txs tm" style="margin-top:4px" x-text="t('savings_local_note')"></div>
        </div></div><div class="log-detail-item" style="grid-column:1/-1"><div class="log-detail-key" :title="t('req_bytes_hint')" x-text="t('detail_req_bytes')"></div><div class="log-detail-val mono" x-text="reqBytesText(selectedLog)"></div></div><template x-if="logHasContext(selectedLog)"><div class="log-detail-item" style="grid-column:1/-1"><!-- 上下文构成（2026-10-24 新增）：WaLiAPI 在日志详情用「比例条 + 分类徽章」表达"输入花在哪"（ObservabilityCards.tsx:88-119）。我们分析页有汇总版，详情弹窗一直没有 —— 看不到单条构成。数据来自 RequestLog.context（逐条存），旧记录没有则不渲染。 --><div class="log-detail-key" x-text="t('ctx_composition')"></div><div style="margin-top:6px"><div class="ctx-bar"><template x-for="s in logContextSegs(selectedLog)" :key="'lc'+s.k"><span :style="'flex-grow:'+Math.max(s.tokens,1)+';background:'+s.color" :title="s.label+' · '+fmtT(s.tokens)+' · '+fmtPct(s.pct)"></span></template></div><div class="ctx-badges"><template x-for="s in logContextSegs(selectedLog)" :key="'lb'+s.k"><span class="ctx-badge" :style="'color:'+s.color"><i :style="'background:'+s.color"></i><span x-text="s.label"></span><span style="opacity:.7" x-show="s.items" x-text="'×'+s.items"></span><span class="mono" x-text="'· ≈'+fmtT(s.tokens)"></span><span style="opacity:.6" x-text="'· '+fmtPct(s.pct)"></span></span></template></div><div class="txs" style="margin-top:6px;color:var(--warn)" x-show="selectedLog.context&&selectedLog.context.has_images" x-text="t('ctx_has_images')"></div></div></div></template><template x-if="selectedLog.error"><div class="log-detail-item" style="grid-column:1/-1"><div class="log-detail-key" x-text="t('detail.error')"></div><div class="log-detail-val" :style="'color:'+(selectedLog.status===499?'var(--warn-fg)':'var(--err)')" x-text="selectedLog.error"></div></div></template>
        <!-- ── 时间去哪了 (方案 F, 2026-10-13) ──
             四段耗时拆分: 等首字 / 思考 / 正文 / 生成工具调用。
             ⚠️ 未采集显示 "—" 而不是 0ms (非流式/缓存回放/原生直通拿不到这些时刻) ——
             与项目一贯口径一致: 无数据不得伪装成测得为 0。 -->
        <!-- 上游尝试明细 (2026-10-21): 只有真的重试过才画; 一次成功/缓存回放用一行说明.
             为什么值得单列: 此前重试只写在 aigate.log 里, 面板永远只显示最终那次结果,
             "1 次 500ms 失败 + 1 次 7.5s 成功" 与 "单次 8s" 在界面上完全同形. -->
        <div class="log-detail-item" style="grid-column:1/-1" x-show="hasAttemptRetry(selectedLog)">
          <div class="log-detail-key" x-text="t('attempts_title')"></div>
          <div class="log-detail-val">
            <template x-for="a in (selectedLog.attempts||[])" :key="a.seq">
              <div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:var(--fs-11)">
                <span class="mono" style="color:var(--muted);flex:0 0 22px" x-text="'#'+a.seq"></span>
                <span style="width:7px;height:7px;border-radius:var(--rs);flex:0 0 7px"
                      :style="'background:'+attemptColor(a)"></span>
                <span :style="'color:'+attemptColor(a)" x-text="attemptOutcomeText(a)"></span>
                <span class="mono" style="color:var(--muted)" x-show="a.status!=null" x-text="a.status"></span>
                <span class="mono" style="margin-left:auto" x-text="msText(a.ms)"></span>
                <span class="txs tm" style="max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                      :title="a.error||''" x-text="a.error||''"></span>
              </div>
            </template>
          </div>
        </div>
        <div class="log-detail-item" style="grid-column:1/-1"
             x-show="!hasAttemptRetry(selectedLog) && attemptsNote(selectedLog)">
          <div class="log-detail-key" x-text="t('attempts_title')"></div>
          <div class="log-detail-val txs tm" x-text="attemptsNote(selectedLog)"></div>
        </div>
        <div class="log-detail-item" style="grid-column:1/-1" x-show="hasStageData(selectedLog)"><div class="log-detail-key" x-text="t('stages_title')"></div><div class="log-detail-val">
          <div class="prop-bar" x-html="stageBarHtml(selectedLog)"></div>
          <div class="txs tm" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:10px" x-html="stageLegendHtml(selectedLog)"></div>
          <div class="txs tm" style="margin-top:4px;color:var(--muted)" x-text="t('stages_note')"></div>
        </div></div>
        <!-- ── 网关去程瀑布 (2026-10-15) ──
             五段互不重叠, 顺序铺满「进门 → 上游响应头」: 路由/鉴权 → 护栏 → 协议转换 →
             其他网关工作 → 上游首字节。与上方的模型侧四段**视角不同**, 不可相加 (见 gw_note)。 -->
        <div class="log-detail-item" style="grid-column:1/-1" x-show="hasGatewayData(selectedLog)"><div class="log-detail-key" x-text="t('gw_title')"></div><div class="log-detail-val">
          <div class="prop-bar" x-html="gwBarHtml(selectedLog)"></div>
          <div class="txs tm" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:10px" x-html="gwLegendHtml(selectedLog)"></div>
          <div class="txs tm" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:10px">
            <span x-show="gwOverheadShareText(selectedLog)" style="color:var(--muted)" x-text="gwOverheadShareText(selectedLog)"></span>
            <span style="color:var(--muted)" x-text="t('gw_note')"></span>
          </div>
          <div class="txs tm" style="margin-top:4px;color:var(--muted)" x-text="t('gw_direct_note')"></div>
        </div></div></div></div></div></div></template>
</div>
