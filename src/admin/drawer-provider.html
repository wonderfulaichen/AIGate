<template x-if="drawerProv">
<div @keydown.escape.window="drawerProv&&closeProviderDrawer()">
  <div class="dr-bk" @click="closeProviderDrawer()"></div>
  <div class="dr" role="dialog" aria-modal="true">
    <div class="dr-card">
      <!-- Header: 图标方块 + 可编辑名称 + 徽章组 (对照 cc-switch 面板头部) -->
      <div class="dr-h">
        <span class="ibox" x-html="providerLogo(drawerProv.name)" aria-hidden="true" style="background:var(--fill-3)"></span>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;min-width:0">
          <input type="text" class="inp" style="font-size:var(--fs-18);font-weight:700;color:var(--fg);width:auto;min-width:80px;border:none;background:transparent;box-shadow:none;padding:0" x-model="drawerProv.name" @input="markDirty()" :aria-label="t('provider_name')">
          <span class="bdg bdg-p" x-text="(drawerProv.models||[]).length+' '+t('unit_models')"></span>
          <span class="bdg" :class="drawerSecCount(drawerProv)>=3?'bdg-s':'bdg-w'" :title="t('dr_sec_hint')" x-text="t('dr_sec_progress',drawerSecCount(drawerProv))"></span>
          <template x-if="healthOf(drawerProv.name)==='ok'"><span class="bdg bdg-s">● <span x-text="t('health_ok')"></span></span></template>
          <template x-if="healthOf(drawerProv.name)==='err'"><span class="bdg bdg-e">● <span x-text="t('health_err')"></span></span></template>
          <template x-if="healthOf(drawerProv.name)==='na'"><span class="bdg bdg-n">○ <span x-text="t('health_na')"></span></span></template>
          <!-- 「已修改 / 恢复默认」（2026-10-24 接上）。
               ⚠️ 又是一处死代码：presetDirty()/presetReset() 与两条 i18n 文案
               早就写好（ds-provsave.js:284-298、i18n.js:371/379），
               但 HTML 里对它们**零引用**。用户把内置预设改乱后没有任何提示，
               也不知道能一键退回模板默认值。 -->
          <template x-if="drawerProv.preset && presetDirty(drawerProv)">
            <span class="bdg bdg-w" :title="t('preset_modified_hint')" x-text="t('preset_modified')"></span>
          </template>
          <template x-if="drawerProv.preset && presetDirty(drawerProv)">
            <button class="btn btn-g" style="font-size:var(--fs-11);padding:2px 8px"
                    @click.stop="presetReset(drawerProv)"
                    :title="t('preset_modified_hint')"
                    x-text="t('preset_reset')"></button>
          </template>
        </div>
        <button class="btn btn-g icon-btn" @click="closeProviderDrawer()" :title="t('close_label')" :aria-label="t('close_label')">✕</button>
      </div>

      <div class="dr-body">
        <!-- 分节导航: 每节状态 (绿=就绪/黄=待完善), 点击滚动到对应分区 -->
        <div class="dr-secnav">
          <template x-for="s in [{k:'basic',label:t('dr_sec_basic')},{k:'key',label:t('dr_sec_key')},{k:'headers',label:t('custom_headers_label')},{k:'models',label:t('unit_models')}]" :key="s.k">
            <button type="button" class="dr-secchip" :class="{'done':drawerSecDone(s.k,drawerProv)}" :title="drawerSecDone(s.k,drawerProv)?t('onboard_step_done'):t('dr_sec_todo')" @click="scrollDrawerSec(s.k)"><span class="dr-secdot"></span><span x-text="s.label"></span></button>
          </template>
        </div>
        <!-- Section: Endpoints -->
        <div class="sec" id="drsec-basic">
          <div class="sec-hdr">
            <div class="sec-ic blue">🔗</div>
            <div style="flex:1"><div class="sec-title" x-text="t('addprov.endpoint')"></div><div class="sec-sub" x-text="t('endpoint_protocol_desc')"></div></div>
            <button class="btn btn-g" style="font-size:var(--fs-11);white-space:nowrap" :disabled="drawerProv._testing" @click="testProvider(providersFormData.indexOf(drawerProv))">
              <template x-if="!drawerProv._testing"><span>⚡ <span x-text="t('test_connection')"></span></span></template>
              <template x-if="drawerProv._testing"><span class="spin" style="margin-right:6px"></span><span x-text="t('testing')"></span></template>
            </button>
            <!-- 「测试并恢复」: 仅熔断已断开时出现。测试本身不碰熔断(隔离),
                 这个按钮是**人看到证据后**显式决定关熔断 —— 不是自动行为。 -->
            <button x-show="healthOf(drawerProv.name)==='err'" class="btn btn-p" style="font-size:var(--fs-11);white-space:nowrap" :disabled="drawerProv._testing" :title="t('test_recover_hint')" @click="testProvider(providersFormData.indexOf(drawerProv), true)">
              <span x-text="t('test_recover')"></span>
            </button>
          </div>
          <div class="sec-body">
            <!-- Test result -->
            <template x-if="drawerProv._testResult">
            <div style="margin-bottom:12px">
              <div :style="'padding:8px 12px;border-radius:var(--rm);font-size:var(--fs-12);display:flex;align-items:center;gap:8px;'+(drawerProv._testResult.success?'background:var(--ok-bg-soft);color:var(--ok);border:1px solid var(--ok-bd-soft)':'background:var(--err-bg-soft);color:var(--err);border:1px solid var(--err-bd-soft)')">
                <span x-text="drawerProv._testResult.success?'✓':'✗'"></span>
                <!-- 环节标签在前: 用户要求"报错要能看出哪个环节" -->
                <span x-show="testStage(drawerProv._testResult)" style="flex:none;font-weight:600;opacity:.95" x-text="testStage(drawerProv._testResult)"></span>
                <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" :title="drawerProv._testResult.success?'':t('err_view_full')" @click="!drawerProv._testResult.success&&(drawerProv._errOpen=!drawerProv._errOpen)" x-text="drawerProv._testResult.success?drawerProv._testResult.status:testErrFirst(drawerProv._testResult.status)"></span>
                <span style="flex:none;opacity:.7" x-text="drawerProv._testResult.latency_ms+'ms'"></span>
              </div>
              <!-- 未用真实密钥校验时如实标注 (不传 name 的老路径 = 只探连通性) -->
              <div x-show="drawerProv._testResult.key_checked===false" class="txs tm" style="margin-top:4px" x-text="t('test_key_unchecked')"></div>
              <!-- 这次测的是哪个密钥 (草稿/已保存/未使用): 面板密钥改完即存、其余字段停在草稿,
                   不显示这一行, 用户就无法判断"测的"与"我改的"是否同一份 ——
                   那正是"测试通过、保存后却报错"的困惑来源。 -->
              <div x-show="testKeySourceText(drawerProv._testResult)" class="txs tm" style="margin-top:4px" x-text="testKeySourceText(drawerProv._testResult)"></div>
              <template x-if="!drawerProv._testResult.success && drawerProv._errOpen">
                <div style="margin-top:6px;padding:8px 12px;border-radius:var(--rm);background:var(--err-bg-soft);border:1px solid var(--err-bd-soft);font-size:var(--fs-11);color:var(--err-fg);white-space:pre-wrap;word-break:break-all">
                  <div x-text="drawerProv._testResult.status"></div>
                  <button class="btn btn-g" style="font-size:var(--fs-10);padding:2px 6px;margin-top:6px" @click="copyTestErr(drawerProv)" x-text="copiedField==='terr'?t('copied'):t('copy')"></button>
                </div>
              </template>
            </div>
            </template>
            <div class="f-grid">
              <div class="f-row"><label x-text="t('addprov.endpoint')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.endpoint" @input="markDirty()" placeholder="https://api.example.com"></div>
            </div>
            <!-- 实际会打到哪个地址（2026-10-24 新增）。
                 为什么值得做：90% 的渠道配错是 Base URL 多写/少写 `/v1`，
                 而填完看不到最终地址、只能靠试。这里把**实际会用的**列出来。
                 只显示已填的协议 —— 没填的不渲染，避免"未配置"占位噪音。 -->
            <template x-if="provEndpointPreview(drawerProv).length">
              <div style="margin-top:8px;padding:8px 10px;border-radius:var(--rm);background:var(--fill-2);border:1px solid var(--border)">
                <div class="txs tm" style="margin-bottom:4px" x-text="t('endpoint_preview_label')"></div>
                <template x-for="e in provEndpointPreview(drawerProv)" :key="'ep'+e.k">
                  <div style="display:flex;gap:8px;align-items:baseline;margin-top:2px">
                    <span class="txs tm" style="flex:none;min-width:60px" x-text="t(e.k)"></span>
                    <span class="mono" style="font-size:var(--fs-11);color:var(--fg);word-break:break-all" x-text="e.v"></span>
                  </div>
                </template>
              </div>
            </template>
            <!-- 高级端点: 多协议覆盖 + 余额查询 (折叠, 偏好存 localStorage) -->
            <button type="button" class="btn btn-g" style="font-size:var(--fs-11);margin-top:10px" @click="toggleDrawerAdv()"><span x-text="t('dr_adv')"></span> <span x-text="drawerAdvOpen?'⌃':'⌄'"></span></button>
            <div x-show="drawerAdvOpen" style="margin-top:10px">
              <div class="f-grid">
                <div class="f-row"><label x-text="t('anthropic_endpoint_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.endpoint_anthropic" :placeholder="t('anthropic_endpoint_ph')" @input="markDirty()"></div>
                <div class="f-row"><label x-text="t('responses_endpoint_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.endpoint_responses" :placeholder="t('responses_endpoint_ph')" @input="markDirty()"></div>
                <div class="f-row"><label x-text="t('balance_endpoint_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.balance_endpoint" :placeholder="t('balance_endpoint_ph')" @input="markDirty()"></div>
                <!-- 鉴权头: 非标准鉴权 (x-api-key / api-key 等) 的供应商在这里声明,
                     不必再把密钥硬编码进 headers 静态表. 留空 = Authorization: Bearer. -->
                <div class="f-row"><label x-text="t('auth_header_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv._authHeader" :placeholder="t('auth_header_ph')" @input="setAuthHeader(drawerProv._authHeader);markDirty()"></div>
                <div class="f-row"><label x-text="t('auth_prefix_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv._authPrefix" :placeholder="t('auth_prefix_ph')" @input="setAuthPrefix(drawerProv._authPrefix);markDirty()"></div>
                <div class="txs tm" style="grid-column:1/-1;margin-top:-2px" x-text="t('auth_header_hint')"></div>
              </div>

              <!-- 自定义上游请求头已搬出折叠区，见 #drsec-headers 分区。 -->

              <!-- ── 上游协议适配开关（2026-10-24 补界面入口）──
                   这 3 个字段后端早已实现（providers.rs:481 / 510 / 519），但抽屉里
                   **完全没有输入项 —— 只在保存逻辑里存在（ds-provsave.js:170-179）。
                   用户要改只能手改 providers.json。上游报 400/413 时这恰恰是排障要用的开关。 -->
              <div class="adv-switches">
                <div class="adv-sw">
                  <div class="adv-sw-tx"><div class="adv-sw-t" x-text="t('rsf_label')"></div><div class="adv-sw-d" x-text="t('rsf_desc')"></div></div>
                  <button type="button" class="tgl" role="switch" :aria-checked="(!!drawerProv.require_system_first)?'true':'false'" :aria-label="t('rsf_label')" :class="drawerProv.require_system_first?'on':'off'" @click="setProvFlag('require_system_first',!drawerProv.require_system_first)"></button>
                </div>
                <div class="adv-sw">
                  <div class="adv-sw-tx"><div class="adv-sw-t" x-text="t('pc_label')"></div><div class="adv-sw-d" x-text="t('pc_desc')"></div></div>
                  <button type="button" class="tgl" role="switch" :aria-checked="(drawerProv.prompt_cache!==false)?'true':'false'" :aria-label="t('pc_label')" :class="drawerProv.prompt_cache!==false?'on':'off'" @click="setProvFlag('prompt_cache',drawerProv.prompt_cache===false?'__unset__':false)"></button>
                </div>
                <div class="adv-sw">
                  <div class="adv-sw-tx"><div class="adv-sw-t" x-text="t('occ_label')"></div><div class="adv-sw-d" x-text="t('occ_desc')"></div></div>
                  <button type="button" class="tgl" role="switch" :aria-checked="(!!drawerProv.openai_cache_control)?'true':'false'" :aria-label="t('occ_label')" :class="drawerProv.openai_cache_control?'on':'off'" @click="setProvFlag('openai_cache_control',!drawerProv.openai_cache_control)"></button>
                </div>
              </div>

              <!-- ── 协议覆盖 + 请求体上限（同样补入口）── -->
              <div class="f-grid" style="margin-top:6px">
                <div class="f-row"><label x-text="t('api_format_label')"></label>
                  <select class="sel" style="width:100%" x-model="drawerProv.api_format" :aria-label="t('api_format_label')" @change="markDirty()">
                    <option value="" x-text="t('fmt.auto')"></option>
                    <option value="openai" x-text="t('fmt.openai')"></option>
                    <option value="anthropic" x-text="t('fmt.anthropic')"></option>
                    <option value="responses" x-text="t('fmt.responses')"></option>
                  </select>
                </div>
                <div class="f-row"><label x-text="t('max_body_label')"></label><input type="number" min="0" step="1024" class="inp mono" style="width:100%" x-model.number="drawerProv.max_request_body_bytes" :placeholder="t('max_body_ph')" :aria-label="t('max_body_label')" @input="markDirty()"></div>
                <div class="txs tm" style="grid-column:1/-1;margin-top:-2px" x-text="t('max_body_hint')"></div>
              </div>

            </div>
          </div>
        </div>

        <!-- Section: API Key -->
        <div class="sec" id="drsec-key">
          <div class="sec-hdr">
            <div class="sec-ic green">🔑</div>
            <div><div class="sec-title" x-text="t('apikey_mgmt')"></div><div class="sec-sub" x-text="t('key_save_hint')"></div></div>
          </div>
          <div class="sec-body">
              <div style="border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--fill-1)">
            <!-- 「前往获取 API Key」横条（2026-10-24，对照参考项目 ChannelForm:1088-1107）。
                 为什么需要：免费层供应商（Groq/Mistral/硅基流动…）用户常常不知道去哪注册领 key。
                 参考项目把它做成 Key 输入框**正上方**的一条横条，一次点击直达。
                 只在预设声明了 key_signup_url 时出现（不猜地址）。 -->
            <template x-if="presetOf(drawerProv) && presetOf(drawerProv).key_signup_url">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;
                          border-radius:var(--rm);background:var(--fill-2);border:1px solid var(--border)">
                <span class="txs tm" style="flex:1;min-width:0" x-text="t('get_api_key_hint')"></span>
                <a class="btn btn-g" style="font-size:var(--fs-11);padding:3px 9px;white-space:nowrap;text-decoration:none"
                   :href="presetOf(drawerProv).key_signup_url" target="_blank" rel="noopener noreferrer"
                   x-text="t('get_api_key')"></a>
              </div>
            </template>
            <div class="key-status-row" x-text="keyStatusText(drawerProv.name)"></div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="password" class="inp" style="flex:1" :placeholder="t('key_placeholder')" x-model="drawerProv._keyDraft" @keydown.enter="!isImeComposing($event)&&saveDrawerKey()">
              <!-- ⚠️ 这两个「保存」语义不同, 必须从**按钮文字**就能分辨 (2026-10-12 审计):
                   这里是**立即生效**（直接 PUT /admin/api/keys, 不经过表单保存链）;
                   而底部那个「保存配置」走表单链、要等落盘。原实现两个都叫「保存」,
                   用户无法从命名推断哪个立刻生效。现按语义改名。 -->
              <button class="btn btn-p" style="white-space:nowrap" :disabled="!((drawerProv._keyDraft||'').trim() || drawerProv._clearRequested)" @click="saveDrawerKey()" :title="t('key_save_hint')" x-text="drawerProv._keySaving?t('saving'):t('save_key_now')"></button>
              <!-- 清除 = 可撤销的草稿态（2026-10-24）。改造前点它**立即 PUT 空值**，
                   后端当场删掉 Key，无确认、无撤销 —— 而 Key 是最不可再生的一项数据。
                   现在只置草稿标记，真正删除发生在「保存密钥」时；期间给「撤销」。 -->
              <template x-if="!drawerProv._clearRequested">
                <button class="btn btn-g" style="color:var(--err);white-space:nowrap" @click="requestClearKey(providersFormData.indexOf(drawerProv))" x-text="t('clear')"></button>
              </template>
              <template x-if="drawerProv._clearRequested">
                <button class="btn btn-g" style="white-space:nowrap" @click="undoClearKey(providersFormData.indexOf(drawerProv))" x-text="t('undo_clear_key')"></button>
              </template>
            </div>
            <!-- 草稿态必须显式说出来：否则用户以为已经删了，或反过来以为没生效 -->
            <template x-if="drawerProv._clearRequested">
              <div class="txs" style="margin-top:8px;color:var(--warn)" x-text="t('key_clear_pending')"></div>
            </template>
            <template x-if="drawerProv._keyMsg"><div :style="'margin-top:8px;font-size:var(--fs-12);padding:6px 10px;border-radius:var(--rm);'+(drawerProv._keyOk?'background:var(--ok-bg-soft);color:var(--ok)':'background:var(--err-bg-soft);color:var(--err)')" x-text="drawerProv._keyMsg"></div></template>
          </div>

            <!-- ── opencode Console 凭据（2026-10-24 从「高级设置」搬到这里）──
                 为什么搬出来：它产出的是**凭据**，与 API Key 同层才符合心智；
                 而原来藏在「编辑 → 高级设置 → 折叠」四层深处，且折叠状态被
                 localStorage 记住 → **新用户必然看不到**。
                 参考项目（WALiAPI）把「拿凭据」做成一级动作：登录是页面级 Tab +
                 一级按钮，渠道编辑表单里**根本没有登录**。
                 详见 HANDOFF ㉚ 的对照结论。 -->
            <!-- ── opencode Console 凭据（2026-10-24 从「高级设置」搬到这里）──
                 为什么搬出来：它产出的是**凭据**，与 API Key 同层才符合心智；
                 而原来藏在「编辑 → 高级设置 → 折叠」四层深处，且折叠状态被
                 localStorage 记住 → **新用户必然看不到**。
                 参考项目 QuotaHub 也是手贴 Cookie，但它把入口做成独立一级页面、
                 用大 Textarea、并且**保存后立刻验证**。这里照它的做法。 -->
            <template x-if="provMayHaveQuota(drawerProv)">
              <div style="margin-top:10px;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;background:var(--fill-1)">
                <div class="row-t" style="margin-bottom:2px" x-text="t('console_cred_label')"></div>
                <div class="txs tm" style="margin-bottom:8px" x-text="t('console_cred_hint')"></div>

                <!-- ── 一键登录（2026-10-24）──
                     为什么有它：手动粘贴 Cookie 要么得开 DevTools 翻 HttpOnly
                     Cookie（普通用户不会），要么得手抄地址栏里的 wrk_ 组织 ID。
                     弹窗登录把这两步都省掉：用户在 WebView 里完成 Google/GitHub
                     授权，后端从 CookieManager 直接取 __Host-console_session
                     （HttpOnly，JS 读不到）+ 从跳转 URL 提 wrk_。
                     失败时分两种：窗口没弹出来（如精简版 Windows 缺 WebView2
                     运行时）→ 文案提示改用手动粘贴；授权没完成 → 可重试。 -->
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
                  <button type="button" class="btn btn-p"
                          :disabled="ocLoginBusy"
                          @click.stop="ocLoginStart(drawerProv)"
                          x-text="ocLoginBusy?t('oc_login_in_progress'):t('oc_login_btn')"></button>
                  <span class="txs" x-show="ocLoginMsg"
                        :style="'color:'+(ocLoginOk?'var(--ok)':'var(--err)')"
                        x-text="ocLoginMsg"></span>
                </div>
                <div class="txs tm" style="margin:0 0 8px"
                     x-text="t('oc_login_manual')"></div>

                <!-- Cookie 用 Textarea：粘贴的串很长（st_... 几十字符 + 可能带 auth=），
                     单行输入框会截断视觉，用户容易以为没贴全（QuotaHub 也用 Textarea）。 -->
                <div class="f-row">
                  <label x-text="t('console_cookie_label')"></label>
                  <textarea class="inp mono" rows="2" style="width:100%;resize:vertical"
                            x-model="drawerProv.console_session"
                            :placeholder="t('console_cookie_ph')"
                            :aria-label="t('console_cookie_label')"
                            @input="markDirty()" autocomplete="off"></textarea>
                </div>
                <div class="f-row" style="margin-top:6px">
                  <label x-text="t('console_org_label')"></label>
                  <div style="display:flex;gap:6px;align-items:center">
                    <input type="text" class="inp mono" style="flex:1"
                           x-model="drawerProv.console_org_id"
                           :placeholder="t('console_org_ph')"
                           :aria-label="t('console_org_label')"
                           @input="markDirty()" autocomplete="off">
                    <!-- 组织 ID 能从 Cookie 自动查到（/console/api/orgs），
                         省掉用户去地址栏抠 wrk_ 的一步 -->
                    <button type="button" class="btn btn-g" style="white-space:nowrap;font-size:var(--fs-11)"
                            :disabled="ocFetchOrgBusy"
                            @click.stop="ocFetchOrgId(drawerProv)"
                            x-text="ocFetchOrgBusy?t('saving'):t('oc_fetch_org')"></button>
                  </div>
                </div>

                <!-- 保存后立即验证：粘完就能知道成不成，不用自己猜 -->
                <div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
                  <button type="button" class="btn btn-p"
                          :disabled="ocVerifyBusy"
                          @click.stop="ocVerifyCred(drawerProv)"
                          x-text="ocVerifyBusy?t('saving'):t('oc_verify_btn')"></button>
                  <span class="txs" x-show="ocVerifyMsg"
                        :style="'color:'+(ocVerifyOk?'var(--ok)':'var(--err)')"
                        x-text="ocVerifyMsg"></span>
                </div>
                <div class="txs tm" style="margin-top:6px"
                     x-show="drawerProv.console_session || drawerProv.console_org_id">
                  <span x-text="t('oc_login_configured')"></span>
                  <span class="mono" x-text="drawerProv.console_org_id || '—'"></span>
                  <button type="button" class="btn btn-g" style="font-size:var(--fs-11);padding:2px 8px;margin-left:6px"
                          @click.stop="drawerProv.console_session=''; drawerProv.console_org_id=''; markDirty()"
                          x-text="t('oc_login_clear')"></button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Section: Headers -->
        <div class="sec" id="drsec-headers">
          <div class="sec-hdr">
            <div class="sec-ic violet">🧩</div>
            <div style="flex:1"><div class="sec-title" x-text="t('custom_headers_label')"></div><div class="sec-sub" x-text="t('custom_headers_hint')"></div></div>
            <button type="button" class="btn btn-g" style="font-size:var(--fs-11)" @click.stop="addProvHeader()" x-text="'+ '+t('add')"></button>
          </div>
          <div class="sec-body">
            <!-- ── 自定义上游请求头（2026-10-24 从「高级设置」折叠区搬到这里）──
                 为什么搬出来：
                 ① 改造前后端早就存了 `headers`（ds-provsave.js 白名单里有），
                    但**没有任何 UI** —— 用户要改只能手写 providers.json；
                 ② 它产出的是**凭据/协议适配信息**，与 API Key 同层才符合心智；
                    原来藏在「端点 → 高级设置 → 折叠」三层深处，且折叠状态被
                    localStorage 记住 → **新用户必然看不到**。
                 行式列表：name / value（password）/ 删除，与参考项目同构。
                 value 用 password：这些头里常放第二个 key（如 x-api-key）。 -->
            <div style="display:flex;flex-direction:column;gap:6px">
              <template x-for="(h, hi) in provHeaderRows()" :key="'hdr'+hi">
                <div style="display:flex;gap:6px;align-items:center">
                  <input type="text" class="inp mono" style="flex:0 0 34%;font-size:var(--fs-11)"
                         :value="h.name" :placeholder="t('header_name_ph')"
                         :aria-label="t('header_name_ph')"
                         @input="setProvHeader(hi, $event.target.value, null)">
                  <input type="password" class="inp mono" style="flex:1;font-size:var(--fs-11)"
                         :value="h.value" :placeholder="t('header_value_ph')"
                         :aria-label="t('header_value_ph')"
                         @input="setProvHeader(hi, null, $event.target.value)">
                  <button type="button" class="prov-ib" :title="t('delete')" :aria-label="t('delete')"
                          @click.stop="removeProvHeader(hi)">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                  </button>
                </div>
              </template>
              <div class="txs tm" x-show="provHeaderRows().length===0" x-text="t('custom_headers_empty')"></div>
            </div>
          </div>
        </div>

        <!-- Section: Models -->
        <div class="sec" id="drsec-models">
          <div class="sec-hdr">
            <div class="sec-ic amber">📦</div>
            <div style="flex:1"><div class="sec-title" x-text="t('unit_models')"></div><div class="sec-sub" x-text="t('model_routing_config')"></div></div>
            <span class="bdg bdg-p" style="font-size:var(--fs-11)" x-text="filteredModelCount()+' / '+(drawerProv.models||[]).length"></span>
          </div>
          <div class="sec-body">
            <div class="m-card">
              <!-- Search + actions header -->
              <div class="m-card-hdr">
                <input type="text" class="inp" style="flex:1;max-width:320px;font-size:var(--fs-12)" x-model="drawerProv._filter" :placeholder="t('search_models')">
                <div style="display:flex;gap:6px;align-items:center">
                  <button class="btn btn-g" style="font-size:var(--fs-11)" @click="toggleAll(drawerProv,true)" x-text="t('select_all')"></button>
                  <button class="btn btn-g" style="font-size:var(--fs-11)" @click="toggleAll(drawerProv,false)" x-text="t('deselect_all')"></button>
                  <button class="btn btn-g" style="font-size:var(--fs-11);color:var(--err)" @click="deleteSelectedModels()" x-text="t('delete_selected')"></button>
                  <button class="btn btn-g" style="font-size:var(--fs-11)" :disabled="!priceClipboardSet||selectedIndexes(drawerProv).length===0" :title="t('price_apply_selected_hint')" @click="applyPriceToSelected(providersFormData.indexOf(drawerProv))" x-text="t('price_apply_selected',selectedIndexes(drawerProv).length)"></button>
                  <!-- 批量改档位/协议/免费（2026-10-24 接线）。
                       这三个方法（applyBulkEffort / applyBulkFmt / applyBulkFree）**早就写好了，
                       但一直没有 HTML 调用点** —— 属死代码。
                       痛点：拉取 40 个模型后要逐个点思考档，是这段活里最枯燥的一次点击乘 40。
                       一个人对某个供应商通常只用一个档位，批量几乎是刚需。 -->
                  <span class="cg" style="gap:4px;padding:4px 8px" x-show="selectedCount(drawerProv)>0">
                    <span class="txs tm" x-text="t('bulk_selected_n',selectedCount(drawerProv))"></span>
                    <select class="sel" style="font-size:var(--fs-11);padding:2px 20px 2px 6px" x-model="drawerProv._bulkEffort" :aria-label="t('bulk_set_effort')">
                      <option value="" x-text="t('bulk_set_effort')"></option>
                      <option value="low" x-text="t('eff.low')"></option>
                      <option value="medium" x-text="t('eff.medium')"></option>
                      <option value="high" x-text="t('eff.high')"></option>
                      <option value="max" x-text="t('eff.max')"></option>
                    </select>
                    <button class="btn btn-g" style="font-size:var(--fs-10);padding:3px 7px" :disabled="!drawerProv._bulkEffort" @click="applyBulkEffort(providersFormData.indexOf(drawerProv));drawerProv._bulkEffort=''" x-text="t('apply')"></button>
                    <select class="sel" style="font-size:var(--fs-11);padding:2px 20px 2px 6px" x-model="drawerProv._bulkFmt" :aria-label="t('bulk_set_fmt')">
                      <option value="" x-text="t('bulk_set_fmt')"></option>
                      <option value="openai" x-text="'OpenAI'"></option>
                      <option value="anthropic" x-text="'Anthropic'"></option>
                      <option value="responses" x-text="'Responses'"></option>
                    </select>
                    <button class="btn btn-g" style="font-size:var(--fs-10);padding:3px 7px" :disabled="!drawerProv._bulkFmt" @click="applyBulkFmt(providersFormData.indexOf(drawerProv));drawerProv._bulkFmt=''" x-text="t('apply')"></button>
                    <button class="btn btn-g" style="font-size:var(--fs-10);padding:3px 7px" @click="applyBulkFree(providersFormData.indexOf(drawerProv),true)" x-text="t('bulk_mark_free')"></button>
                  </span>
                  <button class="btn btn-p" style="font-size:var(--fs-11)" @click="addModel(providersFormData.indexOf(drawerProv))" x-text="t('add_model')"></button>
                </div>
                <!-- 「空模型 = 接受所有模型」这条业务语义不写出来没人猜得到 ——
                     用户会以为是"全禁"还是"没配好"。参考项目专门写了这一行。 -->
                <div class="txs tm" style="margin-top:6px" x-show="(drawerProv.models||[]).length===0"
                     x-text="t('empty_models_wildcard')"></div>
              </div>
              <!-- 实测支持的协议 (由「拉取模型」时探测得到, 供应商级): 后端据此**自动**按客户端
                   入口协议路由 —— 客户端打哪个入口就用哪个, 这里无需任何勾选, 此栏只是把
                   上游能力亮出来便于核对。未探测过则不显示 (不臆造)。 -->
              <div class="m-card-bar" x-show="(drawerProv.probed_protocols||[]).length" style="border-top:1px solid var(--border)">
                <span class="txs tm" :title="t('prov_proto_probed_hint')" x-text="t('prov_proto_probed_short')"></span>
                <template x-for="fmt in (drawerProv.probed_protocols||[])" :key="'drp'+fmt">
                  <span class="bdg bdg-p" :title="t('prov_proto_probed_hint')" x-text="fmt"></span>
                </template>
                <span style="margin-left:auto"></span>
                <span class="txs tm" x-text="t('prov_proto_auto_hint')"></span>
              </div>
              <!-- Brand filter chips -->
              <div class="m-card-bar">
                <span class="txs tm" style="margin-right:4px" x-text="t('brand')"></span>
                <button type="button" class="m-chip" :class="{'on':!drawerProv._brandFilter}" @click="drawerProv._brandFilter=''" x-text="t('plaza_all')" :aria-pressed="(!drawerProv._brandFilter)?'true':'false'"></button>
                <template x-for="b in drawerBrands()" :key="b.label">
                  <button type="button" class="m-chip" :class="{'on':drawerProv._brandFilter===b.label}" @click="drawerProv._brandFilter=b.label" :aria-pressed="(drawerProv._brandFilter===b.label)?'true':'false'">
                    <span :style="'width:6px;height:6px;border-radius:50%;background:'+b.color"></span>
                    <span x-text="b.label"></span>
                  </button>
                </template>
                <span style="margin-left:auto"></span>
                <span class="txs tm" style="margin-right:4px" x-text="t('thinking_short')"></span>
                <button type="button" class="m-chip" :class="{'on':!drawerProv._effFilter}" @click="drawerProv._effFilter=''" x-text="t('plaza_all')" :aria-pressed="(!drawerProv._effFilter)?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._effFilter==='low'}" @click="drawerProv._effFilter='low'" x-text="t('eff.low')" :aria-pressed="(drawerProv._effFilter==='low')?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._effFilter==='medium'}" @click="drawerProv._effFilter='medium'" x-text="t('eff.medium')" :aria-pressed="(drawerProv._effFilter==='medium')?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._effFilter==='high'}" @click="drawerProv._effFilter='high'" x-text="t('eff.high')" :aria-pressed="(drawerProv._effFilter==='high')?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._effFilter==='max'}" @click="drawerProv._effFilter='max'" x-text="t('eff.max')" :aria-pressed="(drawerProv._effFilter==='max')?'true':'false'"></button>
              </div>
              <!-- Price/Status/Origin filter chips -->
              <div class="m-card-bar" style="border-top:1px solid var(--fill-3)">
                <span class="txs tm" style="margin-right:4px" x-text="t('price')"></span>
                <button type="button" class="m-chip" :class="{'on':!drawerProv._freeFilter}" @click="drawerProv._freeFilter=''" x-text="t('plaza_all')" :aria-pressed="(!drawerProv._freeFilter)?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._freeFilter==='free'}" @click="drawerProv._freeFilter='free'" x-text="t('badge.free')" :aria-pressed="(drawerProv._freeFilter==='free')?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._freeFilter==='paid'}" @click="drawerProv._freeFilter='paid'" x-text="t('paid')" :aria-pressed="(drawerProv._freeFilter==='paid')?'true':'false'"></button>
                <span style="margin-left:auto"></span>
                <span class="txs tm" style="margin-right:4px" x-text="t('status_lc')"></span>
                <button type="button" class="m-chip" :class="{'on':!drawerProv._removedFilter}" @click="drawerProv._removedFilter=''" x-text="t('plaza_all')" :aria-pressed="(!drawerProv._removedFilter)?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._removedFilter==='active'}" @click="drawerProv._removedFilter='active'" x-text="t('status_active')" :aria-pressed="(drawerProv._removedFilter==='active')?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._removedFilter==='removed'}" @click="drawerProv._removedFilter='removed'" x-text="t('status_removed')" :aria-pressed="(drawerProv._removedFilter==='removed')?'true':'false'"></button>
                <span style="margin-left:auto"></span>
                <span class="txs tm" style="margin-right:4px" x-text="t('origin')"></span>
                <button type="button" class="m-chip" :class="{'on':!drawerProv._originFilter}" @click="drawerProv._originFilter=''" x-text="t('plaza_all')" :aria-pressed="(!drawerProv._originFilter)?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._originFilter==='manual'}" @click="drawerProv._originFilter='manual'" x-text="t('origin_manual')" :aria-pressed="(drawerProv._originFilter==='manual')?'true':'false'"></button>
                <button type="button" class="m-chip" :class="{'on':drawerProv._originFilter==='fetched'}" @click="drawerProv._originFilter='fetched'" x-text="t('origin_fetched')" :aria-pressed="(drawerProv._originFilter==='fetched')?'true':'false'"></button>
              </div>
              <!-- Model table -->
              <div class="m-card-table-scroll"><table style="width:100%;min-width:760px;border-collapse:collapse;font-size:var(--fs-12)">
                <thead>
                  <tr style="background:var(--fill-2);border-bottom:1px solid var(--border)">
                    <th style="padding:8px 12px;text-align:left;width:4%"><input type="checkbox" :checked="isAllSelected(drawerProv)" @change="toggleAll(drawerProv,$event.target.checked)"></th>
                    <th style="padding:8px 12px;text-align:left;width:8%" x-text="t('tbl.vendor')"></th>
                    <th style="padding:8px 12px;text-align:left;width:20%" x-text="t('tbl.model_id')"></th>
                    <th style="padding:8px 12px;text-align:left;width:20%" x-text="t('tbl.upstream_model')"></th>
                    <th style="padding:8px 12px;text-align:left;width:8%" x-text="t('tbl.reasoning')" :title="t('tbl.reasoning_hint')"></th>
                    <th style="padding:8px 12px;text-align:left;width:5%" x-text="t('badge.free')"></th>
                    <th style="padding:8px 12px;text-align:left;width:18%" x-text="t('tbl.protocol')"></th>
                    <th style="padding:8px 12px;text-align:center;width:6%" :title="t('strip_toolcall_reasoning_hint')" x-text="t('tbl.strip_reasoning')"></th>
                    <th style="padding:8px 12px;width:8%" x-text="t('tbl.unit_price')"></th>
                    <th style="padding:8px 12px;width:4%"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(m,ei) in drawerProv.models" :key="ei">
                  <tr x-show="modelVisible(m,drawerProv)" :style="'border-bottom:1px solid var(--fill-3);'+(m._removed?'opacity:.4;':'')+(m._isNew?'background:rgba(52,211,153,.06)':'')">
                    <td><input type="checkbox" :checked="!!(drawerProv._selected&&drawerProv._selected[ei])" @change="drawerProv._selected=drawerProv._selected||{};drawerProv._selected[ei]=$event.target.checked;markDirty()"></td>
                    <td><div style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap">
                      <span class="bdg bdg-p" :style="'font-size:var(--fs-10);background:'+brandFor(m.upstream_model,drawerProv.name).color+'1a;color:'+brandFor(m.upstream_model,drawerProv.name).color+';border:1px solid '+brandFor(m.upstream_model,drawerProv.name).color+'44'" x-text="brandFor(m.upstream_model,drawerProv.name).label"></span>
                      <template x-if="m._isNew"><span class="bdg-mini" style="background:var(--ok-bg-strong);color:var(--ok);border:1px solid var(--ok-bd-strong)">NEW</span></template>
                      <template x-if="m._removed"><span class="bdg-mini" style="background:var(--err-bg-strong);color:var(--err-fg);border:1px solid var(--err-bd-strong)">下架</span></template>
                      </div></td>
                    <td><div style="display:flex;align-items:center;gap:4px"><input type="text" class="inp mono" style="width:100%;font-size:var(--fs-11)" x-model="m.model_id" :placeholder="m.model_id===drawerProv.name+'/'?drawerProv.name+'/模型ID':''" @input="if(!m._fmtTouched)m.api_format=defaultApiFormat(m.model_id,drawerProv.name);markDirty()"><button style="flex-shrink:0;background:none;border:none;cursor:pointer;font-size:var(--fs-13);padding:2px 4px" :title="t('copy_model_id')" @click="copyText(m.model_id||'', 'mid'+ei)"><span x-text="copiedField==='mid'+ei?'✓':'⧉'" :style="copiedField==='mid'+ei?'color:var(--ok)':'color:var(--muted)'"></span></button></div><template x-if="modelIdDupHint(m.model_id, drawerProv.name)"><div style="margin-top:4px;font-size:var(--fs-10);line-height:1.35;color:var(--warn)" x-text="modelIdDupHint(m.model_id, drawerProv.name)"></div></template></td>
                    <td style="padding:6px 10px;font-size:var(--fs-11);color:var(--muted);font-family:var(--font-mono)"><div x-text="m.upstream_model||'—'"></div><div x-html="modelMetaStatusHtml(m)" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px"></div></td>
                    <td><select class="sel" style="font-size:var(--fs-11);padding:3px 6px" x-model="m.reasoning_effort" :title="t('tbl.reasoning_hint')" @change="markDirty()"><option value="" x-text="t('eff.none')"></option><option value="low" x-text="t('eff.low')"></option><option value="medium" x-text="t('eff.medium')"></option><option value="high" x-text="t('eff.high')"></option><option value="max" x-text="t('eff.max')"></option></select></td>
                    <td style="padding:6px 10px;text-align:center"><input type="checkbox" x-model="m.free" @change="m._freeTouched=true;markDirty()"></td>
                    <td><div style="display:flex;align-items:center;gap:5px;flex-wrap:nowrap"><select class="sel" :style="apiFormatInferred(m,drawerProv)?'font-size:var(--fs-11);padding:3px 6px;border-style:dashed':'font-size:var(--fs-11);padding:3px 6px'" :title="apiFormatInferred(m,drawerProv)?t('fmt_inferred_hint',t('fmt.'+effectiveApiFormat(m,drawerProv))):t('fmt_explicit_hint',t('fmt.'+effectiveApiFormat(m,drawerProv)))" x-model="m.api_format" @change="m._fmtTouched=true;markDirty()"><option value="" x-text="t('fmt.auto')"></option><option value="openai" x-text="t('fmt.openai')"></option><option value="anthropic" x-text="t('fmt.anthropic')"></option><option value="responses" x-text="t('fmt.responses')"></option></select><!-- 「自动」= 未标注 (空值), 按客户端入口决定协议; 「OpenAI」= 显式锁死走 chat。二者必须可区分 —— 旧版空值选项就写作 "OpenAI", 用户误以为默认被固定成了 chat, 且想手动锁 openai 时选它等于没设 (保存时空值被省略)。 --><!-- 该模型**可用**的协议集 (后端 available_api_formats 的镜像): 由上游实测能力与配置推断得出, 客户端打哪个入口就用哪个 —— 故无需勾选, 只展示. 单个协议时不显示 (无信息增量). --><template x-if="availableApiFormats(m,drawerProv).length>1"><span style="display:flex;align-items:center;gap:4px;flex-wrap:wrap"><template x-for="f in availableApiFormats(m,drawerProv)" :key="'av'+f"><span class="bdg-mini" style="background:var(--ok-bg-strong);color:var(--ok);border:1px solid var(--ok-bd-strong)" :title="t('fmt_available_hint')" x-text="t('fmt.'+f)"></span></template></span></template>
                    </div></td>
                    <td style="padding:6px 10px;text-align:center"><input type="checkbox" :title="t('strip_toolcall_reasoning_hint')" x-model="m.strip_toolcall_reasoning" @change="markDirty()"></td>
                    <td style="padding:6px 10px;white-space:nowrap">
                      <button class="btn btn-g" style="font-size:var(--fs-11);padding:2px 6px" :title="m.price?fmtPriceDetail(m.price):t('price_not_set')" @click="openPricePanel(m)" x-text="m.price?fmtPrice(m.price):t('price_not_set')"></button>
                    </td>
                    <td><button style="background:none;border:none;color:var(--err);cursor:pointer;font-size:var(--fs-13);padding:2px 4px" @click="deleteModel(providersFormData.indexOf(drawerProv),ei)" :title="t('delete')" :aria-label="t('delete')">✕</button></td>
                  </tr>
                  </template>
                </tbody>
              </table></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="dr-foot">
        <!-- 「取消」语义应是"放弃改动", 但 closeProviderDrawer() 只关闭面板、**保留**改动
             （改动留在表单里、脏标记亮起）。按钮叫「取消」会让用户以为改动已丢弃
             （2026-10-12 审计）。改名「关闭」+ 提示"改动保留" —— 若真丢弃, 用户可用
             页头的「刷新」（那条会弹确认）。 -->
        <button class="btn btn-g" @click="closeProviderDrawer()" :title="t('drawer_close_hint')" x-text="t('close')"></button>
        <button class="btn btn-p" :disabled="_saving" @click="saveProvidersForm()"><template x-if="!_saving"><span x-text="t('save_config')"></span></template><template x-if="_saving"><span class="spin"></span></template></button>
      </div>
    </div>
  </div>
</div>
</template>
