<div x-show="showAddProvider" x-cloak class="modal-overlay modal-overlay-add" role="dialog" aria-modal="true" @click.self="showAddProvider=false" @keydown.escape.window="showAddProvider=false"><div class="modal-card modal-card-add"><div class="modal-head"><div class="modal-title" x-text="t('add_provider_title')"></div></div><div class="modal-body">
<!-- 内置预设: 一键添加 (端点/账号登录形态已配好), 添加后走既有保存链 -->
<div class="txs tm" style="margin-bottom:6px" x-text="t('presets_title')"></div>
<!-- 按地区分组（2026-10-24）：预设从 3 条扩到 13 条后平铺一列难找。
     分组 + 图标 + 两列网格，与参考项目 ProviderDropdown 同构。
     空组不渲染（presetGroups 已过滤）。 -->
<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:14px">
  <template x-for="g in presetGroups()" :key="'pg'+g.region">
    <div>
      <div class="txs" style="font-weight:600;color:var(--muted);margin-bottom:6px"
           x-text="t(g.labelKey)"></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px">
        <template x-for="pt in g.items" :key="pt.id">
          <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px"
               :title="pt.desc">
            <span class="prov-idx" style="flex:none" aria-hidden="true" x-text="presetIcon(pt.icon_key, pt.display_name)"></span>
            <div style="flex:1;min-width:0">
              <div style="display:flex;gap:6px;align-items:center;min-width:0">
                <span class="fw6" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="pt.display_name"></span>
              </div>
              <div class="txs tm" style="margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="pt.desc"></div>
            </div>
            <!-- 操作按钮（2026-10-24 重排）。
                 账号型：只需「登录」一个按钮（登录成功后账号即写入，不需要"添加"），
                 原来同时显示「登录」+「添加」两个按钮，在窄卡片里把文字挤成竖排。
                 非账号型：只有「添加」。 -->
            <button x-show="pt.account" class="btn btn-p"
                    style="font-size:var(--fs-11);padding:4px 10px;flex:none;white-space:nowrap"
                    @click="presetAdded(pt)?openLogin(pt.id):(addFromPreset(pt),openLogin(pt.id))"
                    :title="t('acc_login_hint')"
                    x-text="t('login')"></button>
            <button x-show="!pt.account" class="btn btn-o"
                    style="font-size:var(--fs-11);padding:4px 10px;flex:none;white-space:nowrap"
                    :disabled="presetAdded(pt)" @click="addFromPreset(pt)"
                    x-text="presetAdded(pt)?t('preset_added'):t('add')"></button>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>
<div class="txs tm" style="margin-bottom:4px" x-text="t('addprov_custom_title')"></div>
<div><label class="txs tm" x-text="t('addprov.name')"></label><input type="text" class="inp" style="width:100%;margin-top:4px" x-model="addProvName" :placeholder="t('addprov.ph_name')"></div><div><label class="txs tm" x-text="t('addprov.endpoint')"></label><input type="text" class="inp mono" style="width:100%;margin-top:4px" x-model="addProvEndpoint" :placeholder="t('addprov.ph_endpoint')"></div><p class="txs tm" x-text="t('addprov.keyhint')"></p></div><div class="modal-foot"><button class="btn btn-g" @click="showAddProvider=false" x-text="t('cancel')"></button><button class="btn btn-p" :disabled="!addProvName||!addProvEndpoint" @click="confirmAddProvider()" x-text="t('add')"></button></div></div></div>
<!-- 账号登录: 浏览器一键登录 (推荐) + 手动粘贴兜底 (x-data 内, §5.5 红线) -->
<div x-show="loginProv" x-cloak class="modal-overlay modal-overlay-add" role="dialog" aria-modal="true" @click.self="stopLoginPoll();loginProv=''" @keydown.escape.window="loginProv&&(stopLoginPoll(),loginProv='')"><div class="modal-card modal-card-add" style="max-width:520px">
  <div class="modal-head"><div><div class="modal-title" x-text="t('login_title')+' · '+loginProv"></div><div class="txs tm" style="margin-top:2px" x-text="t('login_browser_hint')"></div></div></div>
  <div class="modal-body">
    <!-- 浏览器一键登录: 开官方页, 登录完成后台自动写凭据 (无需回调, 见 accounts.rs) -->
    <!-- 判定账号型: 表单条目 **或** 预设目录命中即可 —— 两者都要看, 不能短路。
         原写法 `表单条目 || 预设条目` 在**表单里存在同名条目时就不再看预设**：
         刚「添加」还没「保存配置」的新条目**没有 auth 段**（auth 由保存链写入），
         于是被误判成"静态 Key 型" → 浏览器登录按钮不渲染 + 显示"不是账号形式"，
         而用户明明是从账号型预设加进来的（2026-10-12 实测）。
         正确语义是"任一边声明了 auth.mode=account 就算账号型"。 -->
    <template x-if="isAccountProv((providersFormData||[]).find(p=>p.name===loginProv)||{}) || isAccountProv((presets||[]).find(x=>x.id===loginProv)||{})">
    <div>
    <!-- 已有账号列表 (多账号): 顺序即优先级 —— 靠前的先用, 失效自动跳到下一个 -->
    <template x-if="acctCount(loginProv)>0">
      <div style="margin-bottom:10px">
        <div class="txs tm" style="margin-bottom:6px" x-text="t('acc_list_hint')"></div>
        <!-- 选号策略: order = 严格按列表顺序; pace = 优先消耗"快重置且剩余多"的号.
             必须可见 —— 否则面板显示的"当前账号"可能与实际选择不符. -->
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <span class="txs tm" x-text="t('acc_picking')"></span>
          <button class="btn btn-g" style="font-size:var(--fs-11);padding:2px 8px"
                  :style="acctPicking==='order'?'border-color:var(--accent);color:var(--accent)':''"
                  @click="setAcctPicking('order')" x-text="t('acc_picking_order')"></button>
          <button class="btn btn-g" style="font-size:var(--fs-11);padding:2px 8px"
                  :style="acctPicking==='pace'?'border-color:var(--accent);color:var(--accent)':''"
                  @click="setAcctPicking('pace')" x-text="t('acc_picking_pace')"></button>
        </div>
        <div class="txs tm" style="margin-bottom:6px" x-show="acctPicking==='pace'" x-text="t('acc_picking_pace_hint')"></div>        <template x-for="(a,i) in (accountsStatus&&accountsStatus[loginProv]||[])" :key="a.id">
          <div class="acct-row" draggable="true"
               @dragstart="acctDragFrom=i" @dragover.prevent
               @drop="acctDrop(loginProv, i)"
               :style="acctDragFrom===i?'opacity:.5':''"
               style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--fill-4);border-radius:8px;margin-bottom:4px">
            <span class="acct-grip tm" :title="t('acc_drag_hint')" style="cursor:grab">⠿</span>
            <span class="txs mono tm" x-text="'#'+(i+1)"></span>
            <!-- 主标签 = 人可读账号名 (昵称/登录名); 指纹与登录名放 tooltip, 用于区分同名账号 -->
            <span class="txs fw6" style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                  :title="acctTitle(a)"
                  x-text="a.label||a.name||t('acc_unnamed')"></span>
            <span class="txs tm" x-show="a.username&&a.username!==(a.label||a.name)"
                  style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                  x-text="a.username"></span>
            <span class="txs" :style="a.active?'color:var(--accent);font-weight:600':'color:var(--muted)'"
                  x-text="a.active?t('acc_active_tag'):(a.dead?t('acc_dead'):(a.cooling?t('acc_cooling'):t('acc_idle_tag')))"></span>
            <span class="txs tm" style="margin-left:auto" x-text="acctExpiryText(a)"></span>
            <!-- 「设为首选」而非「设为当前账号」: acctPromote 做的是**置顶**, 而实际用的是
                 「第一个可用账号」—— 置顶的号在冷却/已作废时会被跳过 (acc_promote_* 三条提示即为此).
                 文案说成"设为当前"会让用户以为点了就立刻生效, 冷却时观感就是"点了没反应".
                 title 里把这句话讲清, 不靠 hover 才知道有例外. -->
            <button class="btn btn-g" style="font-size:var(--fs-11);padding:3px 8px" x-show="!a.active"
                    :title="t('acc_set_active_hint')"
                    @click="acctPromote(loginProv, a.id)" x-text="t('acc_set_active')"></button>
            <!-- 行内登出必须带"此账号" —— 底部还有一个「登出全部账号」, 同一个
                 "登出" 词在多账号列表里指代不清 (用户截图指出分不清哪个是哪个). -->
            <button class="btn btn-g" style="font-size:var(--fs-11);padding:3px 8px;color:var(--err)"
                    :title="t('logout_this')" @click="logoutProv(loginProv, a.id)" x-text="t('logout_this')"></button>
          </div>
        </template>
      </div>
    </template>
    <button class="btn btn-p" style="width:100%" :disabled="loginBusy||loginBrowserPending" @click="browserLogin()">
      <span class="spin" x-show="loginBrowserPending"></span>
      <span x-text="loginBrowserPending?t('login_browser_wait'):(acctCount(loginProv)>0?t('acc_add_more'):t('login_browser'))"></span>
    </button>
    </div>
    </template>
    <!-- 静态 Key 型提示: 与上面**同一个判据取反**, 必须完全对应 ——
         两处写法不一致就会出现"既显示浏览器登录按钮、又显示不是账号形式"
         （用户 2026-10-12 截图里正是这个自相矛盾的界面）。 -->
    <template x-if="!isAccountProv((providersFormData||[]).find(p=>p.name===loginProv)||{}) && !isAccountProv((presets||[]).find(x=>x.id===loginProv)||{})">
      <div class="txs tm" style="margin-bottom:10px" x-text="t('login_statickey_hint')"></div>
    </template>
    <div class="txs tm" style="margin-top:10px;text-align:center" x-text="t('login_manual_divider')"></div>
    <div style="margin-top:8px"><label class="txs tm" x-text="t('login_tok')"></label><textarea class="inp mono" rows="3" style="width:100%;margin-top:4px;resize:vertical" x-model="loginTok" placeholder="eyJ..."></textarea></div>
    <div style="margin-top:8px"><label class="txs tm" x-text="t('login_rt')"></label><textarea class="inp mono" rows="2" style="width:100%;margin-top:4px;resize:vertical" x-model="loginRt" placeholder="eyJ..."></textarea></div>
    <div style="margin-top:8px"><label class="txs tm" x-text="t('login_exp')"></label><input type="number" min="0" class="inp" style="width:100%;margin-top:4px" x-model="loginExp" :placeholder="t('login_exp_ph')"></div>
    <p class="txs tm" style="margin-top:8px;word-break:break-all" x-show="loginMsg" x-text="loginMsg"></p>
  </div>
  <div class="modal-foot">
    <!-- 底部「登出全部账号」是破坏性动作 (一次清空该供应商所有凭据), 必须确认.
         原实现直接 logoutProv(loginProv) 无 id = 全部登出, 而按钮只写「登出」——
         与行内那个只登出一个号的按钮**同名**, 用户截图表明分不清, 误点代价极大. -->
    <button class="btn btn-g" style="color:var(--err);margin-right:auto" x-show="accountsStatus&&accountsStatus[loginProv]"
            :title="t('logout_all_hint')"
            @click="confirmAsk(t('logout_all_confirm', (accountsStatus&&accountsStatus[loginProv]||[]).length), { title: t('logout_all'), danger: true, onOk: () => { stopLoginPoll(); logoutProv(loginProv); loginProv=''; } })"
            x-text="t('logout_all')"></button>
    <button class="btn btn-g" @click="stopLoginPoll();loginProv=''" x-text="t('cancel')"></button>
    <!-- 手动粘贴是**兜底**形态 (上方浏览器登录才是推荐), 故用 btn-o 描边而非 btn-p 实心:
         两个实心主按钮并列会争夺焦点, 而官方浏览器登录明显更省事、更安全. -->
    <button class="btn btn-o" :disabled="!loginTok.trim()||loginBusy" @click="submitLogin()" x-text="t('login_submit')"></button>
  </div>
</div></div>
<!-- 拉取模型差异结果: 新增(可勾选)/已存在/下架 三 Tab + 前缀分组全选 + 选择汇总 -->
<div x-show="showFetchDiff && fetchDiff" x-cloak class="modal-overlay modal-overlay-add" role="dialog" aria-modal="true" @keydown.escape.window="showFetchDiff&&(showFetchDiff=false)"><div class="modal-card modal-card-add" style="max-width:660px">
  <div class="modal-head"><div><div class="modal-title" x-text="t('fd_title')"></div><div class="txs tm" style="margin-top:2px" x-text="fetchDiff?fetchDiff.message:''"></div></div></div>
  <div class="modal-body">
    <div class="seg" style="margin-bottom:10px">
      <button type="button" class="seg-i" :class="{'a':fetchDiffTab==='new'}" @click="fetchDiffTab='new'" x-text="t('fd_tab_new')+' ('+(fetchDiff?fetchDiff.added.length:0)+')'"></button>
      <button type="button" class="seg-i" :class="{'a':fetchDiffTab==='existing'}" @click="fetchDiffTab='existing'" x-text="t('fd_tab_existing')+' ('+(fetchDiff?fetchDiff.existing.length:0)+')'"></button>
      <button type="button" class="seg-i" :class="{'a':fetchDiffTab==='removed'}" @click="fetchDiffTab='removed'" x-text="t('fd_tab_removed')+' ('+(fetchDiff?fetchDiff.removed.length:0)+')'"></button>
    </div>
    <div class="txs tm" style="margin-bottom:8px" x-text="t('fd_hint')"></div>
    <template x-if="fetchDiffTab==='new'">
      <div style="display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto">
        <template x-for="g in fetchDiffGroups()" :key="g.prefix">
          <div>
            <div style="display:flex;align-items:center;gap:8px;padding:4px 2px">
              <input type="checkbox" class="chkbox" :checked="g.items.every(it=>fetchDiffSel[it.model_id])" @change="fetchDiffGroupAll(g.prefix,$event.target.checked)">
              <span class="txsm fw6" x-text="g.prefix"></span><span class="txs tm" x-text="'· '+g.items.length"></span>
            </div>
            <template x-for="it in g.items" :key="it.model_id">
              <label style="display:flex;align-items:center;gap:8px;padding:4px 8px 4px 26px;cursor:pointer">
                <input type="checkbox" class="chkbox" x-model="fetchDiffSel[it.model_id]">
                <span class="mono txs" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="it.model_id" x-text="it.model_id"></span>
                <span class="txs tm" style="flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="it.upstream_model"></span>
              </label>
            </template>
          </div>
        </template>
        <template x-if="!fetchDiffGroups().length"><div class="txs tm" style="padding:12px 4px" x-text="t('no_data')"></div></template>
      </div>
    </template>
    <template x-if="fetchDiffTab==='existing'">
      <div style="max-height:320px;overflow:auto">
        <div class="txs tm" style="margin-bottom:6px" x-text="t('fd_existing_note',(fetchDiff?fetchDiff.existing.length:0))"></div>
        <template x-for="id in (fetchDiff?fetchDiff.existing:[])" :key="'e'+id"><div class="mono txs tm" style="padding:3px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="id" x-text="id"></div></template>
      </div>
    </template>
    <template x-if="fetchDiffTab==='removed'">
      <div style="max-height:320px;overflow:auto">
        <div class="txs tm" style="margin-bottom:6px" x-text="t('fd_removed_note',(fetchDiff?fetchDiff.removed.length:0))"></div>
        <template x-for="id in (fetchDiff?fetchDiff.removed:[])" :key="'r'+id"><div class="mono txs" style="padding:3px 8px;color:var(--err);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" :title="id" x-text="id"></div></template>
      </div>
    </template>
  </div>
  <div class="modal-foot">
    <span class="txs tm" style="margin-right:auto" x-text="t('fd_summary',fetchDiffSelCount(),fetchDiff?fetchDiff.added.length:0)"></span>
    <button class="btn btn-g" @click="cancelFetchDiff()" x-text="t('cancel')"></button>
    <button class="btn btn-p" @click="applyFetchDiff()" x-text="t('fd_apply')"></button>
  </div>
</div></div>
