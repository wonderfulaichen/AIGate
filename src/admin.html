  <template x-if="!stats || stats.total_requests===0">

        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht"><span x-text="t('performance_health')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('performance_health_desc')"></div></div><button class="btn btn-g" style="font-size:11px" @click="switchTab('analytics')" x-text="t('view_analytics')+' →'"></button></div><div class="pnl-b"><div class="ov-health-grid">
          <div class="ov-health-item"><div class="ov-health-label" x-text="t('success_rate')"></div><div class="ov-health-value" :style="'color:'+(sRate>=95?'#34d399':sRate>=80?'#f59e0b':'#ef4444')" x-text="sRate+'%'"></div></div>

        </div><div style="margin-top:14px"><div class="txs tm" style="margin-bottom:4px"><span x-text="t('top_models_traffic')"></span></div><template x-for="(m,i) in (stats.top_models||[]).slice(0,6)" :key="m.model"><div class="ov-model-row"><span class="ov-dot" :style="'background:'+(m.errors===0?'#34d399':m.errors<m.requests/5?'#f59e0b':'#ef4444')"></span><span class="mono txs" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)" x-text="m.model"></span><span class="txs tm" x-text="m.requests+' '+t('unit_times')"></span><span class="txs mono" style="color:var(--muted)" x-text="m.requests?Math.round((m.requests-m.errors)/m.requests*100)+'%':'—'"></span></div></template><template x-if="!(stats.top_models||[]).length"><div class="txs tm" style="padding:10px 0" x-text="t('no_data')"></div></template></div></div></div>
        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht"><span x-text="t('api_information')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('api_information_desc')"></div></div><button class="btn btn-g" style="font-size:11px" @click="switchTab('providers')" x-text="t('view_providers')+' →'"></button></div><div class="pnl-b"><template x-for="item in [{method:'BASE',path:baseUrl,descKey:'api_base_url_desc'},{method:'GET',path:'/v1/models',descKey:'available_models'},{method:'POST',path:'/v1/chat/completions',descKey:'chat_completions'}]" :key="item.path"><div class="ov-api-row"><span class="ov-api-method" x-text="item.method"></span><span class="ov-api-path" style="flex:1" x-text="item.path"></span><span class="txs tm" x-text="t(item.descKey)"></span><button class="btn btn-g" style="font-size:11px;padding:4px 8px" @click="copyText(item.path,'api')" x-text="copiedField==='api'?t('copied'):t('copy')"></button></div></template></div></div>
      </div>
      <div class="ov-side">
        <div class="pnl"><div class="pnl-h"><span class="pnl-ht" x-text="t('balance_cost')"></span><button class="btn btn-g" style="font-size:11px" @click="fetchBalance()" x-text="t('balance_refresh')"></button></div><div class="pnl-b" style="padding:8px 16px"><template x-for="row in providerRows" :key="row.provider"><div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)"><div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px;border-radius:6px;overflow:hidden" x-html="providerLogo(row.provider)"></div><span class="txsm fw6" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="row.provider"></span><span class="txsm mono fw6" x-text="row.hasBalance?fmtMoney(row.balance):'—'"></span></div><div style="display:flex;justify-content:space-between;padding-left:32px;margin-top:4px"><span class="txs tm" x-text="t('stat.today_cost')+' '+fmtMoney(row.today_cost)"></span><span class="txs tm" x-text="row.source||''"></span></div><template x-if="row.error"><div class="txs" style="color:var(--err);padding-left:32px;margin-top:3px" x-text="row.error"></div></template></div></template><template x-if="!providerRows.length"><div class="txs tm" style="text-align:center;padding:18px 0" x-text="t('balance_none')"></div></template></div></div>

      </div>
    </div>
  </template>
</div>
<div x-show="activeTab==='analytics'" class="page-enter ov-page">
  <div class="phd"><div><h1 class="pt" x-text="t('analytics_title')"></h1><p class="ps" x-text="t('analytics_subtitle')"></p></div><div class="ov-actions"><span class="bdg bdg-g" x-text="t('stats_range',stats?(stats.source_window||t('current_log_window')):t('current_log_window'))"></span><span class="txs tm" x-text="t('stats_context',trendGranularityLabel,tzLabel)"></span><button class="btn btn-g" @click="fetchStats();fetchHourlyStats()" x-text="t('refresh')"></button></div></div>
  <template x-if="!stats"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="t('no_data')"></span></div></div></template>
  <template x-if="stats"><div style="display:flex;flex-direction:column;gap:16px">
    <div class="an-stat-strip">

      <div class="an-stat"><div class="an-stat-label" x-text="t('total_cost')"></div><div class="an-stat-value" x-text="fmtMoney(stats.total_cost||0)"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('total_tokens')"></div><div class="an-stat-value" x-text="fmtT((stats.total_prompt_tokens||0)+(stats.total_completion_tokens||0))"></div></div>

      <div class="an-stat"><div class="an-stat-label" x-text="t('average_tpm')"></div><div class="an-stat-value" x-text="fmtT(Math.round(analysisTpm))"></div><div class="txs tm" x-text="t('tokens_per_min')"></div></div>
    </div>
    <div class="pnl"><div class="an-filter"><span class="txs tm" x-text="t('time_range')"></span><div class="seg"><span class="seg-i" :class="{'a':analyticsRange==='1d'}" @click="analyticsRange='1d';trendGranularity='hour';fetchStats();fetchHourlyStats()" x-text="t('range_1d')"></span><span class="seg-i" :class="{'a':analyticsRange==='7d'}" @click="analyticsRange='7d';trendGranularity='day';fetchStats();fetchHourlyStats()" x-text="t('range_7d')"></span><span class="seg-i" :class="{'a':analyticsRange==='14d'}" @click="analyticsRange='14d';trendGranularity='day';fetchStats();fetchHourlyStats()" x-text="t('range_14d')"></span><span class="seg-i" :class="{'a':analyticsRange==='29d'}" @click="analyticsRange='29d';trendGranularity='day';fetchStats();fetchHourlyStats()" x-text="t('range_29d')"></span></div><span class="txs tm" style="margin-left:8px" x-text="t('trend_granularity')"></span><div class="seg"><span class="seg-i" :class="{'a':trendGranularity==='hour'}" @click="trendGranularity='hour';fetchStats();fetchHourlyStats()" x-text="t('granularity_hour')"></span><span class="seg-i" :class="{'a':trendGranularity==='day'}" @click="trendGranularity='day';fetchStats()" x-text="t('granularity_day')"></span><span class="seg-i" :class="{'a':trendGranularity==='month'}" @click="trendGranularity='month';fetchStats()" x-text="t('granularity_month')"></span></div><span class="txs tm" style="margin-left:auto" x-text="t('stats_range',analyticsRange?t('range_'+analyticsRange):t('current_log_window'))"></span></div></div>

          </div>
          <div class="sec-body">
            <div class="m-card">
              <!-- Search + actions header -->
              <div class="m-card-hdr">
                <input type="text" class="inp" style="flex:1;max-width:320px;font-size:12px" x-model="drawerProv._filter" :placeholder="t('search_models')">
                <div style="display:flex;gap:6px;align-items:center">
                  <button class="btn btn-g" style="font-size:11px" @click="toggleAll(drawerProv,true)" x-text="t('select_all')"></button>
                  <button class="btn btn-g" style="font-size:11px" @click="toggleAll(drawerProv,false)" x-text="t('deselect_all')"></button>
                  <button class="btn btn-g" style="font-size:11px;color:var(--err)" @click="deleteSelectedModels()" x-text="t('delete_selected')"></button>
                  <button class="btn btn-p" style="font-size:11px" @click="addModel(providersFormData.indexOf(drawerProv))" x-text="t('add_model')"></button>
                </div>
              </div>
              <!-- Brand filter chips -->
              <div class="m-card-bar">
                <span class="txs tm" style="margin-right:4px" x-text="t('brand')"></span>
                <span class="m-chip" :class="{'on':!drawerProv._brandFilter}" @click="drawerProv._brandFilter=''" x-text="t('plaza_all')"></span>

                  <span class="m-chip" :class="{'on':drawerProv._brandFilter===b.label}" @click="drawerProv._brandFilter=b.label">
                    <span :style="'width:6px;height:6px;border-radius:50%;background:'+b.color"></span>
                    <span x-text="b.label"></span>
                  </span>
                </template>
                <span style="margin-left:auto"></span>
                <span class="txs tm" style="margin-right:4px" x-text="t('thinking_short')"></span>
                <span class="m-chip" :class="{'on':!drawerProv._effFilter}" @click="drawerProv._effFilter=''" x-text="t('plaza_all')"></span>
                <span class="m-chip" :class="{'on':drawerProv._effFilter==='low'}" @click="drawerProv._effFilter='low'" x-text="t('eff.low')"></span>

                    <th style="padding:8px 12px;text-align:left" x-text="t('tbl.upstream_model')"></th>

                    <th style="padding:8px 12px;text-align:left;width:9%" x-text="t('tbl.protocol')"></th>
                    <th style="padding:8px 12px;width:4%"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(m,ei) in drawerProv.models" :key="ei">

                    <td style="padding:6px 10px"><input type="checkbox" :checked="!!(drawerProv._selected&&drawerProv._selected[ei])" @change="drawerProv._selected=drawerProv._selected||{};drawerProv._selected[ei]=$event.target.checked;markDirty()"></td>
                    <td style="padding:6px 10px"><span class="bdg bdg-p" style="font-size:10px" x-text="brandFor(m.upstream_model,drawerProv.name).label" :style="'background:'+brandFor(m.upstream_model,drawerProv.name).color+'1a;color:'+brandFor(m.upstream_model,drawerProv.name).color+';border:1px solid '+brandFor(m.upstream_model,drawerProv.name).color+'44'"></span></td>
                    <td style="padding:6px 10px"><input type="text" class="inp mono" style="width:100%;font-size:11px" x-model="m.model_id" @input="if(!m._fmtTouched)m.api_format=this.defaultApiFormat(m.model_id);markDirty()"></td>
                    <td style="padding:6px 10px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace"><div x-text="m.upstream_model||'—'"></div><div x-html="modelMetaStatusHtml(m)" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px"></div></td>
                    <td style="padding:6px 10px"><select class="sel" style="font-size:11px;padding:3px 6px" x-model="m.reasoning_effort" @change="markDirty()"><option value="" x-text="t('eff.none')"></option><option value="low" x-text="t('eff.low')"></option><option value="medium" x-text="t('eff.medium')"></option><option value="high" x-text="t('eff.high')"></option><option value="max" x-text="t('eff.max')"></option></select></td>
                    <td style="padding:6px 10px;text-align:center"><input type="checkbox" x-model="m.free" @change="m._freeTouched=true;markDirty()"></td>
                    <td style="padding:6px 10px"><select class="sel" style="font-size:11px;padding:3px 6px" x-model="m.api_format" @change="m._fmtTouched=true;markDirty()"><option value="" x-text="t('fmt.openai')"></option><option value="anthropic" x-text="t('fmt.anthropic')"></option><option value="responses" x-text="t('fmt.responses')"></option></select></td>

                  </template>
                </tbody>

    </div>
  </div>
</div>
</template>

document.addEventListener('alpine:init', function() {
  Alpine.store('i18n', { lang: (window.AIGATE_LANG || 'zh-CN') });
  // 全局轻量 Toast 通知：toast(msg, type) / Alpine.store('toast').push(msg, type)
  Alpine.store('toast', {
    items: [],
    push(msg, type) {
      type = type || 'info';
      const id = Date.now() + Math.random();
      this.items.push({ id, msg, type });
      setTimeout(() => this.dismiss(id), 3000);
    },
    dismiss(id) { this.items = this.items.filter(x => x.id !== id); },
  });
  Alpine.data('dashboard', dashboard);
});
function toast(msg, type) { if (window.Alpine) Alpine.store('toast').push(msg, type); }
function t(key) {
  var lang = (window.Alpine && Alpine.store('i18n')) ? Alpine.store('i18n').lang : (window.AIGATE_LANG || 'zh-CN');
  var dict = I18N[lang] || I18N['zh-CN'];
  var s = (dict && dict[key] != null) ? dict[key] : (I18N['zh-CN'][key] != null ? I18N['zh-CN'][key] : key);
  for (var i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(arguments[i]);
  return s;
}

}

function providerLogo(providerName) {
  if (!providerName) return _plogo('#374151', '?');
  const key = String(providerName).toLowerCase().trim();
  for (const [re, svgKey] of PROVIDER_LOGO_REGEX) {
    if (re.test(key)) return _logoWrap(PROVIDER_SVG[svgKey]);
  }
  if (PROVIDER_SVG[key]) return _logoWrap(PROVIDER_SVG[key]);
  // 未收录供应商: 取首段 1-2 字母 + 哈希稳定底色, 兜底显示.
  const seg = key.split(/[\s_\-./]+/).filter(Boolean);
  let txt = seg.length ? seg[0].slice(0, 2).toUpperCase() : key.slice(0, 2).toUpperCase();
  if (txt.length < 1) txt = '?';
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) & 0xffffffff;
  const palette = ['#4d6bfe', '#7c5cff', '#10b981', '#ff6b35', '#d97757', '#0ea5e9', '#ef4444', '#8b5cf6', '#14b8a6', '#f59e0b'];
  const bg = palette[Math.abs(h) % palette.length];
  return _plogo(bg, txt, '#fff');
}

function _logoWrap(svg) {
  if (!svg) return _plogo('#374151', '?');
  return '<span style="width:100%;height:100%;display:inline-flex">' + svg + '</span>';
}

    // ── 模型元信息 (models.dev): 点击展开 chips 面板 (上下文/输出/视觉/推理/工具) ──
    async fetchModelMeta() {
      this.modelMetaLoading = true;
      try {
        const names=new Set();
        // 注意: providersFormData 就是供应商数组本身 (非 {providers:[]}),
        // 旧版误写 .providers 导致表单模型名从未被收集, 仅统计接口的模型有元数据.
        (this.providersFormData||[]).forEach(p=>(p.models||[]).forEach(m=>{
          const u=(m.upstream_model||'').trim(); if(u) names.add(u);
          const id=(m.model_id||'').trim(); if(id) names.add(id);
        }));
        // 概览页统计的模型名带 "provider/" 中转前缀, 剥离后一并查询
        [...((this.stats?.top_models)||[]), ...((this.stats?.per_model)||[])].forEach(m=>{
          const raw=(m.model||'').trim(); if(!raw) return;
          names.add(raw.includes('/') ? raw.split('/').pop() : raw);
        });
        if(!names.size) { this.modelMetaLoading = false; return; }
        // 签名去重: 轮询/重复进入不重发 (服务端有 24h 缓存, 也省一次往返)
        const sig=[...names].sort().join(',');
        if(sig===this._metaSig && Object.keys(this.modelMeta).length) { this.modelMetaLoading = false; return; }
        this._metaSig=sig;
        const r=await fetch('/admin/api/model-meta',{method:'POST',headers:authHeaders(),body:JSON.stringify({names:[...names]})});
        if(r.ok){ const d=await r.json(); this.modelMeta=d.meta||{}; }
      } catch(e){}
      this.modelMetaLoading = false;

    // ── 活跃热力图 SVG: 最近 24 个小时桶的相对请求量 ──
    get tokenActivityGridCols() { return 'repeat('+Math.max(1,this.tokenActivityCells.length)+',16px)'; },
    computeTokenActivityCells() {
      const days=(this.stats?.trends||[]).filter(x=>x&&x.ts).sort((a,b)=>a.ts-b.ts).map(x=>({ts:x.ts,date:x.date,requests:Number(x.requests||0),errors:Number(x.errors||0),input:Number(x.total_prompt_tokens||0),output:Number(x.total_completion_tokens||0),tokens:Number(x.total_prompt_tokens||0)+Number(x.total_completion_tokens||0)}));
      if(!days.length){this.tokenActivityCells=[];this.tokenActivityFlat=[];return;}
      const max=Math.max(...days.map(d=>d.tokens),1);
      const start=days[0].ts,end=days[days.length-1].ts;
      const firstWD=(new Date((start+8*3600)*1000).getUTCDay()+6)%7;
      const cellCount=Math.ceil((end-start)/86400+1);
      const weekCount=Math.ceil((firstWD+cellCount)/7);
      const dayMap=new Map(days.map(d=>[d.ts,d]));
      const WEEKDAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const color=v=>{if(!v)return '#1c1d24';const r=Math.min(v/max,1);return r>.75?'#60a5fa':r>.5?'#3b82f6':r>.25?'#2563eb':'#1d4ed8';};
      // Build week-indexed cells (for backwards compat)
      const cells=[];
      for(let wi=0;wi<weekCount;wi++){
        const week=[];
        for(let di=0;di<7;di++){
          const dayIndex=wi*7+di-firstWD;
          if(dayIndex<0||dayIndex>=cellCount){week.push(null);continue;}
          const ts=start+dayIndex*86400;
          const d=dayMap.get(ts)||{ts,date:new Date((ts+8*3600)*1000).toISOString().slice(5,10),requests:0,tokens:0};
          week.push({color:color(d.tokens),title:(d.date||'')+' · '+this.fmtT(d.tokens)+' tok',tokens:d.tokens,requests:d.requests});
        }
        cells.push(week);
      }
      this.tokenActivityCells=cells;
      // Flatten for CSS grid: row=weekday(7), column=week(N)
      // cells[c][r] where c=week index, r=weekday index
      const flat=[];
      for(let r=0;r<7;r++){
        for(let c=0;c<weekCount;c++){
          const cell=cells[c]&&cells[c][r]?cells[c][r]:null;
          if(!cell){flat.push(null);continue;}
          const dayIndex=c*7+r-firstWD;
          if(dayIndex<0||dayIndex>=cellCount){flat.push(null);continue;}
          const ts=start+dayIndex*86400;
          let value=cell.tokens;
          if(this.tokenActivityView==='cumulative') value=days.filter(x=>x.ts<=ts).reduce((a,x)=>a+x.tokens,0);
          if(this.tokenActivityView==='weekly'){const ws=ts-(((ts+8*3600)*1000/1000+3600*8)%86400/86400+(6))*86400;if(r===0)value=days.filter(x=>x.ts>=ws&&x.ts<ws+7*86400).reduce((a,x)=>a+x.tokens,0);}
          const p=new Date((ts+8*3600)*1000);const wd=(p.getUTCDay()+6)%7;
          const monthLabel=(r===0&&(dayIndex===0||(c===0&&r===firstWD)))?(p.getUTCMonth()+1)+'/'+p.getUTCFullYear():'';
          flat.push({color:color(value),title:(cell.title||'')+' ('+WEEKDAYS[wd]+')',showMonth:!!monthLabel,monthLabel,showWeekday:c===0,weekdayLabel:WEEKDAYS[wd]});
        }
      }
      this.tokenActivityCells=cells;
      this.tokenActivityFlat=flat;
      this.tokenActivityHtml=flat.map(c=>c?'<div class="ta-cell" style="background:'+c.color+';" title="'+(c.title||'').replace(/"/g,'&quot;')+'"></div>':'<div class="ta-cell" style="background:#1c1d24;"></div>').join('');
    },
    computeModelTrend() {
      const rows=this.stats?.model_trends||[]; const sums={};
      rows.forEach(r=>{const k=(r.provider||'')+'/'+(r.upstream_model||'');sums[k]=(sums[k]||0)+Number(r.prompt_tokens||0)+Number(r.completion_tokens||0);});
      const allKeys=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]).slice(0,6);

      const W=900,H=280,left=52,right=18,top=18,bottom=36,pw=W-left-right,ph=H-top-bottom;

      if(this.chartMode==='bar'){const bw=Math.min(28,pw/n*.7);const cumul=new Array(n).fill(0);values.forEach((vals,si)=>{const k=keys[si],color=colorOf(k);vals.forEach((v,i)=>{if(!v)return;const y0=y(cumul[i]);cumul[i]+=v;const y1=y(cumul[i]);const barH=y0-y1;out+='<rect x="'+(x(i)-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+barH+'" fill="'+color+'"><title>'+this.escapeHtml(dates[i][1]||'')+' · '+this.escapeHtml(k.split('/').slice(1).join('/'))+' · '+this.fmtT(v)+' tok</title></rect>';});});}else{
        values.forEach((vals,si)=>{const k=keys[si],color=colorOf(k);const pts=vals.map((v,i)=>[x(i),y(v)]);
          const ptsStr=pts.map(p=>p[0]+','+p[1]).join(' ');

          const areaD='M'+x(0)+','+(top+ph)+' L'+pts.map(p=>p[0]+','+p[1]).join(' L')+' L'+x(n-1)+','+(top+ph)+' Z';
          out+='<path d="'+areaD+'" fill="url(#'+gid+')"/>';

        });
      }
      const step=Math.max(1,Math.ceil(n/8));dates.forEach((d,i)=>{if(i%step===0||i===n-1)out+='<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="#6b7280">'+this.escapeHtml(d[1]||'')+'</text>';});out+='</svg>';
      this.modelTrendSvgHtml=out;

    get trendColor() {

    get trendMetricLabel() {
      return t(this.dailyMode==='cost'?'chart_metric_label_cost':this.dailyMode==='tokens'?'chart_metric_label_tokens':this.dailyMode==='latency'?'chart_metric_label_latency':'chart_metric_label_requests');

    get tzLabel() { return t('tz_label'); },
    get trendSummaryHtml() {
      const tr=(this.stats?.trends||[]).slice(-1)[0];
      if(!tr) return '';
      const cost=this.stats?.has_price_config?this.fmtMoney(tr.total_cost||0):t('chart_no_price');
      return '<span>'+t('trend_detail_title')+': '+this.escapeHtml(tr.date||'—')+'</span><br><span>'+t('trend_bucket_metrics',tr.requests||0,tr.errors||0,this.fmtT(tr.total_prompt_tokens||0),this.fmtT(tr.total_completion_tokens||0),this.escapeHtml(cost))+'</span>';
    },
    escapeHtml(value) { return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
    get trendSvg() {
      const trends=this.stats?.trends||[]; if(!trends.length) return '';
      const n=trends.length, W=760, H=190, left=44, right=12, top=18, bottom=34;
      const plotW=W-left-right, plotH=H-top-bottom, stroke=this.trendColor;
      const vals=trends.map(tr=>this.dailyMode==='cost'?(tr.total_cost||0):this.dailyMode==='tokens'?((tr.total_prompt_tokens||0)+(tr.total_completion_tokens||0)):this.dailyMode==='latency'?(tr.requests?(tr.avg_latency||0):null):(tr.requests||0));
      const finite=vals.filter(v=>v!==null&&Number.isFinite(v)); const mx=Math.max(...finite,1);
      const x=i=>left+(n===1?plotW/2:plotW*i/(n-1));
      const y=v=>v===null?top+plotH:top+plotH-(v/mx)*plotH;
      const tip=(tr,v)=>t('trend_bucket_metrics',tr.requests||0,tr.errors||0,this.fmtT(tr.total_prompt_tokens||0),this.fmtT(tr.total_completion_tokens||0),this.stats?.has_price_config?this.escapeHtml(this.fmtMoney(tr.total_cost||0)):t('chart_no_price'));
      let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:190px"><defs><linearGradient id="trendAreaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${stroke}" stop-opacity=".22"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>`;
      for(let i=0;i<=4;i++){const yy=top+plotH*i/4;const value=mx*(1-i/4);const label=this.dailyMode==='cost'?this.fmtMoney(value):this.dailyMode==='tokens'?this.fmtT(value):this.dailyMode==='latency'?this.fmtMs(value):Math.round(value);s+=`<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="#2a2d37" stroke-width=".7"/><text x="${left-7}" y="${yy+3}" font-size="9" text-anchor="end" fill="#6b7280">${label}</text>`;}
      const points=vals.map((v,i)=>[x(i),y(v)]);
      if(this.chartMode==='bar'){
        const gap=Math.min(8,plotW/n*.22), bw=Math.max(2,plotW/n-gap);
        vals.forEach((v,i)=>{if(v===null)return;const xx=x(i)-bw/2,hh=top+plotH-y(v);s+=`<rect x="${xx}" y="${y(v)}" width="${bw}" height="${hh}" rx="3" fill="${stroke}" opacity=".85"><title>${tip(trends[i],v)}</title></rect>`;});
      } else {
        const pts=points.filter((_,i)=>vals[i]!==null).map(p=>p.join(',')).join(' ');
        if(pts){const area=`${left},${top+plotH} ${pts} ${W-right},${top+plotH}`;s+=`<polygon points="${area}" fill="url(#trendAreaFill)"/><polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;}
        points.forEach((p,i)=>{if(vals[i]===null)return;s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${stroke}" stroke="#16161c" stroke-width="1.5"><title>${tip(trends[i],vals[i])}</title></circle>`;});
      }
      const step=Math.max(1,Math.ceil(n/7));trends.forEach((tr,i)=>{if(i%step!==0&&i!==n-1)return;s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="9" fill="#6b7280">${tr.date}</text>`;});
      s+=`<text x="${W-right}" y="${top+3}" text-anchor="end" font-size="9" fill="${stroke}">${this.escapeHtml(this.trendMetricLabel)}</text></svg>`;
      return s;
    },

    fmtResetIn(sec) {

      const h = Math.floor((sec % 86400) / 3600);

      const s = sec % 60;
      if (d > 0) return d + 'd ' + h + 'h';
      if (h > 0) return h + 'h ' + m + 'm';
      return m + 'm ' + s + 's';
    },

      importModels(pi, event){
        const prov=this.providersFormData[pi];
        const file=event.target.files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>{
          const text=reader.result||'';
          const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
          let added=0;
          for(const line of lines){
            if(line.startsWith('#')) continue;
            const parts=line.split(/[,;\t|]/).map(s=>s.trim()).filter(Boolean);
            if(!parts.length) continue;
            const model_id=parts[0];
            const upstream=parts[1]||model_id;
            const effort=parts[2]||'';
            const fmt=parts[3]||'';
            if(prov.models.some(m=>m.model_id===model_id)) continue;
            prov.models.push({model_id, upstream_model:upstream, reasoning_effort:effort, api_format:fmt, free:this.autoFree(model_id, upstream), _freeTouched:false, _fmtTouched:!!fmt});
            added++;
          }
          this.markDirty();
          toast(t('models_imported',added), 'success');
        };
        reader.readAsText(file);
        event.target.value='';
      },
      exportModels(pi){
        const prov=this.providersFormData[pi];
        const selected=Object.keys(prov._selected||{}).filter(k=>prov._selected[k]).map(k=>prov.models[k]).filter(Boolean);
        const list = selected.length? selected : prov.models;
        const csv=list.map(m=> [m.model_id, m.upstream_model||'', m.reasoning_effort||'', m.api_format||''].join(',')).join('\n');
        const blob=new Blob([csv],{type:'text/csv'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download=prov.name+'-models.csv'; a.click(); URL.revokeObjectURL(url);
      },

       const current=this.health.find(h=>h.provider===prov.name);
       if(current){ current.status_level=result.success?'ok':'error'; current.status_text=result.status||''; current.latency_ms=result.latency_ms||0; }
       else this.health.push({provider:prov.name,endpoint:prov.endpoint,status_level:result.success?'ok':'error',status_text:result.status||'',latency_ms:result.latency_ms||0,circuit:'closed',circuit_text:''});
       prov._testing = false;
     },
     // 拉取模型: 后端仅写入内存注册表 (即时生效) 并返回模型列表; 这里合并进表单,
    // 待用户点"保存配置"才持久化 —— 避免直接写盘冲掉表单里其它未保存改动.
    async fetchProviderModels(pi) {
      const prov = this.providersFormData[pi];
      prov._fetching = true;
      try {
        const r = await fetch('/admin/api/providers/'+encodeURIComponent(prov.name)+'/fetch-models', {method:'POST', headers:authHeaders()});
        const d = await r.json();
        if (r.ok && d.success) {
          // 去重: 基于 upstream_model (与后端 add_models 一致), 而非 model_id.
          const existingUpstream = new Set(prov.models.map(m=>m.upstream_model||m.model_id));
          let added=0;
          for (const id of (d.models||[])) {
            if (!existingUpstream.has(id)) {
              prov.models.push({ model_id:id, upstream_model:id, reasoning_effort:'', api_format:this.defaultApiFormat(id), origin:'fetched', _isNew:true, _removed:false, free:this.autoFree(id,id), _freeTouched:false, _fmtTouched:false });
              existingUpstream.add(id);
              added++;
            }
          }
          // 标记已下架: 仅按【上游模型ID】(upstream_model, 缺省回落中转ID) 比对,
          // 中转ID 是用户可改的别名, 不能作为与上游清单比对的依据.
          const removedSet = new Set(d.removed||[]);
          let removedMarked=0;
          for(const m of prov.models){
            const effectiveUpstream = m.upstream_model || m.model_id;
            const wasRemoved = removedSet.has(effectiveUpstream);
            if(wasRemoved && !m._removed) removedMarked++;
            m._removed = wasRemoved;
            if(wasRemoved) m._isNew=false;
          }
          if(added>0 || removedMarked>0) this.markDirty();
          // 8 秒后自动清除 NEW 高亮
          if(added>0){
            setTimeout(()=>{ for(const m of prov.models) m._isNew=false; }, 8000);
          }
          this.providersFormOk = true;
          this.providersFormMsg = d.message + (removedSet.size ? t('removed_models_suffix',removedSet.size) : '');
        } else {
          this.providersFormOk = false;
          this.providersFormMsg = d.error || t('fetch_failed');
        }
      } catch(e) { this.providersFormMsg = t('network_error'); }
      prov._fetching = false;
      if (this.providersFormMsg) setTimeout(() => { this.providersFormMsg = ''; }, 4000);
    },
    async saveProvidersForm() {
      this.providersFormMsg='';
      // 前端预校验: name 非空且唯一 (后端也会校验拦截).
      const names = this.providersFormData.map(p=>(p.name||'').trim());
      const seen = new Set();
      for (const n of names) {
        if (!n) { this.providersFormMsg=t('provider_name_required'); this.providersFormOk=false; return; }
        if (seen.has(n)) { this.providersFormMsg=t('provider_name_duplicate',n); this.providersFormOk=false; return; }
        seen.add(n);
      }
      try {
         const providers = this.providersFormData.map(p => {
           const models = {};
           for (const m of p.models) {
             if (!m.model_id) continue;
             const cfg = {};
             if (m.upstream_model) cfg.upstream_model = m.upstream_model;
             if (m.reasoning_effort) cfg.reasoning_effort = m.reasoning_effort;
             // 协议: 仅当显式选 anthropic 才写字段, 选 openai(空)则省略回落默认.
             if (m.api_format) cfg.api_format = m.api_format;
             // 免费: 仅在与自动判定结果不同时才写显式字段, 保持配置干净;
             // 取消自动判定的免费需用户手动勾掉开关 (_freeTouched) 才写 free: false
              const autoFree = this.autoFree(m.model_id, m.upstream_model);
              if (m.free && !autoFree) cfg.free = true;
              else if (!m.free && autoFree && m._freeTouched) cfg.free = false;
              if (m.origin) cfg.origin = m.origin;
              models[m.model_id] = Object.keys(cfg).length ? cfg : {};
           }
            return {
              name: p.name,
              endpoint: p.endpoint,
              endpoint_anthropic: p.endpoint_anthropic||undefined,
              endpoint_responses: p.endpoint_responses||undefined,
              api_key_env: p.api_key_env,
              api_key_default: p.api_key_default||undefined,
              balance_endpoint: p.balance_endpoint||undefined,
              api_format: p.api_format||undefined,
              prompt_cache: p.prompt_cache,
              openai_cache_control: p.openai_cache_control,
              max_request_body_bytes: p.max_request_body_bytes,
              headers: p.headers||undefined,
              models: models,
            };
         });
         const json = JSON.stringify({providers:providers}, null, 2);
         const r=await fetch('/admin/api/providers/save',{method:'POST',headers:authHeaders(),body:JSON.stringify({json:json})});
         const d=await r.json();
         this.providersFormOk = !!d.message;
         this.providersFormMsg=d.message||d.error||t('save_failed');
          if(d.message) {
            // 配置保存成功后, 同步保存所有有草稿的 key
            await this.saveAllProviderKeys();
            this.isDirty=false;
            setTimeout(()=>this.providersFormMsg='',3000);
          }
       } catch(e){ this.providersFormMsg=t('network_error'); }
       },
       async saveAllProviderKeys() {
       // 遍历所有供应商, 保存有草稿的 key
       const keysToSave = this.providersFormData
         .filter(p => (p._keyDraft||'').trim() !== '')
         .map(p => ({ provider: p.name, value: p._keyDraft.trim() }));
       if (keysToSave.length === 0) return;
       let saved = 0, failed = 0;
       for (const { provider, value } of keysToSave) {
         try {
           const r = await fetch('/admin/api/keys', {
             method: 'PUT',
             headers: authHeaders(),
             body: JSON.stringify({ provider, value })
           });
           const d = await r.json();
           if (r.ok) {
             // 找到对应供应商并清除草稿
             const prov = this.providersFormData.find(p => p.name === provider);
             if (prov) prov._keyDraft = '';
             saved++;
           } else {
             console.error(`保存 ${provider} 的 key 失败:`, d.error);
             failed++;
           }
         } catch (e) {
           console.error(`保存 ${provider} 的 key 网络错误:`, e);
           failed++;
         }
       }
       if (saved > 0) {
         this.keyMsg = t('provider_keys_saved',saved);
         this.fetchKeys();
         setTimeout(() => this.keyMsg = '', 3000);
       }
       if (failed > 0) {
         this.keyMsg = t('provider_keys_save_failed',failed);
         setTimeout(() => this.keyMsg = '', 3000);
       }
       },
        confirmAddProvider() {
        if (!this.addProvName || !this.addProvEndpoint) return;
        this.providersFormData.push({
          name: this.addProvName,
          endpoint: this.addProvEndpoint,
          endpoint_anthropic: this.addProvAnthropicEndpoint||null,
          endpoint_responses: this.addProvResponsesEndpoint||null,
          api_key_env: this.addProvName.toUpperCase().replace(/-/g,'_')+'_KEY',
          api_key_default: null,
          balance_endpoint: this.addProvBalanceEndpoint || null,
          headers: null,
          _expanded: true,
          _testing: false,
          _testResult: null,
          _filter: '',
          _selected: {},
          models: [],
        });
        this.showAddProvider = false;
        this.addProvName = ''; this.addProvEndpoint = ''; this.addProvBalanceEndpoint = ''; this.addProvAnthropicEndpoint=''; this.addProvResponsesEndpoint='';
       this.providersFormOk = true;
       this.providersFormMsg = t('add_provider_hint');
       this.markDirty();
       setTimeout(()=>this.providersFormMsg='',3000);
     },

    // Computed
    get sRate() {
      if(!this.stats||this.stats.today_requests===0) return 100;
      return Math.round(this.stats.today_success/this.stats.today_requests*100);
    },
    get avgGenSpeed() { return Number(this.stats&&this.stats.gen_speed||0); },
    get todayCacheRate() {
      if(!this.stats) return '0.0';
      // 命中率口径: 命中 / 总输入 token (与 opencode-visual-cache 一致: 缓存读 / prompt_tokens).
      // 分母用 prompt_tokens 而非 hit+miss: creation(首次写入) 已从 miss 拆出, hit+miss ≠ prompt.
      const h=this.stats.today_total_cache_hit_tokens, p=this.stats.today_total_prompt_tokens;
      if(!p) return '0.0';
      return (h/p*100).toFixed(1);
    },
    get maxModelReqs() { if(!this.stats||!this.stats.top_models.length) return 1; return this.stats.top_models[0].requests; },
    get maxDailyReqs() { if(!this.stats||!this.stats.trends.length) return 1; return Math.max(...this.stats.trends.map(t=>t.requests),1); },
    get donutSvg() {
      if(!this.stats||!this.stats.per_model.length) return '';
      const total=this.stats.total_requests||1;
      const r=55, w=20, cx=70, cy=70, C=2*Math.PI*r;
      const top=this.stats.per_model.slice(0,8);
      const shown=top.reduce((sum,m)=>sum+(m.requests||0),0);
      const parts=top.map((m,i)=>({value:m.requests||0,color:this.donutColors[i%this.donutColors.length]}));
      if(this.stats.per_model.length>8 && total>shown) parts.push({value:total-shown,color:'#3b3d48'});
      let offset=0, segs='';
      parts.forEach(p=>{
        const len=p.value/total*C;
        segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${w}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
        offset+=len;
      });
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2d37" stroke-width="${w}"/>${segs}<text x="${cx}" y="${cy-8}" text-anchor="middle" fill="#cdd0d4" font-size="16" font-weight="700">${total}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="#6b7280" font-size="10">${t('unit_requests')}</text>`;
    },

    openLogDetail(log) { this.selectedLog=log; },
    get filteredLogs() {
      let r = this.logs;
      if (this.logProviderFilter) r = r.filter(l=>l.provider===this.logProviderFilter);
      if (this.logStatusFilter==='success') r = r.filter(l=>!this.isLogError(l));
      if (this.logStatusFilter==='error') r = r.filter(l=>this.isLogError(l));
      if (this.logTimeFilter) {
        const win = {'1h':3600,'24h':86400,'7d':604800}[this.logTimeFilter]||0;
        if (win) { const cutoff = Date.now()/1000 - win; r = r.filter(l=>l.timestamp>=cutoff); }
      }
      if(this.logSearch) {
        const q=this.logSearch.toLowerCase();
        r = r.filter(l=>l.model.toLowerCase().includes(q)||l.provider.toLowerCase().includes(q)||(l.error&&l.error.toLowerCase().includes(q))||String(l.status).includes(q));
      }
      return r;
    },
    resetLogView() { this.logPage = 0; },
    get totalLogPages() { return Math.ceil(this.filteredLogs.length/this.pageSize)||1; },
    get paginatedLogs() { return this.filteredLogs.slice(this.logPage*this.pageSize,(this.logPage+1)*this.pageSize); },

    // 独立错误列表: 直接来自 /admin/api/errors (已按时间倒序 + 仅错误), 与请求窗口解耦.
    get errorList() { return this.errors || []; },
    get recordErrorCount() { return this.logs.filter(l=>Number(l.status)>=400 || !!l.error).length; },
    get recordSuccessRate() { return this.logs.length ? Math.round((this.logs.length-this.recordErrorCount)/this.logs.length*100) : 0; },
    get recordTokenCount() { return this.logs.reduce((s,l)=>s+(Number(l.prompt_tokens)||0)+(Number(l.completion_tokens)||0),0); },


    // Formatters
    fmtMoney(v) {
      const sym = this.moneySymbol(this.currencyConfig.currency);
      return sym + this.convertCny(v).toFixed(2);
    },
    // 单价格式化: 输入/输出 (缓存价), 未配置显示「未配置」. p 来自 ModelStats.price (可能为 null).
    // 若配置了空闲时段价, 一并展示「高峰/空闲」两档, 反映 DeepSeek 等分时段计费.
    fmtPrice(p) {
      if (!p) return t('price_not_set');
      const sym = this.moneySymbol(this.currencyConfig.currency);
      const c = x => this.convertCny(x);
      let s = sym + c(p.input_per_m) + '/' + sym + c(p.output_per_m);
      if (p.cache_read_per_m != null) s += ' · ' + t('cache_label') + sym + c(p.cache_read_per_m);
      // 空闲价: 任一 offpeak 字段 > 0 即视为分时段计费, 追加「空闲」档.
      if (p.input_per_m_offpeak > 0 || p.output_per_m_offpeak > 0 || p.cache_read_per_m_offpeak > 0) {
        s += '  ' + t('offpeak_label') + ' ' + sym + c(p.input_per_m_offpeak) + '/' + sym + c(p.output_per_m_offpeak);
        if (p.cache_read_per_m_offpeak > 0) s += ' · ' + t('cache_label') + sym + c(p.cache_read_per_m_offpeak);
      }
      return s;
    },
    // 供应商 logo: 复用全局 providerLogo() (内联官方 SVG, 缺失回退首字母徽标).
    providerLogo(p) {
      return window.providerLogo(p);
    },
    fmtTs(ts) { const d=new Date(ts*1000); const loc=(window.Alpine&&Alpine.store('i18n')&&Alpine.store('i18n').lang==='en-US')?'en-US':'zh-CN'; return d.toLocaleTimeString(loc,{hour12:false}); },
    fmtDateTime(ts){ const d=new Date(ts*1000); const loc=(window.Alpine&&Alpine.store('i18n')&&Alpine.store('i18n').lang==='en-US')?'en-US':'zh-CN'; return d.toLocaleString(loc); },
    fmtMs(ms) { if(ms<1000) return Math.round(ms)+'ms'; return (ms/1000).toFixed(1)+'s'; },
    fmtT(n) { if(n<1000) return n; if(n<1000000) return (n/1000).toFixed(1)+'K'; return (n/1000000).toFixed(1)+'M'; },
    fmtB(b) {
      if(b===0) return '0B'; if(b<1024) return b+'B'; if(b<1048576) return (b/1024).toFixed(1)+'KB';
      return (b/1048576).toFixed(1)+'MB';
    },
  };
}
</script>
