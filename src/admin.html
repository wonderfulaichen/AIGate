    },
    // ── 热力图 SVG (GitHub 风格周对齐: 列=周, 行=星期几) ──
    get heatmapSvg() {
      const hs = this.hourlyStats || [];
      if (!hs.length) return '';

      // 1. 聚合到天 (MM/DD)
      const dayTotals = {};
      hs.forEach(h => {
        const d = h.date.split(' ')[0];
        dayTotals[d] = (dayTotals[d] || 0) + h.requests;
      });
      const dateKeys = Object.keys(dayTotals);
      if (!dateKeys.length) return '';

      // 2. 解析日期并排序
      const now = new Date(); const yr = now.getFullYear();
      const parsed = dateKeys.map(k => {
        const [m, dd] = k.split('/').map(Number);
        return { key: k, date: new Date(yr, m - 1, dd) };
      }).sort((a, b) => a.date - b.date);

      const minDate = parsed[0].date;
      const maxDate = parsed[parsed.length - 1].date;

      // 3. 找到 minDate 所在周的周一 (GitHub 以周一为一周起始)
      const getMonday = (date) => {
        const d = new Date(date);
        const day = d.getDay(); // 0=Sun, 1=Mon ... 6=Sat
        const diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        return d;
      };
      const startMonday = getMonday(minDate);

      // 4. 计算总周数
      const endSunday = getMonday(maxDate);
      endSunday.setDate(endSunday.getDate() + 6);
      const totalDays = Math.ceil((endSunday - startMonday) / 86400000) + 1;
      const weeks = Math.ceil(totalDays / 7);

      // 5. 构建日期网格: dateGrid[week][dow] = "MM/DD"
      const dateGrid = [];
      for (let w = 0; w < weeks; w++) {
        dateGrid[w] = [];
        for (let dow = 0; dow < 7; dow++) {
          const d = new Date(startMonday);
          d.setDate(d.getDate() + w * 7 + dow);
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          dateGrid[w][dow] = `${mm}/${dd}`;
        }
      }

      // 6. 最大值 & 颜色
      const mx = Math.max(...Object.values(dayTotals), 1);
      const colors = ['#1e2028', '#1a2332', '#1e3a5f', '#2563eb', '#60a5fa', '#93c5fd'];

      // 7. 尺寸
      const cellW = 14, cellH = 14, gap = 3;
      const leftLabelW = 28, topLabelH = 18;
      const W = leftLabelW + weeks * (cellW + gap);
      const H = topLabelH + 7 * (cellH + gap) + 4;

      let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;

      // 行标签 (周一~周日)
      const dayLabels = ['一', '二', '三', '四', '五', '六', '日'];
      dayLabels.forEach((l, j) => {
        const y = topLabelH + j * (cellH + gap) + cellH / 2;
        s += `<text x="0" y="${y}" font-size="9" fill="#6b7280" dominant-baseline="middle">${l}</text>`;
      });

      // 格子
      for (let w = 0; w < weeks; w++) {
        for (let dow = 0; dow < 7; dow++) {
          const d = dateGrid[w][dow];
          const v = dayTotals[d] || 0;
          const level = v === 0 ? 0 : Math.min(5, Math.floor(v / mx * 5) + 1);
          const x = leftLabelW + w * (cellW + gap);
          const y = topLabelH + dow * (cellH + gap);
           s += `<rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" rx="2" fill="${colors[level]}"><title>${d}: ${v} ${window.t ? window.t('unit_times') : '次'}</title></rect>`;
        }
      }

      // 列标签 (月份标记: 每月第一周标注)
      let lastMonth = -1;
      for (let w = 0; w < weeks; w++) {
        const [m] = dateGrid[w][0].split('/').map(Number);
        if (m !== lastMonth) {
          lastMonth = m;
          const x = leftLabelW + w * (cellW + gap);
          s += `<text x="${x}" y="${topLabelH - 5}" font-size="8" fill="#6b7280" text-anchor="middle">${m}月</text>`;
        }
      }

      s += '</svg>';
      return s;
    },
    // ── 趋势图 SVG (line/bar 共用坐标系: 第 j 列中心 x=35+j*70) ──
    get trendSvg() {
      const t=this.stats?.trends||[]; if(!t.length) return '';
      const n=t.length, W=n*70, H=132;
      const barMode=this.chartMode==='bar';
      const vals=t.map(tr=>{
        if(this.dailyMode==='cost') return tr.total_cost||0;
        if(this.dailyMode==='tokens') return (tr.total_prompt_tokens||0)+(tr.total_completion_tokens||0);
        if(this.dailyMode==='latency') return tr.avg_latency||0;
        return tr.requests;
      });
      const mx=Math.max(...vals,1);
      const stroke=barMode?'#a78bfa':(this.dailyMode==='tokens'?'#a78bfa':this.dailyMode==='latency'?'#f59e0b':'#818cf8');
      let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;
      s+=`<defs><linearGradient id="trendArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${stroke}" stop-opacity="0.26"/><stop offset="100%" stop-color="${stroke}" stop-opacity="0"/></linearGradient></defs>`;
      // 数据点 hover 提示（原生 title，零 JS、零常驻视觉噪音）
      const tipText=(tr,v)=>{
        if(this.dailyMode==='cost') return this.fmtMoney(v)+(this.currencyConfig?.currency||'');
        if(this.dailyMode==='tokens') return this.fmtT(v)+' '+window.t('unit_tokens');
        if(this.dailyMode==='latency') return this.fmtMs(v);
        return v+' '+window.t('unit_times');
      };
      // 网格线 + Y 轴标签（左 30px 内）
      for(let i=1;i<=3;i++) s+=`<line x1="30" x2="${W}" y1="${20+i*30}" y2="${20+i*30}" stroke="#2a2d37" stroke-width="0.5"/>`;
      for(let i=0;i<=4;i++){
        const y=20+i*22;
        const v=Math.round(mx*(1-i/4));
        const label = this.dailyMode==='cost'? this.fmtMoney(v): (this.dailyMode==='tokens'||this.dailyMode==='latency')? (v>999? (v/1000).toFixed(1)+'K':v): v;
        s+=`<text x="0" y="${y+3}" font-size="8" fill="#6b7280" text-anchor="start">${label}</text>`;
      }
      if(barMode){
        // 条形
        vals.forEach((v,i)=>{
          const h=Math.max((v/mx)*88,0);
          s+=`<rect x="${i*70+10}" y="${108-h}" width="50" height="${h}" rx="4" fill="${stroke}" opacity="0.85"><title>${t[i].date}: ${tipText(t[i],v)}</title></rect>`;
        });
      } else {
        // 折线 + 面积渐变
        const ptsArr=vals.map((v,i)=>[35+i*70, 108-(v/mx)*88]);
        const area=`${ptsArr[0][0]},108 ` + ptsArr.map(p=>p[0]+','+p[1]).join(' ') + ` ${ptsArr[ptsArr.length-1][0]},108`;
        s+=`<polygon points="${area}" fill="url(#trendArea)" stroke="none"/>`;
        const pts=ptsArr.map(p=>p.join(',')).join(' ');
        s+=`<polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
        vals.forEach((v,i)=>{
          const y=108-(v/mx)*88;
          s+=`<circle cx="${35+i*70}" cy="${y}" r="3" fill="${stroke}" stroke="#1e2028" stroke-width="1" style="cursor:pointer"><title>${t[i].date}: ${tipText(t[i],v)}</title></circle>`;
        });
      }
      // x 轴日期标签 (稀疏, 与下方列 div 对齐)
      const step=Math.max(1,Math.ceil(n/8));
      t.forEach((tr,i)=>{
        if(i%step!==0 && i!==n-1) return;
        s+=`<text x="${35+i*70}" y="126" text-anchor="middle" font-size="10" fill="#6b7280">${tr.date}</text>`;
      });
      s+='</svg>';
      return s;
    },
    async fetchBalance() {
      this.balanceLoading = true;
      try {
        const r = await fetch('/admin/api/balance', {headers: authHeaders()});
        if (r.ok) {
          const data = await r.json();
          this.balanceData = data.balances || [];
        }
      } catch(e) {}
      this.balanceLoading = false;

    // 重置倒计时格式化 (秒 -> "Xh Ym" / "Xm Ys")
    fmtResetIn(sec) {
      sec = Math.max(0, Math.trunc(sec || 0));
      const d = Math.floor(sec / 86400);
      const h = Math.floor((sec % 86400) / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (d > 0) return d + 'd ' + h + 'h';
      if (h > 0) return h + 'h ' + m + 'm';
      return m + 'm ' + s + 's';
    },
    async saveManualBalance(provider) {
      const val = parseFloat(this.balanceEditValue);
      if (isNaN(val) || val < 0) return;
      try {

     deleteModel(pi, mi) {

      markDirty(){ this.isDirty = true; },
      isAllSelected(prov){

        const idxs=prov.models.map((m,i)=>i).filter(i=> !q || (prov.models[i].model_id||'').toLowerCase().includes(q) || (prov.models[i].upstream_model||'').toLowerCase().includes(q));

        (prov._selected||{});
        Object.keys(prov._selected||{}).forEach(k=>{

        });

        if(v===undefined) return;

          if(prov._selected[k]){ prov.models[k].api_format=v; prov.models[k]._fmtTouched=true; }
        });

      applyBulkFree(pi, val){

          if(prov._selected[k]){ prov.models[k].free=val; prov.models[k]._freeTouched=true; }
        });

      deleteSelected(pi){
        const prov=this.providersFormData[pi];
        const idxs=Object.keys(prov._selected||{}).filter(k=>prov._selected[k]).map(Number).sort((a,b)=>b-a);
        if(!idxs.length) return;
        if(!confirm('确认删除选中的 '+idxs.length+' 个模型？')) return;
        idxs.forEach(i=> prov.models.splice(i,1));
        prov._selected={};
        this.markDirty();
      },
      clearRemoved(pi){
        const prov=this.providersFormData[pi];
        const idxs=prov.models.map((m,i)=> m._removed ? i : -1).filter(i=>i>=0).sort((a,b)=>b-a);
        if(!idxs.length) return;
        if(!confirm('确认清理 '+idxs.length+' 个已下架模型？')) return;
        idxs.forEach(i=> prov.models.splice(i,1));
        this.markDirty();
        toast('已清理 '+idxs.length+' 个下架模型', 'success');
      },
      importModels(pi, event){
        const prov=this.providersFormData[pi];
        const file=event.target.files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>{
          const text=reader.result||'';
          const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
          let added=0;
          for(const line of lines){
            if(line.startsWith('#')) continue;
            const parts=line.split(/[,;\t|]/).map(s=>s.trim()).filter(Boolean);
            if(!parts.length) continue;
            const model_id=parts[0];
            const upstream=parts[1]||model_id;
            const effort=parts[2]||'';
            const fmt=parts[3]||'';
            if(prov.models.some(m=>m.model_id===model_id)) continue;
            prov.models.push({model_id, upstream_model:upstream, reasoning_effort:effort, api_format:fmt, free:this.autoFree(model_id, upstream), _freeTouched:false, _fmtTouched:!!fmt});
            added++;
          }
          this.markDirty();
          toast('已导入 '+added+' 个模型', 'success');
        };
        reader.readAsText(file);
        event.target.value='';
      },
      exportModels(pi){
        const prov=this.providersFormData[pi];
        const selected=Object.keys(prov._selected||{}).filter(k=>prov._selected[k]).map(k=>prov.models[k]).filter(Boolean);
        const list = selected.length? selected : prov.models;
        const csv=list.map(m=> [m.model_id, m.upstream_model||'', m.reasoning_effort||'', m.api_format||''].join(',')).join('\n');
        const blob=new Blob([csv],{type:'text/csv'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download=prov.name+'-models.csv'; a.click(); URL.revokeObjectURL(url);
      },
      async testProvider(pi) {
       const prov = this.providersFormData[pi];
       prov._testing = true;

         if(r.ok) prov._testResult = await r.json();
         else prov._testResult = {success:false,status:t('request_failed'),latency_ms:0};
       } catch(e){ prov._testResult = {success:false,status:t('network_error'),latency_ms:0}; }

     },
     // 拉取模型: 后端仅写入内存注册表 (即时生效) 并返回模型列表; 这里合并进表单,
    // 待用户点"保存配置"才持久化 —— 避免直接写盘冲掉表单里其它未保存改动.
    async fetchProviderModels(pi) {
      const prov = this.providersFormData[pi];
      prov._fetching = true;
      try {
        const r = await fetch('/admin/api/providers/'+encodeURIComponent(prov.name)+'/fetch-models', {method:'POST', headers:authHeaders()});
        const d = await r.json();
        if (r.ok && d.success) {
          // 去重: 基于 upstream_model (与后端 add_models 一致), 而非 model_id.
          const existingUpstream = new Set(prov.models.map(m=>m.upstream_model||m.model_id));
          let added=0;
          for (const id of (d.models||[])) {
            if (!existingUpstream.has(id)) {
              prov.models.push({ model_id:id, upstream_model:id, reasoning_effort:'', api_format:this.defaultApiFormat(id), origin:'fetched', _isNew:true, _removed:false, free:this.autoFree(id,id), _freeTouched:false, _fmtTouched:false });
              existingUpstream.add(id);
              added++;
            }
          }
          // 标记已下架
          const removedSet = new Set(d.removed||[]);
          let removedMarked=0;
          for(const m of prov.models){
            const wasRemoved = removedSet.has(m.model_id) || removedSet.has(m.upstream_model);
            if(wasRemoved && !m._removed) removedMarked++;
            m._removed = wasRemoved;
            if(wasRemoved) m._isNew=false;
          }
          if(added>0 || removedMarked>0) this.markDirty();
          // 8 秒后自动清除 NEW 高亮
          if(added>0){
            setTimeout(()=>{ for(const m of prov.models) m._isNew=false; }, 8000);
          }
          this.providersFormOk = true;
          this.providersFormMsg = d.message + (removedSet.size ? ' | 下架 ' + removedSet.size + ' 个' : '');
        } else {
          this.providersFormOk = false;
          this.providersFormMsg = d.error || t('fetch_failed');
        }
      } catch(e) { this.providersFormMsg = t('network_error'); }
      prov._fetching = false;
      if (this.providersFormMsg) setTimeout(() => { this.providersFormMsg = ''; }, 4000);
    },
    async saveProvidersForm() {
      this.providersFormMsg='';
      // 前端预校验: name 非空且唯一 (后端也会校验拦截).
      const names = this.providersFormData.map(p=>(p.name||'').trim());
      const seen = new Set();
      for (const n of names) {
        if (!n) { this.providersFormMsg='供应商 name 不能为空'; this.providersFormOk=false; return; }
        if (seen.has(n)) { this.providersFormMsg='供应商 name 重复: '+n; this.providersFormOk=false; return; }
        seen.add(n);
      }
      try {
         const providers = this.providersFormData.map(p => {
           const models = {};
           for (const m of p.models) {
             if (!m.model_id) continue;
             const cfg = {};
             if (m.upstream_model) cfg.upstream_model = m.upstream_model;
             if (m.reasoning_effort) cfg.reasoning_effort = m.reasoning_effort;
             // 协议: 仅当显式选 anthropic 才写字段, 选 openai(空)则省略回落默认.
             if (m.api_format) cfg.api_format = m.api_format;
             // 免费: 仅在与自动判定结果不同时才写显式字段, 保持配置干净;
             // 取消自动判定的免费需用户手动勾掉开关 (_freeTouched) 才写 free: false
              const autoFree = this.autoFree(m.model_id, m.upstream_model);
              if (m.free && !autoFree) cfg.free = true;
              else if (!m.free && autoFree && m._freeTouched) cfg.free = false;
              if (m.origin) cfg.origin = m.origin;
              models[m.model_id] = Object.keys(cfg).length ? cfg : {};
           }
            return {
              name: p.name,
              endpoint: p.endpoint,
              endpoint_anthropic: p.endpoint_anthropic||undefined,
              endpoint_responses: p.endpoint_responses||undefined,
              api_key_env: p.api_key_env,
              api_key_default: p.api_key_default||undefined,
              balance_endpoint: p.balance_endpoint||undefined,
              api_format: p.api_format||undefined,
              prompt_cache: p.prompt_cache,
              openai_cache_control: p.openai_cache_control,
              max_request_body_bytes: p.max_request_body_bytes,
              headers: p.headers||undefined,
              models: models,
            };
         });
         const json = JSON.stringify({providers:providers}, null, 2);
         const r=await fetch('/admin/api/providers/save',{method:'POST',headers:authHeaders(),body:JSON.stringify({json:json})});
         const d=await r.json();
         this.providersFormOk = !!d.message;
         this.providersFormMsg=d.message||d.error||t('save_failed');
          if(d.message) {
            // 配置保存成功后, 同步保存所有有草稿的 key
            await this.saveAllProviderKeys();
            this.fetchRoutes();
            this.isDirty=false;
            setTimeout(()=>this.providersFormMsg='',3000);
          }
       } catch(e){ this.providersFormMsg=t('network_error'); }
       },
       async saveAllProviderKeys() {
       // 遍历所有供应商, 保存有草稿的 key
       const keysToSave = this.providersFormData
         .filter(p => (p._keyDraft||'').trim() !== '')
         .map(p => ({ provider: p.name, value: p._keyDraft.trim() }));
       if (keysToSave.length === 0) return;
       let saved = 0, failed = 0;
       for (const { provider, value } of keysToSave) {
         try {
           const r = await fetch('/admin/api/keys', {
             method: 'PUT',
             headers: authHeaders(),
             body: JSON.stringify({ provider, value })
           });
           const d = await r.json();
           if (r.ok) {
             // 找到对应供应商并清除草稿
             const prov = this.providersFormData.find(p => p.name === provider);
             if (prov) prov._keyDraft = '';
             saved++;
           } else {
             console.error(`保存 ${provider} 的 key 失败:`, d.error);
             failed++;
           }
         } catch (e) {
           console.error(`保存 ${provider} 的 key 网络错误:`, e);
           failed++;
         }
       }
       if (saved > 0) {
         this.keyMsg = `已保存 ${saved} 个供应商的密钥`;
         this.fetchKeys();
         setTimeout(() => this.keyMsg = '', 3000);
       }
       if (failed > 0) {
         this.keyMsg = `${failed} 个供应商的密钥保存失败`;
         setTimeout(() => this.keyMsg = '', 3000);
       }
       },
        confirmAddProvider() {
        if (!this.addProvName || !this.addProvEndpoint) return;
        this.providersFormData.push({
          name: this.addProvName,
          endpoint: this.addProvEndpoint,
          endpoint_anthropic: this.addProvAnthropicEndpoint||null,
          endpoint_responses: this.addProvResponsesEndpoint||null,
          api_key_env: this.addProvName.toUpperCase().replace(/-/g,'_')+'_KEY',
          api_key_default: null,
          balance_endpoint: this.addProvBalanceEndpoint || null,
          headers: null,
          _expanded: true,
          _testing: false,
          _testResult: null,
          models: [],
        });
        this.showAddProvider = false;
        this.addProvName = ''; this.addProvEndpoint = ''; this.addProvBalanceEndpoint = ''; this.addProvAnthropicEndpoint=''; this.addProvResponsesEndpoint='';
       this.providersFormOk = true;
       this.providersFormMsg = t('add_provider_hint');
       this.markDirty();
       setTimeout(()=>this.providersFormMsg='',3000);
     },

    // Computed
    get sRate() {
      if(!this.stats||this.stats.today_requests===0) return 100;
      return Math.round(this.stats.today_success/this.stats.today_requests*100);
    },
    get todayCacheRate() {
      if(!this.stats) return '0.0';
      // 命中率口径: 命中 / 总输入 token (与 opencode-visual-cache 一致: 缓存读 / prompt_tokens).
      // 分母用 prompt_tokens 而非 hit+miss: creation(首次写入) 已从 miss 拆出, hit+miss ≠ prompt.
      const h=this.stats.today_total_cache_hit_tokens, p=this.stats.today_total_prompt_tokens;
      if(!p) return '0.0';
      return (h/p*100).toFixed(1);
    },
    get maxModelReqs() { if(!this.stats||!this.stats.top_models.length) return 1; return this.stats.top_models[0].requests; },
    get maxDailyReqs() { if(!this.stats||!this.stats.trends.length) return 1; return Math.max(...this.stats.trends.map(t=>t.requests),1); },
    get donutSvg() {
      if(!this.stats||this.stats.per_model.length===0) return '';
      const total=this.stats.total_requests||1;
      const r=55, w=20, cx=70, cy=70;
      const C=2*Math.PI*r;
      let offset=0;
      let segs='';
      const models=this.stats.per_model.slice(0,8);
      models.forEach((m,i)=>{
        const pct=m.requests/total;
        const len=pct*C;
        const color=this.donutColors[i%this.donutColors.length];
        segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
        offset+=len;
      });
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2d37" stroke-width="${w}"/>${segs}<text x="${cx}" y="${cy-8}" text-anchor="middle" fill="#cdd0d4" font-size="16" font-weight="700">${total}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="#6b7280" font-size="10">${t('unit_requests')}</text>`;
    },

    get filteredLogs() {
      let r = this.logs;
      if (this.logProviderFilter) r = r.filter(l=>l.provider===this.logProviderFilter);
      if (this.logStatusFilter==='success') r = r.filter(l=>l.status<400);
      if (this.logStatusFilter==='error') r = r.filter(l=>l.status>=400);
      if(this.logSearch) {
        const q=this.logSearch.toLowerCase();
        r = r.filter(l=>l.model.toLowerCase().includes(q)||l.provider.toLowerCase().includes(q)||(l.error&&l.error.toLowerCase().includes(q))||String(l.status).includes(q));
      }
      return r;
    },
    get totalLogPages() { return Math.ceil(this.filteredLogs.length/this.pageSize)||1; },
    get paginatedLogs() { return this.filteredLogs.slice(this.logPage*this.pageSize,(this.logPage+1)*this.pageSize); },

    // 独立错误列表: 直接来自 /admin/api/errors (已按时间倒序 + 仅错误), 与请求窗口解耦.
    get errorList() { return this.errors || []; },

    // Daily trends chart points (requests / latency / tokens)
    get dailyTp() {
      if(!this.stats||this.stats.trends.length<2) return [];
      const t=this.stats.trends,n=t.length;
      let vals;
      if(this.dailyMode==='cost') vals=t.map(d=>d.total_cost||0);
      else if(this.dailyMode==='latency') vals=t.map(d=>d.avg_latency||0);
      else if(this.dailyMode==='tokens') vals=t.map(d=>(d.total_prompt_tokens||0)+(d.total_completion_tokens||0));
      else vals=t.map(d=>d.requests);
      const mv=Math.max(...vals,1);
      const w=n*70,h=120,pX=35,pY=12;
      return t.map((d,i)=>({x:pX+i*(w-2*pX)/(n-1||1),y:h-pY-(vals[i]/mv)*(h-2*pY)}));
    },
    get dailyTps() { return this.dailyTp.map(p=>p.x+','+p.y).join(' '); },
    get dailyArea() {
      const p=this.dailyTp; if(p.length<2) return '';
      return `M${p[0].x},108L${p[0].x},${p[0].y} ${p.slice(1).map(x=>`L${x.x},${x.y}`).join(' ')}L${p[p.length-1].x},108Z`;
    },

    // Formatters
    fmtMoney(v) {
      const sym = this.moneySymbol(this.currencyConfig.currency);
      return sym + this.convertCny(v).toFixed(2);
    },
    // 单价格式化: 输入/输出 (缓存价), 未配置显示「未配置」. p 来自 ModelStats.price (可能为 null).
    // 若配置了空闲时段价, 一并展示「高峰/空闲」两档, 反映 DeepSeek 等分时段计费.
    fmtPrice(p) {
      if (!p) return t('price_not_set');
      const sym = this.moneySymbol(this.currencyConfig.currency);
      const c = x => this.convertCny(x);
      let s = sym + c(p.input_per_m) + '/' + sym + c(p.output_per_m);
      if (p.cache_read_per_m != null) s += ' · ' + t('cache_label') + sym + c(p.cache_read_per_m);
      // 空闲价: 任一 offpeak 字段 > 0 即视为分时段计费, 追加「空闲」档.
      if (p.input_per_m_offpeak > 0 || p.output_per_m_offpeak > 0 || p.cache_read_per_m_offpeak > 0) {
        s += '  ' + t('offpeak_label') + ' ' + sym + c(p.input_per_m_offpeak) + '/' + sym + c(p.output_per_m_offpeak);
        if (p.cache_read_per_m_offpeak > 0) s += ' · ' + t('cache_label') + sym + c(p.cache_read_per_m_offpeak);
      }
      return s;
    },
    // 供应商 logo: 复用全局 providerLogo() (内联官方 SVG, 缺失回退首字母徽标).
    providerLogo(p) {
      return window.providerLogo(p);
    },
    fmtTs(ts) { const d=new Date(ts*1000); const loc=(window.Alpine&&Alpine.store('i18n')&&Alpine.store('i18n').lang==='en-US')?'en-US':'zh-CN'; return d.toLocaleTimeString(loc,{hour12:false}); },
    fmtDateTime(ts){ const d=new Date(ts*1000); const loc=(window.Alpine&&Alpine.store('i18n')&&Alpine.store('i18n').lang==='en-US')?'en-US':'zh-CN'; return d.toLocaleString(loc); },
    fmtMs(ms) { if(ms<1000) return Math.round(ms)+'ms'; return (ms/1000).toFixed(1)+'s'; },
    fmtT(n) { if(n<1000) return n; if(n<1000000) return (n/1000).toFixed(1)+'K'; return (n/1000000).toFixed(1)+'M'; },
    fmtB(b) {
      if(b===0) return '0B'; if(b<1024) return b+'B'; if(b<1048576) return (b/1024).toFixed(1)+'KB';
      return (b/1048576).toFixed(1)+'MB';
    },
  };
}
</script>
<!-- 全局 Toast 通知容器 -->
<div x-data x-cloak
     class="fixed top-4 right-4 z-[100] flex flex-col gap-2 items-end pointer-events-none">
  <template x-for="t in $store.toast.items" :key="t.id">
    <div class="pointer-events-auto px-4 py-2 rounded-lg shadow-lg text-sm font-medium text-white max-w-xs transition"
         :class="{
           'bg-green-600': t.type==='success',
           'bg-red-600': t.type==='error',
           'bg-gray-700': t.type!=='success' && t.type!=='error'
         }"
         x-text="t.msg"
         @click="$store.toast.dismiss(t.id)"
         style="cursor:pointer"></div>
  </template>
</div>
</body>
