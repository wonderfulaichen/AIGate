});

<style>

html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){.body{flex-direction:column}.sb{width:100%!important;height:52px;flex-direction:row;border-right:none;border-top:1px solid var(--border-subtle)}.sb .sb-nav{display:flex;overflow-x:auto;gap:4px;padding:4px 8px}.sb .sb-glabel{display:none}.sb .sb-item{flex-direction:column;font-size:9px;padding:6px 8px;gap:2px}.sb .sb-item.active::before{display:none}.sb .sb-item span{opacity:1;width:auto}.sb .sb-foot{display:none}}

.page-wide{width:100%;max-width:1600px;margin:0 auto}
.about-page{width:100%;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.about-capabilities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px}

/* ── new-api header + sidebar ── */
.hdr{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:rgba(12,12,16,.92);flex-shrink:0}
.hdr-title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--fg)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sidebar-group{padding:14px 12px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.6;white-space:nowrap;overflow:hidden}
.sidebar-group + .sidebar-group{margin-top:8px}
.sb .sidebar-item span{overflow:hidden;transition:opacity .15s;white-space:nowrap}
/* ── new-api panel ── */
.pnl{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.pnl-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.pnl-ht{font-size:13px;font-weight:600;color:var(--fg)}
.pnl-b{padding:16px}
/* 组内子卡头: 与 .st 同款的弱化标题, 但作为面板内部的次级分区 —— 用上边框与
   上方行为界, 不占独立分区的层级 (响应缓存是性能优化的子项, 不是并列分区). */
.sub-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;margin-top:2px;border-top:1px solid var(--border);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* ── new-api page header ── */
.phd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.pt{font-size:clamp(1.25rem,2.5vw,1.5rem);font-weight:800;letter-spacing:-.02em;color:var(--fg);line-height:1.2}
.ps{font-size:13px;color:var(--muted);margin-top:2px}
/* ── new-api form rows ── */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px}
/* 左侧文案可收缩、右侧控件组保住宽度: 否则长说明会把多控件行挤到换行
   (实测「连接参数」一行三控件: 需要 347px 而只剩 341px, 第三个被挤到第二行, 行高 68 -> 161). */
.set-row>*:first-child{flex:1 1 auto;min-width:0}
.set-row>*:last-child{flex:0 0 auto}
.row-t{font-size:13px;font-weight:600;color:var(--fg)}
.row-d{font-size:12px;color:var(--muted);margin-top:2px;max-width:560px}
.cg{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
.chkbox{accent-color:var(--primary);width:14px;height:14px;cursor:pointer}
/* ── new-api toggle ── */
.tgl{position:relative;width:40px;height:22px;border-radius:11px;cursor:pointer;transition:background .2s;border:none;padding:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl.on{background:var(--primary)}.tgl.on::after{transform:translateX(18px)}
.tgl.off{background:#3a3a44}
/* ── new-api segmented control ── */
.seg{display:inline-flex;background:rgba(255,255,255,.06);border-radius:8px;padding:2px}
.seg-i{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg-i.a{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* ── new-api badge ── */
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.02em}
.bdg-g{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border-subtle)}
.bdg-p{background:rgba(99,102,241,.15);color:var(--indigo);border:1px solid rgba(99,102,241,.25)}
.bdg-e{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.bdg-s{background:rgba(52,211,153,.12);color:#a7f3d0;border:1px solid rgba(52,211,153,.25)}
.bdg-w{background:rgba(245,158,11,.12);color:#fde68a;border:1px solid rgba(245,158,11,.25)}
/* ── new-api button ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s;border:none}
.btn-p{background:var(--primary);color:var(--primary-fg)}.btn-p:hover{background:var(--primary-h)}
.btn-g{background:transparent;color:var(--muted)}.btn-g:hover{background:rgba(255,255,255,.06);color:var(--fg)}
.btn-o{background:transparent;color:var(--fg);border:1px solid var(--border-s)}.btn-o:hover{background:rgba(255,255,255,.06)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
@keyframes aispin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:aispin .6s linear infinite;flex:0 0 auto}
/* ── new-api input ── */
.inp{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--fg);transition:border-color .15s,box-shadow .15s}

/* ── plaza ── */
.plaza-hd{text-align:center;padding:24px 0 16px}
.plaza-t{font-size:clamp(1.5rem,4vw,2.25rem);font-weight:800;letter-spacing:-.02em;color:var(--fg)}

.dr-model-table-scroll{min-width:0;overflow-x:auto}
.dr-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 24px;border-top:1px solid var(--border);flex-shrink:0}
/* ── section cards ── */
.sec{margin:0;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec-hdr{display:flex;align-items:center;gap:10px;padding:14px 24px;cursor:default}
.sec-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.sec-ic.blue{background:rgba(99,102,241,.12);color:#818cf8}
.sec-ic.green{background:rgba(52,211,153,.12);color:#34d399}
.sec-ic.amber{background:rgba(245,158,11,.12);color:#f59e0b}
.sec-ic.purple{background:rgba(167,139,250,.12);color:#a78bfa}
.sec-title{font-size:13px;font-weight:600;color:var(--fg)}
.sec-sub{font-size:11px;color:var(--muted)}
.sec-body{padding:0 24px 16px}
/* ── field rows ── */
.f-row{display:flex;flex-direction:column;gap:4px}
.f-row label{font-size:12px;font-weight:500;color:var(--muted)}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.f-grid{grid-template-columns:1fr}}
/* ── misc ── */
.dirty{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:600;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.25)}
.key-status-row{font-size:11px;color:var(--muted);margin-bottom:8px}
.mono{font-family:'JetBrains Mono',monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.fb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}
.mt2{margin-top:8px}
.txs{font-size:11px}.txsm{font-size:12.5px}
.fw6{font-weight:600}.fw7{font-weight:700}
.tm{color:var(--muted)}
[x-cloak]{display:none!important}

</style>
</head>
<body>
<div class="layout" x-data="dashboard()" x-init="init()">
<header class="hdr">
  <button @click="sbCollapsed=!sbCollapsed" class="btn-g" style="padding:4px 6px;border-radius:6px" :title="t('toggle_sidebar')" :aria-label="t('toggle_sidebar')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span class="hdr-title">AIGate</span>
  <div class="hdr-right">
    <span class="txs mono tm">v<span x-text="version.version"></span></span>
    <select class="sel" style="font-size:11px;padding:3px 24px 3px 8px" @change="setLang($event.target.value)" x-effect="$el.value=(Alpine.store('i18n')||{}).lang||'zh-CN'">
      <option value="zh-CN" x-text="t('lang_zh')"></option><option value="en-US" x-text="t('lang_en')"></option>
    </select>
  </div>
</header>
<div class="body">
<nav class="sb" :class="{'colapsed':sbCollapsed}">
  <div class="sb-nav">
    <div class="sb-glabel" x-text="t('nav_group.monitor')"></div>
    <a href="#" @click.prevent="switchTab('dashboard')" class="sb-item" :class="{'active':activeTab==='dashboard'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span x-text="t('nav.dashboard')"></span></a>
    <a href="#" @click.prevent="switchTab('analytics')" class="sb-item" :class="{'active':activeTab==='analytics'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg><span x-text="t('nav.analytics')"></span></a>
    <a href="#" @click.prevent="switchTab('records')" class="sb-item" :class="{'active':activeTab==='records'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span x-text="t('nav.records')"></span></a>
    <div class="sb-glabel" x-text="t('nav_group.config')"></div>

    <a href="#" @click.prevent="switchTab('providers')" class="sb-item" :class="{'active':activeTab==='providers'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="6" rx="2"/><rect x="3" y="15" width="18" height="6" rx="2"/><circle cx="7" cy="6" r="0.5" fill="currentColor"/><circle cx="7" cy="18" r="0.5" fill="currentColor"/></svg><span x-text="t('nav.providers')"></span></a>
    <a href="#" @click.prevent="switchTab('settings')" class="sb-item" :class="{'active':activeTab==='settings'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span x-text="t('nav.settings')"></span></a>
    <div class="sb-glabel" x-text="t('nav_group.system')"></div>
    <a href="#" @click.prevent="switchTab('about')" class="sb-item" :class="{'active':activeTab==='about'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><circle cx="12" cy="8" r="0.5" fill="currentColor"/></svg><span x-text="t('nav.about')"></span></a>
  </div>
</nav>
<main class="main">
<template x-if="loading && !stats"><div style="display:flex;align-items:center;justify-content:center;min-height:120px;padding:48px 16px"><div style="width:200px;height:3px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,var(--primary),#818cf8);border-radius:99px;width:60%;animation:loadBar 1.8s ease-in-out infinite"></div></div></div></template>
<template x-if="statsError && !stats"><div class="pnl" style="margin-bottom:16px"><div class="pnl-b" style="text-align:center;padding:40px 16px"><div class="tm" style="margin-bottom:14px" x-text="t('fetch_failed')"></div><button class="btn btn-g" @click="retryFetchStats()" x-text="t('refresh')"></button></div></div></template>
<div x-show="activeTab==='dashboard'" class="page-enter ov-page">
  <div class="phd">
    <div><h1 class="pt" x-text="t('dashboard_title')"></h1><p class="ps" x-text="t('dashboard_subtitle')"></p></div>
    <div class="ov-actions"><span class="bdg bdg-s">● <span x-text="t('service_running')"></span></span><button class="btn btn-g" @click="fetchStats();fetchBalance();fetchHealth()" x-text="t('refresh')"></button></div>
  </div>
  <template x-if="!statsError && (!stats || stats.total_requests===0)">
    <div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px 16px">
      <span class="bdg bdg-s mb2" x-text="t('service_running')"></span>
      <h2 style="font-size:1.1rem;font-weight:600;color:var(--fg);margin:8px 0" x-text="t('waiting_first_request')"></h2>
      <p class="txsm tm mb3" x-text="t('setup_hint')"></p>
      <div class="fb" style="max-width:460px;margin:0 auto;padding:10px 14px;background:var(--input);border-radius:8px;border:1px solid var(--border)"><span class="mono txsm" style="color:var(--fg);overflow:hidden;text-overflow:ellipsis" x-text="baseUrl"></span><button class="btn btn-g" style="font-size:11px" @click="copyText(baseUrl,'base')" x-text="copiedField==='base'?t('copied'):t('copy')"></button></div>
    </div></div>
  </template>
  <template x-if="stats && stats.total_requests>0">
    <div class="ov-grid">
      <div class="ov-main">
        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht"><span x-text="t('usage_glance')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('usage_glance_desc')"></div></div><span class="txs tm" :title="heroScopeHint" x-text="heroScopeLabel"></span></div><div class="pnl-b"><div class="ov-summary-grid">
          <div class="ov-summary-card"><div class="ov-kpi-top"><span class="ov-kpi-label" x-text="t('hero_requests')"></span><span class="ov-icon" style="background:rgba(99,102,241,.12);color:#818cf8">↗</span></div><div class="ov-kpi-value" x-text="heroRequests"></div><div class="ov-kpi-hint" x-text="heroRequestsHint"></div><div class="mini-spark" x-html="sparklineSvg((stats.trends||[]).map(x=>x.requests),'#818cf8')"></div></div>
          <div class="ov-summary-card"><div class="ov-kpi-top"><span class="ov-kpi-label" x-text="t('hero_cost')"></span><span class="ov-icon" style="background:rgba(245,158,11,.12);color:#f59e0b">¥</span></div><div class="ov-kpi-value" style="color:#f59e0b" x-text="heroCostText"></div><div class="ov-kpi-hint" x-text="stats.has_price_config?t('cost_estimated'):t('price_unconfigured')"></div><div class="mini-spark" x-html="sparklineSvg((stats.trends||[]).map(x=>x.total_cost||0),'#f59e0b')"></div></div>
          <div class="ov-summary-card"><div class="ov-kpi-top"><span class="ov-kpi-label" x-text="t('hero_tokens')"></span><span class="ov-icon" style="background:rgba(167,139,250,.12);color:#a78bfa">◇</span></div><div class="ov-kpi-value" style="color:#a78bfa" x-text="fmtT(heroTokens)"></div><div class="mini-spark" x-html="sparklineSvg((stats.trends||[]).map(x=>(x.total_prompt_tokens||0)+(x.total_completion_tokens||0)),'#a78bfa')"></div></div>
        </div><div class="ov-secondary-grid"><div class="ov-secondary-item"><div class="ov-secondary-label" x-text="t('input_tokens_short')"></div><div class="ov-secondary-value" style="color:#34d399" x-text="fmtT(heroPrompt)"></div></div><div class="ov-secondary-item"><div class="ov-secondary-label" x-text="t('output_tokens_short')"></div><div class="ov-secondary-value" style="color:#a78bfa" x-text="fmtT(heroCompletion)"></div></div><div class="ov-secondary-item"><div class="ov-secondary-label" x-text="t('kv_cache_hit')"></div><div class="ov-secondary-value" style="color:#22d3ee" x-text="heroCacheText"></div></div></div></div></div>
        <div class="pnl"><div class="pnl-b"><div class="fb mb2"><span class="pnl-ht" x-text="t('opt_saved_title')"></span><span class="txs tm" style="margin-left:8px" x-text="t('opt_saved_cumulative',fmtT(stats.total_opt_saved_tokens||0),stats.opt_saved_since||new Date().toLocaleDateString())+(stats.total_opt_saved_fee>0?(' · ≈ '+fmtMoneyTiny(stats.total_opt_saved_fee)):'')"></span></div><div class="ov-summary-grid"><div class="ov-summary-card"><div class="ov-kpi-top"><span class="ov-kpi-label" x-text="t('opt_saved_today_tokens')"></span><span class="ov-icon" style="background:rgba(52,211,153,.12);color:#34d399">⚡</span></div><div class="ov-kpi-value" style="color:#34d399" x-text="fmtT((stats.today_strip_saved_tokens||0)+(stats.today_trim_saved_tokens||0)+(stats.today_resp_cache_saved_tokens||0))"></div><div class="ov-kpi-hint" x-text="(stats.today_opt_saved_fee>0?('≈ '+fmtMoneyTiny(stats.today_opt_saved_fee)+' · '):'')+t('session_saved_tokens_hint')"></div></div><div class="ov-summary-card"><div class="ov-kpi-top"><span class="ov-kpi-label" x-text="t('opt_saved_month_tokens')"></span><span class="ov-icon" style="background:rgba(34,211,238,.12);color:#22d3ee">📊</span></div><div class="ov-kpi-value" style="color:#22d3ee" x-text="fmtT(stats.month_opt_saved_tokens||0)"></div><div class="ov-kpi-hint" x-text="(stats.month_opt_saved_fee>0?('≈ '+fmtMoneyTiny(stats.month_opt_saved_fee)+' · '):'')+t('opt_saved_30d')"></div></div></div></div></div>
        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht"><span x-text="t('performance_health')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('performance_health_desc')"></div></div><button class="btn btn-g" style="font-size:11px" @click="switchTab('analytics')" x-text="t('view_analytics')+' →'"></button></div><div class="pnl-b"><div class="ov-health-grid">
          <div class="ov-health-item"><div class="ov-health-label" x-text="t('success_rate')"></div><div class="ov-health-value" :style="'color:'+rateColor(sRate,sRateText)" x-text="sRateText"></div></div>
          <div class="ov-health-item"><div class="ov-health-label" x-text="t('avg_latency')"></div><div class="ov-health-value" x-text="fmtMs(stats.avg_latency_ms||0)"></div></div>
          <div class="ov-health-item"><div class="ov-health-label" x-text="t('generation_speed')"></div><div class="ov-health-value" x-text="stats.gen_speed?stats.gen_speed.toFixed(1)+' tok/s':'—'"></div><div class="txs tm" x-show="stats.gen_samples" x-text="t('sample_count',stats.gen_samples)"></div></div>
        </div><div style="margin-top:14px"><div class="txs tm" style="margin-bottom:4px"><span x-text="t('top_models_traffic')"></span></div><template x-for="(m,i) in (stats.top_models||[]).slice(0,6)" :key="m.model"><div class="ov-model-row"><span class="ov-dot" :style="'background:'+(m.errors===0?'#34d399':m.errors<m.requests/5?'#f59e0b':'#ef4444')"></span><span class="mono txs" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)" x-text="m.model"></span><span class="txs tm" x-text="m.requests+' '+t('unit_times')"></span><span class="txs mono" style="color:var(--muted)" x-text="m.requests?fmtPct((m.requests-m.errors)/m.requests*100):'—'"></span></div></template><template x-if="!(stats.top_models||[]).length"><div class="txs tm" style="padding:10px 0" x-text="t('no_data')"></div></template></div></div></div>
      </div>
      <div class="ov-side">
        <div class="pnl"><div class="pnl-h"><span class="pnl-ht" x-text="t('balance_cost')"></span><button class="btn btn-g" style="font-size:11px" @click="fetchBalance()" x-text="t('balance_refresh')"></button></div><div class="pnl-b" style="padding:8px 16px"><template x-for="row in providerRows" :key="row.provider"><div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)"><div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px;border-radius:6px;overflow:hidden" x-html="providerLogo(row.provider)"></div><span class="txsm fw6" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="row.provider"></span><span class="txsm mono fw6" x-text="row.hasBalance?fmtMoney(row.balance):'—'"></span></div><div style="display:flex;justify-content:space-between;padding-left:32px;margin-top:4px"><span class="txs tm" x-text="t('stat.today_cost')+' '+fmtMoney(row.today_cost)"></span><span class="txs tm" x-text="row.source||''"></span></div><template x-if="row.error"><div class="txs" style="color:var(--err);padding-left:32px;margin-top:3px" x-text="row.error"></div></template></div></template><template x-if="!providerRows.length"><div class="txs tm" style="text-align:center;padding:18px 0" x-text="t('balance_none')"></div></template></div></div>
        <div class="pnl"><div class="pnl-h"><span class="pnl-ht" x-text="t('quick_start')"></span></div><div class="pnl-b"><div class="txs tm" style="line-height:1.6;margin-bottom:10px" x-text="t('quick_start_desc')"></div><div class="fb" style="padding:8px 10px;background:var(--input);border:1px solid var(--border);border-radius:8px"><span class="mono txs" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="baseUrl"></span><button class="btn btn-g" style="font-size:11px;padding:4px 6px" @click="copyText(baseUrl,'base')" x-text="copiedField==='base'?t('copied'):t('copy')"></button></div><div class="ov-actions" style="margin-top:10px"><button class="btn btn-o" style="font-size:11px" @click="switchTab('providers')" x-text="t('manage_providers')"></button><button class="btn btn-g" style="font-size:11px" @click="switchTab('records')" x-text="t('view_records')"></button></div></div></div>
        <div class="pnl"><div class="pnl-h"><div><span class="pnl-ht"><span x-text="t('api_information')"></span></span><div class="txs tm" style="margin-top:3px" x-text="t('api_information_desc')"></div></div><button class="btn btn-g" style="font-size:11px" @click="switchTab('providers')" x-text="t('view_providers')+' →'"></button></div><div class="pnl-b"><template x-for="item in [{method:'BASE',path:baseUrl,descKey:'api_base_url_desc'},{method:'GET',path:'/v1/models',descKey:'available_models'},{method:'POST',path:'/v1/chat/completions',descKey:'chat_completions'},{method:'POST',path:'/v1/messages',descKey:'anthropic_messages'},{method:'POST',path:'/v1/responses',descKey:'responses_api'}]" :key="item.path"><div class="ov-api-row"><span class="ov-api-method" x-text="item.method"></span><span class="ov-api-path" style="flex:1" x-text="item.path"></span><span class="txs tm" x-text="t(item.descKey)"></span><button class="btn btn-g" style="font-size:11px;padding:4px 8px" @click="copyText(item.path,'api')" x-text="copiedField==='api'?t('copied'):t('copy')"></button></div></template></div></div>
      </div>
    </div>
  </template>
</div>
<div x-show="activeTab==='analytics'" class="page-enter ov-page">
  <div class="phd"><div><h1 class="pt" x-text="t('analytics_title')"></h1><p class="ps" x-text="t('analytics_subtitle')"></p></div><div class="ov-actions"><span class="bdg bdg-g" x-text="t('stats_range',stats?(stats.source_window||t('current_log_window')):t('current_log_window'))"></span><span class="txs tm" x-text="t('stats_context',trendGranularityLabel,tzLabel)"></span><button class="btn btn-g" @click="fetchStats()" x-text="t('refresh')"></button></div></div>
  <template x-if="!stats"><div class="pnl"><div class="pnl-b" style="text-align:center;padding:48px"><span class="tm" x-text="statsError?t('fetch_failed'):t('no_data')"></span><button x-show="statsError" class="btn btn-g" style="margin-left:10px" @click="retryFetchStats()" x-text="t('refresh')"></button></div></div></template>
  <template x-if="stats"><div style="display:flex;flex-direction:column;gap:16px">
    <div class="an-stat-strip">
      <div class="an-stat"><div class="an-stat-label" x-text="t('total_requests')"></div><div class="an-stat-value" x-text="stats.total_requests||0"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('total_cost')"></div><div class="an-stat-value" x-text="fmtMoney(stats.total_cost||0)"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('total_tokens')"></div><div class="an-stat-value" x-text="fmtT((stats.total_prompt_tokens||0)+(stats.total_completion_tokens||0))"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('average_rpm')"></div><div class="an-stat-value" x-text="analysisRpm.toFixed(2)"></div><div class="an-stat-hint"></div></div>
      <div class="an-stat"><div class="an-stat-label" x-text="t('average_tpm')"></div><div class="an-stat-value" x-text="fmtT(Math.round(analysisTpm))"></div><div class="txs tm an-stat-hint" x-text="t('tokens_per_min')"></div></div>
    </div>
    <div class="pnl"><div class="an-filter"><span class="txs tm" x-text="t('time_range')"></span><div class="seg"><span class="seg-i" :class="{'a':analyticsSpan==='hour'}" @click="setSpan('hour')" x-text="t('span_hour')"></span><span class="seg-i" :class="{'a':analyticsSpan==='day'}" @click="setSpan('day')" x-text="t('span_day')"></span><span class="seg-i" :class="{'a':analyticsSpan==='month'}" @click="setSpan('month')" x-text="t('span_month')"></span></div><span class="txs tm" style="margin-left:auto" x-text="t('stats_range', stats?stats.source_window:t('current_log_window'))"></span></div></div>

<table><thead><tr>
<th style="width:5%"></th>
<th x-text="t('provider_name')"></th>
<th x-text="t('provider_status')"></th>
<th x-text="t('latency')"></th>
<th x-text="t('circuit')"></th>
<th x-text="t('key_label')"></th>
<th x-text="t('unit_models')"></th>
<th style="text-align:right" x-text="t('actions')"></th>
</tr></thead>
<tbody><template x-for="prov in visibleProviders" :key="prov.name"><tr>
  <td><div style="width:28px;height:28px;border-radius:6px;overflow:hidden" x-html="providerLogo(prov.name)"></div></td>
  <td><div class="txsm fw6" x-text="prov.name"></div><div class="txs mono tm" style="max-width:220px;overflow:hidden;text-overflow:ellipsis" x-text="prov.endpoint"></div></td>
  <td>
    <template x-if="health.find(h => h.provider === prov.name)"><span class="bdg" :class="health.find(h=>h.provider===prov.name).status_level==='ok'?'bdg-s':'bdg-e'" x-text="health.find(h=>h.provider===prov.name).status_level==='ok'?t('health_ok'):t('health_err')"></span></template>
    <template x-if="!health.find(h => h.provider === prov.name)"><span class="txs tm" x-text="t('health_na')"></span></template>
  </td>
  <td class="txs tm mono" x-text="health.find(h => h.provider === prov.name) ? fmtMs(health.find(h => h.provider === prov.name).latency_ms) : t('health_na')"></td>
  <td><template x-if="health.find(h => h.provider === prov.name)"><span class="bdg" :class="health.find(h=>h.provider===prov.name).circuit==='closed'?'bdg-s':health.find(h=>h.provider===prov.name).circuit==='half-open'?'bdg-w':'bdg-e'" x-text="health.find(h=>h.provider===prov.name).circuit==='closed'?t('circuit_closed'):health.find(h=>h.provider===prov.name).circuit==='half-open'?t('circuit_half_open'):t('circuit_open')"></span></template><template x-if="!health.find(h => h.provider === prov.name)"><span class="txs tm" x-text="t('health_na')"></span></template></td>
  <td><span class="bdg" :class="keysByProvider[prov.name]&&keysByProvider[prov.name].configured?'bdg-s':'bdg-w'" x-text="keyStatusText(prov.name)"></span></td>
  <td>
    <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
      <span class="mono txsm" x-text="(prov.models||[]).length"></span>
      <template x-if="prov._newModels>0"><span class="bdg bdg-s" style="font-size:9px" x-text="t('new_models_badge', prov._newModels)"></span></template>
      <template x-for="fmt in provProtocols(prov)" :key="fmt"><span class="bdg bdg-g" x-text="fmt"></span></template>
    </div>
  </td>
  <td style="text-align:right;white-space:nowrap"><div style="display:inline-flex;gap:4px">
    <button class="btn btn-g" style="font-size:11px;padding:4px 8px" :title="t('test_connection')" :disabled="prov._testing" @click="testProvider(providersFormData.indexOf(prov))"><template x-if="!prov._testing"><span>⚡</span></template><template x-if="prov._testing"><span class="spin"></span></template></button>
    <button class="btn btn-g" style="font-size:11px;padding:4px 8px;color:var(--warn)" x-show="health.find(h=>h.provider===prov.name)&&health.find(h=>h.provider===prov.name).circuit!=='closed'" @click="resetCircuit(prov.name)" x-text="t('reset_circuit')"></button>
    <button class="btn btn-g" style="font-size:11px;padding:4px 8px" :title="t('fetch_models')" :disabled="prov._fetching" @click="fetchProviderModels(providersFormData.indexOf(prov))"><template x-if="!prov._fetching"><span>↓</span></template><template x-if="prov._fetching"><span class="spin"></span></template></button>
    <button class="btn btn-o" style="font-size:11px;padding:4px 10px" @click="openProviderDrawer(providersFormData.indexOf(prov))" x-text="t('edit')"></button>
    <button class="btn btn-g" style="font-size:11px;padding:4px 8px;color:var(--err)" @click="deleteProvider(providersFormData.indexOf(prov))" :title="t('delete')" :aria-label="t('delete')">✕</button>
  </div></td>
</tr></template></tbody></table>
</div></div></template>
<template x-if="provViewMode==='card' && visibleProviders.length>0"><div class="plaza-grid">
  <template x-for="prov in visibleProviders" :key="prov.name"><div class="plaza-card">
    <div class="plaza-ch"><div class="plaza-ic" x-html="providerLogo(prov.name)"></div><div style="min-width:0"><div class="plaza-nm" x-text="prov.name"></div><div class="plaza-ep" x-text="prov.endpoint"></div></div></div>
    <div class="plaza-ft">
      <template x-if="health.find(h=>h.provider===prov.name)"><span class="bdg" :class="health.find(h=>h.provider===prov.name).status_level==='ok'?'bdg-s':'bdg-e'" x-text="health.find(h=>h.provider===prov.name).status_level==='ok'?t('health_ok'):t('health_err')"></span></template>
      <span class="txs tm mono" x-text="health.find(h=>h.provider===prov.name)?fmtMs(health.find(h=>h.provider===prov.name).latency_ms):t('health_na')"></span>
      <span class="bdg" :class="keysByProvider[prov.name]&&keysByProvider[prov.name].configured?'bdg-s':'bdg-w'" x-text="keyStatusText(prov.name)"></span>
      <span class="txs tm" x-text="(prov.models||[]).length+' '+t('unit_models')"></span>
      <template x-if="prov._newModels>0"><span class="bdg bdg-s" style="font-size:9px" x-text="t('new_models_badge', prov._newModels)"></span></template>
      <template x-for="fmt in provProtocols(prov)" :key="fmt"><span class="bdg bdg-g" x-text="fmt"></span></template>
    </div>
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn btn-g" style="font-size:11px;padding:4px 8px" :disabled="prov._fetching" @click="fetchProviderModels(providersFormData.indexOf(prov))"><template x-if="!prov._fetching"><span x-text="t('fetch_models')"></span></template><template x-if="prov._fetching"><span class="spin"></span></template></button>
      <button class="btn btn-o" style="font-size:11px;padding:4px 10px" @click="openProviderDrawer(providersFormData.indexOf(prov))" x-text="t('edit')"></button>
      <button class="btn btn-g" style="font-size:11px;padding:4px 8px;color:var(--err);margin-left:auto" @click="deleteProvider(providersFormData.indexOf(prov))" x-text="t('delete')"></button>
    </div>
  </div></template>
  </div></template>
</div>
<div x-show="activeTab==='about'" class="page-enter about-page">
  <div class="about-hero"><div><div class="about-eyebrow">AIGATE</div><h1 class="about-hero-title">AIGate</h1><p class="about-hero-desc" x-text="t('about_page_subtitle')"></p></div><span class="bdg bdg-s">● <span x-text="t('service_running')"></span></span></div>
  <div class="about-grid">
    <div class="pnl about-main">
      <div class="about-intro"><div class="about-intro-title" x-text="t('about_intro_title')"></div><div class="about-intro-desc" x-text="t('about_desc1')"></div><div class="about-intro-desc" style="margin-top:8px" x-text="t('about_desc2')"></div></div>
      <div class="about-section"><div class="about-section-title" x-text="t('api_endpoints_title')"></div><div class="about-endpoints"><a class="about-endpoint" href="/v1/models" target="_blank"><span class="about-endpoint-method">GET</span><span class="about-endpoint-path">/v1/models</span></a><a class="about-endpoint" href="/v1/chat/completions" target="_blank"><span class="about-endpoint-method">POST</span><span class="about-endpoint-path">/v1/chat/completions</span></a><a class="about-endpoint" href="/v1/messages" target="_blank"><span class="about-endpoint-method">POST</span><span class="about-endpoint-path">/v1/messages</span></a><a class="about-endpoint" href="/v1/responses" target="_blank"><span class="about-endpoint-method">POST</span><span class="about-endpoint-path">/v1/responses</span></a><a class="about-endpoint" href="/health" target="_blank"><span class="about-endpoint-method">GET</span><span class="about-endpoint-path">/health</span></a><a class="about-endpoint" href="/admin/api/stats" target="_blank"><span class="about-endpoint-method">GET</span><span class="about-endpoint-path">/admin/api/stats</span></a></div></div>
      <div class="about-section"><div class="about-section-title" x-text="t('about_capabilities_title')"></div><div class="about-capabilities"><div class="about-capability"><span class="about-capability-icon">↔</span><div><div class="txsm fw6" x-text="t('about_capability_routing')"></div><div class="txs tm" x-text="t('about_capability_routing_desc')"></div></div></div><div class="about-capability"><span class="about-capability-icon">◎</span><div><div class="txsm fw6" x-text="t('about_capability_mapping')"></div><div class="txs tm" x-text="t('about_capability_mapping_desc')"></div></div></div><div class="about-capability"><span class="about-capability-icon">◈</span><div><div class="txsm fw6" x-text="t('about_capability_monitoring')"></div><div class="txs tm" x-text="t('about_capability_monitoring_desc')"></div></div></div><div class="about-capability"><span class="about-capability-icon">↯</span><div><div class="txsm fw6" x-text="t('about_capability_reasoning')"></div><div class="txs tm" x-text="t('about_capability_reasoning_desc')"></div></div></div></div></div>
    </div>
    <div class="about-side">
      <div class="pnl about-side-panel"><div class="about-section-title" x-text="t('tech_stack')"></div><div class="about-tech"><span class="bdg bdg-g">Rust</span><span class="bdg bdg-g">Axum</span><span class="bdg bdg-g">Reqwest</span><span class="bdg bdg-g">Tailwind CSS</span><span class="bdg bdg-g">Alpine.js</span></div></div>
      <div class="pnl about-side-panel about-changelog"><template x-if="changelog && changelog.length"><div><div class="about-section-title" x-text="t('changelog_title')"></div><template x-for="v in changelog.slice(0,5)" :key="v.version"><details style="margin-bottom:8px"><summary class="txs fw6" style="cursor:pointer;color:var(--fg);padding:4px 0" x-text="v.version+(v.date?' · '+v.date:'')"></summary><div style="padding:4px 0 4px 12px"><template x-for="sec in v.sections" :key="sec.title"><div class="mt2"><div class="txs fw7" style="color:var(--indigo)" x-text="sec.title"></div><template x-for="item in sec.items" :key="item"><div class="txs tm" style="padding:2px 0;line-height:1.6">· <span x-html="renderMdInline(item)"></span></div></template></div></template></div></details></template></div></template><template x-if="!changelog || !changelog.length"><div class="txs tm" x-text="t('whats_new_empty')"></div></template></div>
    </div>
  </div>
</div>
</main>
</div>
<div x-show="showWhatsNew" x-cloak class="modal-overlay" role="dialog" aria-modal="true" @click.self="dismissWhatsNew()" @keydown.escape.window="dismissWhatsNew()"><div class="modal-card modal-card-sm"><div class="modal-head"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class="bdg bdg-p" x-text="t('whats_new')"></span><span class="txs mono tm" x-text="whatsNewEntry?(whatsNewEntry.version+(whatsNewEntry.date?' · '+whatsNewEntry.date:'')):''"></span></div><div class="modal-title" x-text="t('whats_new_title')"></div></div><div class="modal-body"><template x-if="whatsNewEntry"><div style="display:flex;flex-direction:column;gap:12px;padding:8px 0"><template x-for="sec in whatsNewEntry.sections" :key="sec.title"><div><div class="txs fw7" style="color:var(--indigo);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px" x-text="sec.title"></div><template x-for="item in sec.items" :key="item"><div class="txs" style="color:var(--fg);padding:2px 0">▸ <span x-html="renderMdInline(item)"></span></div></template></div></template></div></template></div><div class="modal-foot"><button class="btn btn-p" @click="dismissWhatsNew()" x-text="t('got_it')"></button></div></div></div>
<div x-show="showAddProvider" x-cloak class="modal-overlay modal-overlay-add" role="dialog" aria-modal="true" @click.self="showAddProvider=false" @keydown.escape.window="showAddProvider=false"><div class="modal-card modal-card-add"><div class="modal-head"><div class="modal-title" x-text="t('add_provider_title')"></div></div><div class="modal-body"><div><label class="txs tm" x-text="t('addprov.name')"></label><input type="text" class="inp" style="width:100%;margin-top:4px" x-model="addProvName" :placeholder="t('addprov.ph_name')"></div><div><label class="txs tm" x-text="t('addprov.endpoint')"></label><input type="text" class="inp mono" style="width:100%;margin-top:4px" x-model="addProvEndpoint" :placeholder="t('addprov.ph_endpoint')"></div><p class="txs tm" x-text="t('addprov.keyhint')"></p></div><div class="modal-foot"><button class="btn btn-g" @click="showAddProvider=false" x-text="t('cancel')"></button><button class="btn btn-p" :disabled="!addProvName||!addProvEndpoint" @click="confirmAddProvider()" x-text="t('add')"></button></div></div></div>
<template x-if="drawerProv">
<div>
  <div class="dr-bk" @click="closeProviderDrawer()"></div>
  <div class="dr">
    <div class="dr-card">
      <!-- Header -->
      <div class="dr-h">
        <div style="display:flex;align-items:center;gap:10px">
          <input type="text" class="inp" style="font-size:15px;font-weight:600;color:var(--fg);width:auto;min-width:80px;border:none;background:transparent;box-shadow:none;padding:0" x-model="drawerProv.name" @input="markDirty()">
          <span class="bdg bdg-p" style="font-size:10px" x-text="(drawerProv.models||[]).length+' '+t('unit_models')"></span>
          <template x-if="healthOf(drawerProv.name)==='ok'"><span class="bdg" style="background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.25);font-size:10px">● <span x-text="t('health_ok')"></span></span></template>
          <template x-if="healthOf(drawerProv.name)==='error'"><span class="bdg" style="background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25);font-size:10px">● <span x-text="t('health_err')"></span></span></template>
          <template x-if="healthOf(drawerProv.name)===''"><span class="bdg" style="background:rgba(156,163,175,.12);color:#9ca3af;border:1px solid rgba(156,163,175,.25);font-size:10px">○ <span x-text="t('health_na')"></span></span></template>
        </div>
        <button class="btn btn-g" @click="closeProviderDrawer()" style="padding:4px 8px" :title="t('close_label')" :aria-label="t('close_label')">✕</button>
      </div>

      <div class="dr-body">
        <!-- Section: Endpoints -->
        <div class="sec">
          <div class="sec-hdr">
            <div class="sec-ic blue">🔗</div>
            <div style="flex:1"><div class="sec-title" x-text="t('addprov.endpoint')"></div><div class="sec-sub" x-text="t('endpoint_protocol_desc')"></div></div>
            <button class="btn btn-g" style="font-size:11px;white-space:nowrap" :disabled="drawerProv._testing" @click="testProvider(providersFormData.indexOf(drawerProv))">
              <template x-if="!drawerProv._testing"><span>⚡ <span x-text="t('test_connection')"></span></span></template>
              <template x-if="drawerProv._testing"><span class="spin" style="margin-right:6px"></span><span x-text="t('testing')"></span></template>
            </button>
          </div>
          <div class="sec-body">
            <!-- Test result -->
            <template x-if="drawerProv._testResult">
            <div style="margin-bottom:12px;padding:8px 12px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:8px"
              :style="drawerProv._testResult.success?'background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)':'background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)'">
              <span x-text="drawerProv._testResult.success?'✓':'✗'"></span>
              <span x-text="drawerProv._testResult.status"></span>
              <span style="margin-left:auto;opacity:.7" x-text="drawerProv._testResult.latency_ms+'ms'"></span>
            </div>
            </template>
            <div class="f-grid">
              <div class="f-row"><label x-text="t('addprov.endpoint')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.endpoint" @input="markDirty()" placeholder="https://api.example.com"></div>
              <div class="f-row"><label x-text="t('anthropic_endpoint_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.endpoint_anthropic" :placeholder="t('anthropic_endpoint_ph')" @input="markDirty()"></div>
              <div class="f-row"><label x-text="t('responses_endpoint_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.endpoint_responses" :placeholder="t('responses_endpoint_ph')" @input="markDirty()"></div>
              <div class="f-row"><label x-text="t('balance_endpoint_label')"></label><input type="text" class="inp mono" style="width:100%" x-model="drawerProv.balance_endpoint" :placeholder="t('balance_endpoint_ph')" @input="markDirty()"></div>
            </div>
          </div>
        </div>

        <!-- Section: API Key -->
        <div class="sec">
          <div class="sec-hdr">
            <div class="sec-ic green">🔑</div>
            <div><div class="sec-title" x-text="t('apikey_mgmt')"></div><div class="sec-sub" x-text="t('key_save_hint')"></div></div>
          </div>
          <div class="sec-body">
              <div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:rgba(255,255,255,.02)">
            <div class="key-status-row" x-text="keyStatusText(drawerProv.name)"></div>
            <div style="display:flex;gap:8px;align-items:center">
              <input type="password" class="inp" style="flex:1" :placeholder="t('key_placeholder')" x-model="drawerProv._keyDraft" @keydown.enter="saveDrawerKey()">
              <button class="btn btn-p" style="white-space:nowrap" :disabled="!(drawerProv._keyDraft||'').trim()" @click="saveDrawerKey()" x-text="drawerProv._keySaving?t('saving'):t('save')"></button>
              <button class="btn btn-g" style="color:var(--err);white-space:nowrap" @click="clearProviderKey(providersFormData.indexOf(drawerProv))" x-text="t('clear')"></button>
            </div>
            <template x-if="drawerProv._keyMsg"><div style="margin-top:8px;font-size:12px;padding:6px 10px;border-radius:6px" :style="drawerProv._keyOk?'background:rgba(52,211,153,.1);color:#34d399':'background:rgba(239,68,68,.1);color:#ef4444'" x-text="drawerProv._keyMsg"></div></template>
          </div>
          </div>
        </div>

        <!-- Section: Models -->
        <div class="sec">
          <div class="sec-hdr">
            <div class="sec-ic amber">📦</div>
            <div style="flex:1"><div class="sec-title" x-text="t('unit_models')"></div><div class="sec-sub" x-text="t('model_routing_config')"></div></div>
            <span class="bdg bdg-p" style="font-size:11px" x-text="filteredModelCount()+' / '+(drawerProv.models||[]).length"></span>
          </div>
          <div class="sec-body">
            <div class="m-card">
              <!-- Search + actions header -->
              <div class="m-card-hdr">
                <input type="text" class="inp" style="flex:1;max-width:320px;font-size:12px" x-model="drawerProv._filter" :placeholder="t('search_models')">
                <div style="display:flex;gap:6px;align-items:center">
                  <button class="btn btn-g" style="font-size:11px" @click="toggleAll(drawerProv,true)" x-text="t('select_all')"></button>
                  <button class="btn btn-g" style="font-size:11px" @click="toggleAll(drawerProv,false)" x-text="t('deselect_all')"></button>
                  <button class="btn btn-g" style="font-size:11px;color:var(--err)" @click="deleteSelectedModels()" x-text="t('delete_selected')"></button>
                  <button class="btn btn-g" style="font-size:11px" :disabled="!priceClipboardSet||selectedIndexes(drawerProv).length===0" :title="t('price_apply_selected_hint')" @click="applyPriceToSelected(providersFormData.indexOf(drawerProv))" x-text="t('price_apply_selected',selectedIndexes(drawerProv).length)"></button>
                  <button class="btn btn-p" style="font-size:11px" @click="addModel(providersFormData.indexOf(drawerProv))" x-text="t('add_model')"></button>
                </div>
              </div>
              <!-- Brand filter chips -->
              <div class="m-card-bar">
                <span class="txs tm" style="margin-right:4px" x-text="t('brand')"></span>
                <span class="m-chip" :class="{'on':!drawerProv._brandFilter}" @click="drawerProv._brandFilter=''" x-text="t('plaza_all')"></span>
                <template x-for="b in drawerBrands()" :key="b.label">
                  <span class="m-chip" :class="{'on':drawerProv._brandFilter===b.label}" @click="drawerProv._brandFilter=b.label">
                    <span :style="'width:6px;height:6px;border-radius:50%;background:'+b.color"></span>
                    <span x-text="b.label"></span>
                  </span>
                </template>
                <span style="margin-left:auto"></span>
                <span class="txs tm" style="margin-right:4px" x-text="t('thinking_short')"></span>
                <span class="m-chip" :class="{'on':!drawerProv._effFilter}" @click="drawerProv._effFilter=''" x-text="t('plaza_all')"></span>
                <span class="m-chip" :class="{'on':drawerProv._effFilter==='low'}" @click="drawerProv._effFilter='low'" x-text="t('eff.low')"></span>
                <span class="m-chip" :class="{'on':drawerProv._effFilter==='medium'}" @click="drawerProv._effFilter='medium'" x-text="t('eff.medium')"></span>
                <span class="m-chip" :class="{'on':drawerProv._effFilter==='high'}" @click="drawerProv._effFilter='high'" x-text="t('eff.high')"></span>
                <span class="m-chip" :class="{'on':drawerProv._effFilter==='max'}" @click="drawerProv._effFilter='max'" x-text="t('eff.max')"></span>
              </div>
              <!-- Price/Status/Origin filter chips -->
              <div class="m-card-bar" style="border-top:1px solid rgba(255,255,255,.04)">
                <span class="txs tm" style="margin-right:4px" x-text="t('price')"></span>
                <span class="m-chip" :class="{'on':!drawerProv._freeFilter}" @click="drawerProv._freeFilter=''" x-text="t('plaza_all')"></span>
                <span class="m-chip" :class="{'on':drawerProv._freeFilter==='free'}" @click="drawerProv._freeFilter='free'" x-text="t('badge.free')"></span>
                <span class="m-chip" :class="{'on':drawerProv._freeFilter==='paid'}" @click="drawerProv._freeFilter='paid'" x-text="t('paid')"></span>
                <span style="margin-left:auto"></span>
                <span class="txs tm" style="margin-right:4px" x-text="t('status')"></span>
                <span class="m-chip" :class="{'on':!drawerProv._removedFilter}" @click="drawerProv._removedFilter=''" x-text="t('plaza_all')"></span>
                <span class="m-chip" :class="{'on':drawerProv._removedFilter==='active'}" @click="drawerProv._removedFilter='active'" x-text="t('status_active')"></span>
                <span class="m-chip" :class="{'on':drawerProv._removedFilter==='removed'}" @click="drawerProv._removedFilter='removed'" x-text="t('status_removed')"></span>
                <span style="margin-left:auto"></span>
                <span class="txs tm" style="margin-right:4px" x-text="t('origin')"></span>
                <span class="m-chip" :class="{'on':!drawerProv._originFilter}" @click="drawerProv._originFilter=''" x-text="t('plaza_all')"></span>

document.addEventListener('alpine:init', function() {
  Alpine.store('i18n', { lang: (window.AIGATE_LANG || 'zh-CN') });
  // 全局轻量 Toast 通知：toast(msg, type) / Alpine.store('toast').push(msg, type)
  Alpine.store('toast', {
    items: [],
    push(msg, type) {
      type = type || 'info';
      const id = Date.now() + Math.random();
      this.items.push({ id, msg, type });
      setTimeout(() => this.dismiss(id), 3000);
    },
    dismiss(id) { this.items = this.items.filter(x => x.id !== id); },
  });
  Alpine.data('dashboard', dashboard);
});
function toast(msg, type) { if (window.Alpine) Alpine.store('toast').push(msg, type); }
function t(key) {
  var lang = (window.Alpine && Alpine.store('i18n')) ? Alpine.store('i18n').lang : (window.AIGATE_LANG || 'zh-CN');
  var dict = I18N[lang] || I18N['zh-CN'];
  var s = (dict && dict[key] != null) ? dict[key] : (I18N['zh-CN'][key] != null ? I18N['zh-CN'][key] : key);
  for (var i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(arguments[i]);
  return s;
}

}

const PROVIDER_LOGO_REGEX = [

// 供应商 logo 解析: 优先正则别名 -> 精确 id -> 官方 SVG, 自适应容器尺寸; 缺失回退首字母彩色徽标.
function providerLogo(providerName) {
  if (!providerName) return _plogo('#374151', '?');
  const key = String(providerName).toLowerCase().trim();
  for (const [re, svgKey] of PROVIDER_LOGO_REGEX) {
    if (re.test(key)) return _logoWrap(PROVIDER_SVG[svgKey]);
  }
  if (PROVIDER_SVG[key]) return _logoWrap(PROVIDER_SVG[key]);
  // 未收录供应商: 取首段 1-2 字母 + 哈希稳定底色, 兜底显示.
  const seg = key.split(/[\s_\-./]+/).filter(Boolean);
  let txt = seg.length ? seg[0].slice(0, 2).toUpperCase() : key.slice(0, 2).toUpperCase();
  if (txt.length < 1) txt = '?';
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) & 0xffffffff;
  const palette = ['#4d6bfe', '#7c5cff', '#10b981', '#ff6b35', '#d97757', '#0ea5e9', '#ef4444', '#8b5cf6', '#14b8a6', '#f59e0b'];
  const bg = palette[Math.abs(h) % palette.length];
  return _plogo(bg, txt, '#fff');
}
// 官方 SVG 自适应容器包裹
function _logoWrap(svg) {
  if (!svg) return _plogo('#374151', '?');
  return '<span style="width:100%;height:100%;display:inline-flex">' + svg + '</span>';
}

    // ── 模型元信息 (models.dev): 点击展开 chips 面板 (上下文/输出/视觉/推理/工具) ──
    async fetchModelMeta() {
      this.modelMetaLoading = true;
      try {
        const names=new Set();
        // 注意: providersFormData 就是供应商数组本身 (非 {providers:[]}),
        // 旧版误写 .providers 导致表单模型名从未被收集, 仅统计接口的模型有元数据.
        (this.providersFormData||[]).forEach(p=>(p.models||[]).forEach(m=>{
          const u=(m.upstream_model||'').trim(); if(u) names.add(u);
          const id=(m.model_id||'').trim(); if(id) names.add(id);
        }));
        // 概览页统计的模型名带 "provider/" 中转前缀, 剥离后一并查询
        [...((this.stats?.top_models)||[]), ...((this.stats?.per_model)||[])].forEach(m=>{
          const raw=(m.model||'').trim(); if(!raw) return;
          names.add(raw.includes('/') ? raw.split('/').pop() : raw);
        });
        if(!names.size) { this.modelMetaLoading = false; return; }
        // 签名去重: 轮询/重复进入不重发 (服务端有 24h 缓存, 也省一次往返)
        const sig=[...names].sort().join(',');
        if(sig===this._metaSig && Object.keys(this.modelMeta).length) { this.modelMetaLoading = false; return; }
        this._metaSig=sig;
        const r=await fetch('/admin/api/model-meta',{method:'POST',headers:authHeaders(),body:JSON.stringify({names:[...names]})});
        if(r.ok){ const d=await r.json(); this.modelMeta=d.meta||{}; }
      } catch(e){}
      this.modelMetaLoading = false;
    },
    metaFor(m) {
      const u=(m.upstream_model||'').trim();
      return this.modelMeta[u] ?? this.modelMeta[(m.model_id||'').trim()] ?? null;
    },
    fmtTok(n) { if(!n) return '—'; if(n>=1e6) return (Math.round(n/1e5)/10)+'M'; if(n>=1000) return Math.round(n/1000)+'K'; return String(n); },
    // 模型元信息 chips 面板内容 (数据源 models.dev, 仅数字/布尔/i18n 文案, x-html 安全)
    sparklineSvg(values,color) {
      const vals=(values||[]).map(Number).filter(v=>Number.isFinite(v));
      if(vals.length<2) return '';
      const w=160,h=28,p=2,mx=Math.max(...vals),mn=Math.min(...vals),span=Math.max(mx-mn,1);
      const pts=vals.map((v,i)=>`${p+(w-2*p)*i/(vals.length-1)},${h-p-(v-mn)/span*(h-2*p)}`);
      const area=`${p},${h} ${pts.join(' ')} ${w-p},${h}`;
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="sp${Math.abs(color.length+vals.length)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".24"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#sp${Math.abs(color.length+vals.length)})"/><polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    },
    metaChipsHtml(m) {
      const meta=this.metaFor(m);
      if(!meta) return '';
      const chip=(l,v,c)=>'<span class="meta-chip" style="background:'+c+'1a;color:'+c+';border:1px solid '+c+'44"><span style="opacity:.7">'+l+'</span><b class="mono">'+v+'</b></span>';
      const tag=(l,c)=>'<span class="meta-tag" style="background:'+c+'1a;color:'+c+';border:1px solid '+c+'44">'+l+'</span>';
      let h='';
      if(meta.context) h+=chip(t('meta_ctx'), this.fmtTok(meta.context), '#38bdf8');
      if(meta.output) h+=chip(t('meta_out'), this.fmtTok(meta.output), '#818cf8');
      if(meta.vision) h+=tag(t('meta_vision'), '#c084fc');
      if(meta.reasoning) h+=tag(t('meta_reasoning'), '#fbbf24');
      if(meta.tool_call) h+=tag(t('meta_tools'), '#34d399');
      return h;
    },
    modelMetaStatusHtml(m) {
      if(this.metaFor(m)) return this.metaChipsHtml(m);
      if(this.modelMetaLoading) return '<span class="meta-pending">'+t('meta_loading')+'</span>';
      return '<span class="meta-pending">'+t('meta_unavailable')+'</span>';
    },
    async fetchStats(rangeOverride)   {
      try {
        const range=rangeOverride || (this.activeTab==='dashboard'?'window':(this.analyticsRange||'1d'));
        const params=new URLSearchParams({granularity:this.trendGranularity,range});
        const r=await fetch('/admin/api/stats?'+params.toString(), {headers:authHeaders()});
        if(r.ok) {
          this.stats=await r.json();
          this.loading=false;
          this.statsError=false;
          this.fetchModelMeta(); await this.$nextTick();
          this.computeModelTrend();
          if(this.$refs.trendScroll){ this.$refs.trendScroll.scrollLeft=this.$refs.trendScroll.scrollWidth; }
        } else {
          // 非 2xx 也是失败: 必须复位 loading, 否则界面停在假的「加载中」.
          this.loading=false; this.statsError=true;
        }
      } catch(e) {
        // 网络异常同理 —— 原实现这里是空 catch, 导致 loading 永远为 true.
        this.loading=false; this.statsError=true;
      }
    },
    retryFetchStats() { this.statsError=false; this.loading=true; this.fetchStats(); },
    isLogError(log) { return Number(log&&log.status)>=400 || !!(log&&log.error); },
    get analysisWindowMinutes() {
      return Math.max(1, Number(this.stats&&this.stats.window_minutes||1));
    },
    // 活跃跨度(分钟): 窗口内首个到最后一个**有数据**的桶.
    // 用整个窗口当分母会把大量空闲时段算进去 —— 实测 29 天窗口算出"平均 RPM 0.06",
    // 读不出任何信息; 按实际活跃区间算才有意义.
    get analysisActiveMinutes() {
      const all=(this.stats&&this.stats.trends)||[];
      const live=all.filter(x=>x&&x.ts&&((x.requests||0)>0||(x.total_prompt_tokens||0)>0||(x.total_completion_tokens||0)>0));
      if(live.length<2) return this.analysisWindowMinutes;
      const bucket=Math.max(1,(all[1].ts||0)-(all[0].ts||0));
      // 钳到窗口以内: 桶跨度按整天向外取整 (日粒度下首桶从当天 0 点算起), 会略大于真实数据跨度;
      // 活跃跨度不可能超过窗口本身, 否则算出的 RPM 比按整窗口算的还低, 反而失真.
      return Math.max(1, Math.min(this.analysisWindowMinutes, (live[live.length-1].ts-live[0].ts+bucket)/60));
    },
    get analysisRpm() { return Number(this.stats&&this.stats.total_requests||0)/this.analysisActiveMinutes; },
    get analysisTpm() { return ((Number(this.stats&&this.stats.total_prompt_tokens||0)+Number(this.stats&&this.stats.total_completion_tokens||0))/this.analysisActiveMinutes); },
    get filteredModelStats() {
      const q=(this.modelDetailFilter||'').toLowerCase().trim();
      return (this.stats&&this.stats.per_model||[]).filter(m=>{
        if(this.modelProviderFilter && this.modelProviderName(m)!==this.modelProviderFilter) return false;
        return !q || (m.model||'').toLowerCase().includes(q) || (m.upstream_model||'').toLowerCase().includes(q) || (m.provider||'').toLowerCase().includes(q) || (m.aliases||[]).some(a=>a.toLowerCase().includes(q));
      });
    },
    modelProviderName(model) { return (model&&model.provider)||'—'; },
    modelErrorCount(model) { return Number(model&&model.errors||0); },
    get modelDetailProviders() { return [...new Set((this.stats&&this.stats.per_model||[]).map(m=>this.modelProviderName(m)))].sort(); },
    // 统一时间范围与粒度: 小时(24h)/天(30d)/月(12m). 每个选项同时决定窗口与桶大小, 避免两套控件重叠混乱.
    setSpan(span) {
      this.analyticsSpan = span;
      const map = { hour: ['1d','hour'], day: ['29d','day'], month: ['365d','month'] };
      const m = map[span];
      if (m) { this.analyticsRange = m[0]; this.trendGranularity = m[1]; }
      this.fetchStats();
    },
    // ── 更新亮点：取最新一条 changelog 作为弹窗内容 ──
    get whatsNewEntry() {
      return (this.changelog && this.changelog.length) ? this.changelog[0] : null;
    },
    computeModelTrend() {
      const rows=this.stats?.model_trends||[]; const sums={};
      rows.forEach(r=>{const k=(r.provider||'')+'/'+(r.upstream_model||'');sums[k]=(sums[k]||0)+Number(r.prompt_tokens||0)+Number(r.completion_tokens||0);});
      const allKeys=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]).slice(0,6);
      const keys=allKeys.filter(k=>!this.hiddenModels[k]);
      this.modelTrendData={keys:allKeys,sums,dates:[],series:[],xPct:[],trendByTs:new Map()};
      if(!rows.length||!keys.length){this.modelTrendSvgHtml='';return;}
      const trends=(this.stats.trends||[]).filter(x=>x&&x.ts);
      const dates=[...new Map(trends.map(r=>[r.ts,r.date])).entries()].sort((a,b)=>a[0]-b[0]);
      if(!dates.length){this.modelTrendSvgHtml='';return;}
      // 画布与内边距 (viewBox 坐标); 比例由 CSS 等比缩放维持, 不再用 preserveAspectRatio 拉伸.
      const W=900,H=280,left=52,right=18,top=18,bottom=36,pw=W-left-right,ph=H-top-bottom;
      const palette=['#3b9cff','#45c97a','#7956e8','#ff5b63','#ff7b27','#42c6c6'];
      const colorOf=k=>palette[allKeys.indexOf(k)%palette.length];
      const map=new Map(rows.map(r=>[r.ts+'/'+r.provider+'/'+r.upstream_model,r]));
      const values=keys.map(k=>dates.map(([ts])=>{const [p,...u]=k.split('/');const r=map.get(ts+'/'+p+'/'+u.join('/'));return r?Number(r.prompt_tokens||0)+Number(r.completion_tokens||0):0;}));
      // 自适应裁剪: 去掉首尾**没有任何数据**的桶, 否则稀疏数据下大半画布是贴着 0 的直线,
      // 真正的信息被挤到一角 (实测 29 天窗口里只有最近 3 天有数据 → 3/4 画布无信息).
      // 两端各多留一个空桶: 让人看得出数据"从哪开始、到哪结束", 而不是被硬切在边缘.
      const hasData=i=>values.some(vals=>Number(vals[i]||0)>0);
      let lo=-1, hi=-1;
      for(let i=0;i<dates.length;i++){ if(hasData(i)){ if(lo<0)lo=i; hi=i; } }
      if(lo>=0){
        lo=Math.max(0,lo-1); hi=Math.min(dates.length-1,hi+1);
        if(hi-lo+1 < dates.length){
          this.modelTrendTrimmed=true;
          dates.splice(hi+1);
          dates.splice(0,lo);
          values.forEach(vals=>{ vals.splice(hi+1); vals.splice(0,lo); });
        }
      }
      const stackMax=Math.max(...dates.map((_,i)=>values.reduce((s,vals)=>s+vals[i],0)),1);
      const max=this.chartMode==='bar'?stackMax:Math.max(...values.flat(),1);
      const n=dates.length;
      const x=i=>left+(n===1?pw/2:pw*i/(n-1));
      const y=v=>top+ph-v/max*ph;
      const smooth=pts=>{if(pts.length<2)return '';let d='M'+pts[0][0]+','+pts[0][1];for(let i=0;i<pts.length-1;i++){const cx=(pts[i][0]+pts[i+1][0])/2;d+=' C'+cx+','+pts[i][1]+' '+cx+','+pts[i+1][1]+' '+pts[i+1][0]+','+pts[i+1][1];}return d;};
      // 暴露给悬停浮层 (按桶取各序列用量, 无需重算).
      this.modelTrendData.dates=dates;
      this.modelTrendData.xPct=dates.map((_,i)=>x(i)/W*100);
      this.modelTrendData.series=keys.map((k,si)=>({key:k,label:k.split('/').slice(1).join('/')||k,color:colorOf(k),values:values[si]}));
      this.modelTrendData.trendByTs=new Map(trends.map(r=>[r.ts,r]));
      // viewBox + width:100% + height:auto: 等比缩放, 圆点与文字不被拉扁.
      let out='<svg viewBox="0 0 '+W+' '+H+'" style="display:block;width:100%;height:auto" class="model-trend-svg" role="img" aria-label="'+this.escapeHtml(t('token_trend_title'))+'">';
      for(let i=0;i<=4;i++){const yy=top+ph*i/4;out+='<line x1="'+left+'" x2="'+(W-right)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2a2d37" stroke-width=".7"/><text x="'+(left-8)+'" y="'+(yy+3)+'" text-anchor="end" font-size="9" fill="#6b7280">'+this.escapeHtml(this.fmtT(max*(1-i/4)))+'</text>';}
      if(this.chartMode==='bar'){const bw=Math.min(28,pw/n*.7);const cumul=new Array(n).fill(0);values.forEach((vals,si)=>{const k=keys[si],color=colorOf(k);vals.forEach((v,i)=>{if(!v)return;const y0=y(cumul[i]);cumul[i]+=v;const y1=y(cumul[i]);const barH=y0-y1;out+='<rect x="'+(x(i)-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+barH+'" fill="'+color+'"/>';});});}else{
        values.forEach((vals,si)=>{const k=keys[si],color=colorOf(k);const pts=vals.map((v,i)=>[x(i),y(v)]);
          const ptsStr=pts.map(p=>p[0]+','+p[1]).join(' ');
          const gid='tg'+si;
          out+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".25"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>';
          const areaD='M'+x(0)+','+(top+ph)+' L'+pts.map(p=>p[0]+','+p[1]).join(' L')+' L'+x(n-1)+','+(top+ph)+' Z';
          out+='<path d="'+areaD+'" fill="url(#'+gid+')"/>';
          out+='<polyline points="'+ptsStr+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
          vals.forEach((v,i)=>{if(!v)return;out+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.5" fill="'+color+'" stroke="#16161c" stroke-width="1.5"/>';});
        });
      }
      const step=Math.max(1,Math.ceil(n/8));dates.forEach((d,i)=>{if(i%step===0||i===n-1)out+='<text x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle" font-size="9" fill="#6b7280">'+this.escapeHtml(d[1]||'')+'</text>';});out+='</svg>';
      this.modelTrendSvgHtml=out;
    },
    // ── Token 趋势悬停: 十字线 + 该时段各模型用量浮层 ──
    onTrendHover(ev) {
      const d=this.modelTrendData; if(!d||!d.dates||!d.dates.length) return;
      const el=ev.currentTarget; const r=el.getBoundingClientRect(); if(!r.width) return;
      const W=900, left=52, right=18, pw=W-left-right, n=d.dates.length;
      const vbX=((ev.clientX-r.left)/r.width)*W;
      let i=n===1?0:Math.round((vbX-left)*(n-1)/pw);
      i=Math.max(0,Math.min(n-1,i));
      if(this.trendHover&&this.trendHover.idx===i) return; // 同一桶不重算, 避免每像素触发重排
      const leftPct=d.xPct[i]||0;
      this.trendHover={idx:i,leftPct,align:leftPct<16?'left':leftPct>62?'right':'center'};
    },
    onTrendHoverEnd() { this.trendHover=null; },
    get trendTooltipHtml() {
      const d=this.modelTrendData||{}; const h=this.trendHover;
      if(!h||!d.series||!d.dates||!d.dates.length) return '';
      const i=h.idx, date=(d.dates[i]||[])[1]||'';
      const shown=d.series.map(s=>({label:s.label,color:s.color,v:(s.values||[])[i]||0})).filter(s=>s.v>0).sort((a,b)=>b.v-a.v);
      const total=shown.reduce((s,r)=>s+r.v,0);
      let html='<div class="tt-h">'+this.escapeHtml(date)+' · '+t('trend_total')+' <b>'+this.fmtT(total)+'</b> tok</div>';
      if(!shown.length){html+='<div class="tt-r"><span class="tt-n tm">'+t('trend_no_requests')+'</span></div>';}
      shown.forEach(s=>{html+='<div class="tt-r"><i style="background:'+s.color+'"></i><span class="tt-n">'+this.escapeHtml(s.label)+'</span><span class="tt-v">'+this.fmtT(s.v)+'</span></div>';});
      const tr=d.trendByTs&&d.trendByTs.get?d.trendByTs.get((d.dates[i]||[])[0]):null;
      if(tr){
        const cost=this.stats?.has_price_config?this.fmtMoney(tr.total_cost||0):t('chart_no_price');
        html+='<div class="tt-f">'+t('trend_bucket_metrics',tr.requests||0,tr.errors||0,this.fmtT(tr.total_prompt_tokens||0),this.fmtT(tr.total_completion_tokens||0),this.escapeHtml(cost))+'</div>';
      }
      return html;
    },
    get trendLegendItems() {
      const d=this.modelTrendData||{}; const keys=d.keys||[]; const sums=d.sums||{};
      const palette=['#3b9cff','#45c97a','#7956e8','#ff5b63','#ff7b27','#42c6c6'];
      const total=Object.keys(sums).reduce((a,k)=>a+(sums[k]||0),0)||1;
      return keys.map((k,i)=>({k,label:k.split('/').slice(1).join('/')||k,color:palette[i%palette.length],tokens:sums[k]||0,pct:(sums[k]||0)/total*100,hidden:!!this.hiddenModels[k]}));
    },
    toggleModel(k){ this.hiddenModels[k]=!this.hiddenModels[k]; this.computeModelTrend(); },
    // 图表上下文标签: 只在图表的展示区间**不同于整个窗口**时才输出
    // (自适应裁剪掉了首尾空桶时, 明确写出实际展示的区间, 免得让人以为画的是整个窗口).
    // 粒度 · 时区由页头统一承担 —— 原先这里也输出一份, 与分析页页头完全重复:
    // 同一屏出现两次「天 粒度 · UTC+8」. 无裁剪时返回空串, 该行自然不占位.
    get trendContextLabel() {
      const d = (this.modelTrendData && this.modelTrendData.dates) || [];
      if (!this.modelTrendTrimmed || d.length < 2) return '';
      return t('trend_shown_range', (d[0][1] || ''), (d[d.length - 1][1] || ''));
    },
    get trendGranularityLabel() {

    modelVisible(m, prov){
      const q=(prov._filter||'').toLowerCase();
      if(q && !((m.model_id||'').toLowerCase().includes(q) || (m.upstream_model||'').toLowerCase().includes(q))) return false;
      const brand=prov._brandFilter||'';
      if(brand){
        const b=this.brandFor(m.upstream_model,prov.name);
        if(b.label!==brand) return false;
      }
      const eff=prov._effFilter||'';
      if(eff && (m.reasoning_effort||'')!==eff) return false;
      // 价格筛选: 'free' 仅看免费 (用户标记 或 名称含 free/免费), 'paid' 仅看付费
      const free=prov._freeFilter||'';
      if(free==='free' && !this.isFree(m)) return false;
      if(free==='paid' && this.isFree(m)) return false;
      // 下架筛选: 'active' 仅未下架, 'removed' 仅下架. 缺省 (空) 行为
      // 同 'active' — 已下架模型默认隐藏, 避免「拉取后被标下架」一直占视线.
      const rm=prov._removedFilter||'active';
      if(rm==='active' && m._removed) return false;
      if(rm==='removed' && !m._removed) return false;
      // 来源筛选: manual/fetched; fetched 含 origin 缺失 (兼容旧配置).
      const og=prov._originFilter||'';
      if(og==='manual' && m.origin!=='manual') return false;
      if(og==='fetched' && m.origin==='manual') return false;
      return true;
    },
    isFree(m){
      // 与 Rust is_free 一致: 显式 free:true → 免; free:false → 付; 否则
      // 按 upstream_model / model_id 字符串 (小写) 是否含 'free' 或 '免费' 自动识别.
      if(m && m.free===true) return true;
      if(m && m.free===false) return false;
      const s=((m&&m.upstream_model)||(m&&m.model_id)||'').toLowerCase();
      return s.includes('free') || s.includes('免费');
    },
    drawerBrands(){
      if(!this.drawerProv) return [];
      const seen=new Map();
      (this.drawerProv.models||[]).forEach(m=>{
        const b=this.brandFor(m.upstream_model,this.drawerProv.name);
        if(!seen.has(b.label)) seen.set(b.label,b);
      });
      return [...seen.values()];
    },
    filteredModelCount(){
      if(!this.drawerProv) return 0;
      return (this.drawerProv.models||[]).filter(m=>this.modelVisible(m,this.drawerProv)).length;
    },
    totalModelCount(){
      return (this.providersFormData||[]).reduce((n,p)=>n+((p.models||[]).length),0);
    },
    provMatches(prov){
      const q=(this.provSearch||'').toLowerCase().trim();
      if(!q) return true;
      if((prov.name||'').toLowerCase().includes(q)) return true;
      if((prov.endpoint||'').toLowerCase().includes(q)) return true;
      return (prov.models||[]).some(m=>((m.model_id||'').toLowerCase().includes(q))||((m.upstream_model||'').toLowerCase().includes(q)));
    },
    provProtocols(prov){
      const s=new Set((prov.models||[]).map(m=>(m.api_format||'')===''?'OpenAI':m.api_format));
      return [...s];
    },
    get visibleProviders(){

    keyStatusText(name){

    openProviderDrawer(pi){

    // 单价编辑面板 (行列与供应商官方价目表一致: 项目 × 空闲/高峰时段)
    // 面板表单 → price 对象. 七项全为 0 视为「无价」, 返回 null.
    priceFromPanel(){
      const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
      const f = {
        cache_read_per_m: n(this.pricePanel.cache_read_per_m),
        cache_read_per_m_offpeak: n(this.pricePanel.cache_read_per_m_offpeak),
        input_per_m: n(this.pricePanel.input_per_m),
        input_per_m_offpeak: n(this.pricePanel.input_per_m_offpeak),
        output_per_m: n(this.pricePanel.output_per_m),
        output_per_m_offpeak: n(this.pricePanel.output_per_m_offpeak),
        cache_creation_per_m: n(this.pricePanel.cache_creation_per_m),
      };
      if(Object.values(f).every(v => v === 0)) return null;
      return {
        input_per_m: f.input_per_m, output_per_m: f.output_per_m,
        cache_read_per_m: f.cache_read_per_m || null,
        cache_creation_per_m: f.cache_creation_per_m || null,
        input_per_m_offpeak: f.input_per_m_offpeak,
        output_per_m_offpeak: f.output_per_m_offpeak,
        cache_read_per_m_offpeak: f.cache_read_per_m_offpeak,
      };
    },
    // price 对象 → 面板表单 (0 / 缺失统一显示为空, 便于区分"未填"与"填 0").
    priceToPanel(p){
      const q = p || {};
      const nz = v => (typeof v === 'number' && v !== 0) ? v : null;
      this.pricePanel = {
        cache_read_per_m: q.cache_read_per_m ?? null,
        cache_read_per_m_offpeak: nz(q.cache_read_per_m_offpeak),
        input_per_m: q.input_per_m ?? null,
        input_per_m_offpeak: nz(q.input_per_m_offpeak),
        output_per_m: q.output_per_m ?? null,
        output_per_m_offpeak: nz(q.output_per_m_offpeak),
        cache_creation_per_m: q.cache_creation_per_m ?? null,
      };
    },
    openPricePanel(model){
      this.priceToPanel(model.price);
      this.pricePanelModel = model;
    },
    closePricePanel(){
      this.pricePanelModel = null;
    },
    savePricePanel(){
      if(!this.pricePanelModel) return;
      this.pricePanelModel.price = this.priceFromPanel();
      this.markDirty();
      this.closePricePanel();
    },
    // 复制当前面板价格到剪贴板 (内存缓冲区, 跨模型/跨供应商可用; null 亦为有效值=无价).
    copyPriceFromPanel(){
      this.priceClipboard = this.priceFromPanel();

    pastePriceToPanel(){

    },
    // 把剪贴板价格应用到当前勾选的模型 (整批覆盖).
    applyPriceToSelected(pi){
      const prov = this.providersFormData[pi];
      if(!prov || !this.priceClipboardSet) return;
      const idxs = Object.keys(prov._selected||{}).filter(k=>prov._selected[k]).map(Number);

      }

    },
    selectedIndexes(prov){
      if(!prov || !prov._selected) return [];

    },
    clearPricePanel(){
      if(!this.pricePanelModel) return;

    },

      addModel(pi) {

      this.providersFormData[pi].models.push({model_id:provName+'/',upstream_model:'',reasoning_effort:'',api_format:'',free:false,origin:'manual',_isNew:false,_removed:false,_freeTouched:false,_fmtTouched:false,_metaExpanded:false});
      this.markDirty();
    },
     deleteModel(pi, mi) {
        this.providersFormData[pi].models.splice(mi,1);

      },
      deleteSelectedModels() {
        const prov = this.drawerProv;

        if (!toRemove.length) return;
        toRemove.sort((a,b) => b - a).forEach(i => prov.models.splice(i, 1));
        prov._selected = {};
        this.markDirty();
      },
      markDirty(){ this.isDirty = true; },
      isAllSelected(prov){

        const idxs=prov.models.map((m,i)=>i).filter(i=> !q || (prov.models[i].model_id||'').toLowerCase().includes(q) || (prov.models[i].upstream_model||'').toLowerCase().includes(q));
        return idxs.length>0 && idxs.every(i=> prov._selected && prov._selected[i]);

      applyBulkFree(pi, val){

      deleteSelected(pi){

      clearRemoved(pi){
        const prov=this.providersFormData[pi];
        const idxs=prov.models.map((m,i)=> m._removed ? i : -1).filter(i=>i>=0).sort((a,b)=>b-a);
        if(!idxs.length) return;
        if(!confirm(t('confirm_clear_removed_models',idxs.length))) return;
        idxs.forEach(i=> prov.models.splice(i,1));

      importModels(pi, event){
        const prov=this.providersFormData[pi];
        const file=event.target.files[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>{
          const text=reader.result||'';
          const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
          let added=0;
          for(const line of lines){
            if(line.startsWith('#')) continue;
            const parts=line.split(/[,;\t|]/).map(s=>s.trim()).filter(Boolean);
            if(!parts.length) continue;
            // 中转 ID 未显式带「供应商/」前缀时自动补全 (与拉取模型一致), 免手动命名.
            let model_id=parts[0];
            if(!model_id.includes('/')) model_id = prov.name + '/' + model_id;
            const upstream=parts[1]||model_id;
            const effort=parts[2]||'';
            const fmt=parts[3]||'';
            if(prov.models.some(m=>m.model_id===model_id)) continue;
            prov.models.push({model_id, upstream_model:upstream, reasoning_effort:effort, api_format:fmt, free:this.autoFree(model_id, upstream), _freeTouched:false, _fmtTouched:!!fmt});
            added++;
          }
          this.markDirty();
          toast(t('models_imported',added), 'success');
        };
        reader.readAsText(file);
        event.target.value='';

      exportModels(pi){

       } catch(e){ prov._testResult = {success:false,status:t('network_error'),latency_ms:0}; }
