     // 拉取模型: 后端仅写入内存注册表 (即时生效) 并返回模型列表; 这里合并进表单,
    // 待用户点"保存配置"才持久化 —— 避免直接写盘冲掉表单里其它未保存改动.
    async fetchProviderModels(pi) {
      const prov = this.providersFormData[pi];
      prov._fetching = true;
      try {
        const r = await fetch('/admin/api/providers/'+encodeURIComponent(prov.name)+'/fetch-models', {method:'POST', headers:authHeaders()});
        const d = await r.json();
        if (r.ok && d.success) {
          // 去重: 基于 upstream_model (与后端 add_models 一致), 而非 model_id.
          const existingUpstream = new Set(prov.models.map(m=>m.upstream_model||m.model_id));
          let added=0;
          for (const id of (d.models||[])) {
            if (!existingUpstream.has(id)) {
              // 中转 ID 自动生成为「供应商/上游模型ID」, 免去手动命名; 不满意可直接改.
              const prefixed = (id.includes('/') ? id : prov.name + '/' + id);
              prov.models.push({ model_id:prefixed, upstream_model:id, reasoning_effort:'', api_format:this.defaultApiFormat(id), origin:'fetched', _isNew:true, _removed:false, free:this.autoFree(id,id), _freeTouched:false, _fmtTouched:false });
              existingUpstream.add(id);
              added++;
            }
          }
          // 标记已下架: 仅按【上游模型ID】(upstream_model, 缺省回落中转ID) 比对,
          // 中转ID 是用户可改的别名, 不能作为与上游清单比对的依据.
          const removedSet = new Set(d.removed||[]);
          let removedMarked=0;
          for(const m of prov.models){
            const effectiveUpstream = m.upstream_model || m.model_id;
            const wasRemoved = removedSet.has(effectiveUpstream);
            if(wasRemoved && !m._removed) removedMarked++;
            m._removed = wasRemoved;
            if(wasRemoved) m._isNew=false;
          }
          if(added>0 || removedMarked>0) this.markDirty();
          // 8 秒后自动清除 NEW 高亮
          if(added>0){
            prov._newModels = (prov._newModels||0) + added;
            setTimeout(()=>{ for(const m of prov.models) m._isNew=false; }, 8000);
          }
          this.providersFormOk = true;
          this.providersFormMsg = d.message + (removedSet.size ? t('removed_models_suffix',removedSet.size) : '');
        } else {
          this.providersFormOk = false;
          this.providersFormMsg = d.error || t('fetch_failed');
        }
      } catch(e) { this.providersFormMsg = t('network_error'); }
      prov._fetching = false;
      if (this.providersFormMsg) setTimeout(() => { this.providersFormMsg = ''; }, 4000);
    },
    async saveProvidersForm() {
      this.providersFormMsg='';
      this._saving=true;
      try {
      // 前端预校验: name 非空且唯一 (后端也会校验拦截).
      const names = this.providersFormData.map(p=>(p.name||'').trim());
      const seen = new Set();
      for (const n of names) {
        if (!n) { this.providersFormMsg=t('provider_name_required'); this.providersFormOk=false; return; }
        if (seen.has(n)) { this.providersFormMsg=t('provider_name_duplicate',n); this.providersFormOk=false; return; }
        seen.add(n);
      }
      try {
         const providers = this.providersFormData.map(p => {
           const models = {};
           for (const m of p.models) {
             if (!m.model_id) continue;
             const cfg = {};
             if (m.upstream_model) cfg.upstream_model = m.upstream_model;
             if (m.reasoning_effort) cfg.reasoning_effort = m.reasoning_effort;
             // 协议: 仅当显式选 anthropic 才写字段, 选 openai(空)则省略回落默认.
             if (m.api_format) cfg.api_format = m.api_format;
             // 免费: 仅在与自动判定结果不同时才写显式字段, 保持配置干净;
             // 取消自动判定的免费需用户手动勾掉开关 (_freeTouched) 才写 free: false
              const autoFree = this.autoFree(m.model_id, m.upstream_model);
              if (m.free && !autoFree) cfg.free = true;
              else if (!m.free && autoFree && m._freeTouched) cfg.free = false;
              if (m.origin) cfg.origin = m.origin;
              // 剥离带工具调用的推理链: 逐模型设置 (中转供应商下各模型协议不同).
              if (m.strip_toolcall_reasoning) cfg.strip_toolcall_reasoning = true;
              // 单价 (元/百万 tokens): 仅写入非空字段, 避免污染配置.
              if (m.price) {
                const pr = { input_per_m: m.price.input_per_m||0, output_per_m: m.price.output_per_m||0 };
                if (m.price.cache_read_per_m != null) pr.cache_read_per_m = m.price.cache_read_per_m;
                if (m.price.cache_creation_per_m != null) pr.cache_creation_per_m = m.price.cache_creation_per_m;
                if (m.price.input_per_m_offpeak) pr.input_per_m_offpeak = m.price.input_per_m_offpeak;
                if (m.price.output_per_m_offpeak) pr.output_per_m_offpeak = m.price.output_per_m_offpeak;
                if (m.price.cache_read_per_m_offpeak) pr.cache_read_per_m_offpeak = m.price.cache_read_per_m_offpeak;
                cfg.price = pr;
              }
              models[m.model_id] = Object.keys(cfg).length ? cfg : {};
           }
            return {
              name: p.name,
              endpoint: p.endpoint,
              endpoint_anthropic: p.endpoint_anthropic||undefined,
              endpoint_responses: p.endpoint_responses||undefined,
              api_key_env: p.api_key_env,
              api_key_default: p.api_key_default||undefined,
              balance_endpoint: p.balance_endpoint||undefined,
              api_format: p.api_format||undefined,
              prompt_cache: p.prompt_cache,
              openai_cache_control: p.openai_cache_control,
              max_request_body_bytes: p.max_request_body_bytes,
              headers: p.headers||undefined,
              models: models,
            };
         });
         const json = JSON.stringify({providers:providers}, null, 2);
         const oldNames = this.providersFormData.map(p => p._origName || p.name);
         const r=await fetch('/admin/api/providers/save',{method:'POST',headers:authHeaders(),body:JSON.stringify({json:json,oldNames:oldNames})});
         const d=await r.json();
         this.providersFormOk = !!d.message;
         this.providersFormMsg=d.message||d.error||t('save_failed');
          if(d.message) {
            // 配置保存成功后, 同步保存所有有草稿的 key
            await this.saveAllProviderKeys();
            this.isDirty=false;
            // 保存即持久化, 清除各供应商"新模型"未保存提示; 同步 _origName
            this.providersFormData.forEach(p=>{ p._newModels=0; p._origName=p.name; });
            setTimeout(()=>this.providersFormMsg='',3000);
          }
       } catch(e){ this.providersFormMsg=t('network_error'); }
       } finally { this._saving=false; }
       },
       async saveAllProviderKeys() {
       // 遍历所有供应商, 保存有草稿的 key
       const keysToSave = this.providersFormData
         .filter(p => (p._keyDraft||'').trim() !== '')
         .map(p => ({ provider: p.name, value: p._keyDraft.trim() }));
       if (keysToSave.length === 0) return;
       let saved = 0, failed = 0;
       for (const { provider, value } of keysToSave) {
         try {
           const r = await fetch('/admin/api/keys', {
             method: 'PUT',
             headers: authHeaders(),
             body: JSON.stringify({ provider, value })
           });
           const d = await r.json();
           if (r.ok) {
             // 找到对应供应商并清除草稿
             const prov = this.providersFormData.find(p => p.name === provider);
             if (prov) prov._keyDraft = '';
             saved++;
           } else {
             console.error(`保存 ${provider} 的 key 失败:`, d.error);
             failed++;
           }
         } catch (e) {
           console.error(`保存 ${provider} 的 key 网络错误:`, e);
           failed++;
         }
       }
       if (saved > 0) {
         this.keyMsg = t('provider_keys_saved',saved);
         this.fetchKeys();
         setTimeout(() => this.keyMsg = '', 3000);
       }
       if (failed > 0) {
         this.keyMsg = t('provider_keys_save_failed',failed);
         setTimeout(() => this.keyMsg = '', 3000);
       }
       },

    // Computed
    // 成功率配色阈值: 概览与记录页共用同一套, 避免两处口径分叉
    // (原先记录页把成功率写死 var(--ok), 全是错误时也会显示绿色的 0%).
    // 无数据 → 灰(muted); 判定与 sRateText 的 '—' 一致.
    rateColor(pct, text) {
      // 注意: null/'' 经 Number() 会变成 0, 会被误判为"成功率 0%"的红色 —— 故先排除空值.
      if (text === '—' || pct === null || pct === undefined || pct === ''
          || !Number.isFinite(Number(pct))) return 'var(--muted)';
      const v = Number(pct);
      return v >= 95 ? '#34d399' : v >= 80 ? '#f59e0b' : '#ef4444';
    },
    // 成功率(数值): 供配色阈值使用; 无数据返回 0 (配色另由 sRateText 判为灰).
    // 口径与**同面板**的「平均延迟」「生成速度」保持一致, 都用窗口累计 ——
    // 原先此处用今日、而旁边两项用窗口, 同一张卡片里混了两个尺度.
    get sRate() {
      if(!this.stats||!this.stats.total_requests) return 0;
      return (this.stats.total_requests-(this.stats.error_count||0))/this.stats.total_requests*100;
    },
    // 窗口内无请求 ≠ "100% 成功" —— 那是没有数据, 与全部成功是两回事.
    get sRateText() {
      if(!this.stats||!this.stats.total_requests) return '—';
      return this.fmtPct(this.sRate);
    },
    // ── 概览 hero 的作用域 ──
    //
    // **主数字一律用「窗口累计」口径**, 与卡片里的迷你折线严格同口径
    // (折线画的就是 stats.trends 整个窗口) —— 这是本面板最看重的一条: 数字与图形不得打架.
    //
    // 历史: 最初六个数只显示"今日", 每天开始打开面板全是 0 而折线有峰 (口径不一致);
    // 上一版改成"今日有请求就显示今日", 修好了全 0, 但引入了新矛盾 ——
    // 今日有请求时主数字是今日口径 (例: 22), 旁边的折线却仍是窗口口径 (峰值可达数百),
    // 同一张卡片里两个尺度. 且注释声称"现在数字与图形同口径", 与实现不符.
    // 现统一为窗口口径, 今日用量以文字形式附在提示里 (见 heroRequestsHint), 不再抢主位.
    get heroToday() { return Number((this.stats&&this.stats.today_requests)||0) > 0; },
    get heroScopeLabel() { return t('window_label'); },
    get heroScopeHint() { return t('hero_scope_window_hint'); },
    get heroRequests() { const s=this.stats||{}; return Number(s.total_requests||0); },
    get heroErrors() { const s=this.stats||{}; return Number(s.error_count||0); },
    get heroRequestsHint() {
      // 提示只补主数字**没有**的信息: 主数字已是"请求总数", 故这里只给错误数,
      // 不再重复一遍总数 (原先渲染成「错误 70 · 总计 2619」而主数字正是 2619,
      // 同屏把同一个数说了两遍, 白占提示行三分之一).
      // 今日有请求时把今日用量附在末尾 —— 它是补充, 不与主数字混排取值.
      const base = t('errors_only', this.heroErrors);
      return this.heroToday
        ? base + ' · ' + t('today_label') + ' ' + Number((this.stats && this.stats.today_requests) || 0)
        : base;
    },
    get heroCost() { const s=this.stats||{}; return Number(s.total_cost||0); },
    get heroCostText() { return (this.stats&&this.stats.has_price_config) ? this.fmtMoney(this.heroCost) : '—'; },
    get heroPrompt() { const s=this.stats||{}; return Number(s.total_prompt_tokens||0); },
    get heroCompletion() { const s=this.stats||{}; return Number(s.total_completion_tokens||0); },
    get heroTokens() { return this.heroPrompt + this.heroCompletion; },
    // 命中率口径: 命中 / 总输入 token (与统计页一致). 分母为 0 = 没有数据, 给 '—' 而非 0%.
    get heroCacheText() {
      const s=this.stats||{};
      const h=Number(s.total_cache_hit_tokens||0);
      const pt=Number(s.total_prompt_tokens||0);
      if(!pt) return '—';
      return this.fmtPct(h/pt*100);
    },
    get donutSvg() {
      if(!this.stats||!this.stats.per_model.length) return '';
      const total=this.stats.total_requests||1;
      const r=55, w=20, cx=70, cy=70, C=2*Math.PI*r;
      const top=this.stats.per_model.slice(0,8);
      const shown=top.reduce((sum,m)=>sum+(m.requests||0),0);
      const parts=top.map((m,i)=>({value:m.requests||0,color:this.donutColors[i%this.donutColors.length]}));
      if(this.stats.per_model.length>8 && total>shown) parts.push({value:total-shown,color:'#3b3d48'});
      let offset=0, segs='';
      parts.forEach(p=>{
        const len=p.value/total*C;
        segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${w}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
        offset+=len;
      });
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2a2d37" stroke-width="${w}"/>${segs}<text x="${cx}" y="${cy-8}" text-anchor="middle" fill="#cdd0d4" font-size="16" font-weight="700">${total}</text><text x="${cx}" y="${cy+10}" text-anchor="middle" fill="#6b7280" font-size="10">${t('unit_requests')}</text>`;
    },

    openLogDetail(log) { this.selectedLog=log; },
    // 单条请求的 KV 缓存命中率: 命中 token / 总输入 token (与聚合口径一致); 无输入或纯缓存命中显示占位.
    logCacheRate(log) {
      if (log && log.cached) return t('badge.cached');
      const hit=Number(log&&log.prompt_cache_hit_tokens||0), pt=Number(log&&log.prompt_tokens||0);
      if (!pt || hit<=0) return '—';
      return this.fmtPct(hit/pt*100);
    },
    // 单条请求的纯生成速度 (tok/s): 排除排队与 TTFT, 需要首 token 延迟已知的流式请求.
    logGenSpeed(log) {
      if (!log || !log.first_token_ms || log.first_token_ms>=log.latency_ms || !log.completion_tokens) return '—';
      const genMs=log.latency_ms-log.first_token_ms;
      if (genMs<=0) return '—';
      return (log.completion_tokens/genMs*1000).toFixed(1)+' '+t('unit_tokps');
    },
    get filteredLogs() {
      let r = this.logs;
      if (this.logProviderFilter) r = r.filter(l=>l.provider===this.logProviderFilter);
      if (this.logStatusFilter==='success') r = r.filter(l=>!this.isLogError(l));
      if (this.logStatusFilter==='error') r = r.filter(l=>this.isLogError(l));
      if (this.logTimeFilter) {
        const win = {'1h':3600,'24h':86400,'7d':604800}[this.logTimeFilter]||0;
        if (win) { const cutoff = Date.now()/1000 - win; r = r.filter(l=>l.timestamp>=cutoff); }
      }
      if(this.logSearch) {
        const q=this.logSearch.toLowerCase();
        r = r.filter(l=>l.model.toLowerCase().includes(q)||l.provider.toLowerCase().includes(q)||(l.error&&l.error.toLowerCase().includes(q))||String(l.status).includes(q));
      }
      return r;
    },
    resetLogView() { this.logPage = 0; },
    // 数据收缩后把当前页夹回有效范围: 日志缓冲区会滚动淘汰旧记录 (每 3s 轮询刷新),
    // 用户若停在第 5 页而列表缩到 2 页, 原实现会渲染出一个空白表格且毫无提示 ——
    // 看起来像"筛选把结果筛没了", 实际只是页码越界.
    clampLogPage() {
      const max = this.totalLogPages - 1;
      if (this.logPage > max) this.logPage = Math.max(0, max);
      if (this.logPage < 0) this.logPage = 0;
    },
    get totalLogPages() { return Math.ceil(this.filteredLogs.length/this.pageSize)||1; },
    get paginatedLogs() { return this.filteredLogs.slice(this.logPage*this.pageSize,(this.logPage+1)*this.pageSize); },

    // 独立错误列表: 直接来自 /admin/api/errors (已按时间倒序 + 仅错误), 与请求窗口解耦.
    get recordErrorCount() { return this.logs.filter(l=>Number(l.status)>=400 || !!l.error).length; },
    get recordSuccessRate() { return this.logs.length ? (this.logs.length-this.recordErrorCount)/this.logs.length*100 : 0; },
    get recordSuccessRateText() { return this.logs.length ? this.fmtPct(this.recordSuccessRate) : '—'; },
    get recordTokenCount() { return this.logs.reduce((s,l)=>s+(Number(l.prompt_tokens)||0)+(Number(l.completion_tokens)||0),0); },


    // Formatters
    fmtMoney(v) {
      const sym = this.moneySymbol(this.currencyConfig.currency);
      return sym + this.convertCny(v).toFixed(2);
    },
    // 极小金额友好显示: 换算后不足最小分位时给出 "<¥0.01", 而不是 0.00.
    // 省量费用常远小于 1 分 (单请求 1009 tok × 2元/1M ≈ 0.002), 一律 ¥0.00 会让人误以为没生效.
    fmtMoneyTiny(v) {
      const c = this.convertCny(v);
      if (v > 0 && c < 0.005) return '<' + this.moneySymbol(this.currencyConfig.currency) + '0.01';
      return this.fmtMoney(v);
    },
    // 单价格式化 (表格单元格用): 紧凑展示「未命中/输出 (命中)」, 未配置显示「未配置」.
    // 鼠标悬停由 fmtPriceDetail 给出逐项明细.
    fmtPrice(p) {
      if (!p) return t('price_not_set');
      const sym = this.moneySymbol(this.currencyConfig.currency);
      const c = x => this.convertCny(x);
      let s = sym + c(p.input_per_m) + '/' + sym + c(p.output_per_m);
      if (p.cache_read_per_m != null) s += ' · ' + t('cache_label') + sym + c(p.cache_read_per_m);
      // 空闲价: 任一 offpeak 字段 > 0 即视为分时段计费, 追加「空闲」档.
      if (p.input_per_m_offpeak > 0 || p.output_per_m_offpeak > 0 || p.cache_read_per_m_offpeak > 0) {
        s += '  ' + t('offpeak_label') + ' ' + sym + c(p.input_per_m_offpeak) + '/' + sym + c(p.output_per_m_offpeak);
        if (p.cache_read_per_m_offpeak > 0) s += ' · ' + t('cache_label') + sym + c(p.cache_read_per_m_offpeak);
      }
      return s;
    },
    // 单价明细 (按钮 tooltip 用): 与面板/官方价目表同构, 逐行列出高峰与空闲两档.
    fmtPriceDetail(p) {
      if (!p) return t('price_not_set');
      const sym = this.moneySymbol(this.currencyConfig.currency);
      const c = x => sym + this.convertCny(x || 0);
      const rows = [
        t('price_col_peak'),
        '  ' + t('price_row_cache_hit') + ' ' + c(p.cache_read_per_m != null ? p.cache_read_per_m : p.input_per_m),
        '  ' + t('price_row_cache_miss') + ' ' + c(p.input_per_m),
        '  ' + t('price_row_output') + ' ' + c(p.output_per_m),
      ];
      if (p.input_per_m_offpeak > 0 || p.output_per_m_offpeak > 0 || p.cache_read_per_m_offpeak > 0) {
        rows.push(t('price_col_offpeak'));
        rows.push('  ' + t('price_row_cache_hit') + ' ' + c(p.cache_read_per_m_offpeak != null ? p.cache_read_per_m_offpeak : p.input_per_m_offpeak));
        rows.push('  ' + t('price_row_cache_miss') + ' ' + c(p.input_per_m_offpeak));
        rows.push('  ' + t('price_row_output') + ' ' + c(p.output_per_m_offpeak));
      }
      return rows.join('\n');
    },
    // 供应商 logo: 复用全局 providerLogo() (内联官方 SVG, 缺失回退首字母徽标).
    providerLogo(p) {
      return window.providerLogo(p);
    },
    // 记录列表的时间列: 带日期 —— 日志窗口本身跨天(实测 09/13 → 09/16),
    // 只显示 HH:MM:SS 时, 同一条 22:45:42 无法判断是哪一天.
    fmtTs(ts) {
      const d=new Date(ts*1000);
      const p=n=>String(n).padStart(2,'0');
      return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    },
    fmtDateTime(ts){ const d=new Date(ts*1000); const loc=(window.Alpine&&Alpine.store('i18n')&&Alpine.store('i18n').lang==='en-US')?'en-US':'zh-CN'; return d.toLocaleString(loc); },
    fmtMs(ms) { if(ms<1000) return Math.round(ms)+'ms'; return (ms/1000).toFixed(1)+'s'; },
    // 百分比格式化 (入参为 0..100 的百分值).
    //
    // 两处舍入都会把"事实"改掉, 必须挡住:
    //   · 非满值不得显示成 100% —— `toFixed(1)` 把 99.95%+ 抬成 "100.0%", `Math.round` 把 99.5%+ 抬成 "100%".
    //     实测: 231 条缓存命中率显示 100.0% 而真 100% 的一条都没有 (例 603264/603517 = 99.958%);
    //     成功率显示 100% 的同时旁边写着"错误请求 1".
    //   · 非零不得显示成 0.0% —— 同理, 舍入不该改变"有没有"这个事实.
    // 分母为 0 (没有数据) 由调用方给 `—`, 不走这里 —— "没有数据"也不是 0%.
    fmtPct(pct) {
      const v = Number(pct);
      if (!Number.isFinite(v)) return '—';
      if (v >= 100) return '100%';
      if (v > 99.9) return '>99.9%';
      if (v <= 0) return '0%';
      if (v < 0.1) return '<0.1%';
      return v.toFixed(1) + '%';
    },
    fmtT(n) { if(n<1000) return n; if(n<1000000) return (n/1000).toFixed(1)+'K'; return (n/1000000).toFixed(1)+'M'; },
    // 省量明细行: "标签 <tokens> ≈ <费用>". 费用为 0 (未配置价格/免费) 时省略.
    auditLine(labelKey, tokens, fee) {
      const tk = this.fmtT(tokens || 0);
      const f = fee || 0;
      return t(labelKey) + ' ' + tk + (f > 0 ? ' ≈ ' + this.fmtMoneyTiny(f) : '');
    },
    // 单条日志的优化省量合计 (tokens). 优先用后端下发的拆分, 回退到三个字段直加.
    logSavedTotal(log) {
      const b = log && log.saved_breakdown;
      if (b) return (b.strip||0)+(b.strip_toolcall||0)+(b.trim||0)+(b.resp_cache||0);
      return (log.strip_saved_tokens||0)+(log.trim_saved_tokens||0)+(log.resp_cache_saved_tokens||0);
    },
    // 更新日志条目的行内 markdown 渲染: 仅支持 **粗体** 与 `代码`.
    // 先 HTML 转义再套标签 —— CHANGELOG 是本地文件, 但仍按不可信文本处理.
    renderMdInline(s) {
      const esc = String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
      return esc
        .replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--fg)">$1</strong>')
        .replace(/`([^`]+)`/g, '<code class="mono" style="font-size:11px;background:rgba(255,255,255,.06);padding:1px 4px;border-radius:3px">$1</code>');
    },
    // 省量审计窗口标签: 明确覆盖的实际时间范围与采样覆盖度.
    // 「当前窗口」= 内存里的日志缓冲区 (启动时从磁盘加载历史), 因此可能跨越很久, 必须说清.
    auditWindowLabel() {
      const a = (this.stats && this.stats.audit) || {};
      const span = (a.window_start && a.window_end)
        ? (this.fmtShort(a.window_start) + ' → ' + this.fmtShort(a.window_end))
        : '';
      const reqs = a.requests || 0;
      const sampled = a.sampled_requests || 0;
      const base = t('audit_basis', reqs);
      const est = a.estimated_requests || 0;
      return span + (span ? ' · ' : '') + base + (reqs && sampled < reqs ? ' · ' + t('audit_sampled', sampled) : '') + (est ? ' · ' + t('audit_estimated', est) : '');
    },
    fmtShort(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      const p = n => String(n).padStart(2, '0');
      return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    },
    // 潜在可省占比: 分母必须是「已采样请求的输入」而非窗口总输入 ——
    // 潜在项只来自做过审计的请求, 用总输入会把占比按采样比例稀释 (老日志越多压得越低).
    auditPctSampled(v) {
      const a = (this.stats && this.stats.audit) || {};
      const base = a.sampled_input_tokens || 0;
      if (!v || !base) return '—';
      // 上限保护: 潜在量来自做过审计的请求, 而分母只累计已采样请求的输入;
      // 两者口径在小样本下可能不一致, 会算出 >100% 的失真值. 封顶并标注.
      const pct = v / base * 100;
      if (pct > 100) return '>100%';
      return this.fmtPct(pct);
    },
    // 输出/输入 token 比 (看输出相对规模).
    outInRatio() {
      const a = (this.stats && this.stats.audit) || {};
      const inp = a.input_tokens || 0;
      const out = (a.output || {}).output_tokens || 0;
      if (!inp) return '—';
      return (out / inp * 100).toFixed(2) + '%';
    },
    // 长输出请求贡献了全部输出的百分之多少 (输出是否集中在少数请求).
    outLongShare() {
      const o = ((this.stats && this.stats.audit) || {}).output || {};
      if (!o.output_tokens) return '—';
      // 占比类: 走 fmtPct, 避免 9999/10000 被舍入显示成 100%.
      return this.fmtPct((o.long_tokens || 0) / o.output_tokens * 100);
    },
    // 已生效省量占比: 分母用「反事实基线」= 实际发送 + 已省, 而非只算实际发送.
    // 省下的 token 本就不在 input_tokens 内 (响应缓存回放的 prompt_tokens 记为 0),
    // 只除以 input_tokens 会算出 >100%.
    auditAppliedPct() {
      const a = (this.stats && this.stats.audit) || {};
      const saved = a.applied_saved_tokens || 0;
      const base = (a.input_tokens || 0) + saved;
      // 无数据 ≠ 0: 窗口内没有输入量时给 '—', 不给 '0%' (那是"确实没省量"的表达).
      if (!base) return '—';
      if (!saved) return '0%';
      return this.fmtPct(saved / base * 100);
    },
    // 省量审计: KV 缓存命中率 = 命中 token / 输入总量 (比"写入量"普适, 后者仅 Anthropic 上报).
    kvHitRate() {
      const a = (this.stats && this.stats.audit) || {};
      const base = a.input_tokens || 0;
      if (!base) return '—';
      return this.fmtPct((a.cache_read_tokens || 0) / base * 100);
    },
    // 省量审计: 某潜在省量占当前窗口总输入 token 的百分比 (分母缺失时显示占位).
    // 省量构成 (供分段比例条): 只列非零项, 全零时不渲染条.
    get auditAppliedSegs() {
      const a=(this.stats&&this.stats.audit)||{};
      const items=[
        {k:'strip',label:t('saved_strip'),v:Number(a.applied_strip_tokens||0),color:'#3b9cff'},
        {k:'tc',label:t('saved_strip_tc'),v:Number(a.applied_strip_toolcall_tokens||0),color:'#22d3ee'},
        {k:'trim',label:t('saved_trim'),v:Number(a.applied_trim_tokens||0),color:'#a78bfa'},
        {k:'resp',label:t('saved_resp'),v:Number(a.applied_resp_cache_tokens||0),color:'#34d399'},
      ].filter(x=>x.v>0);
      return items.length>1?items:[];
    },
    get auditPotentialSegs() {
      const a=(this.stats&&this.stats.audit)||{};
      const items=[
        {k:'exempt',label:t('audit_exempt_reasoning'),v:Number(a.exempt_reasoning_tokens||0),color:'#f59e0b'},
        {k:'dup',label:t('audit_dup_blocks'),v:Number(a.dup_block_tokens||0),color:'#ff7b27'},
      ].filter(x=>x.v>0);
      return items.length>1?items:[];
    },
    get kvSegs() {
      const a=(this.stats&&this.stats.audit)||{};
      const hit=Number(a.cache_read_tokens||0), miss=Number(a.cache_miss_tokens||0), cre=Number(a.cache_creation_tokens||0);
      const items=[
        {k:'hit',label:t('audit_kv_read'),v:hit,color:'#22d3ee'},
        {k:'miss',label:t('audit_kv_miss'),v:miss,color:'#f59e0b'},
        {k:'cre',label:t('audit_kv_creation'),v:cre,color:'#a78bfa'},
      ].filter(x=>x.v>0);
      return items.length>1?items:[];
    },
    fmtB(b) {
      if(b===0) return '0B'; if(b<1024) return b+'B'; if(b<1048576) return (b/1024).toFixed(1)+'KB';
      return (b/1048576).toFixed(1)+'MB';
    },
  };
}
</script>
